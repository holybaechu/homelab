name: Deploy apps desired state

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Deploy the complete package or rotate only its component bundle
        required: true
        default: deploy
        type: choice
        options: [deploy, sync-secrets]

permissions:
  contents: read
  id-token: write

concurrency:
  group: prod-control-plane
  queue: max
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    environment: prod
    steps:
      - name: Checkout exact desired state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Materialize the one apps component secret bundle
        env:
          COMPONENT_SECRET_BUNDLE: ${{ secrets.APPS_SECRET_BUNDLE }}
        run: |
          test -n "$COMPONENT_SECRET_BUNDLE"
          umask 077
          printf '%s\n' "$COMPONENT_SECRET_BUNDLE" > "$RUNNER_TEMP/apps.json"
      - name: Resolve the apps host from the sole inventory
        run: |
          host="$(python -c 'import json; print(json.load(open("infra/ansible/inventory/prod/topology.json"))["all"]["children"]["debian"]["hosts"]["docker_apps"]["ansible_host"])')"
          printf 'DOCKER_APPS_HOST=%s\n' "$host" >> "$GITHUB_ENV"
      - name: Connect to the management tailnet
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4
        with:
          authkey: ${{ secrets.HEADSCALE_CI_AUTH_KEY }}
          oauth-client-id: ${{ secrets.HEADSCALE_CI_AUTH_KEY == '' && secrets.TS_OAUTH_CLIENT_ID || '' }}
          audience: ${{ secrets.HEADSCALE_CI_AUTH_KEY == '' && secrets.TS_AUDIENCE || '' }}
          tags: tag:ci
          # renovate: datasource=custom.tailscale-linux depName=tailscale/tailscale versioning=semver
          version: "1.104.1"
          args: ${{ secrets.HEADSCALE_CI_AUTH_KEY != '' && '--login-server=https://headscale.home.hchu.me --accept-routes=true --accept-dns=false' || '--accept-dns=false' }}
          ping: ${{ env.DOCKER_APPS_HOST }}
      - name: Configure pinned SSH trust
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: ./scripts/ci/configure-ssh.sh
      - name: Deploy with native Compose
        env:
          OPERATION: ${{ inputs.operation }}
        run: sh scripts/ci/deploy-compose-via-ssh.sh "$OPERATION" "$RUNNER_TEMP/apps.json"
      - name: Remove the runner secret copy
        if: always()
        run: rm -f -- "$RUNNER_TEMP/apps.json"
