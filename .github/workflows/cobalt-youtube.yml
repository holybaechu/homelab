name: cobalt-youtube
on:
  workflow_dispatch:
  pull_request:
    paths:
      - kubernetes/apps/cobalt/**
      - .github/workflows/cobalt-youtube.yml
  push:
    branches: [main]
    paths:
      - kubernetes/apps/cobalt/**
      - .github/workflows/cobalt-youtube.yml
permissions:
  contents: read
jobs:
  youtube-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.6
        with:
          install_args: yq
      - name: Test VISIONOS startup against the deployed API image
        run: |
          image=$(yq -N -r 'select(.kind == "Deployment") | .spec.template.spec.containers[] | select(.name == "api") | .image' kubernetes/apps/cobalt/resources.yaml)
          node_image=$(yq -N -r 'select(.kind == "Deployment") | .spec.template.spec.initContainers[] | select(.name == "prepare-youtube") | .image' kubernetes/apps/cobalt/resources.yaml)
          mkdir -p "$RUNNER_TEMP/cobalt-youtube"
          chmod 0777 "$RUNNER_TEMP/cobalt-youtube"
          docker run --rm \
            -v "$GITHUB_WORKSPACE/kubernetes/apps/cobalt/youtube:/source:ro" \
            -v "$RUNNER_TEMP/cobalt-youtube:/youtube" \
            --entrypoint /bin/sh "$node_image" -ec '
              cp /source/package.json /source/package-lock.json /youtube/
              npm ci --prefix /youtube --ignore-scripts --no-audit --no-fund
            '
          docker run --rm --network none \
            -e API_URL=http://127.0.0.1:9000/ \
            -v "$GITHUB_WORKSPACE/kubernetes/apps/cobalt:/compat:ro" \
            -v "$RUNNER_TEMP/cobalt-youtube:/youtube:ro" \
            --entrypoint node "$image" /compat/test_youtube_client.mjs
      - name: Test browser routing and processing module types over HTTP/1.1 and HTTP/2
        run: |
          api_image=$(yq -N -r 'select(.kind == "Deployment") | .spec.template.spec.containers[] | select(.name == "api") | .image' kubernetes/apps/cobalt/resources.yaml)
          web_image=$(yq -N -r 'select(.kind == "Deployment") | .spec.template.spec.containers[] | select(.name == "web") | .image' kubernetes/apps/cobalt/resources.yaml)
          mkdir -p "$RUNNER_TEMP/cobalt-web/_libav"
          printf '<html><body>Proxy test</body></html>' > "$RUNNER_TEMP/cobalt-web/index.html"
          printf 'export default {};' | tee "$RUNNER_TEMP/cobalt-web/_libav/libav-remux-cli.mjs" > "$RUNNER_TEMP/cobalt-web/_libav/libav-encode-cli.mjs"
          trap 'docker rm -f cobalt-web-test cobalt-api-test >/dev/null 2>&1 || true' EXIT
          docker run -d --name cobalt-api-test --network host \
            -e API_URL=http://127.0.0.1:9000/ -e CUSTOM_INNERTUBE_CLIENT=VISIONOS \
            -v "$GITHUB_WORKSPACE/kubernetes/apps/cobalt:/compat:ro" \
            -v "$RUNNER_TEMP/cobalt-youtube:/youtube:ro" \
            --entrypoint node "$api_image" --import /compat/youtube_client.mjs src/cobalt.js
          docker run -d --name cobalt-web-test --network host --read-only --tmpfs /tmp \
            -v "$GITHUB_WORKSPACE/kubernetes/apps/cobalt/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$RUNNER_TEMP/cobalt-web:/usr/share/nginx/html:ro" \
            --entrypoint nginx "$web_image" -g 'daemon off;'
          for attempt in {1..30}; do
            if curl -fsS -H 'Accept: application/json' http://127.0.0.1:8080/ >/dev/null; then
              break
            fi
            sleep 1
          done
          docker exec -i cobalt-api-test node --input-type=module < kubernetes/apps/cobalt/check_proxy.mjs
