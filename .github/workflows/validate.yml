name: Validate repository

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-deploy.txt
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run behavioral and invariant tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q
      - name: Render the application package
        run: ./scripts/ci/validate-compose.sh
      - name: Detect infrastructure changes
        id: infrastructure
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PR_NUMBER" ] || gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq ' .[].filename' | grep -qE '^(infra/|requirements-deploy.txt|.github/workflows/infra.yml)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Syntax-check every explicit infrastructure unit
        if: steps.infrastructure.outputs.changed == 'true'
        env:
          ANSIBLE_CONFIG: infra/ansible/ansible.cfg
        run: |
          python -m pip install -r requirements-deploy.txt
          for unit in pve tailnet apps-host; do
            ansible-playbook \
              infra/ansible/playbooks/reconcile.yml \
              --syntax-check \
              -e "homelab_unit=$unit" \
              -e "homelab_secret_bundle=/tmp/not-read-during-syntax-check.json"
          done
