name: validate
on:
  workflow_dispatch:
    inputs:
      talos:
        description: Also render and validate Talos configuration in isolated temporary state
        type: boolean
        default: false
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  configuration:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      TF_IN_AUTOMATION: "1"
      TF_INPUT: "0"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.3
        with:
          install_args: opentofu flux2 kustomize kubeconform yq ${{ inputs.talos && 'talosctl jq' || '' }}
      - name: Validate OpenTofu configuration
        env:
          TF_DATA_DIR: ${{ runner.temp }}/tofu-providers
        run: |
          export TF_VAR_state_passphrase=$(openssl rand -hex 32)
          printf 'TF_VAR_state_passphrase=%s\n' "$TF_VAR_state_passphrase" >> "$GITHUB_ENV"
          tofu -chdir=infra/talos fmt -check
          tofu -chdir=infra/talos init -backend=false -lockfile=readonly
          tofu -chdir=infra/talos validate
      - name: Build and substitute Kubernetes configuration
        run: |
          while IFS=$'\t' read -r key value; do
            export "$key=$value"
          done < <(yq -N -r '.data | to_entries | .[] | [.key, .value] | @tsv' kubernetes/clusters/homelab/{settings,onepassword}.yaml)
          mkdir -p "$RUNNER_TEMP/rendered"
          for path in bootstrap clusters/homelab platform/controllers platform/config identity apps access; do
            if [[ "$path" == bootstrap || "$path" == clusters/homelab ]]; then
              kustomize build "kubernetes/$path" >> "$RUNNER_TEMP/rendered/authored.yaml"
            else
              kustomize build "kubernetes/$path" | flux envsubst --strict >> "$RUNNER_TEMP/rendered/authored.yaml"
            fi
            printf '\n---\n' >> "$RUNNER_TEMP/rendered/authored.yaml"
          done
      - name: Validate native Kubernetes schemas
        run: |
          # Skip CRD definitions and custom resources; validate native workloads and configuration.
          kubeconform -strict -summary \
            -kubernetes-version "$(yq -r '.data.KUBERNETES_VERSION | sub("^v", "")' kubernetes/clusters/homelab/settings.yaml)" \
            -skip CustomResourceDefinition,Certificate,ClusterIssuer,ClusterSecretStore,ExternalSecret,HelmRelease,HelmRepository,IngressRoute,Kustomization,Middleware,TLSStore \
            "$RUNNER_TEMP/rendered/authored.yaml"
      - name: Render and validate isolated Talos configuration
        if: ${{ inputs.talos }}
        run: |
          umask 077
          fixture="$RUNNER_TEMP/talos"
          module="$fixture/infra/talos"
          mkdir -p "$module" "$fixture/kubernetes/clusters/homelab"
          trap 'rm -rf "$fixture"' EXIT
          cp infra/talos/*.tf infra/talos/.terraform.lock.hcl "$module/"
          cp kubernetes/clusters/homelab/settings.yaml "$fixture/kubernetes/clusters/homelab/"
          export TF_DATA_DIR="$fixture/providers"
          tofu -chdir="$module" init -lockfile=readonly -backend-config="path=$fixture/render.tfstate"
          tofu -chdir="$module" plan -refresh=false -target=data.talos_machine_configuration.node -out="$fixture/render.tfplan" > /dev/null
          tofu -chdir="$module" show -json "$fixture/render.tfplan" | jq -e '
            all(.resource_changes[];
              (.address == "talos_machine_secrets.cluster" and .change.actions == ["create"]) or
              (.address == "data.talos_machine_configuration.node" and .change.actions == ["read"]))
          ' > /dev/null
          tofu -chdir="$module" apply "$fixture/render.tfplan" > /dev/null
          jq -e 'has("encrypted_data")' "$fixture/render.tfstate" > /dev/null
          tofu -chdir="$module" output -raw machine_configuration > "$fixture/machine.yaml"
          talosctl validate --config "$fixture/machine.yaml" --mode metal --strict
          yq ea -N -o=json -I=0 '.' "$fixture/machine.yaml" | jq -se \
            --arg interface "$(yq -r '.data.NODE_INTERFACE' kubernetes/clusters/homelab/settings.yaml)" \
            --arg node "$(yq -r '.data.NODE_IP' kubernetes/clusters/homelab/settings.yaml)/32" \
            --arg pods "$(yq -r '.data.POD_CIDR' kubernetes/clusters/homelab/settings.yaml)" '
            any(.[]; .kind == "SysctlConfig" and .params["net.ipv4.tcp_congestion_control"] == "bbr") and
            any(.[]; .kind == "EthernetConfig" and .name == $interface and
              .features["rx-udp-gro-forwarding"] == true and .features["rx-gro-list"] == false) and
            any(.[]; .kind == "NetworkRuleConfig" and .name == "adguard-http" and
              .portSelector.ports == [3000] and .portSelector.protocol == "tcp" and
              ([.ingress[].subnet] | sort) == ([$node, $pods] | sort))
          ' > /dev/null
      - run: git diff --check
