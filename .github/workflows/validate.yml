name: validate
on:
  workflow_dispatch:
    inputs:
      talos:
        description: Also render and validate Talos configuration in isolated temporary state
        type: boolean
        default: false
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  configuration:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      TF_IN_AUTOMATION: "1"
      TF_INPUT: "0"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.6
        with:
          install_args: opentofu flux2 kustomize kubeconform yq ${{ inputs.talos && 'talosctl jq' || '' }}
      - name: Prepare verified Talos provider mirror
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(yq -p hcl -er '.provider."registry.opentofu.org/siderolabs/talos".version' infra/talos/.terraform.lock.hcl)
          platform=$(tofu version -json | yq -p json -er '.platform')
          package="terraform-provider-talos_${version}_${platform}.zip"
          sums="terraform-provider-talos_${version}_SHA256SUMS"
          assets="$RUNNER_TEMP/talos-assets"
          mirror="$RUNNER_TEMP/provider-mirror/registry.opentofu.org/siderolabs/talos"
          mkdir -p "$assets" "$mirror"
          # gh uses GitHub's asset API, avoiding the failing /releases/download edge route.
          gh release download "v$version" --repo siderolabs/terraform-provider-talos \
            --pattern "$package" --pattern "$sums" --pattern "$sums.sig" --dir "$assets"
          curl --fail --silent --show-error --location \
            "https://registry.opentofu.org/v1/providers/siderolabs/talos/$version/download/${platform/_/\/}" \
            --output "$assets/registry.json"
          yq -p json -er '.signing_keys.gpg_public_keys[].ascii_armor' "$assets/registry.json" > "$assets/keys.asc"
          export GNUPGHOME="$RUNNER_TEMP/talos-gnupg"
          mkdir -m 700 "$GNUPGHOME"
          gpg --batch --import "$assets/keys.asc" > /dev/null 2>&1
          if ! gpg --batch --verify "$assets/$sums.sig" "$assets/$sums" > /dev/null 2>&1; then
            echo 'Talos provider checksum signature verification failed' >&2
            exit 1
          fi
          (cd "$assets" && sha256sum --check --ignore-missing "$sums")
          mv "$assets/$package" "$mirror/"
          # OpenTofu independently checks this packed mirror against the unchanged lockfile.
          # https://opentofu.org/docs/cli/config/config-file/#explicit-installation-method-configuration
          printf 'provider_installation {\n  filesystem_mirror {\n    path = "%s"\n    include = ["registry.opentofu.org/siderolabs/talos"]\n  }\n  direct {\n    exclude = ["registry.opentofu.org/siderolabs/talos"]\n  }\n}\n' \
            "$RUNNER_TEMP/provider-mirror" > "$RUNNER_TEMP/providers.tfrc"
          printf 'TF_CLI_CONFIG_FILE=%s\n' "$RUNNER_TEMP/providers.tfrc" >> "$GITHUB_ENV"
      - name: Validate OpenTofu configuration
        env:
          TF_DATA_DIR: ${{ runner.temp }}/tofu-providers
        run: |
          export TF_VAR_state_passphrase=$(openssl rand -hex 32)
          printf 'TF_VAR_state_passphrase=%s\n' "$TF_VAR_state_passphrase" >> "$GITHUB_ENV"
          tofu -chdir=infra/talos fmt -check
          tofu -chdir=infra/talos init -backend=false -lockfile=readonly
          tofu -chdir=infra/talos validate
      - name: Validate backup cloud OpenTofu configuration
        env:
          TF_DATA_DIR: ${{ runner.temp }}/backup-cloud-providers
        run: |
          export TF_VAR_state_passphrase=$(openssl rand -hex 32)
          tofu -chdir=infra/backup fmt -check
          tofu -chdir=infra/backup init -backend=false -lockfile=readonly
          tofu -chdir=infra/backup validate
      - name: Prepare official Flux bootstrap bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bootstrap="$RUNNER_TEMP/bootstrap"
          mkdir -p "$bootstrap"
          cp kubernetes/bootstrap/kustomization.yaml "$bootstrap/"
          version=$(yq -er '.resources[0] | split("?ref=")[1]' "$bootstrap/kustomization.yaml")
          while read -r resource; do
            [[ "$resource" == https://github.com/fluxcd/flux2/manifests/*"?ref=$version" ]]
          done < <(yq -r '.resources[]' "$bootstrap/kustomization.yaml")
          # The release bundle is byte-identical to these upstream bases; keep the authored overlay.
          gh release download "$version" --repo fluxcd/flux2 --pattern manifests.tar.gz --dir "$bootstrap"
          tar -xzf "$bootstrap/manifests.tar.gz" -C "$bootstrap"
          yq -i '.resources |= map(sub(".*/", "") | sub("\\?ref=.*", ".yaml"))' "$bootstrap/kustomization.yaml"
      - name: Build and substitute Kubernetes configuration
        run: |
          while IFS=$'\t' read -r key value; do
            export "$key=$value"
          done < <(yq -N -r '.data | to_entries | .[] | [.key, .value] | @tsv' kubernetes/clusters/homelab/{settings,onepassword}.yaml)
          mkdir -p "$RUNNER_TEMP/rendered"
          for path in bootstrap clusters/homelab platform/controllers platform/onepassword platform/config identity apps access; do
            if [[ "$path" == bootstrap ]]; then
              kustomize build "$RUNNER_TEMP/bootstrap" >> "$RUNNER_TEMP/rendered/authored.yaml"
            elif [[ "$path" == clusters/homelab ]]; then
              kustomize build "kubernetes/$path" >> "$RUNNER_TEMP/rendered/authored.yaml"
            else
              kustomize build "kubernetes/$path" | flux envsubst --strict >> "$RUNNER_TEMP/rendered/authored.yaml"
            fi
            printf '\n---\n' >> "$RUNNER_TEMP/rendered/authored.yaml"
          done
      - name: Check local-path storage and credential safeguards
        run: |
          python3 -m pip install cryptography==50.0.2
          python3 -m unittest discover -s tests -v
      - name: Validate native Kubernetes schemas
        run: |
          # Skip CRD definitions and custom resources; validate native workloads and configuration.
          kubeconform -strict -summary \
            -kubernetes-version "$(yq -r '.data.KUBERNETES_VERSION | sub("^v", "")' kubernetes/clusters/homelab/settings.yaml)" \
            -skip CustomResourceDefinition,Certificate,ClusterIssuer,OnePasswordItem,HelmRelease,HelmRepository,IngressRoute,Kustomization,Middleware,TLSStore,talos.dev/v1alpha1/ServiceAccount \
            "$RUNNER_TEMP/rendered/authored.yaml"
      - name: Render and validate isolated Talos configuration
        if: ${{ inputs.talos }}
        run: |
          umask 077
          fixture="$RUNNER_TEMP/talos"
          module="$fixture/infra/talos"
          mkdir -p "$module" "$fixture/kubernetes/clusters/homelab"
          trap 'rm -rf "$fixture"' EXIT
          cp infra/talos/*.tf infra/talos/.terraform.lock.hcl "$module/"
          cp kubernetes/clusters/homelab/settings.yaml "$fixture/kubernetes/clusters/homelab/"
          export TF_DATA_DIR="$fixture/providers"
          tofu -chdir="$module" init -lockfile=readonly -backend-config="path=$fixture/render.tfstate"
          tofu -chdir="$module" plan -refresh=false -target=data.talos_machine_configuration.node -out="$fixture/render.tfplan" > /dev/null
          tofu -chdir="$module" show -json "$fixture/render.tfplan" | jq -e '
            all(.resource_changes[];
              (.address == "talos_machine_secrets.cluster" and .change.actions == ["create"]) or
              (.address == "data.talos_machine_configuration.node" and .change.actions == ["read"]))
          ' > /dev/null
          tofu -chdir="$module" apply "$fixture/render.tfplan" > /dev/null
          jq -e 'has("encrypted_data")' "$fixture/render.tfstate" > /dev/null
          tofu -chdir="$module" output -raw machine_configuration > "$fixture/machine.yaml"
          talosctl validate --config "$fixture/machine.yaml" --mode metal --strict
          yq ea -N -o=json -I=0 '.' "$fixture/machine.yaml" | jq -se \
            --arg interface "$(yq -r '.data.NODE_INTERFACE' kubernetes/clusters/homelab/settings.yaml)" \
            --arg node "$(yq -r '.data.NODE_IP' kubernetes/clusters/homelab/settings.yaml)/32" \
            --arg pods "$(yq -r '.data.POD_CIDR' kubernetes/clusters/homelab/settings.yaml)" '
            any(.[]; .kind == "SysctlConfig" and .params["net.ipv4.tcp_congestion_control"] == "bbr") and
            any(.[]; .kind == "EthernetConfig" and .name == $interface and
              .features["rx-udp-gro-forwarding"] == true and .features["rx-gro-list"] == false) and
            any(.[]; .kind == "NetworkRuleConfig" and .name == "adguard-http" and
              .portSelector.ports == [3000] and .portSelector.protocol == "tcp" and
              ([.ingress[].subnet] | sort) == ([$node, $pods] | sort)) and
            any(.[]; .kind == "NetworkRuleConfig" and .name == "talos-api" and
              .portSelector.ports == [50000] and .portSelector.protocol == "tcp" and
              ([.ingress[].subnet] | index($pods)) != null) and
            any(.[]; .kind == "KubeTalosAPIAccessConfig" and
              .allowedRoles == ["os:admin"] and .allowedKubernetesNamespaces == ["homelab"])
          ' > /dev/null
      - run: git diff --check
