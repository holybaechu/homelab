name: browser-vault
on:
  pull_request:
    paths:
      - kubernetes/apps/hermes/**
      - tests/browser_vault/**
      - tests/hermes_instructions/**
      - .github/workflows/browser-vault.yml
  push:
    branches: [main]
    paths:
      - kubernetes/apps/hermes/**
      - tests/browser_vault/**
      - tests/hermes_instructions/**
      - .github/workflows/browser-vault.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-vault:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Exercise pinned native broker with synthetic Connect API and Chromium
        run: |
          docker run --rm --user 0 --shm-size=256m \
            --entrypoint /opt/hermes/.venv/bin/python \
            -e PYTHONPATH=/opt/hermes \
            -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo \
            nousresearch/hermes-agent:latest-desktop@sha256:399ec6c0052a945b06b38de9d44d26b636237a60e97422d2d81f1c38b8d7c9fd \
            tests/browser_vault/test_connect.py
      - name: Check instruction history with native Git and credential patterns
        run: |
          docker run --rm --user 0 \
            --entrypoint /opt/hermes/.venv/bin/python \
            -e PYTHONPATH=/opt/hermes \
            -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo \
            nousresearch/hermes-agent:latest-desktop@sha256:399ec6c0052a945b06b38de9d44d26b636237a60e97422d2d81f1c38b8d7c9fd \
            tests/hermes_instructions/test_history.py
