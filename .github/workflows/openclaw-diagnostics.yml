name: openclaw-diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Connect Tailscale
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          version: "1.102.2"
          args: --accept-dns=false
          ping: ${{ vars.PVE_TAILSCALE_IP }}

      - name: Configure SSH
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: ./scripts/ci/configure-ssh.sh

      - name: Trust the OpenClaw LXC host key through Proxmox
        run: |
          set -eu
          umask 077
          host_key="$(
            timeout --signal=TERM --kill-after=5s 30s ssh \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
              -i "${HOME}/.ssh/id_ed25519" \
              root@192.168.0.2 \
              'pct exec 118 -- cat /etc/ssh/ssh_host_ed25519_key.pub'
          )"
          printf '%s\n' "${host_key}" | ssh-keygen -l -f - >/dev/null
          ssh-keygen -R 192.168.0.5 -f "${HOME}/.ssh/known_hosts" >/dev/null 2>&1 || true
          printf '192.168.0.5 %s\n' "${host_key}" >> "${HOME}/.ssh/known_hosts"

      - name: Classify the CTF session trajectory on the Gateway
        run: |
          set -eu
          timeout --signal=TERM --kill-after=10s 90s ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
            -i "${HOME}/.ssh/id_ed25519" \
            root@192.168.0.5 'sh -s' <<'REMOTE'
          set -eu
          runuser -u openclaw -- env \
              HOME=/home/openclaw \
              OPENCLAW_HOME=/home/openclaw \
              OPENCLAW_STATE_DIR=/var/lib/openclaw \
              OPENCLAW_CONFIG_PATH=/home/openclaw/openclaw-setup/config/openclaw.json \
              OPENCLAW_GATEWAY_TOKEN_FILE=/run/openclaw-gateway/gateway_token \
              OPENCLAW_DISCORD_BOT_TOKEN_FILE=/run/openclaw-gateway/discord_bot_token \
              PATH=/opt/nodejs/current/bin:/opt/openclaw/current/bin:/usr/local/bin:/usr/bin:/bin \
              /opt/nodejs/current/bin/node \
              /opt/openclaw/current/lib/node_modules/openclaw/openclaw.mjs \
              sessions tail \
              --agent ctf \
              --session-key agent:ctf:discord:channel:1537716407889039391 \
              --tail 80 | python3 -c '
          import re
          import sys

          text = sys.stdin.read().lower()
          categories = {
              "auth_failure": r"authentication failed|http 401|unauthorized|token.{0,32}expired",
              "sandbox_failure": r"sandbox.{0,48}(error|failed)|docker.{0,48}(error|failed)",
              "context_failure": r"(context|workspace|skill).{0,48}(error|failed)",
              "timeout_failure": r"timed? out|timeout",
              "suppressed_reply": r"no_reply|silent reply|reply suppressed",
              "generic_failure": r"\berror\b|\bfailed\b",
              "successful_completion": r"terminal status.{0,24}(ok|done|success)|completion.{0,24}(ok|done|success)",
          }
          print("trajectory_present=" + ("yes" if text.strip() else "no"))
          for name, pattern in categories.items():
              print(f"{name}={len(re.findall(pattern, text))}")
          '
          journalctl --no-pager --quiet \
              --unit openclaw-gateway.service \
              --since '2 hours ago' | python3 -c '
          import re
          import sys

          text = sys.stdin.read().lower()
          categories = {
              "journal_ctf_channel": r"1537716407889039391",
              "journal_ctf_agent": r"agent[:= ]+ctf|agentid[=: ]+ctf",
              "journal_inbound": r"discord.{0,64}(inbound|received|message)",
              "journal_dispatch": r"dispatch|route.{0,32}ctf",
              "journal_no_visible_reply": r"command produced no visible reply|no visible reply",
              "journal_empty_reply": r"empty.{0,32}reply|reply.{0,32}empty",
              "journal_dropped": r"drop(ped|ping)?.{0,48}(message|reply)|suppress(ed)?.{0,48}reply",
              "journal_codex_completion": r"codex.{0,64}(complete|done|success)",
              "journal_codex_failure": r"codex.{0,64}(error|failed|401|unauthorized)",
              "journal_sandbox_start": r"sandbox.{0,64}(start|spawn|create)",
              "journal_sandbox_failure": r"sandbox.{0,64}(error|failed)|docker.{0,64}(error|failed)",
              "journal_codex_auth": r"(codex|openai).{0,96}(401|unauthorized|authentication failed|token expired)",
              "journal_docker_transport": r"docker.{0,96}(ssh|dial|transport|daemon|host key|connection refused)",
              "journal_image_missing": r"(image|manifest).{0,64}(not found|missing|no such)",
              "journal_network_missing": r"network.{0,64}(not found|missing|no such)",
              "journal_mount_failure": r"(mount|bind).{0,64}(denied|error|failed|missing|not found)",
              "journal_permission_denied": r"permission denied|operation not permitted|eacces|eperm",
              "journal_container_create": r"(create|creating).{0,48}container|container.{0,48}(create|creating)",
              "journal_workspace_failure": r"workspace.{0,64}(denied|error|failed|missing|not found)",
              "journal_tool_unavailable": r"tool.{0,64}(unavailable|not found|denied|not allowed)",
          }
          print("journal_present=" + ("yes" if text.strip() else "no"))
          for name, pattern in categories.items():
              print(f"{name}={len(re.findall(pattern, text))}")
          '
          REMOTE

      - name: Disconnect Tailscale
        if: always()
        run: sudo tailscale logout || true
