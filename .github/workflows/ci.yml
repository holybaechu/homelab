name: ci

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Daily at 03:17 Asia/Seoul (18:17 UTC).
    - cron: "17 18 * * *"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      ANSIBLE_CONFIG: infra/ansible/ansible.cfg
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-deploy.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt -r requirements-deploy.txt

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r infra/ansible/requirements.yml

      - name: Check generated Ansible inventory
        run: python3 scripts/ci/render_ansible_inventory.py --check

      - name: Run repository tests
        run: PYTHONPATH=$PWD pytest

      - name: Install OpenTofu
        run: ./scripts/ci/install-opentofu.sh

      - name: Validate OpenTofu
        run: |
          cd infra/opentofu/envs/prod
          cp terraform.tfvars.example terraform.tfvars
          tofu init -backend=false
          tofu fmt -recursive -check ../..
          tofu validate

      - name: Check active Ansible playbook syntax
        run: |
          for playbook in \
            bootstrap.yml \
            preflight-openclaw-lxc.yml \
            fence-openclaw-docker-before-native.yml \
            rebaseline-openclaw-retained-rollback.yml \
            site.yml \
            validate.yml; do
            ansible-playbook -i infra/ansible/inventory/prod/hosts.yml \
              "infra/ansible/playbooks/${playbook}" --syntax-check
          done

      - name: Validate Docker Compose migration manifests
        run: ./scripts/ci/validate-compose.sh
