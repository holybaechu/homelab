name: backup
on:
  pull_request:
    paths: [kubernetes/backup/**, tests/backup/**, .github/workflows/backup.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.8
        with:
          install_args: go jq yq
      - name: Verify exact suspend-only admission CEL
        working-directory: tests/backup/admission
        run: go test -v ./...
      - name: Use restic from the official K8up runner
        run: |
          version=$(yq -r '.data.K8UP_VERSION' kubernetes/clusters/homelab/settings.yaml)
          container=$(docker create "ghcr.io/k8up-io/k8up:$version")
          docker cp "$container:/usr/local/bin/restic" "$RUNNER_TEMP/restic"
          docker rm "$container"
          chmod +x "$RUNNER_TEMP/restic"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Exercise SQLite WAL, capture recovery, notifications and real restic copy/restore
        run: python3 -m unittest discover -s tests/backup -v
      - name: Exercise PostgreSQL 14 and 18 native capture and logical restore
        run: |
          for image in ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0 postgres:18.6-trixie; do
            name="backup-postgres-${image##*:}"
            docker network create "$name"
            docker run -d --name "$name" --network "$name" \
              -e POSTGRES_HOST_AUTH_METHOD=trust "$image" > /dev/null
            docker run --rm --network "$name" --entrypoint bash \
              -v "$PWD:/repo:ro" "$image" /repo/tests/backup/postgres_restore.sh "$name"
            docker rm -f "$name"
            docker network rm "$name"
          done
      - run: git diff --check
