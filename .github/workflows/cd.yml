name: cd

on:
  workflow_dispatch:
    inputs:
      tofu_force_unlock_id:
        description: Confirmed stale OpenTofu lock UUID to remove before planning
        required: false
        type: string
      verify_workload_identity:
        description: Prove long-lived workload containers do not restart or recreate
        required: false
        default: false
        type: boolean
      migrate_openclaw_native:
        description: One-time transfer and activation of the dedicated native OpenClaw LXC
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cd.yml"
      - ".opentofu-version"
      - "apps/**"
      - "infra/**"
      - "requirements-deploy.txt"
      - "scripts/ci/**"

permissions:
  contents: write
  id-token: write

concurrency:
  group: cd-prod
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: prod
    env:
      TF_IN_AUTOMATION: "1"
      ANSIBLE_CONFIG: infra/ansible/ansible.cfg
      # Temporary, tracked phase-1 gate. Phase 2 removes this together with the
      # one-shot migration input after native activation is committed.
      OPENCLAW_NATIVE_TRANSITION: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Select deployment scope
        id: scope
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before || '' }}
        run: python3 scripts/ci/select-deployment-scope.py "${GITHUB_OUTPUT}"

      - name: Validate manual deployment inputs
        if: github.event_name == 'workflow_dispatch'
        env:
          MIGRATE_OPENCLAW_NATIVE: ${{ inputs.migrate_openclaw_native }}
        run: |
          set -eu
          if [ "${MIGRATE_OPENCLAW_NATIVE}" = true ] \
            && [ "${OPENCLAW_NATIVE_TRANSITION}" != true ]; then
            echo "Native OpenClaw migration is available only during the tracked transition." >&2
            exit 2
          fi

      - name: Fail closed on non-full changes during the native transition
        if: env.OPENCLAW_NATIVE_TRANSITION == 'true'
        env:
          DEPLOYMENT_SCOPE: ${{ steps.scope.outputs.deployment_scope }}
        run: |
          set -eu
          test "${DEPLOYMENT_SCOPE}" = full || {
            echo "Only the serialized narrow OpenClaw stage may deploy during the native transition." >&2
            exit 2
          }

      - name: Pin the serialized Arcane deployment ref
        run: |
          git push --force origin "${GITHUB_SHA}:refs/heads/arcane-deploy"
          remote_sha="$(git ls-remote --heads origin refs/heads/arcane-deploy | awk '{print $1}')"
          test "${remote_sha}" = "${GITHUB_SHA}"

      - name: Connect Tailscale
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          # renovate: datasource=github-releases depName=tailscale/tailscale versioning=semver extractVersion=^v(?<version>.*)$
          version: "1.102.2"
          args: --accept-dns=false
          ping: ${{ vars.PVE_TAILSCALE_IP }}

      - name: Deploy changed workloads with Arcane
        if: >-
          steps.scope.outputs.deployment_scope == 'arcane' &&
          env.OPENCLAW_NATIVE_TRANSITION != 'true'
        env:
          ARCANE_PROJECTS: ${{ steps.scope.outputs.arcane_projects }}
        run: |
          printf '%s\n' '192.168.0.3 arcane.home.hchu.me' | sudo tee -a /etc/hosts >/dev/null
          python3 scripts/ci/deploy-with-arcane.py \
            --base-url https://arcane.home.hchu.me \
            --audience https://arcane.home.hchu.me \
            --projects "${ARCANE_PROJECTS}" \
            --expected-commit "${GITHUB_SHA}"

      - name: Install tooling
        env:
          INSTALL_OPENTOFU: ${{ steps.scope.outputs.deployment_scope == 'full' }}
        run: ./scripts/ci/install-tools.sh

      - name: Configure SSH
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: ./scripts/ci/configure-ssh.sh

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r infra/ansible/requirements.yml

      - name: Preflight dedicated OpenClaw LXC allocation
        if: steps.scope.outputs.deployment_scope == 'full'
        env:
          PVE_ROOT_DATASTORE_ID: ${{ vars.PVE_ROOT_DATASTORE_ID }}
        run: >-
          ansible-playbook -i infra/ansible/inventory/prod/hosts.yml
          infra/ansible/playbooks/preflight-openclaw-lxc.yml
          --extra-vars
          "openclaw_root_datastore_id=${PVE_ROOT_DATASTORE_ID}"

      - name: Trust Docker application LXC access for transition proof
        if: >-
          env.OPENCLAW_NATIVE_TRANSITION == 'true' &&
          steps.scope.outputs.deployment_scope == 'full'
        run: >-
          ansible-playbook -i infra/ansible/inventory/prod/hosts.yml
          infra/ansible/playbooks/trust-docker-apps.yml

      - name: Capture unaffected transition workload identities
        id: transition_identity_capture
        if: >-
          env.OPENCLAW_NATIVE_TRANSITION == 'true' &&
          steps.scope.outputs.deployment_scope == 'full'
        env:
          MIGRATE_OPENCLAW_NATIVE: ${{ inputs.migrate_openclaw_native == true }}
          TRANSITION_IDENTITY_BASELINE: ${{ runner.temp }}/openclaw-transition-identities.before.tsv
          RETAINED_GATEWAY_BASELINE: ${{ runner.temp }}/openclaw-retained-gateway.before.tsv
        run: |
          set -euo pipefail
          umask 077
          docker_apps_host="$(
            ansible-inventory \
              -i infra/ansible/inventory/prod/hosts.yml \
              --host docker_apps |
              python3 -c '
          import ipaddress
          import json
          import sys

          value = json.load(sys.stdin).get("ansible_host")
          try:
              address = ipaddress.ip_address(value)
          except (TypeError, ValueError) as exc:
              raise SystemExit("docker_apps ansible_host must be an IP address") from exc
          if address.version != 4 or not address.is_private:
              raise SystemExit("docker_apps ansible_host must be a private IPv4 address")
          print(address)
          '
          )"
          printf 'DOCKER_APPS_SSH_HOST=%s\n' "${docker_apps_host}" >> "${GITHUB_ENV}"
          timeout --signal=TERM --kill-after=10s 60s ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
            -i "${HOME}/.ssh/id_ed25519" \
            "root@${docker_apps_host}" \
            'sh -s -- snapshot platform media code openclaw arcane-control' \
            < scripts/ci/verify-compose-container-identities.sh |
            awk -F '\t' -v migration="${MIGRATE_OPENCLAW_NATIVE}" '
              NR == 1 { print; next }
              migration == "true" && $1 == "openclaw" && $2 == "openclaw-gateway" { next }
              migration == "true" && $1 == "arcane-control" && $2 == "arcane" { next }
              migration != "true" && $1 == "platform" && $2 == "traefik" { next }
              { print }
            ' > "${TRANSITION_IDENTITY_BASELINE}"
          test "$(wc -l < "${TRANSITION_IDENTITY_BASELINE}")" -gt 1

          if [ "${MIGRATE_OPENCLAW_NATIVE}" = true ]; then
            timeout --signal=TERM --kill-after=10s 60s ssh \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
              -i "${HOME}/.ssh/id_ed25519" \
              "root@${docker_apps_host}" \
              "set -eu; cd /opt/homelab-compose/openclaw; container=\$(docker compose ps --all -q openclaw-gateway); test -n \"\${container}\"; docker inspect --format '{{.Id}}\t{{.Created}}\t{{.Image}}\t{{.Config.Image}}' \"\${container}\"" \
              > "${RETAINED_GATEWAY_BASELINE}"
            test -s "${RETAINED_GATEWAY_BASELINE}"
          fi

      - name: Trust Docker application LXC access for identity proof
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.verify_workload_identity == true &&
          steps.scope.outputs.deployment_scope == 'full' &&
          env.OPENCLAW_NATIVE_TRANSITION != 'true'
        run: >-
          ansible-playbook -i infra/ansible/inventory/prod/hosts.yml
          infra/ansible/playbooks/trust-docker-apps.yml

      - name: Capture long-lived workload container identities
        id: workload_identity_capture
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.verify_workload_identity == true &&
          steps.scope.outputs.deployment_scope == 'full' &&
          env.OPENCLAW_NATIVE_TRANSITION != 'true'
        env:
          WORKLOAD_IDENTITY_BASELINE: ${{ runner.temp }}/compose-identities.before.tsv
        run: |
          set -eu
          umask 077
          docker_apps_host="$(
            ansible-inventory \
              -i infra/ansible/inventory/prod/hosts.yml \
              --host docker_apps |
              python3 -c '
          import ipaddress
          import json
          import sys

          value = json.load(sys.stdin).get("ansible_host")
          try:
              address = ipaddress.ip_address(value)
          except (TypeError, ValueError) as exc:
              raise SystemExit("docker_apps ansible_host must be an IP address") from exc
          if address.version != 4 or not address.is_private:
              raise SystemExit("docker_apps ansible_host must be a private IPv4 address")
          print(address)
          '
          )"
          printf 'DOCKER_APPS_SSH_HOST=%s\n' "${docker_apps_host}" >> "${GITHUB_ENV}"
          timeout --signal=TERM --kill-after=10s 60s ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
            -i "${HOME}/.ssh/id_ed25519" \
            "root@${docker_apps_host}" \
            'sh -s -- snapshot' \
            < scripts/ci/verify-compose-container-identities.sh \
            > "${WORKLOAD_IDENTITY_BASELINE}"
          test -s "${WORKLOAD_IDENTITY_BASELINE}"

      - name: Validate and write Ansible service secrets
        if: steps.scope.outputs.deployment_scope == 'full'
        env:
          ANSIBLE_EXTRA_VARS_PATH: ${{ runner.temp }}/ansible-extra-vars.json
          CLOUDFLARE_TRAEFIK_TOKEN: ${{ secrets.CLOUDFLARE_TRAEFIK_TOKEN || secrets.CLOUDFLARE_CADDY_TOKEN }}
          CLOUDFLARE_DDNS_TOKEN: ${{ secrets.CLOUDFLARE_DDNS_TOKEN }}
          ADGUARD_ADMIN_USERNAME: ${{ vars.ADGUARD_ADMIN_USERNAME }}
          ADGUARD_ADMIN_PASSWORD: ${{ secrets.ADGUARD_ADMIN_PASSWORD }}
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
          QBITTORRENT_WEBUI_PASSWORD: ${{ secrets.QBITTORRENT_WEBUI_PASSWORD }}
          COPYPARTY_USERS_JSON: ${{ secrets.COPYPARTY_USERS_JSON }}
          ARCANE_ENCRYPTION_KEY: ${{ secrets.ARCANE_ENCRYPTION_KEY }}
          ARCANE_JWT_SECRET: ${{ secrets.ARCANE_JWT_SECRET }}
          OPENCLAW_GATEWAY_TOKEN: ${{ secrets.OPENCLAW_GATEWAY_TOKEN }}
        run: python3 scripts/ci/write_ansible_extra_vars.py "${ANSIBLE_EXTRA_VARS_PATH}"

      - name: Prepare one-time lowest-ID cutover
        if: >-
          steps.scope.outputs.deployment_scope == 'full' &&
          env.OPENCLAW_NATIVE_TRANSITION != 'true'
        env:
          LOW_ID_CUTOVER_CONFIRMED: ${{ vars.LOW_ID_CUTOVER_CONFIRMED }}
          ANSIBLE_EXTRA_VARS_PATH: ${{ runner.temp }}/ansible-extra-vars.json
        run: >-
          ansible-playbook -i infra/ansible/inventory/prod/hosts.yml
          infra/ansible/playbooks/prepare-low-id-cutover.yml
          --extra-vars
          "low_id_cutover_confirmed=${LOW_ID_CUTOVER_CONFIRMED}"
          --extra-vars @"${ANSIBLE_EXTRA_VARS_PATH}"

      - name: OpenTofu plan
        if: >-
          steps.scope.outputs.deployment_scope == 'full' &&
          (env.OPENCLAW_NATIVE_TRANSITION != 'true' ||
          inputs.migrate_openclaw_native != true)
        env:
          PROXMOX_ENDPOINT: ${{ secrets.PROXMOX_ENDPOINT }}
          PROXMOX_API_TOKEN: ${{ secrets.PROXMOX_API_TOKEN }}
          PROXMOX_INSECURE_TLS: "true"
          PVE_NODE_NAME: ${{ vars.PVE_NODE_NAME }}
          PVE_BRIDGE: ${{ vars.PVE_BRIDGE }}
          PVE_ROOT_DATASTORE_ID: ${{ vars.PVE_ROOT_DATASTORE_ID }}
          DEPLOY_SSH_PUBLIC_KEYS: ${{ secrets.DEPLOY_SSH_PUBLIC_KEYS }}
          TOFU_STATE_BUCKET: ${{ vars.TOFU_STATE_BUCKET }}
          TOFU_STATE_KEY: ${{ vars.TOFU_STATE_KEY }}
          TOFU_STATE_REGION: ${{ vars.TOFU_STATE_REGION }}
          TOFU_STATE_ENDPOINT: ${{ vars.TOFU_STATE_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.TOFU_STATE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TOFU_STATE_SECRET_ACCESS_KEY }}
          TOFU_FORCE_UNLOCK_ID: ${{ inputs.tofu_force_unlock_id || '' }}
          OPENCLAW_NATIVE_STAGE_ONLY: ${{ env.OPENCLAW_NATIVE_TRANSITION == 'true' }}
        run: ./scripts/ci/tofu-plan.sh

      - name: OpenTofu apply
        if: >-
          steps.scope.outputs.deployment_scope == 'full' &&
          (env.OPENCLAW_NATIVE_TRANSITION != 'true' ||
          inputs.migrate_openclaw_native != true)
        env:
          PROXMOX_ENDPOINT: ${{ secrets.PROXMOX_ENDPOINT }}
          PROXMOX_API_TOKEN: ${{ secrets.PROXMOX_API_TOKEN }}
          PROXMOX_INSECURE_TLS: "true"
          PVE_NODE_NAME: ${{ vars.PVE_NODE_NAME }}
          PVE_BRIDGE: ${{ vars.PVE_BRIDGE }}
          PVE_ROOT_DATASTORE_ID: ${{ vars.PVE_ROOT_DATASTORE_ID }}
          DEPLOY_SSH_PUBLIC_KEYS: ${{ secrets.DEPLOY_SSH_PUBLIC_KEYS }}
          TOFU_STATE_BUCKET: ${{ vars.TOFU_STATE_BUCKET }}
          TOFU_STATE_KEY: ${{ vars.TOFU_STATE_KEY }}
          TOFU_STATE_REGION: ${{ vars.TOFU_STATE_REGION }}
          TOFU_STATE_ENDPOINT: ${{ vars.TOFU_STATE_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.TOFU_STATE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TOFU_STATE_SECRET_ACCESS_KEY }}
        run: ./scripts/ci/tofu-apply.sh

      - name: Bootstrap Proxmox and LXC access
        if: >-
          steps.scope.outputs.deployment_scope == 'full' &&
          env.OPENCLAW_NATIVE_TRANSITION != 'true'
        run: ansible-playbook -i infra/ansible/inventory/prod/hosts.yml infra/ansible/playbooks/bootstrap.yml

      - name: Bootstrap only the dedicated native OpenClaw LXC
        if: >-
          steps.scope.outputs.deployment_scope == 'full' &&
          env.OPENCLAW_NATIVE_TRANSITION == 'true' &&
          inputs.migrate_openclaw_native != true
        run: >-
          ansible-playbook -i infra/ansible/inventory/prod/hosts.yml
          infra/ansible/playbooks/bootstrap-openclaw-native.yml

      - name: Trust dedicated native OpenClaw LXC access
        if: >-
          steps.scope.outputs.deployment_scope == 'full' &&
          env.OPENCLAW_NATIVE_TRANSITION == 'true'
        run: >-
          ansible-playbook -i infra/ansible/inventory/prod/hosts.yml
          infra/ansible/playbooks/trust-openclaw-native.yml

      - name: Trust Docker application LXC access
        if: >-
          steps.scope.outputs.deployment_scope == 'arcane' &&
          env.OPENCLAW_NATIVE_TRANSITION != 'true'
        run: >-
          ansible-playbook -i infra/ansible/inventory/prod/hosts.yml
          infra/ansible/playbooks/trust-docker-apps.yml

      # Recover an interrupted migration before the normal roles inspect either
      # side of the paired durable transition marker. Clean first runs are no-op.
      - name: Recover an interrupted native OpenClaw migration
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.migrate_openclaw_native == true &&
          steps.scope.outputs.deployment_scope == 'full' &&
          env.OPENCLAW_NATIVE_TRANSITION == 'true'
        env:
          ANSIBLE_EXTRA_VARS_PATH: ${{ runner.temp }}/ansible-extra-vars.json
          DOCKER_APPS_SSH_HOST: 192.168.0.3
          OPENCLAW_SSH_HOST: 192.168.0.5
          OPENCLAW_EXPECTED_IP: 192.168.0.5
          OPENCLAW_PROXY_IP: 192.168.0.3
          OPENCLAW_CONTROL_UI_ORIGIN: https://openclaw.home.hchu.me
        run: sh ./scripts/ci/migrate-openclaw-native.sh recover-only

      - name: Stage only native OpenClaw and its Traefik route
        if: >-
          steps.scope.outputs.deployment_scope == 'full' &&
          env.OPENCLAW_NATIVE_TRANSITION == 'true'
        env:
          ANSIBLE_EXTRA_VARS_PATH: ${{ runner.temp }}/ansible-extra-vars.json
        run: >-
          ansible-playbook -i infra/ansible/inventory/prod/hosts.yml
          infra/ansible/playbooks/stage-openclaw-native.yml
          --extra-vars @"${ANSIBLE_EXTRA_VARS_PATH}"

      - name: Validate the narrow native OpenClaw stage
        if: >-
          steps.scope.outputs.deployment_scope == 'full' &&
          env.OPENCLAW_NATIVE_TRANSITION == 'true'
        run: >-
          ansible-playbook -i infra/ansible/inventory/prod/hosts.yml
          infra/ansible/playbooks/validate-openclaw-native-stage.yml

      - name: Fence retained Docker OpenClaw before native reconciliation
        if: >-
          steps.scope.outputs.deployment_scope == 'full' &&
          env.OPENCLAW_NATIVE_TRANSITION != 'true'
        run: >-
          ansible-playbook -i infra/ansible/inventory/prod/hosts.yml
          infra/ansible/playbooks/fence-openclaw-docker-before-native.yml

      - name: Deploy services
        if: >-
          steps.scope.outputs.deployment_scope == 'full' &&
          env.OPENCLAW_NATIVE_TRANSITION != 'true'
        env:
          ANSIBLE_EXTRA_VARS_PATH: ${{ runner.temp }}/ansible-extra-vars.json
          ANSIBLE_DEPLOYMENT_SCOPE: ${{ steps.scope.outputs.deployment_scope }}
        run: sh ./scripts/ci/run-ansible-parallel.sh site --extra-vars @"${ANSIBLE_EXTRA_VARS_PATH}"

      - name: Validate services
        if: env.OPENCLAW_NATIVE_TRANSITION != 'true'
        env:
          ANSIBLE_DEPLOYMENT_SCOPE: ${{ steps.scope.outputs.deployment_scope }}
        run: sh ./scripts/ci/run-ansible-parallel.sh validate

      - name: Arm failback and move the subnet route to VMID 111
        if: >-
          steps.scope.outputs.deployment_scope == 'full' &&
          env.OPENCLAW_NATIVE_TRANSITION != 'true'
        run: >-
          ansible-playbook -i infra/ansible/inventory/prod/hosts.yml
          infra/ansible/playbooks/arm-low-id-retirement.yml

      - name: Prove Proxmox remains reachable after VMID 112 stops
        if: >-
          steps.scope.outputs.deployment_scope == 'full' &&
          env.OPENCLAW_NATIVE_TRANSITION != 'true'
        run: |
          set -eu
          for attempt in $(seq 1 48); do
            if ansible pve_hosts -i infra/ansible/inventory/prod/hosts.yml \
              -m ansible.builtin.shell \
              -a "if pct config 112 >/dev/null 2>&1; then pct status 112 | grep -q 'status: stopped'; fi"; then
              exit 0
            fi
            sleep 5
          done
          echo "The new tailnet route was not proven; VMID 112 will restart automatically." >&2
          exit 1

      - name: Retire the archived source pair
        if: >-
          steps.scope.outputs.deployment_scope == 'full' &&
          env.OPENCLAW_NATIVE_TRANSITION != 'true'
        run: >-
          ansible-playbook -i infra/ansible/inventory/prod/hosts.yml
          infra/ansible/playbooks/finalize-low-id-retirement.yml

      - name: Prove long-lived workload container identities are unchanged
        id: workload_identity_proof
        if: >-
          always() &&
          github.event_name == 'workflow_dispatch' &&
          inputs.verify_workload_identity == true &&
          steps.scope.outputs.deployment_scope == 'full' &&
          env.OPENCLAW_NATIVE_TRANSITION != 'true' &&
          steps.workload_identity_capture.outcome == 'success'
        env:
          WORKLOAD_IDENTITY_BASELINE: ${{ runner.temp }}/compose-identities.before.tsv
          WORKLOAD_IDENTITY_CURRENT: ${{ runner.temp }}/compose-identities.after.tsv
        run: |
          set -eu
          umask 077
          test -n "${DOCKER_APPS_SSH_HOST:-}"
          test -s "${WORKLOAD_IDENTITY_BASELINE}"
          timeout --signal=TERM --kill-after=10s 60s ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
            -i "${HOME}/.ssh/id_ed25519" \
            "root@${DOCKER_APPS_SSH_HOST}" \
            'sh -s -- snapshot' \
            < scripts/ci/verify-compose-container-identities.sh \
            > "${WORKLOAD_IDENTITY_CURRENT}"
          diff -u "${WORKLOAD_IDENTITY_BASELINE}" "${WORKLOAD_IDENTITY_CURRENT}"
          timeout --signal=TERM --kill-after=10s 60s ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
            -i "${HOME}/.ssh/id_ed25519" \
            "root@${DOCKER_APPS_SSH_HOST}" \
            'sh -s -- health' \
            < scripts/ci/verify-compose-container-identities.sh

      - name: Require the requested workload identity proof to pass
        if: >-
          always() &&
          github.event_name == 'workflow_dispatch' &&
          inputs.verify_workload_identity == true &&
          env.OPENCLAW_NATIVE_TRANSITION != 'true'
        env:
          WORKLOAD_IDENTITY_CAPTURE_OUTCOME: ${{ steps.workload_identity_capture.outcome }}
          WORKLOAD_IDENTITY_PROOF_OUTCOME: ${{ steps.workload_identity_proof.outcome }}
        run: |
          set -eu
          test "${WORKLOAD_IDENTITY_CAPTURE_OUTCOME}" = success
          test "${WORKLOAD_IDENTITY_PROOF_OUTCOME}" = success

      # This is deliberately the final mutating deployment step. Phase 2 removes
      # this dispatch input and step after tracked steady-state reconciliation.
      - name: Transfer and activate native OpenClaw
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.migrate_openclaw_native == true &&
          steps.scope.outputs.deployment_scope == 'full' &&
          env.OPENCLAW_NATIVE_TRANSITION == 'true'
        env:
          ANSIBLE_EXTRA_VARS_PATH: ${{ runner.temp }}/ansible-extra-vars.json
          DOCKER_APPS_SSH_HOST: 192.168.0.3
          OPENCLAW_SSH_HOST: 192.168.0.5
          OPENCLAW_EXPECTED_IP: 192.168.0.5
          OPENCLAW_PROXY_IP: 192.168.0.3
          OPENCLAW_CONTROL_UI_ORIGIN: https://openclaw.home.hchu.me
        run: sh ./scripts/ci/migrate-openclaw-native.sh

      - name: Prove unrelated transition workloads retained their identities
        id: transition_identity_proof
        if: >-
          always() &&
          env.OPENCLAW_NATIVE_TRANSITION == 'true' &&
          steps.scope.outputs.deployment_scope == 'full' &&
          steps.transition_identity_capture.outcome == 'success'
        env:
          MIGRATE_OPENCLAW_NATIVE: ${{ inputs.migrate_openclaw_native == true }}
          TRANSITION_IDENTITY_BASELINE: ${{ runner.temp }}/openclaw-transition-identities.before.tsv
          TRANSITION_IDENTITY_CURRENT: ${{ runner.temp }}/openclaw-transition-identities.after.tsv
          RETAINED_GATEWAY_BASELINE: ${{ runner.temp }}/openclaw-retained-gateway.before.tsv
          RETAINED_GATEWAY_CURRENT: ${{ runner.temp }}/openclaw-retained-gateway.after.tsv
        run: |
          set -euo pipefail
          umask 077
          test -n "${DOCKER_APPS_SSH_HOST:-}"
          test -s "${TRANSITION_IDENTITY_BASELINE}"
          timeout --signal=TERM --kill-after=10s 60s ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
            -i "${HOME}/.ssh/id_ed25519" \
            "root@${DOCKER_APPS_SSH_HOST}" \
            'sh -s -- snapshot platform media code openclaw arcane-control' \
            < scripts/ci/verify-compose-container-identities.sh |
            awk -F '\t' -v migration="${MIGRATE_OPENCLAW_NATIVE}" '
              NR == 1 { print; next }
              migration == "true" && $1 == "openclaw" && $2 == "openclaw-gateway" { next }
              migration == "true" && $1 == "arcane-control" && $2 == "arcane" { next }
              migration != "true" && $1 == "platform" && $2 == "traefik" { next }
              { print }
            ' > "${TRANSITION_IDENTITY_CURRENT}"
          diff -u "${TRANSITION_IDENTITY_BASELINE}" "${TRANSITION_IDENTITY_CURRENT}"

          if [ "${MIGRATE_OPENCLAW_NATIVE}" = true ]; then
            test -s "${RETAINED_GATEWAY_BASELINE}"
            timeout --signal=TERM --kill-after=10s 60s ssh \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
              -i "${HOME}/.ssh/id_ed25519" \
              "root@${DOCKER_APPS_SSH_HOST}" \
              "set -eu; cd /opt/homelab-compose/openclaw; container=\$(docker compose ps --all -q openclaw-gateway); test -n \"\${container}\"; docker inspect --format '{{.Id}}\t{{.Created}}\t{{.Image}}\t{{.Config.Image}}' \"\${container}\"" \
              > "${RETAINED_GATEWAY_CURRENT}"
            diff -u "${RETAINED_GATEWAY_BASELINE}" "${RETAINED_GATEWAY_CURRENT}"
            identity_health_projects="platform media code arcane-control"
          else
            identity_health_projects="platform media code openclaw arcane-control"
          fi

          # shellcheck disable=SC2086
          timeout --signal=TERM --kill-after=10s 60s ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
            -i "${HOME}/.ssh/id_ed25519" \
            "root@${DOCKER_APPS_SSH_HOST}" \
            "sh -s -- health ${identity_health_projects}" \
            < scripts/ci/verify-compose-container-identities.sh

      - name: Require the automatic transition identity proof to pass
        if: >-
          always() &&
          env.OPENCLAW_NATIVE_TRANSITION == 'true' &&
          steps.scope.outputs.deployment_scope == 'full'
        env:
          TRANSITION_IDENTITY_CAPTURE_OUTCOME: ${{ steps.transition_identity_capture.outcome }}
          TRANSITION_IDENTITY_PROOF_OUTCOME: ${{ steps.transition_identity_proof.outcome }}
        run: |
          set -eu
          test "${TRANSITION_IDENTITY_CAPTURE_OUTCOME}" = success
          test "${TRANSITION_IDENTITY_PROOF_OUTCOME}" = success

      - name: Remove Ansible extra vars
        if: always()
        env:
          ANSIBLE_EXTRA_VARS_PATH: ${{ runner.temp }}/ansible-extra-vars.json
          WORKLOAD_IDENTITY_BASELINE: ${{ runner.temp }}/compose-identities.before.tsv
          WORKLOAD_IDENTITY_CURRENT: ${{ runner.temp }}/compose-identities.after.tsv
          TRANSITION_IDENTITY_BASELINE: ${{ runner.temp }}/openclaw-transition-identities.before.tsv
          TRANSITION_IDENTITY_CURRENT: ${{ runner.temp }}/openclaw-transition-identities.after.tsv
          RETAINED_GATEWAY_BASELINE: ${{ runner.temp }}/openclaw-retained-gateway.before.tsv
          RETAINED_GATEWAY_CURRENT: ${{ runner.temp }}/openclaw-retained-gateway.after.tsv
        run: >-
          rm -f
          "${ANSIBLE_EXTRA_VARS_PATH}"
          "${WORKLOAD_IDENTITY_BASELINE}"
          "${WORKLOAD_IDENTITY_CURRENT}"
          "${TRANSITION_IDENTITY_BASELINE}"
          "${TRANSITION_IDENTITY_CURRENT}"
          "${RETAINED_GATEWAY_BASELINE}"
          "${RETAINED_GATEWAY_CURRENT}"
          infra/opentofu/envs/prod/ci.auto.tfvars.json

      - name: Disconnect Tailscale
        if: always()
        run: sudo tailscale logout || true
