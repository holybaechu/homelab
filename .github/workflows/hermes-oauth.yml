name: hermes-oauth
on:
  workflow_dispatch:
  pull_request:
    paths:
      - kubernetes/apps/hermes/**
      - .github/workflows/hermes-oauth.yml
  push:
    branches: [main]
    paths:
      - kubernetes/apps/hermes/**
      - .github/workflows/hermes-oauth.yml
permissions:
  contents: read
jobs:
  ticktick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.3
        with:
          install_args: yq
      - name: Test OAuth compatibility against the deployed image
        run: |
          image=$(yq -N -r 'select(.kind == "Deployment") | .spec.template.spec.containers[] | select(.name == "hermes") | .image' kubernetes/apps/hermes/resources.yaml)
          docker run --rm --network none \
            -v "$GITHUB_WORKSPACE/kubernetes/apps/hermes:/check:ro" \
            --entrypoint /bin/sh "$image" -ec '
              /opt/hermes/.venv/bin/python /check/patch_ticktick_oauth.py /tmp/mcp_oauth_provider.py
              export HERMES_OAUTH_PROVIDER_FILE=/tmp/mcp_oauth_provider.py
              export PYTHONPATH=/opt/hermes:/opt/hermes/.venv/lib/python3.14/site-packages
              /opt/hermes/.venv/bin/python -P /check/tests/test_ticktick_oauth.py
            '
