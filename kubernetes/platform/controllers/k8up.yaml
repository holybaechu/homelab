apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8up
  namespace: k8up
spec:
  interval: 1h
  releaseName: k8up
  chart:
    spec:
      chart: k8up
      version: 4.10.1
      sourceRef:
        kind: HelmRepository
        name: k8up
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    image:
      tag: ${K8UP_VERSION}
    k8up:
      timezone: ${TIME_ZONE}
      skipWithoutAnnotation: true
      envVars:
        - name: BACKUP_GLOBAL_BACKOFF_LIMIT
          value: "0"
      globalResources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 1Gi
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        memory: 256Mi
