apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-account
    solvers:
    - dns01:
        cloudflare:
          apiTokenSecretRef:
            name: cloudflare-connect
            key: credential
      selector:
        dnsZones:
        - ${DOMAIN}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: hchu-me
  namespace: traefik
spec:
  secretName: hchu-me-tls
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt
  dnsNames:
  - ${DOMAIN}
  - '*.${DOMAIN}'
  - dash.hermes.${DOMAIN}
  privateKey:
    rotationPolicy: Always
---
apiVersion: traefik.io/v1alpha1
kind: TLSStore
metadata:
  name: default
  namespace: traefik
spec:
  defaultCertificate:
    secretName: hchu-me-tls
