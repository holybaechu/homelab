apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: private-only
  namespace: traefik
spec:
  ipAllowList:
    sourceRange:
    # Exclude router-SNAT traffic, including own-WAN hairpins to protected routes.
    # Regenerate with Python ipaddress: LAN_CIDR.address_exclude(GATEWAY_IP/32)
    # from clusters/homelab/settings.yaml whenever either setting changes.
    - 192.168.0.0/32
    - 192.168.0.2/31
    - 192.168.0.4/30
    - 192.168.0.8/29
    - 192.168.0.16/28
    - 192.168.0.32/27
    - 192.168.0.64/26
    - 192.168.0.128/25
    - 100.64.0.0/10
    - fd7a:115c:a1e0::/48
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: tailnet-only
  namespace: traefik
spec:
  ipAllowList:
    sourceRange:
    - 100.64.0.0/10
    - fd7a:115c:a1e0::/48
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: clear-proxy-identity
  namespace: traefik
spec:
  headers:
    customRequestHeaders:
      X-authentik-username: ''
      X-authentik-groups: ''
      X-authentik-email: ''
      X-authentik-name: ''
      X-authentik-uid: ''
      X-authentik-jwt: ''
      X-authentik-meta-jwks: ''
      X-authentik-meta-outpost: ''
      X-authentik-meta-provider: ''
      X-authentik-meta-app: ''
      X-authentik-meta-version: ''
      X-Remote-User: ''
      X-Remote-Groups: ''
      Remote-User: ''
      Remote-Groups: ''
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik
  namespace: traefik
spec:
  forwardAuth:
    address: http://authentik-server.identity.svc.cluster.local/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: false
    authResponseHeadersRegex: (?i)^X-authentik-
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: secure-headers
  namespace: traefik
spec:
  headers:
    contentTypeNosniff: true
    referrerPolicy: same-origin
    customResponseHeaders:
      # Clear cached QUIC upgrades so browsers prefer HTTP/2 on remote paths.
      Alt-Svc: clear
