apiVersion: apps/v1
kind: Deployment
metadata:
  name: cobalt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cobalt
  template:
    metadata:
      labels:
        app: cobalt
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # Upstream publishes an API image; build the unmodified static web app
      # from the matching source revision without requiring a private registry.
      initContainers:
        - name: prepare-youtube
          image: docker.io/library/node:24-bookworm
          command: [/bin/sh, -ec]
          args:
            - |
              cp /compat/package.json /compat/package-lock.json /youtube/
              npm ci --prefix /youtube --ignore-scripts --no-audit --no-fund --cache /tmp/npm
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: youtube-compat
              mountPath: /compat
              readOnly: true
            - name: youtube-dependencies
              mountPath: /youtube
            - name: build-temporary
              mountPath: /tmp
        - name: build-web
          image: docker.io/library/node:24-bookworm
          workingDir: /build
          command: [/bin/sh, -ec]
          args:
            - |
              source_dir=$(mktemp -d /build/cobalt.XXXXXX)
              cd "$source_dir"
              git init
              git remote add origin https://github.com/imputnet/cobalt.git
              git fetch --depth=1 origin "$COBALT_REVISION"
              git checkout -B main FETCH_HEAD
              corepack pnpm install --frozen-lockfile --filter @imput/cobalt-web... --store-dir /tmp/pnpm-store
              corepack pnpm --filter @imput/cobalt-web build
              cp -R web/build/. /web/
          env:
            - name: COBALT_REVISION
              value: a636575b09de1fc55d9b8cd98cac88f5f2f16b42
            - name: WEB_HOST
              value: cobalt.${DOMAIN}
            - name: WEB_DEFAULT_API
              value: https://cobalt.${DOMAIN}/api/
            - name: COREPACK_HOME
              value: /tmp/corepack
            - name: COREPACK_ENABLE_DOWNLOAD_PROMPT
              value: "0"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 3Gi
          volumeMounts:
            - name: build
              mountPath: /build
            - name: web
              mountPath: /web
            - name: build-temporary
              mountPath: /tmp
      containers:
        - name: api
          image: ghcr.io/imputnet/cobalt:11.7.1-a636575
          command: [node, --import, /compat/youtube_client.mjs, src/cobalt.js]
          env:
            - name: CUSTOM_INNERTUBE_CLIENT
              value: VISIONOS
            - name: API_URL
              value: https://cobalt.${DOMAIN}/api/
            - name: CORS_WILDCARD
              value: "0"
            - name: CORS_URL
              value: https://cobalt.${DOMAIN}
            - name: TZ
              value: ${TIME_ZONE}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: api
              containerPort: 9000
          startupProbe:
            httpGet:
              path: /
              port: api
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: api
          livenessProbe:
            httpGet:
              path: /
              port: api
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: youtube-compat
              mountPath: /compat
              readOnly: true
            - name: youtube-dependencies
              mountPath: /youtube
              readOnly: true
            - name: api-temporary
              mountPath: /tmp
        - name: web
          image: ghcr.io/nginx/nginx-unprivileged:1.30.6-alpine
          command: [nginx, -g, "daemon off;"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: web
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: web-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: web-temporary
              mountPath: /tmp
      volumes:
        - name: youtube-compat
          configMap:
            name: cobalt-youtube-compat
        - name: youtube-dependencies
          emptyDir:
            sizeLimit: 128Mi
        - name: build
          emptyDir: {}
        - name: web
          emptyDir: {}
        - name: build-temporary
          emptyDir: {}
        - name: api-temporary
          emptyDir: {}
        - name: web-temporary
          emptyDir: {}
        - name: web-config
          configMap:
            name: cobalt-web-config
---
apiVersion: v1
kind: Service
metadata:
  name: cobalt
spec:
  selector:
    app: cobalt
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: cobalt
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`cobalt.${DOMAIN}`) && PathPrefix(`/outpost.goauthentik.io/`)
      kind: Rule
      priority: 300
      middlewares:
        - name: secure-headers
          namespace: traefik
      services:
        - name: authentik-server
          namespace: identity
          port: http
    - match: Host(`cobalt.${DOMAIN}`)
      kind: Rule
      priority: 100
      middlewares:
        - name: clear-proxy-identity
          namespace: traefik
        - name: authentik
          namespace: traefik
        - name: secure-headers
          namespace: traefik
      services:
        - name: cobalt
          port: 8080
          scheme: h2c
  tls: {}
