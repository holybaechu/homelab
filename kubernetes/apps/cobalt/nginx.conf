worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # The stock client reduces the API URL to its origin. Serve HTML for
    # navigation and processing information for fetch requests on that origin.
    map "$request_method:$http_accept" $cobalt_root_api {
        default 1;
        ~*^(GET|HEAD):.*text/html 0;
    }

    server {
        listen 8080;
        http2 on;
        root /usr/share/nginx/html;
        index index.html;
        add_header Vary Accept always;

        location = / {
            if ($cobalt_root_api) {
                rewrite ^ /api/ last;
            }
            try_files /index.html =404;
        }

        location = /tunnel {
            rewrite ^ /api/tunnel last;
        }

        location = /session {
            rewrite ^ /api/session last;
        }

        # Keep requests on the frontend origin so Authentik's session covers both.
        location /api/ {
            proxy_pass http://127.0.0.1:9000/;
            # Cobalt's upstream API uses node:http and accepts HTTP/1.1.
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 600s;
        }

        location / {
            try_files $uri $uri.html $uri/ =404;
        }

        error_page 404 /404.html;
    }
}
