apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: homelab
resources:
  - resources.yaml
configMapGenerator:
  - name: cobalt-youtube-compat
    files:
      - youtube_client.mjs
      - package.json=youtube/package.json
      - package-lock.json=youtube/package-lock.json
  - name: cobalt-web-config
    files:
      - nginx.conf
