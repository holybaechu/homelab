apiVersion: apps/v1
kind: Deployment
metadata:
  name: shlink-web-client
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shlink-web-client
  template:
    metadata:
      labels:
        app: shlink-web-client
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 101
        runAsGroup: 101
        runAsNonRoot: true
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web-client
          image: ghcr.io/shlinkio/shlink-web-client:4.8.1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: servers
              mountPath: /usr/share/nginx/html/servers.json
              subPath: servers.json
              readOnly: true
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: servers
          secret:
            secretName: shlink-web-client
        - name: temporary
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: shlink-web-client
spec:
  selector:
    app: shlink-web-client
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: shlink-no-service-worker
spec:
  headers:
    # A root-scoped dashboard service worker would intercept public short links.
    contentSecurityPolicy: "worker-src 'none'"
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: shlink-web-client
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`l.${DOMAIN}`) && PathPrefix(`/outpost.goauthentik.io/`)
      kind: Rule
      priority: 300
      middlewares:
        - name: tailnet-only
          namespace: traefik
        - name: secure-headers
          namespace: traefik
      services:
        - name: authentik-server
          namespace: identity
          port: http
    # Reserve the stock web client's routes and assets; all other paths go to Shlink.
    # Routes: https://github.com/shlinkio/shlink-web-client/blob/v4.8.1/src/app/App.tsx
    - match: >-
        Host(`l.${DOMAIN}`) && (Path(`/`) || Path(`/index.html`) || Path(`/manage-servers`) ||
        Path(`/settings`) || PathPrefix(`/settings/`) ||
        Path(`/server`) || PathPrefix(`/server/`) ||
        Path(`/servers.json`) || PathPrefix(`/conf.d/`) ||
        PathPrefix(`/assets/`) || PathPrefix(`/icons/`) ||
        Path(`/manifest.json`) || Path(`/service-worker.js`) ||
        PathRegexp(`^/favicon\.(ico|svg|png|gif)$`))
      kind: Rule
      priority: 200
      middlewares:
        - name: tailnet-only
          namespace: traefik
        - name: clear-proxy-identity
          namespace: traefik
        - name: authentik
          namespace: traefik
        - name: shlink-no-service-worker
        - name: secure-headers
          namespace: traefik
      services:
        - name: shlink-web-client
          port: 8080
  tls: {}
