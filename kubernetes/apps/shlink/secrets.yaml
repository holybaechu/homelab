apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: shlink-env
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: shlink-env
    creationPolicy: Owner
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: ${SHLINK_DATABASE_PASSWORD_REF}
    - secretKey: INITIAL_API_KEY
      remoteRef:
        key: ${SHLINK_API_KEY_REF}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: shlink-web-client
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: shlink-web-client
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        servers.json: |
          [{"name":"Homelab","url":"https://l.${DOMAIN}","apiKey":{{ .apiKey | toJson }}}]
  data:
    - secretKey: apiKey
      remoteRef:
        key: ${SHLINK_API_KEY_REF}
