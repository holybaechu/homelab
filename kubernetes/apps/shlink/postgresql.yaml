apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shlink-postgresql
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      # Required PVC bookkeeping; local-path grows with writes and enforces no quota.
      storage: 1Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shlink-postgresql
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: shlink-postgresql
  template:
    metadata:
      labels:
        app: shlink-postgresql
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        runAsNonRoot: true
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: docker.io/library/postgres:18.6-trixie
          env:
            - name: POSTGRES_USER
              value: shlink
            - name: POSTGRES_DB
              value: shlink
            - name: PGDATA
              value: /var/lib/postgresql/18/docker
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shlink-env
                  key: DB_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: postgresql
              containerPort: 5432
          startupProbe:
            exec:
              command: [pg_isready, -U, shlink, -d, shlink]
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            exec:
              command: [pg_isready, -U, shlink, -d, shlink]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: runtime
              mountPath: /var/run/postgresql
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: shlink-postgresql
        - name: runtime
          emptyDir: {}
        - name: temporary
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: shlink-postgresql
spec:
  selector:
    app: shlink-postgresql
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
