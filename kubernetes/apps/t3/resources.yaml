apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: t3-data
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      # Required bookkeeping; local-path does not enforce this as a quota.
      storage: 1Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: t3
  annotations:
    secret.reloader.stakater.com/reload: github-connect,signing-connect
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: t3
  template:
    metadata:
      labels:
        app: t3
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 10000
        runAsGroup: 10000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        kubernetes.io/arch: amd64
      initContainers:
        - name: prepare-git
          image: nousresearch/hermes-agent:latest-desktop@sha256:399ec6c0052a945b06b38de9d44d26b636237a60e97422d2d81f1c38b8d7c9fd
          command: [/bin/sh, -ec]
          args:
            - |
              mkdir -p /var/lib/t3/workspaces
              chown 10000:10000 /var/lib/t3 /var/lib/t3/workspaces /runtime /opt/coder-credentials /tmp
              chmod 700 /var/lib/t3 /opt/coder-credentials /tmp
              /bin/sh /bootstrap/coder-configure-git.sh
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [CHOWN, FOWNER, DAC_OVERRIDE]
          volumeMounts:
            - name: runtime
              mountPath: /runtime
            - name: temporary
              mountPath: /tmp
            - name: data
              mountPath: /var/lib/t3
            - name: git-bootstrap
              mountPath: /bootstrap
              readOnly: true
            - name: coder-source
              mountPath: /var/run/coder-source
              readOnly: true
            - name: coder-credentials
              mountPath: /opt/coder-credentials
        - name: install-t3
          # Reuse the existing pinned tool image, not its gateway or entrypoint.
          image: nousresearch/hermes-agent:latest-desktop@sha256:399ec6c0052a945b06b38de9d44d26b636237a60e97422d2d81f1c38b8d7c9fd
          command: [/bin/sh, /t3-bootstrap/install-runtime.sh]
          workingDir: /runtime
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: runtime
              mountPath: /runtime
            - name: temporary
              mountPath: /tmp
            - name: git-bootstrap
              mountPath: /bootstrap
              readOnly: true
            - name: bootstrap
              mountPath: /t3-bootstrap
              readOnly: true
      containers:
        - name: t3
          image: nousresearch/hermes-agent:latest-desktop@sha256:399ec6c0052a945b06b38de9d44d26b636237a60e97422d2d81f1c38b8d7c9fd
          command: [/runtime/t3]
          args: [serve, --host, 0.0.0.0, --port, "3773", --base-dir, /var/lib/t3/server, --no-browser]
          workingDir: /var/lib/t3/workspaces
          env:
            - name: HOME
              value: /var/lib/t3
            - name: PATH
              value: /opt/coder/bin:/opt/hermes/bin:/opt/hermes/.venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            - name: GIT_CONFIG_GLOBAL
              value: /opt/coder/gitconfig
            - name: GH_HOST
              value: github.com
            - name: GH_PROMPT_DISABLED
              value: "1"
            - name: T3CODE_TELEMETRY_ENABLED
              value: "false"
            - name: TZ
              value: ${TIME_ZONE}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 3773
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: http
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 4Gi
          volumeMounts:
            - name: runtime
              mountPath: /opt/coder
              readOnly: true
            - name: coder-credentials
              mountPath: /opt/coder-credentials
              readOnly: true
            - name: runtime
              mountPath: /runtime
              readOnly: true
            - name: data
              mountPath: /var/lib/t3
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: bootstrap
          configMap:
            name: t3-bootstrap
        - name: git-bootstrap
          configMap:
            name: hermes-bootstrap
            items:
              - key: coder-configure-git.sh
                path: coder-configure-git.sh
              - key: coder-configure-git.py
                path: coder-configure-git.py
              - key: coder-tools.sha256
                path: coder-tools.sha256
              - key: coder-gh.sh
                path: coder-gh.sh
              - key: coder-gitconfig
                path: coder-gitconfig
        - name: coder-source
          projected:
            defaultMode: 0400
            sources:
              - secret:
                  name: github-connect
                  items:
                    - key: credential
                      path: github-token
              - secret:
                  name: signing-connect
                  items:
                    - key: private-key
                      path: signing-key
                    - key: public-key
                      path: signing-public-key
        - name: coder-credentials
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: runtime
          emptyDir: {}
        - name: temporary
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: t3-data
---
apiVersion: v1
kind: Service
metadata:
  name: t3
spec:
  selector:
    app: t3
  ports:
    - name: http
      port: 3773
      targetPort: http
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: t3
spec:
  secretName: t3-tls
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt
  dnsNames:
    - t3.${DOMAIN}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: t3
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`t3.${DOMAIN}`)
      kind: Rule
      middlewares:
        - name: private-only
          namespace: traefik
        - name: secure-headers
          namespace: traefik
      services:
        - name: t3
          port: 3773
  tls:
    secretName: t3-tls
