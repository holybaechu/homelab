http_port 0.0.0.0:3128
visible_hostname browser-use-proxy
auth_param basic program /usr/lib/squid/basic_ncsa_auth /runtime/passwd
auth_param basic realm browser-use-proxy
auth_param basic credentialsttl 1 minute
acl authenticated proxy_auth REQUIRED
acl web_ports port 80 443
acl CONNECT method CONNECT
acl tls_port port 443
http_access deny !web_ports
http_access deny CONNECT !tls_port
http_access allow authenticated
http_access deny all
cache deny all
access_log none
cache_log /dev/null
cache_store_log none
pinger_enable off
max_filedescriptors 1024
pid_filename /run/squid/squid.pid
coredump_dir /run/squid
connect_timeout 5 seconds
forward_timeout 15 seconds
shutdown_lifetime 1 seconds
dns_nameservers 10.96.0.10
forwarded_for delete
via off
