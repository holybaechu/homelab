apiVersion: apps/v1
kind: Deployment
metadata:
  name: browser-use-proxy
  annotations:
    secret.reloader.stakater.com/reload: browser-use-proxy-connect
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: browser-use-proxy
  template:
    metadata:
      labels:
        app: browser-use-proxy
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      hostNetwork: false
      hostPID: false
      hostIPC: false
      nodeSelector:
        kubernetes.io/hostname: talos-homelab
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: firewall
          image: nicolaka/netshoot@sha256:147f2c4cb0aa7a741151bce2bfef71d9e1a04631636e24665ee2a5ed799feb47
          command: [/bin/sh, -ec, 'nft -f /config/egress.nft']
          securityContext:
            runAsUser: 0
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [NET_ADMIN]
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
        - name: verifier
          image: nicolaka/netshoot@sha256:147f2c4cb0aa7a741151bce2bfef71d9e1a04631636e24665ee2a5ed799feb47
          command: [/bin/sh, /config/initialize.sh, /source/custom-proxy.json, /runtime/passwd]
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: source
              mountPath: /source
              readOnly: true
            - name: runtime
              mountPath: /runtime
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
      containers:
        - name: squid
          # Canonical 7.2-26.04_edge, pinned content: squid 7.7-0ubuntu0.26.04.2.
          image: ubuntu/squid@sha256:417f97c0f570e616de72c4144bd45c5669d5055201888632fa41b10bac9b5517
          command: [/usr/sbin/squid-gnutls, -N, -f, /config/squid.conf]
          ports:
            - name: proxy
              containerPort: 3128
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: runtime
              mountPath: /runtime
              readOnly: true
            - name: run
              mountPath: /run/squid
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            tcpSocket:
              port: proxy
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: browser-use-proxy-config
        - name: source
          secret:
            secretName: browser-use-proxy-connect
            defaultMode: 0440
            items:
              - key: custom-proxy-json
                path: custom-proxy.json
        - name: runtime
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: run
          emptyDir:
            medium: Memory
            sizeLimit: 8Mi
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 8Mi
---
apiVersion: v1
kind: Service
metadata:
  name: browser-use-proxy
spec:
  selector:
    app: browser-use-proxy
  ports:
    - name: proxy
      port: 3128
      targetPort: proxy
