apiVersion: traefik.io/v1alpha1
kind: TLSOption
metadata:
  name: browser-use-proxy
spec:
  minVersion: VersionTLS12
  alpnProtocols:
    - http/1.1
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: browser-use-proxy
spec:
  entryPoints:
    - websecure
  routes:
    - match: HostSNI(`proxy.${DOMAIN}`)
      services:
        - name: browser-use-proxy
          port: 3128
  tls:
    options:
      name: browser-use-proxy
