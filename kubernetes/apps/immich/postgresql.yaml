apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-postgresql
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      # Required PVC bookkeeping; local-path grows with writes and enforces no quota.
      storage: 1Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-postgresql
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: immich-postgresql
  template:
    metadata:
      labels:
        app: immich-postgresql
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        runAsNonRoot: true
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          # Use the database build supplied with the pinned Immich release.
          image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
          env:
            - name: POSTGRES_USER
              value: immich
            - name: POSTGRES_DB
              value: immich
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich
                  key: DB_PASSWORD
            - name: POSTGRES_INITDB_ARGS
              value: --data-checksums
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: postgresql
              containerPort: 5432
          startupProbe:
            exec:
              command: [pg_isready, -U, immich, -d, immich]
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            exec:
              command: [pg_isready, -U, immich, -d, immich]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 2Gi
          volumeMounts:
            # The image generates postgresql.conf here before starting Postgres.
            - name: configuration
              mountPath: /etc/postgresql
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: runtime
              mountPath: /var/run/postgresql
            - name: shared-memory
              mountPath: /dev/shm
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: configuration
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: immich-postgresql
        - name: runtime
          emptyDir: {}
        - name: shared-memory
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
        - name: temporary
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: immich-postgresql
spec:
  selector:
    app: immich-postgresql
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
