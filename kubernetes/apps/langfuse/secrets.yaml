apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: langfuse-env
spec:
  refreshInterval: ${SECRET_REFRESH_INTERVAL}
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: langfuse-env
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: ${LANGFUSE_DATABASE_URL_REF}
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: ${LANGFUSE_POSTGRES_PASSWORD_REF}
    - secretKey: CLICKHOUSE_PASSWORD
      remoteRef:
        key: ${LANGFUSE_CLICKHOUSE_PASSWORD_REF}
    - secretKey: REDIS_AUTH
      remoteRef:
        key: ${LANGFUSE_REDIS_AUTH_REF}
    - secretKey: MINIO_ROOT_PASSWORD
      remoteRef:
        key: ${LANGFUSE_MINIO_PASSWORD_REF}
    - secretKey: SALT
      remoteRef:
        key: ${LANGFUSE_SALT_REF}
    - secretKey: ENCRYPTION_KEY
      remoteRef:
        key: ${LANGFUSE_ENCRYPTION_KEY_REF}
    - secretKey: NEXTAUTH_SECRET
      remoteRef:
        key: ${LANGFUSE_NEXTAUTH_SECRET_REF}
    - secretKey: AUTH_AUTHENTIK_CLIENT_SECRET
      remoteRef:
        key: ${LANGFUSE_OIDC_SECRET_REF}
    - secretKey: LANGFUSE_INIT_PROJECT_PUBLIC_KEY
      remoteRef:
        key: ${LANGFUSE_PROJECT_PUBLIC_KEY_REF}
    - secretKey: LANGFUSE_INIT_PROJECT_SECRET_KEY
      remoteRef:
        key: ${LANGFUSE_PROJECT_SECRET_KEY_REF}
