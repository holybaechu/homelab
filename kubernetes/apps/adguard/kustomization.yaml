apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: networking
resources:
  - onepassword.yaml
  - resources.yaml
configMapGenerator:
  - name: adguard-config
    files:
      - AdGuardHome.yaml=AdGuardHome.yaml.tmpl
  - name: adguard-config-staging
    options:
      disableNameSuffixHash: true
    files:
      - AdGuardHome.yaml=AdGuardHome.yaml.tmpl
      - render.py
