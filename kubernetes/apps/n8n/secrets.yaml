apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: n8n-env
spec:
  refreshInterval: ${SECRET_REFRESH_INTERVAL}
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: n8n-env
    creationPolicy: Owner
  data:
    - secretKey: N8N_ENCRYPTION_KEY
      remoteRef:
        key: ${N8N_ENCRYPTION_KEY_REF}
    - secretKey: N8N_INSTANCE_OWNER_EMAIL
      remoteRef:
        key: ${N8N_OWNER_EMAIL_REF}
    - secretKey: N8N_INSTANCE_OWNER_PASSWORD_HASH
      remoteRef:
        key: ${N8N_OWNER_PASSWORD_HASH_REF}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: n8n-hermes-credentials
spec:
  refreshInterval: ${SECRET_REFRESH_INTERVAL}
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: n8n-hermes-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        credentials.json: |
          [
            {"id":"hermesWebhookTok","name":"Hermes webhook","type":"httpHeaderAuth","data":{"name":"X-Gitlab-Token","value":{{ .token | toJson }}}},
            {"id":"perplexityDecider","name":"Perplexity Decider","type":"perplexityApi","data":{"apiKey":{{ .perplexity_api_key | toJson }}}}
          ]
  data:
    - secretKey: token
      remoteRef:
        key: ${HERMES_WEBHOOK_SECRET_REF}
    - secretKey: perplexity_api_key
      remoteRef:
        key: ${PERPLEXITY_API_KEY_REF}
