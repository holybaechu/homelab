apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: homelab
resources:
  - onepassword.yaml
  - resources.yaml
configMapGenerator:
  - name: qbittorrent-config
    files:
      - defaults.conf
      - managed.conf=managed.conf.tmpl
      - merge.py
  - name: qbittorrent-config-staging
    options:
      disableNameSuffixHash: true
    files:
      - managed.conf=managed.conf.tmpl
      - render.py
