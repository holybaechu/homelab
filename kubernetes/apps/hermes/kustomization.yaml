apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: homelab
resources:
  - resources.yaml
  - secrets.yaml
configMapGenerator:
  - name: hermes-bootstrap
    files:
      - config.yaml
      - mcp-servers.yaml
      - obsidian-sync/package.json
      - obsidian-sync/package-lock.json
      - second-brain.md
      - seed_skills.py
      - skill-overrides.patch
      - qmd-package.json=qmd/package.json
      - qmd-package-lock.json=qmd/package-lock.json
      - qmd-index.yml=qmd/index.yml
      - qmd-refresh.sh=qmd/refresh.sh
      - configure_qmd.py=qmd/configure_runtime.py
      - langfuse-requirements.txt=langfuse/requirements.txt
      - langfuse-plugin.sha256=langfuse/plugin.sha256
      - langfuse-runtime.pth=langfuse/runtime.pth
      - services.py=integrations/services.py
      - mcp_server.py=integrations/mcp_server.py
      - homelab-skill.md=integrations/SKILL.md
      - requirements.txt=integrations/requirements.txt
