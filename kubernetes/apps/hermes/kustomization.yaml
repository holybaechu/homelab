apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: homelab
resources:
  - onepassword.yaml
  - resources.yaml
configMapGenerator:
  - name: hermes-bootstrap
    files:
      - config.yaml
      - kubeconfig.yaml=kubernetes-client.yaml
      - configure_profiles.py
      - home.chezmoiignore
      - chezmoi.toml
      - profile-sync.sh
      - configure_browser_proxy.py
      - coder-install-tools.sh=coder/install-tools.sh
      - coder-tools.sha256=coder/tools.sha256
      - coder-gh.sh=coder/gh.sh
      - coder-gitconfig=coder/gitconfig
      - coder-configure-git.sh=coder/configure-git.sh
      - coder-configure-git.py=coder/configure_git.py
      - browser-cloud.patch
      - browser-vault-connect.patch
      - browser-vault.sha256
      - connect_vault.py
      - mcp-servers.yaml
      - webhook.yaml
      - obsidian-sync/package.json
      - obsidian-sync/package-lock.json
      - seed_skills.py
      - qmd-package.json=qmd/package.json
      - qmd-package-lock.json=qmd/package-lock.json
      - qmd-index.yml=qmd/index.yml
      - qmd-refresh.sh=qmd/refresh.sh
      - configure_qmd.py=qmd/configure_runtime.py
      - langfuse-requirements.txt=langfuse/requirements.txt
      - langfuse-plugin.sha256=langfuse/plugin.sha256
      - langfuse-runtime.pth=langfuse/runtime.pth
      - langfuse-configure-mcp.py=langfuse/configure_mcp.py
      - services.py=integrations/services.py
      - mcp_server.py=integrations/mcp_server.py
      - requirements.txt=integrations/requirements.txt
