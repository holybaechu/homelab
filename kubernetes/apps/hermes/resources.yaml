apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      # local-path does not enforce a capacity quota.
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
  annotations:
    secret.reloader.stakater.com/reload: hermes-runtime-connect,n8n-connect,langfuse-connect,github-connect,signing-connect,immich-connect,obsidian-connect,opencloud-connect,zipline-connect,qbittorrent-connect
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hermes
  template:
    metadata:
      labels:
        app: hermes
    spec:
      serviceAccountName: hermes
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      hostAliases:
        - ip: ${NODE_IP}
          hostnames:
            - auth.${DOMAIN}
            - cloud.${DOMAIN}
            - photos.${DOMAIN}
            - i.${DOMAIN}
            - l.${DOMAIN}
      initContainers:
        - name: seed-config
          image: nousresearch/hermes-agent:latest-desktop@sha256:399ec6c0052a945b06b38de9d44d26b636237a60e97422d2d81f1c38b8d7c9fd
          command: [/bin/sh, -ec]
          args:
            - |
              if [ ! -e /opt/data/config.yaml ]; then
                cp /bootstrap/config.yaml /opt/data/config.yaml
                chown 10000:10000 /opt/data/config.yaml
                chmod 600 /opt/data/config.yaml
              fi
              mkdir -p /opt/data/workspace /opt/data/obsidian/vault /opt/data/obsidian/headless /opt/obsidian
              mkdir -p /opt/data/skills/homelab-services /opt/data/workspace/homelab
              mkdir -p /opt/homelab/python /opt/homelab/credentials /opt/immich-mcp
              mkdir -p /opt/qmd /opt/data/qmd/config /opt/data/qmd/cache/qmd
              mkdir -p /opt/langfuse/python /opt/langfuse/plugin /opt/data/plugins/langfuse
              mkdir -p /opt/browser
              mkdir -p /opt/coder/bin /opt/coder-credentials
              mkdir -p /opt/data/cua
              chown 10000:10000 /opt/data/cua
              chmod 700 /opt/data/cua
              mkdir -p /opt/data/coder-tools/mise /opt/data/coder-tools/cache /opt/data/coder-tools/config
              chown 10000:10000 /opt/coder /opt/coder/bin /opt/coder-credentials
              chown 10000:10000 /opt/data/coder-tools /opt/data/coder-tools/mise /opt/data/coder-tools/cache /opt/data/coder-tools/config
              chmod 700 /opt/coder-credentials
              /bin/sh /bootstrap/coder-configure-git.sh
              cp /opt/hermes/.venv/lib/python3.14/site-packages/browser_harness/run.py /opt/browser/run.py
              git -C /opt/browser apply --check /bootstrap/browser-cloud.patch
              git -C /opt/browser apply /bootstrap/browser-cloud.patch
              cd /opt/hermes
              sha256sum -c /bootstrap/browser-vault.sha256
              mkdir -p /opt/browser/agent/vault_backends
              mkdir -p /opt/browser/tools
              mkdir -p /opt/browser/plugins/browser/browser_use
              cp agent/vault_backends/onepassword.py agent/vault_backends/base.py /opt/browser/agent/vault_backends/
              cp tools/browser_vault_tool.py tools/browser_use_cli.py tools/browser_session.py /opt/browser/tools/
              cp plugins/browser/browser_use/provider.py /opt/browser/plugins/browser/browser_use/
              git -C /opt/browser apply --check /bootstrap/browser-vault-connect.patch
              git -C /opt/browser apply /bootstrap/browser-vault-connect.patch
              cp /bootstrap/qmd-index.yml /opt/data/qmd/config/index.yml
              touch /opt/homelab/services.py /opt/homelab/mcp_server.py
              chown 10000:10000 /opt/data /opt/data/workspace
              chown 10000:10000 /opt/data/skills/homelab-services /opt/data/workspace/homelab
              chown 10000:10000 /opt/data/skills /opt/qmd /opt/data/qmd /opt/data/qmd/config /opt/data/qmd/config/index.yml /opt/data/qmd/cache /opt/data/qmd/cache/qmd
              chown 10000:10000 /opt/langfuse /opt/langfuse/python /opt/langfuse/plugin /opt/data/plugins /opt/data/plugins/langfuse
              chown -R 10000:10000 /opt/homelab /opt/immich-mcp
              chown 10000:10000 /opt/data/obsidian /opt/data/obsidian/vault /opt/data/obsidian/headless /opt/obsidian
              chmod 700 /opt/data/obsidian/headless
              # Git owns the MCP section; the CLI preserves other live settings.
              hermes config set --force mcp_servers "$(cat /bootstrap/mcp-servers.yaml)"
              hermes config set --force platforms.webhook "$(cat /bootstrap/webhook.yaml)"
              # Reconcile web access for existing profiles as well as new installs.
              hermes config set --force dashboard.public_url https://dash.hermes.${DOMAIN}
              hermes config set --force webapp.enabled true
              hermes config set --force webapp.host 0.0.0.0
              hermes config set --force webapp.port 9120
              hermes config set --force webapp.public_url https://hermes.${DOMAIN}
              # Keep hybrid routing declarative, including for an existing profile.
              hermes config set --force browser.cloud_provider browser-use
              hermes config set --force browser.auto_local_for_private_urls true
              # This Pod cannot create Chromium's unprivileged user namespaces.
              hermes config set --force browser.chromium_args '["--no-sandbox"]'
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [CHOWN, FOWNER, DAC_OVERRIDE, SETUID, SETGID]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: homelab-workspace
              mountPath: /opt/data/workspace/homelab
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
            - name: obsidian-runtime
              mountPath: /opt/obsidian
            - name: homelab-runtime
              mountPath: /opt/homelab
            - name: immich-temporary
              mountPath: /opt/immich-mcp
            - name: qmd-runtime
              mountPath: /opt/qmd
            - name: langfuse-runtime
              mountPath: /opt/langfuse
            - name: browser-runtime
              mountPath: /opt/browser
            - name: coder-runtime
              mountPath: /opt/coder
            - name: coder-source
              mountPath: /var/run/coder-source
              readOnly: true
            - name: coder-credentials
              mountPath: /opt/coder-credentials
        - name: reconcile-skills
          image: nousresearch/hermes-agent:latest-desktop@sha256:399ec6c0052a945b06b38de9d44d26b636237a60e97422d2d81f1c38b8d7c9fd
          command: [/bin/sh, -ec]
          args:
            - |
              /opt/hermes/.venv/bin/python /bootstrap/seed_skills.py
              cd /opt/data/skills
              if git apply --reverse --check /bootstrap/skill-overrides.patch 2>/dev/null; then
                echo 'Skill overrides already applied.'
              else
                git apply --check /bootstrap/skill-overrides.patch
                git apply /bootstrap/skill-overrides.patch
              fi
          securityContext:
            runAsUser: 10000
            runAsGroup: 10000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
            - name: integration-temporary
              mountPath: /tmp
        - name: configure-profiles
          image: nousresearch/hermes-agent:latest-desktop@sha256:399ec6c0052a945b06b38de9d44d26b636237a60e97422d2d81f1c38b8d7c9fd
          command: [/bin/sh, -ec]
          args:
            - |
              mkdir -p /opt/data/plugins/advanced-delegation
              cd /opt/data/plugins/advanced-delegation
              source=https://raw.githubusercontent.com/NousResearch/hermes-official-plugins/bedc9e74ef792864cd7198a8e43cedd5b585ace7/advanced-delegation
              for file in __init__.py cli.py model_map.py profile_routes.py slash.py store.py LICENSE plugin.yaml; do
                curl --fail --silent --show-error --location --max-time 30 --retry 1 "$source/$file" -o "$file"
              done
              sha256sum -c /bootstrap/delegation-plugin.sha256
              /opt/hermes/.venv/bin/python /bootstrap/configure_profiles.py
              /opt/hermes/.venv/bin/python /bootstrap/configure_browser_proxy.py
          securityContext:
            runAsUser: 10000
            runAsGroup: 10000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
            - name: browser-proxy-source
              mountPath: /var/run/hermes-browser-proxy
              readOnly: true
            - name: integration-temporary
              mountPath: /tmp
        - name: install-coder-tools
          image: nousresearch/hermes-agent:latest-desktop@sha256:399ec6c0052a945b06b38de9d44d26b636237a60e97422d2d81f1c38b8d7c9fd
          command: [/bin/sh, /bootstrap/coder-install-tools.sh]
          env:
            - name: KUBERNETES_VERSION
              value: ${KUBERNETES_VERSION}
            - name: TALOS_VERSION
              value: ${TALOS_VERSION}
            - name: FLUX_VERSION
              value: ${FLUX_VERSION}
            - name: MISE_DATA_DIR
              value: /opt/data/coder-tools/mise
            - name: MISE_CACHE_DIR
              value: /opt/data/coder-tools/cache
            - name: MISE_CONFIG_DIR
              value: /opt/data/coder-tools/config
          securityContext:
            runAsUser: 10000
            runAsGroup: 10000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: coder-runtime
              mountPath: /opt/coder
            - name: data
              mountPath: /opt/data/coder-tools
              subPath: coder-tools
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
            - name: integration-temporary
              mountPath: /tmp
        - name: install-qmd
          image: nousresearch/hermes-agent:latest-desktop@sha256:399ec6c0052a945b06b38de9d44d26b636237a60e97422d2d81f1c38b8d7c9fd
          command: [/bin/sh, -ec]
          args:
            - |
              cp /bootstrap/qmd-package.json /opt/qmd/package.json
              cp /bootstrap/qmd-package-lock.json /opt/qmd/package-lock.json
              npm ci --prefix /opt/qmd --omit=optional --ignore-scripts --no-audit --no-fund --cache /tmp/npm-cache
              /opt/hermes/.venv/bin/python /bootstrap/configure_qmd.py
              node -e 'const D=require("/opt/qmd/node_modules/better-sqlite3");const db=new D(":memory:");require("/opt/qmd/node_modules/sqlite-vec").load(db);db.prepare("SELECT vec_version()").get();db.close()'
              node -e 'import("/opt/qmd/node_modules/node-llama-cpp/dist/index.js").then(async({getLlama})=>{const llama=await getLlama({gpu:false,build:"never"});await llama.dispose()})'
          securityContext:
            runAsUser: 10000
            runAsGroup: 10000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
            - name: qmd-runtime
              mountPath: /opt/qmd
            - name: qmd-temporary
              mountPath: /tmp
        - name: install-python-clients
          image: python:3.15.2-alpine3.23
          command: [/bin/sh, -ec]
          args:
            - |
              python -m pip install --disable-pip-version-check --no-deps --no-compile --require-hashes --target=/runtime/python --cache-dir=/tmp/pip-cache -r /bootstrap/requirements.txt
              if ! python -m pip install --disable-pip-version-check --no-deps --no-compile --require-hashes --target=/opt/langfuse/python --cache-dir=/tmp/pip-cache --timeout=10 --retries=1 -r /bootstrap/langfuse-requirements.txt; then
                echo 'Langfuse SDK unavailable; Hermes can continue.' >&2
              fi
          securityContext:
            runAsUser: 10000
            runAsGroup: 10000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: homelab-runtime
              mountPath: /runtime
            - name: langfuse-runtime
              mountPath: /opt/langfuse
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
            - name: integration-temporary
              mountPath: /tmp
        - name: prepare-langfuse
          image: nousresearch/hermes-agent:latest-desktop@sha256:399ec6c0052a945b06b38de9d44d26b636237a60e97422d2d81f1c38b8d7c9fd
          command: [/bin/sh, -ec]
          args:
            - |
              /opt/hermes/.venv/bin/python /bootstrap/langfuse-configure-mcp.py
              mkdir -p /opt/data/profiles/coder/plugins
              ln -sfn /opt/langfuse/plugin /opt/data/profiles/coder/plugins/langfuse
              cd /opt/langfuse/plugin
              rm -f plugin.yaml plugin.yaml.pending
              source=https://raw.githubusercontent.com/NousResearch/hermes-official-plugins/83f0a896b3518c7131181838e340c9a80c79524d/langfuse
              if curl --fail --silent --show-error --location --max-time 30 --retry 1 "$source/__init__.py" -o __init__.py &&
                 curl --fail --silent --show-error --location --max-time 30 --retry 1 "$source/LICENSE" -o LICENSE &&
                 curl --fail --silent --show-error --location --max-time 30 --retry 1 "$source/plugin.yaml" -o plugin.yaml.pending &&
                 sha256sum -c /bootstrap/langfuse-plugin.sha256 &&
                 /opt/hermes/.venv/bin/python -c 'from langfuse import Langfuse, propagate_attributes' &&
                 mv plugin.yaml.pending plugin.yaml; then
                echo 'Langfuse plugin prepared.'
              else
                echo 'Langfuse tracing unavailable; Hermes can continue.' >&2
              fi
          env:
            - name: HERMES_HOME
              value: /opt/data
            - name: HERMES_LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: langfuse-connect
                  key: hermes-project-public-key
                  optional: true
            - name: HERMES_LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: langfuse-connect
                  key: hermes-project-secret-key
                  optional: true
          securityContext:
            runAsUser: 10000
            runAsGroup: 10000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: langfuse-runtime
              mountPath: /opt/langfuse
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
            - name: bootstrap
              mountPath: /opt/hermes/.venv/lib/python3.14/site-packages/hermes-langfuse.pth
              subPath: langfuse-runtime.pth
              readOnly: true
            - name: integration-temporary
              mountPath: /tmp
        - name: install-obsidian-sync
          image: nousresearch/hermes-agent:latest-desktop@sha256:399ec6c0052a945b06b38de9d44d26b636237a60e97422d2d81f1c38b8d7c9fd
          command: [/bin/sh, -ec]
          args:
            - |
              cp /bootstrap/package.json /opt/obsidian/package.json
              cp /bootstrap/package-lock.json /opt/obsidian/package-lock.json
              npm ci --prefix /opt/obsidian --omit=dev --no-audit --no-fund --strict-allow-scripts --cache /tmp/npm-cache
              node -e 'const Database = require("/opt/obsidian/node_modules/better-sqlite3"); const db = new Database(":memory:"); db.prepare("SELECT 1").get(); db.close();'
          securityContext:
            runAsUser: 10000
            runAsGroup: 10000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
            - name: obsidian-runtime
              mountPath: /opt/obsidian
            - name: obsidian-temporary
              mountPath: /tmp
      containers:
        - name: qmd
          image: nousresearch/hermes-agent:latest-desktop@sha256:399ec6c0052a945b06b38de9d44d26b636237a60e97422d2d81f1c38b8d7c9fd
          command: [node, /opt/qmd/node_modules/@tobilu/qmd/dist/cli/qmd.js]
          args: [--index, index, mcp, --http, --host, 127.0.0.1, --port, "8181"]
          workingDir: /opt/qmd
          env:
            - name: QMD_CONFIG_DIR
              value: /state/config
            - name: XDG_CACHE_HOME
              value: /state/cache
            - name: QMD_FORCE_CPU
              value: "1"
            - name: QMD_EMBED_PARALLELISM
              value: "1"
          securityContext:
            runAsUser: 10000
            runAsGroup: 10000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          livenessProbe:
            exec:
              command: [node, -e, "fetch('http://127.0.0.1:8181/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 5Gi
          volumeMounts:
            - name: qmd-runtime
              mountPath: /opt/qmd
              readOnly: true
            - name: data
              mountPath: /state
              subPath: qmd
            - name: data
              mountPath: /vault
              subPath: obsidian/vault
              readOnly: true
            - name: qmd-temporary
              mountPath: /tmp
        - name: qmd-index
          image: nousresearch/hermes-agent:latest-desktop@sha256:399ec6c0052a945b06b38de9d44d26b636237a60e97422d2d81f1c38b8d7c9fd
          command: [/bin/sh, /bootstrap/qmd-refresh.sh]
          env:
            - name: QMD_CONFIG_DIR
              value: /state/config
            - name: XDG_CACHE_HOME
              value: /state/cache
            - name: QMD_FORCE_CPU
              value: "1"
            - name: QMD_EMBED_PARALLELISM
              value: "1"
          securityContext:
            runAsUser: 10000
            runAsGroup: 10000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
            - name: qmd-runtime
              mountPath: /opt/qmd
              readOnly: true
            - name: data
              mountPath: /state
              subPath: qmd
            - name: data
              mountPath: /vault
              subPath: obsidian/vault
              readOnly: true
            - name: qmd-temporary
              mountPath: /tmp
        - name: hermes
          image: nousresearch/hermes-agent:latest-desktop@sha256:399ec6c0052a945b06b38de9d44d26b636237a60e97422d2d81f1c38b8d7c9fd
          # Preserve the official entrypoint: s6 starts as root, initializes
          # storage, then drops gateway/dashboard processes to UID 10000.
          args: [gateway, run]
          env:
            - name: DISCORD_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-runtime-connect
                  key: discord-bot-token
            - name: DISCORD_ALLOWED_USERS
              valueFrom:
                secretKeyRef:
                  name: hermes-runtime-connect
                  key: discord-allowed-users
            - name: DISCORD_HOME_CHANNEL
              valueFrom:
                secretKeyRef:
                  name: hermes-runtime-connect
                  key: discord-home-channel
            - name: EXA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-runtime-connect
                  key: exa-api-key
            - name: BROWSER_USE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-runtime-connect
                  key: browser-use-api-key
            - name: WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: n8n-connect
                  key: hermes_webhook_secret
            - name: HERMES_LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: langfuse-connect
                  key: hermes-project-public-key
                  optional: true
            - name: HERMES_LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: langfuse-connect
                  key: hermes-project-secret-key
                  optional: true
            - name: TZ
              value: ${TIME_ZONE}
            - name: DISCORD_FREE_RESPONSE_CHANNELS
              valueFrom:
                secretKeyRef:
                  name: hermes-runtime-connect
                  key: discord-home-channel
            - name: DISCORD_AUTO_THREAD
              value: "true"
            - name: DISCORD_FREE_RESPONSE_AUTO_THREAD
              value: "true"
            - name: OBSIDIAN_VAULT_PATH
              value: /opt/data/obsidian/vault
            - name: WIKI_PATH
              value: /opt/data/obsidian/vault
            - name: PYTHONPATH
              value: /opt/hermes
            - name: PATH
              value: /opt/coder/bin:/opt/data/coder-tools/mise/shims:/opt/hermes/bin:/opt/hermes/.venv/bin:/opt/data/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            - name: MISE_DATA_DIR
              value: /opt/data/coder-tools/mise
            - name: MISE_CACHE_DIR
              value: /opt/data/coder-tools/cache
            - name: MISE_CONFIG_DIR
              value: /opt/data/coder-tools/config
            - name: GIT_CONFIG_GLOBAL
              value: /opt/coder/gitconfig
            - name: KUBECONFIG
              value: /etc/hermes-kubernetes/kubeconfig.yaml
            - name: TALOSCONFIG
              value: /var/run/secrets/talos.dev/talosconfig
            - name: GH_CONFIG_DIR
              value: /opt/data/profiles/coder/home/.config/gh
            - name: GH_HOST
              value: github.com
            - name: GH_PROMPT_DISABLED
              value: "1"
            - name: HERMES_LANGFUSE_BASE_URL
              value: http://langfuse.homelab.svc.cluster.local:3000
            - name: HERMES_LANGFUSE_CAPTURE
              value: metadata
            - name: HERMES_LANGFUSE_MAX_CHARS
              value: "2000"
            - name: HERMES_LANGFUSE_MAX_DEPTH
              value: "3"
            - name: HERMES_DASHBOARD
              value: "1"
            - name: HERMES_DASHBOARD_HOST
              value: 0.0.0.0
            - name: HERMES_DASHBOARD_PUBLIC_URL
              value: https://dash.hermes.${DOMAIN}
            - name: HERMES_DASHBOARD_OIDC_ISSUER
              value: https://auth.${DOMAIN}/application/o/hermes/
            - name: HERMES_DASHBOARD_OIDC_CLIENT_ID
              value: homelab-hermes
            - name: HERMES_DASHBOARD_OIDC_SCOPES
              value: openid profile email offline_access
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [CHOWN, FOWNER, DAC_OVERRIDE, SETUID, SETGID]
          ports:
            - name: dashboard
              containerPort: 9119
            - name: webapp
              containerPort: 9120
            - name: webhook
              containerPort: 8644
          startupProbe:
            tcpSocket:
              port: dashboard
            failureThreshold: 120
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: webapp
          livenessProbe:
            tcpSocket:
              port: dashboard
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 4Gi
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: langfuse-runtime
              mountPath: /opt/langfuse
              readOnly: true
            - name: writing-for-agents
              mountPath: /opt/data/skills/writing-for-agents
              readOnly: true
            - name: writing-for-agents
              mountPath: /opt/data/profiles/coder/skills/writing-for-agents
              readOnly: true
            - name: langfuse-runtime
              mountPath: /opt/data/plugins/langfuse
              subPath: plugin
              readOnly: true
            # The native launcher resets PYTHONPATH, then processes this site directory.
            - name: bootstrap
              mountPath: /opt/hermes/.venv/lib/python3.14/site-packages/hermes-langfuse.pth
              subPath: langfuse-runtime.pth
              readOnly: true
            - name: shared-memory
              mountPath: /dev/shm
            - name: coder-runtime
              mountPath: /opt/coder
              readOnly: true
            - name: coder-credentials
              mountPath: /opt/coder-credentials
              readOnly: true
            - name: kubernetes-identity
              mountPath: /var/run/secrets/hermes-kubernetes
              readOnly: true
            - name: kubernetes-client
              mountPath: /etc/hermes-kubernetes
              readOnly: true
            - name: talos-identity
              mountPath: /var/run/secrets/talos.dev
              readOnly: true
            - name: browser-runtime
              mountPath: /opt/hermes/.venv/lib/python3.14/site-packages/browser_harness/run.py
              subPath: run.py
              readOnly: true
            - name: browser-runtime
              mountPath: /opt/hermes/agent/vault_backends/onepassword.py
              subPath: agent/vault_backends/onepassword.py
              readOnly: true
            - name: browser-runtime
              mountPath: /opt/hermes/agent/vault_backends/base.py
              subPath: agent/vault_backends/base.py
              readOnly: true
            - name: bootstrap
              mountPath: /opt/hermes/agent/vault_backends/connect_vault.py
              subPath: connect_vault.py
              readOnly: true
            - name: browser-runtime
              mountPath: /opt/hermes/tools/browser_vault_tool.py
              subPath: tools/browser_vault_tool.py
              readOnly: true
            - name: browser-runtime
              mountPath: /opt/hermes/tools/browser_use_cli.py
              subPath: tools/browser_use_cli.py
              readOnly: true
            - name: browser-runtime
              mountPath: /opt/hermes/tools/browser_session.py
              subPath: tools/browser_session.py
              readOnly: true
            - name: browser-runtime
              mountPath: /opt/hermes/plugins/browser/browser_use/provider.py
              subPath: plugins/browser/browser_use/provider.py
              readOnly: true
            - name: browser-vault-credentials
              mountPath: /var/run/hermes-browser-vault
              readOnly: true
            - name: bootstrap
              mountPath: /opt/data/workspace/.hermes.md
              subPath: second-brain.md
              readOnly: true
            - name: homelab-runtime
              mountPath: /opt/homelab
              readOnly: true
            - name: bootstrap
              mountPath: /opt/homelab/services.py
              subPath: services.py
              readOnly: true
            - name: bootstrap
              mountPath: /opt/homelab/mcp_server.py
              subPath: mcp_server.py
              readOnly: true
            - name: service-credentials
              mountPath: /opt/homelab/credentials
              readOnly: true
            - name: homelab-workspace
              mountPath: /opt/data/workspace/homelab
            - name: bootstrap
              mountPath: /opt/data/skills/homelab-services/SKILL.md
              subPath: homelab-skill.md
              readOnly: true
        - name: immich-mcp
          image: ghcr.io/drolosoft/immich-photo-manager:2.0.14@sha256:7486f483c9d47563aa4167d00dfaf901c71aa85cb214239da98764154b0264e1
          env:
            - name: IMMICH_BASE_URL
              value: https://photos.${DOMAIN}
            - name: IMMICH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: immich-connect
                  key: hermes-api-key
            - name: MCP_HOST
              value: 127.0.0.1
            - name: MCP_PORT
              value: "8626"
            - name: MCP_TRANSPORT
              value: http
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          securityContext:
            runAsUser: 10000
            runAsGroup: 10000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            exec:
              command: [python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8626/health', timeout=4)"]
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            exec:
              command: [python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8626/health', timeout=4)"]
          livenessProbe:
            exec:
              command: [python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8626/health', timeout=4)"]
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: immich-temporary
              mountPath: /data
            - name: integration-temporary
              mountPath: /tmp
        - name: obsidian-sync
          image: nousresearch/hermes-agent:latest-desktop@sha256:399ec6c0052a945b06b38de9d44d26b636237a60e97422d2d81f1c38b8d7c9fd
          command: [/bin/sh, -ec]
          args:
            - |
              cli=/opt/obsidian/node_modules/obsidian-headless/cli.js
              rm -f /state/ready
              until node "$cli" sync-status --path /vault --json >/dev/null 2>&1; do
                sleep 10
              done
              node "$cli" sync --path /vault
              touch /state/ready
              exec node "$cli" sync --path /vault --continuous
          env:
            - name: TZ
              value: ${TIME_ZONE}
            - name: XDG_CONFIG_HOME
              value: /state
            - name: OBSIDIAN_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: obsidian-connect
                  key: auth-token
          securityContext:
            runAsUser: 10000
            runAsGroup: 10000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /vault
              subPath: obsidian/vault
            - name: data
              mountPath: /state
              subPath: obsidian/headless
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
            - name: obsidian-runtime
              mountPath: /opt/obsidian
              readOnly: true
            - name: obsidian-temporary
              mountPath: /tmp
      volumes:
        - name: writing-for-agents
          configMap:
            name: hermes-writing-for-agents
        - name: talos-identity
          secret:
            secretName: hermes-talos-managed
            defaultMode: 0444
            items:
              - key: config
                path: talosconfig
        - name: kubernetes-identity
          projected:
            defaultMode: 0444
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
        - name: kubernetes-client
          configMap:
            name: hermes-bootstrap
            items:
              - key: kubeconfig.yaml
                path: kubeconfig.yaml
        - name: data
          persistentVolumeClaim:
            claimName: hermes-data
        - name: bootstrap
          configMap:
            name: hermes-bootstrap
        - name: obsidian-runtime
          emptyDir: {}
        - name: obsidian-temporary
          emptyDir: {}
        - name: shared-memory
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
        - name: homelab-runtime
          emptyDir: {}
        - name: service-credentials
          projected:
            defaultMode: 0444
            sources:
              - secret:
                  name: opencloud-connect
                  items:
                    - key: username
                      path: OPENCLOUD_USERNAME
                    - key: password
                      path: OPENCLOUD_APP_TOKEN
              - secret:
                  name: zipline-connect
                  items:
                    - key: hermes-api-token
                      path: ZIPLINE_TOKEN
              - secret:
                  name: qbittorrent-connect
                  items:
                    - key: username
                      path: QBITTORRENT_USERNAME
                    - key: password
                      path: QBITTORRENT_PASSWORD
        - name: immich-temporary
          emptyDir: {}
        - name: integration-temporary
          emptyDir: {}
        - name: homelab-workspace
          emptyDir: {}
        - name: qmd-runtime
          emptyDir: {}
        - name: qmd-temporary
          emptyDir: {}
        - name: langfuse-runtime
          emptyDir: {}
        - name: browser-runtime
          emptyDir: {}
        - name: browser-proxy-source
          secret:
            secretName: browser-use-proxy-connect
            optional: false
            defaultMode: 0444
            items:
              - key: custom-proxy-json
                path: custom-proxy-json
        - name: browser-vault-credentials
          secret:
            secretName: hermes-browser-vault
            optional: true
            defaultMode: 0444
            items:
              - key: connect-token
                path: connect-token
        - name: coder-runtime
          emptyDir: {}
        - name: coder-source
          projected:
            defaultMode: 0400
            sources:
              - secret:
                  name: github-connect
                  items:
                    - key: credential
                      path: github-token
              - secret:
                  name: signing-connect
                  items:
                    - key: private-key
                      path: signing-key
                    - key: public-key
                      path: signing-public-key
        - name: coder-credentials
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
---
apiVersion: v1
kind: Service
metadata:
  name: hermes
spec:
  selector:
    app: hermes
  ports:
    - name: dashboard
      port: 9119
      targetPort: dashboard
    - name: webapp
      port: 9120
      targetPort: webapp
    - name: webhook
      port: 8644
      targetPort: webhook
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: hermes
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`hermes.${DOMAIN}`)
      kind: Rule
      middlewares:
        - name: private-only
          namespace: traefik
        - name: secure-headers
          namespace: traefik
      services:
        - name: hermes
          port: 9120
    - match: Host(`dash.hermes.${DOMAIN}`)
      kind: Rule
      middlewares:
        - name: private-only
          namespace: traefik
        - name: secure-headers
          namespace: traefik
      services:
        - name: hermes
          port: 9119
  tls: {}
