apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      # local-path does not enforce a capacity quota.
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hermes
  template:
    metadata:
      labels:
        app: hermes
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      hostAliases:
        - ip: ${NODE_IP}
          hostnames:
            - auth.${DOMAIN}
            - cloud.${DOMAIN}
            - photos.${DOMAIN}
            - i.${DOMAIN}
            - l.${DOMAIN}
      initContainers:
        - name: seed-config
          image: nousresearch/hermes-agent:latest-desktop@sha256:2393aaca1b7d53b5c04c1b98d5f2b126f763ba3440b0724f4af185415974096f
          command: [/bin/sh, -ec]
          args:
            - |
              if [ ! -e /opt/data/config.yaml ]; then
                cp /bootstrap/config.yaml /opt/data/config.yaml
                chown 10000:10000 /opt/data/config.yaml
                chmod 600 /opt/data/config.yaml
              fi
              mkdir -p /opt/data/workspace /opt/data/obsidian/vault /opt/data/obsidian/headless /opt/obsidian
              mkdir -p /opt/data/skills/homelab-services /opt/data/workspace/homelab
              mkdir -p /opt/homelab/python /opt/homelab/credentials /opt/immich-mcp
              mkdir -p /opt/qmd /opt/data/qmd/config /opt/data/qmd/cache/qmd
              mkdir -p /opt/langfuse/python /opt/langfuse/plugin /opt/data/plugins/langfuse
              cp /bootstrap/qmd-index.yml /opt/data/qmd/config/index.yml
              touch /opt/homelab/services.py /opt/homelab/mcp_server.py
              chown 10000:10000 /opt/data /opt/data/workspace
              chown 10000:10000 /opt/data/skills/homelab-services /opt/data/workspace/homelab
              chown 10000:10000 /opt/data/skills /opt/qmd /opt/data/qmd /opt/data/qmd/config /opt/data/qmd/config/index.yml /opt/data/qmd/cache /opt/data/qmd/cache/qmd
              chown 10000:10000 /opt/langfuse /opt/langfuse/python /opt/langfuse/plugin /opt/data/plugins /opt/data/plugins/langfuse
              chown -R 10000:10000 /opt/homelab /opt/immich-mcp
              chown 10000:10000 /opt/data/obsidian /opt/data/obsidian/vault /opt/data/obsidian/headless /opt/obsidian
              chmod 700 /opt/data/obsidian/headless
              # Git owns the MCP section; the CLI preserves other live settings.
              hermes config set --force mcp_servers "$(cat /bootstrap/mcp-servers.yaml)"
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [CHOWN, FOWNER, DAC_OVERRIDE, SETUID, SETGID]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: homelab-workspace
              mountPath: /opt/data/workspace/homelab
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
            - name: obsidian-runtime
              mountPath: /opt/obsidian
            - name: homelab-runtime
              mountPath: /opt/homelab
            - name: immich-temporary
              mountPath: /opt/immich-mcp
            - name: qmd-runtime
              mountPath: /opt/qmd
            - name: langfuse-runtime
              mountPath: /opt/langfuse
        - name: reconcile-skills
          image: nousresearch/hermes-agent:latest-desktop@sha256:2393aaca1b7d53b5c04c1b98d5f2b126f763ba3440b0724f4af185415974096f
          command: [/bin/sh, -ec]
          args:
            - |
              /opt/hermes/.venv/bin/python /bootstrap/seed_skills.py
              /opt/hermes/.venv/bin/python /bootstrap/reconcile_skills.py --skills-dir /opt/data/skills --patches /bootstrap/skill-overrides.json
          securityContext:
            runAsUser: 10000
            runAsGroup: 10000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
            - name: integration-temporary
              mountPath: /tmp
        - name: install-qmd
          image: nousresearch/hermes-agent:latest-desktop@sha256:2393aaca1b7d53b5c04c1b98d5f2b126f763ba3440b0724f4af185415974096f
          command: [/bin/sh, -ec]
          args:
            - |
              cp /bootstrap/qmd-package.json /opt/qmd/package.json
              cp /bootstrap/qmd-package-lock.json /opt/qmd/package-lock.json
              npm ci --prefix /opt/qmd --omit=optional --ignore-scripts --no-audit --no-fund --cache /tmp/npm-cache
              node -e 'const D=require("/opt/qmd/node_modules/better-sqlite3");const db=new D(":memory:");require("/opt/qmd/node_modules/sqlite-vec").load(db);db.prepare("SELECT vec_version()").get();db.close()'
              node -e 'import("/opt/qmd/node_modules/node-llama-cpp/dist/index.js").then(async({getLlama})=>{const llama=await getLlama({gpu:false,build:"never"});await llama.dispose()})'
          securityContext:
            runAsUser: 10000
            runAsGroup: 10000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
            - name: qmd-runtime
              mountPath: /opt/qmd
            - name: qmd-temporary
              mountPath: /tmp
        - name: prepare-langfuse
          image: nousresearch/hermes-agent:latest-desktop@sha256:2393aaca1b7d53b5c04c1b98d5f2b126f763ba3440b0724f4af185415974096f
          command: [/opt/hermes/.venv/bin/python, /bootstrap/prepare_langfuse.py, /opt/langfuse]
          env:
            - name: PYTHONPATH
              value: /opt/langfuse/python:/opt/hermes
          securityContext:
            runAsUser: 10000
            runAsGroup: 10000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: langfuse-runtime
              mountPath: /opt/langfuse
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
            - name: integration-temporary
              mountPath: /tmp
        - name: install-qbittorrent-client
          image: python:3.15.2-alpine3.23
          command: [python, -m, pip, install]
          args:
            - --disable-pip-version-check
            - --no-deps
            - --no-compile
            - --require-hashes
            - --target=/runtime/python
            - --cache-dir=/tmp/pip-cache
            - --requirement=/bootstrap/requirements.txt
          securityContext:
            runAsUser: 10000
            runAsGroup: 10000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: homelab-runtime
              mountPath: /runtime
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
            - name: integration-temporary
              mountPath: /tmp
        - name: install-obsidian-sync
          image: nousresearch/hermes-agent:latest-desktop@sha256:2393aaca1b7d53b5c04c1b98d5f2b126f763ba3440b0724f4af185415974096f
          command: [/bin/sh, -ec]
          args:
            - |
              cp /bootstrap/package.json /opt/obsidian/package.json
              cp /bootstrap/package-lock.json /opt/obsidian/package-lock.json
              npm ci --prefix /opt/obsidian --omit=dev --no-audit --no-fund --strict-allow-scripts --cache /tmp/npm-cache
              node -e 'const Database = require("/opt/obsidian/node_modules/better-sqlite3"); const db = new Database(":memory:"); db.prepare("SELECT 1").get(); db.close();'
          securityContext:
            runAsUser: 10000
            runAsGroup: 10000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
            - name: obsidian-runtime
              mountPath: /opt/obsidian
            - name: obsidian-temporary
              mountPath: /tmp
        - name: patch-ticktick-oauth
          image: nousresearch/hermes-agent:latest-desktop@sha256:2393aaca1b7d53b5c04c1b98d5f2b126f763ba3440b0724f4af185415974096f
          command:
            - /opt/hermes/.venv/bin/python
            - /bootstrap/patch_ticktick_oauth.py
            - /patched/mcp_oauth_provider.py
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
            - name: oauth-provider
              mountPath: /patched
      containers:
        - name: qmd
          image: nousresearch/hermes-agent:latest-desktop@sha256:2393aaca1b7d53b5c04c1b98d5f2b126f763ba3440b0724f4af185415974096f
          command: [node, /opt/qmd/node_modules/@tobilu/qmd/dist/cli/qmd.js]
          args: [--index, index, mcp, --http, --host, 127.0.0.1, --port, "8181"]
          workingDir: /opt/qmd
          env:
            - name: QMD_CONFIG_DIR
              value: /state/config
            - name: XDG_CACHE_HOME
              value: /state/cache
            - name: QMD_FORCE_CPU
              value: "1"
            - name: QMD_EMBED_PARALLELISM
              value: "1"
          securityContext:
            runAsUser: 10000
            runAsGroup: 10000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          livenessProbe:
            exec:
              command: [node, -e, "fetch('http://127.0.0.1:8181/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 4Gi
          volumeMounts:
            - name: qmd-runtime
              mountPath: /opt/qmd
              readOnly: true
            - name: data
              mountPath: /state
              subPath: qmd
            - name: data
              mountPath: /vault
              subPath: obsidian/vault
              readOnly: true
            - name: qmd-temporary
              mountPath: /tmp
        - name: qmd-index
          image: nousresearch/hermes-agent:latest-desktop@sha256:2393aaca1b7d53b5c04c1b98d5f2b126f763ba3440b0724f4af185415974096f
          command: [/bin/sh, /bootstrap/qmd-refresh.sh]
          env:
            - name: QMD_CONFIG_DIR
              value: /state/config
            - name: XDG_CACHE_HOME
              value: /state/cache
            - name: QMD_FORCE_CPU
              value: "1"
            - name: QMD_EMBED_PARALLELISM
              value: "1"
          securityContext:
            runAsUser: 10000
            runAsGroup: 10000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
            - name: qmd-runtime
              mountPath: /opt/qmd
              readOnly: true
            - name: data
              mountPath: /state
              subPath: qmd
            - name: data
              mountPath: /vault
              subPath: obsidian/vault
              readOnly: true
            - name: qmd-temporary
              mountPath: /tmp
        - name: hermes
          image: nousresearch/hermes-agent:latest-desktop@sha256:2393aaca1b7d53b5c04c1b98d5f2b126f763ba3440b0724f4af185415974096f
          # Preserve the official entrypoint: s6 starts as root, initializes
          # storage, then drops gateway/dashboard processes to UID 10000.
          args: [gateway, run]
          envFrom:
            - secretRef:
                name: hermes-discord
            - secretRef:
                name: hermes-web
            - secretRef:
                name: hermes-langfuse
          env:
            - name: TZ
              value: ${TIME_ZONE}
            - name: OBSIDIAN_VAULT_PATH
              value: /opt/data/obsidian/vault
            - name: WIKI_PATH
              value: /opt/data/obsidian/vault
            - name: PYTHONPATH
              value: /opt/langfuse/python:/opt/hermes
            - name: HERMES_LANGFUSE_BASE_URL
              value: http://langfuse.homelab.svc.cluster.local:3000
            - name: HERMES_LANGFUSE_CAPTURE
              value: sanitized
            - name: HERMES_DASHBOARD
              value: "1"
            - name: HERMES_DASHBOARD_HOST
              value: 0.0.0.0
            - name: HERMES_DASHBOARD_PUBLIC_URL
              value: https://hermes.${DOMAIN}
            - name: HERMES_DASHBOARD_OIDC_ISSUER
              value: https://auth.${DOMAIN}/application/o/hermes/
            - name: HERMES_DASHBOARD_OIDC_CLIENT_ID
              value: homelab-hermes
            - name: HERMES_DASHBOARD_OIDC_SCOPES
              value: openid profile email offline_access
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [CHOWN, FOWNER, DAC_OVERRIDE, SETUID, SETGID]
          ports:
            - name: dashboard
              containerPort: 9119
          startupProbe:
            tcpSocket:
              port: dashboard
            failureThreshold: 120
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: dashboard
          livenessProbe:
            tcpSocket:
              port: dashboard
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 4Gi
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: langfuse-runtime
              mountPath: /opt/langfuse
              readOnly: true
            - name: langfuse-runtime
              mountPath: /opt/data/plugins/langfuse
              subPath: plugin
              readOnly: true
            - name: shared-memory
              mountPath: /dev/shm
            - name: bootstrap
              mountPath: /opt/data/workspace/.hermes.md
              subPath: second-brain.md
              readOnly: true
            - name: oauth-provider
              mountPath: /opt/hermes/tools/mcp_oauth_provider.py
              subPath: mcp_oauth_provider.py
              readOnly: true
            - name: homelab-runtime
              mountPath: /opt/homelab
              readOnly: true
            - name: bootstrap
              mountPath: /opt/homelab/services.py
              subPath: services.py
              readOnly: true
            - name: bootstrap
              mountPath: /opt/homelab/mcp_server.py
              subPath: mcp_server.py
              readOnly: true
            - name: service-credentials
              mountPath: /opt/homelab/credentials
              readOnly: true
            - name: homelab-workspace
              mountPath: /opt/data/workspace/homelab
            - name: bootstrap
              mountPath: /opt/data/skills/homelab-services/SKILL.md
              subPath: homelab-skill.md
              readOnly: true
        - name: immich-mcp
          image: ghcr.io/drolosoft/immich-photo-manager:2.0.13@sha256:2087e460c2b114a87649d3b6d57c87e72a77900f016fd86052279aaf4e2020b8
          env:
            - name: IMMICH_BASE_URL
              value: https://photos.${DOMAIN}
            - name: IMMICH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-immich
                  key: IMMICH_API_KEY
            - name: MCP_HOST
              value: 127.0.0.1
            - name: MCP_PORT
              value: "8626"
            - name: MCP_TRANSPORT
              value: http
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          securityContext:
            runAsUser: 10000
            runAsGroup: 10000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            exec:
              command: [python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8626/health', timeout=4)"]
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            exec:
              command: [python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8626/health', timeout=4)"]
          livenessProbe:
            exec:
              command: [python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8626/health', timeout=4)"]
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: immich-temporary
              mountPath: /data
            - name: integration-temporary
              mountPath: /tmp
        - name: obsidian-sync
          image: nousresearch/hermes-agent:latest-desktop@sha256:2393aaca1b7d53b5c04c1b98d5f2b126f763ba3440b0724f4af185415974096f
          command: [/bin/sh, -ec]
          args:
            - |
              cli=/opt/obsidian/node_modules/obsidian-headless/cli.js
              rm -f /state/ready
              until node "$cli" sync-status --path /vault --json >/dev/null 2>&1; do
                sleep 10
              done
              node "$cli" sync --path /vault
              touch /state/ready
              exec node "$cli" sync --path /vault --continuous
          env:
            - name: TZ
              value: ${TIME_ZONE}
            - name: XDG_CONFIG_HOME
              value: /state
            - name: OBSIDIAN_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-obsidian
                  key: OBSIDIAN_AUTH_TOKEN
          securityContext:
            runAsUser: 10000
            runAsGroup: 10000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /vault
              subPath: obsidian/vault
            - name: data
              mountPath: /state
              subPath: obsidian/headless
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
            - name: obsidian-runtime
              mountPath: /opt/obsidian
              readOnly: true
            - name: obsidian-temporary
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-data
        - name: bootstrap
          configMap:
            name: hermes-bootstrap
        - name: oauth-provider
          emptyDir: {}
        - name: obsidian-runtime
          emptyDir: {}
        - name: obsidian-temporary
          emptyDir: {}
        - name: shared-memory
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
        - name: homelab-runtime
          emptyDir: {}
        - name: service-credentials
          secret:
            secretName: hermes-services
            defaultMode: 0444
        - name: immich-temporary
          emptyDir: {}
        - name: integration-temporary
          emptyDir: {}
        - name: homelab-workspace
          emptyDir: {}
        - name: qmd-runtime
          emptyDir: {}
        - name: qmd-temporary
          emptyDir: {}
        - name: langfuse-runtime
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: hermes
spec:
  selector:
    app: hermes
  ports:
    - name: dashboard
      port: 9119
      targetPort: dashboard
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: hermes
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`hermes.${DOMAIN}`)
      kind: Rule
      middlewares:
        - name: private-only
          namespace: traefik
        - name: secure-headers
          namespace: traefik
      services:
        - name: hermes
          port: 9119
  tls: {}
