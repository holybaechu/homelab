apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      # local-path does not enforce a capacity quota.
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hermes
  template:
    metadata:
      labels:
        app: hermes
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      hostAliases:
        - ip: ${NODE_IP}
          hostnames:
            - auth.${DOMAIN}
      initContainers:
        - name: seed-config
          image: nousresearch/hermes-agent:latest-desktop@sha256:b7837e696eebce08495f6984a79a0a6a7ef696af746d407debff26d88473a389
          command: [/bin/sh, -ec]
          args:
            - |
              if [ ! -e /opt/data/config.yaml ]; then
                cp /bootstrap/config.yaml /opt/data/config.yaml
                chown 10000:10000 /opt/data/config.yaml
                chmod 600 /opt/data/config.yaml
              fi
              mkdir -p /opt/data/workspace /opt/data/obsidian/vault /opt/data/obsidian/headless /opt/obsidian
              chown 10000:10000 /opt/data /opt/data/workspace
              chown 10000:10000 /opt/data/obsidian /opt/data/obsidian/vault /opt/data/obsidian/headless /opt/obsidian
              chmod 700 /opt/data/obsidian/headless
              # Git owns the MCP section; the CLI preserves other live settings.
              hermes config set --force mcp_servers "$(cat /bootstrap/mcp-servers.yaml)"
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [CHOWN, FOWNER, DAC_OVERRIDE, SETUID, SETGID]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
            - name: obsidian-runtime
              mountPath: /opt/obsidian
        - name: install-obsidian-sync
          image: nousresearch/hermes-agent:latest-desktop@sha256:b7837e696eebce08495f6984a79a0a6a7ef696af746d407debff26d88473a389
          command: [/bin/sh, -ec]
          args:
            - |
              cp /bootstrap/package.json /opt/obsidian/package.json
              cp /bootstrap/package-lock.json /opt/obsidian/package-lock.json
              npm ci --prefix /opt/obsidian --omit=dev --no-audit --no-fund --strict-allow-scripts --cache /tmp/npm-cache
              node -e 'const Database = require("/opt/obsidian/node_modules/better-sqlite3"); const db = new Database(":memory:"); db.prepare("SELECT 1").get(); db.close();'
          securityContext:
            runAsUser: 10000
            runAsGroup: 10000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
            - name: obsidian-runtime
              mountPath: /opt/obsidian
            - name: obsidian-temporary
              mountPath: /tmp
        - name: patch-ticktick-oauth
          image: nousresearch/hermes-agent:latest-desktop@sha256:b7837e696eebce08495f6984a79a0a6a7ef696af746d407debff26d88473a389
          command:
            - /opt/hermes/.venv/bin/python
            - /bootstrap/patch_ticktick_oauth.py
            - /patched/mcp_oauth_provider.py
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
            - name: oauth-provider
              mountPath: /patched
      containers:
        - name: hermes
          image: nousresearch/hermes-agent:latest-desktop@sha256:b7837e696eebce08495f6984a79a0a6a7ef696af746d407debff26d88473a389
          # Preserve the official entrypoint: s6 starts as root, initializes
          # storage, then drops gateway/dashboard processes to UID 10000.
          args: [gateway, run]
          envFrom:
            - secretRef:
                name: hermes-discord
            - secretRef:
                name: hermes-web
          env:
            - name: TZ
              value: ${TIME_ZONE}
            - name: OBSIDIAN_VAULT_PATH
              value: /vault
            - name: WIKI_PATH
              value: /vault/Hermes
            - name: HERMES_DASHBOARD
              value: "1"
            - name: HERMES_DASHBOARD_HOST
              value: 0.0.0.0
            - name: HERMES_DASHBOARD_PUBLIC_URL
              value: https://hermes.${DOMAIN}
            - name: HERMES_DASHBOARD_OIDC_ISSUER
              value: https://auth.${DOMAIN}/application/o/hermes/
            - name: HERMES_DASHBOARD_OIDC_CLIENT_ID
              value: homelab-hermes
            - name: HERMES_DASHBOARD_OIDC_SCOPES
              value: openid profile email offline_access
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [CHOWN, FOWNER, DAC_OVERRIDE, SETUID, SETGID]
          ports:
            - name: dashboard
              containerPort: 9119
          startupProbe:
            tcpSocket:
              port: dashboard
            failureThreshold: 120
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: dashboard
          livenessProbe:
            tcpSocket:
              port: dashboard
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 4Gi
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: shared-memory
              mountPath: /dev/shm
            - name: data
              mountPath: /vault
              subPath: obsidian/vault
            - name: bootstrap
              mountPath: /opt/data/workspace/.hermes.md
              subPath: second-brain.md
              readOnly: true
            - name: oauth-provider
              mountPath: /opt/hermes/tools/mcp_oauth_provider.py
              subPath: mcp_oauth_provider.py
              readOnly: true
        - name: obsidian-sync
          image: nousresearch/hermes-agent:latest-desktop@sha256:b7837e696eebce08495f6984a79a0a6a7ef696af746d407debff26d88473a389
          command: [/bin/sh, -ec]
          args:
            - |
              cli=/opt/obsidian/node_modules/obsidian-headless/cli.js
              rm -f /state/ready
              until node "$cli" sync-status --path /vault --json >/dev/null 2>&1; do
                sleep 10
              done
              node "$cli" sync --path /vault
              touch /state/ready
              exec node "$cli" sync --path /vault --continuous
          env:
            - name: TZ
              value: ${TIME_ZONE}
            - name: XDG_CONFIG_HOME
              value: /state
          securityContext:
            runAsUser: 10000
            runAsGroup: 10000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /vault
              subPath: obsidian/vault
            - name: data
              mountPath: /state
              subPath: obsidian/headless
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
            - name: obsidian-runtime
              mountPath: /opt/obsidian
              readOnly: true
            - name: obsidian-temporary
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-data
        - name: bootstrap
          configMap:
            name: hermes-bootstrap
        - name: oauth-provider
          emptyDir: {}
        - name: obsidian-runtime
          emptyDir: {}
        - name: obsidian-temporary
          emptyDir: {}
        - name: shared-memory
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: hermes
spec:
  selector:
    app: hermes
  ports:
    - name: dashboard
      port: 9119
      targetPort: dashboard
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: hermes
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`hermes.${DOMAIN}`)
      kind: Rule
      middlewares:
        - name: private-only
          namespace: traefik
        - name: secure-headers
          namespace: traefik
      services:
        - name: hermes
          port: 9119
  tls: {}
