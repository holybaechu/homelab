model:
  provider: openai-codex
  default: gpt-6.1-sol
terminal:
  backend: local
  cwd: /opt/data/profiles/coder/workspace
browser:
  chromium_args: [--no-sandbox]
mcp_servers: {}
platforms:
  discord:
    enabled: false
plugins:
  enabled: [langfuse]
  entries:
    langfuse:
      settings:
        end_user_attribution: false
