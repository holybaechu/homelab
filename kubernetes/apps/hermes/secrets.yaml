apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-discord
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: hermes-discord
    creationPolicy: Owner
  data:
    - secretKey: DISCORD_BOT_TOKEN
      remoteRef:
        key: ${HERMES_DISCORD_TOKEN_REF}
    - secretKey: DISCORD_ALLOWED_USERS
      remoteRef:
        key: ${HERMES_DISCORD_ALLOWED_USERS_REF}
    - secretKey: DISCORD_HOME_CHANNEL
      remoteRef:
        key: ${HERMES_DISCORD_HOME_CHANNEL_REF}
