# Seeded only on first boot. Hermes manages its live config in /opt/data.
model:
  provider: openai-codex
  default: gpt-6.1-sol
terminal:
  backend: local
  cwd: /opt/data/workspace
plugins:
  enabled: [langfuse]
  entries:
    langfuse:
      settings:
        end_user_attribution: false
platforms:
  discord:
    enabled: true
web:
  search_backend: exa
  extract_backend: exa
  provider_tier:
    exa: paid
webapp:
  enabled: true
  host: 0.0.0.0
  port: 9120
  public_url: https://hermes.${DOMAIN}
dashboard:
  public_url: https://dash.hermes.${DOMAIN}
  trusted_proxies:
    # Traefik uses the node network, rather than a pod address.
    - ${NODE_IP}/32
