# Git owns the full MCP server list, reconciled on every pod start.
# OAuth credentials stay on the persistent volume, outside this ConfigMap.
t3code:
  url: https://t3.${DOMAIN}/mcp
  auth: oauth
  connect_timeout: 315
  # Cutover gate: enable only after the operator acceptance in ../t3/README.md.
  enabled: false
  tools:
    resources: false
    prompts: false
    include:
      - orchestrator_capabilities
      - t3_project_list
      - t3_project_read
      - t3_thread_launch
      - t3_thread_list
      - t3_thread_search
      - t3_thread_read
      - t3_thread_send
      - t3_thread_wait
      - t3_thread_interrupt
      - t3_queue
cua:
  command: /opt/coder/bin/cua
  args:
    - mcp
    - --embedded
    - --permissions
    - spaces:list_spaces,spaces:space_bash,spaces:space_job,spaces:space_write,spaces:upload,spaces:download,spaces:list_tools,spaces:call_tool
  env:
    CUA_HOME: /opt/data/cua
    CUA_TELEMETRY: "0"
  enabled: true
  tools:
    resources: false
    prompts: false
    include:
      - list_spaces
      - space_bash
      - space_job
      - space_write
      - upload
      - download
      - list_tools
      - call_tool
langfuse:
  url: http://langfuse.homelab.svc.cluster.local:3000/api/public/mcp
  headers:
    Authorization: $${env:HERMES_LANGFUSE_MCP_AUTH}
    Host: langfuse.${DOMAIN}
  tools:
    include:
      - listObservations
      - getObservation
      - getObservationFieldSchema
      - getObservationFilterSchema
      - getObservationFilterValues
      - queryMetrics
      - getMetricsSchema
    resources: false
    prompts: false
ticktick:
  url: https://mcp.ticktick.com
  auth: oauth
  enabled: true
qmd:
  url: http://127.0.0.1:8181/mcp
  enabled: true
  tools:
    resources: false
    prompts: false
homelab:
  command: /opt/hermes/.venv/bin/python
  args: [/opt/homelab/mcp_server.py]
  enabled: true
  tools:
    resources: false
    prompts: false
immich:
  url: http://127.0.0.1:8626/mcp
  enabled: true
  tools:
    resources: false
    prompts: false
    include:
      - ping
      - get_server_version
      - get_capabilities
      - search_metadata
      - search_smart
      - search_explore
      - search_cities
      - search_places
      - search_suggestions
      - list_albums
      - get_album
      - get_asset_info
      - get_asset_image
      - get_images_batch
      - list_people
      - get_person
      - search_people
      - create_album
      - add_assets_to_album
