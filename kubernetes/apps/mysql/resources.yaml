apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      # Required PVC bookkeeping; local-path grows with writes and enforces no quota.
      storage: 1Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  annotations:
    secret.reloader.stakater.com/reload: mysql-tls
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        runAsNonRoot: true
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mysql
          image: docker.io/library/mysql:8.4.13
          args:
            - --innodb-buffer-pool-size=128M
            - --innodb-log-buffer-size=16M
            - --performance-schema-digests-size=1000
            - --performance-schema-events-statements-history-long-size=1000
            - --temptable-max-ram=64M
            - --max-connections=50
            - --mysqlx=OFF
            - --skip-log-bin
            - --require-secure-transport=ON
            - --ssl-cert=/run/secrets/tls/tls.crt
            - --ssl-key=/run/secrets/tls/tls.key
          env:
            - name: TZ
              value: ${TIME_ZONE}
            - name: MYSQL_DATABASE
              value: temp
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-connect
                  key: username
            - name: MYSQL_PASSWORD_FILE
              value: /run/secrets/mysql/password
            - name: MYSQL_ROOT_PASSWORD_FILE
              value: /run/secrets/mysql/root-password
            - name: MYSQL_ROOT_HOST
              value: localhost
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: mysql
              containerPort: 3306
          startupProbe:
            tcpSocket:
              port: mysql
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - 'MYSQL_PWD="$(cat /run/secrets/mysql/password)" mysql --ssl-mode=REQUIRED --protocol=TCP -h 127.0.0.1 -u "$MYSQL_USER" -D temp -e "SELECT 1" >/dev/null'
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: mysql
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: runtime
              mountPath: /var/run/mysqld
            - name: temporary
              mountPath: /tmp
            - name: credentials
              mountPath: /run/secrets/mysql
              readOnly: true
            - name: tls
              mountPath: /run/secrets/tls
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mysql-data
        - name: runtime
          emptyDir: {}
        - name: temporary
          emptyDir: {}
        - name: credentials
          secret:
            secretName: mysql-connect
            defaultMode: 0440
            items:
              - key: password
                path: password
              - key: root_password
                path: root-password
        - name: tls
          secret:
            secretName: mysql-tls
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
spec:
  type: NodePort
  selector:
    app: mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
      nodePort: 30306
