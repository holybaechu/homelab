apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mysql-env
spec:
  refreshInterval: ${SECRET_REFRESH_INTERVAL}
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: mysql-env
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: ${MYSQL_USERNAME_REF}
    - secretKey: password
      remoteRef:
        key: ${MYSQL_PASSWORD_REF}
    - secretKey: root-password
      remoteRef:
        key: ${MYSQL_ROOT_PASSWORD_REF}
