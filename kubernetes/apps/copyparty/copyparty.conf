[accounts]
@@ACCOUNTS@@

[global]
  e2dsa
  e2ts
  usernames
  env-expand: 0
  rproxy: -1
  xff-src: ${POD_CIDR}
  idp-h-usr: x-authentik-username
  idp-h-grp: x-authentik-groups
  idp-gsep: |
  auth-ord: idp,pw
  name: copyparty.${DOMAIN}
  hist: /config/state
  localtime
  gsel
  lang: kor
  p: 3923
  no-voldump

[/public]
  /srv/public
  accs:
    r: *
    A: @@OWNER@@, @copyparty-admins

[/shared-readonly]
  /srv/shared-readonly
  accs:
    r: @@OWNER@@, @copyparty-users, @copyparty-admins

[/downloads]
  /srv/downloads
  accs:
    r: @@OWNER@@, @copyparty-admins
