{{- /* Invalid input intentionally fails ESO's missing-key check. */ -}}
{{- if or (not (regexMatch `^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$` .username)) (eq .password "") (ne .password (trim .password)) (regexMatch `[\x00\r\n]| #` .password) -}}
{{- .invalid_copyparty_credentials -}}
{{- end -}}
[accounts]
  {{ .username }}: {{ .password }}

[global]
  e2dsa
  e2ts
  usernames
  env-expand: 0
  rproxy: -1
  xff-src: ${NODE_IP}/32
  idp-h-usr: x-authentik-username
  idp-h-grp: x-authentik-groups
  idp-gsep: |
  # ACL names cannot contain spaces; normalize the IdP names to underscores.
  idp-chsub: | _|
  auth-ord: idp,pw
  name: copyparty.${DOMAIN}
  hist: /config/state
  localtime
  gsel
  lang: kor
  p: 3923
  no-voldump

[/public]
  /srv/public
  accs:
    r: *
    A: {{ .username }}, @copyparty_Admins

[/shared-readonly]
  /srv/shared-readonly
  accs:
    r: {{ .username }}, @copyparty_Users, @copyparty_Admins

[/downloads]
  /srv/downloads
  accs:
    r: {{ .username }}, @copyparty_Admins
