apiVersion: k8up.io/v1
kind: PreBackupPod
metadata:
  name: backup-opencloud
  namespace: homelab
  labels:
    backup.hchu.me/app: opencloud
spec:
  backupCommand: bash /backup/offline.sh opencloud
  fileExtension: .json
  pod:
    spec:
      automountServiceAccountToken: true
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: capture
          image: ghcr.io/k8up-io/k8up:${K8UP_VERSION}
          command:
            - sleep
            - infinity
          env:
            - name: HOME
              value: /tmp
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: scripts
              mountPath: /backup
              readOnly: true
            - name: tmp
              mountPath: /tmp
              readOnly: false
            - name: opencloud-config
              mountPath: /source/opencloud-config
              readOnly: true
            - name: opencloud-data
              mountPath: /source/opencloud-data
              readOnly: true
            - name: recovery
              mountPath: /credentials
              readOnly: true
            - name: recovery-copy
              mountPath: /recovery
              readOnly: false
            - name: stage
              mountPath: /stage
              readOnly: false
            - name: repository
              mountPath: /repository
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: backup-scripts
        - name: tmp
          emptyDir: {}
        - name: opencloud-config
          persistentVolumeClaim:
            claimName: opencloud-config
            readOnly: true
        - name: opencloud-data
          persistentVolumeClaim:
            claimName: opencloud-data
            readOnly: true
        - name: recovery
          emptyDir: {}
        - name: recovery-copy
          emptyDir: {}
        - name: stage
          persistentVolumeClaim:
            claimName: backup-stage
        - name: repository
          secret:
            secretName: backup-b2-connect
            defaultMode: 256
            items:
              - key: access-key-id
                path: access-key-id
              - key: secret-access-key
                path: secret-access-key
              - key: restic-password
                path: restic-password
      serviceAccountName: backup-runner
---
apiVersion: k8up.io/v1
kind: PreBackupPod
metadata:
  name: backup-immich
  namespace: homelab
  labels:
    backup.hchu.me/app: immich
spec:
  backupCommand: sh /backup/postgres.sh
  fileExtension: .tar
  pod:
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: capture
          image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
          command:
            - sleep
            - infinity
          env:
            - name: HOME
              value: /tmp
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PGHOST
              value: immich-postgresql
            - name: PGUSER
              value: immich
            - name: PGDATABASE
              value: immich
            - name: PGCONNECT_TIMEOUT
              value: "10"
            - name: PGOPTIONS
              value: -c statement_timeout=3600000
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-connect
                  key: database-password
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: scripts
              mountPath: /backup
              readOnly: true
            - name: tmp
              mountPath: /tmp
              readOnly: false
            - name: immich-media
              mountPath: /source/immich-media
              readOnly: true
            - name: recovery
              mountPath: /recovery
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: backup-scripts
        - name: tmp
          emptyDir: {}
        - name: immich-media
          persistentVolumeClaim:
            claimName: immich-media
            readOnly: true
        - name: recovery
          projected:
            defaultMode: 256
            sources:
              - secret:
                  name: immich-connect
                  items:
                    - key: database-password
                      path: immich/database-password
---
