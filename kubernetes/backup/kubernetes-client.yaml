# Connection metadata only; kubelet rotates the separately projected token.
apiVersion: v1
kind: Config
clusters:
  - name: in-cluster
    cluster:
      server: https://kubernetes.default.svc
      certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
users:
  - name: backup
    user:
      tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
contexts:
  - name: homelab
    context:
      cluster: in-cluster
      user: backup
      namespace: homelab
current-context: homelab
