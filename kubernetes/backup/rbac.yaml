---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backup-suspend-apps
  namespace: flux-system
rules:
  - apiGroups:
      - kustomize.toolkit.fluxcd.io
    resources:
      - kustomizations
    resourceNames:
      - apps
    verbs:
      - get
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backup-suspend-apps
  namespace: flux-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: backup-suspend-apps
subjects:
  - kind: ServiceAccount
    name: backup-runner
    namespace: homelab
  - kind: ServiceAccount
    name: backup-watchdog
    namespace: homelab
---
