    resources:
      - deployments
    resourceNames:
      - opencloud
      - qbittorrent
      - zipline
      - n8n
      - backup-watchdog
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - apps
    resources:
      - deployments/scale
    resourceNames:
      - opencloud
      - qbittorrent
      - zipline
      - n8n
    verbs:
      - get
      - patch
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backup-watchdog
  namespace: homelab
roleRef:
