apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backup-runner
  namespace: homelab
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
    resourceNames:
      - backup-capture-state
    verbs:
      - get
      - update
  - apiGroups:
      - apps
    resources:
      - deployments
    resourceNames:
      - opencloud
      - qbittorrent
      - zipline
      - n8n
      - backup-watchdog
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - apps
    resources:
      - deployments/scale
    resourceNames:
      - opencloud
      - qbittorrent
      - zipline
      - n8n
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backup-runner
  namespace: homelab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: backup-runner
subjects:
  - kind: ServiceAccount
    name: backup-runner
    namespace: homelab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backup-watchdog
  namespace: homelab
rules:
  - apiGroups:
