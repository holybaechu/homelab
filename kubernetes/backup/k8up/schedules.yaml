apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: backup-b2-connect
  namespace: homelab
spec:
  itemPath: ${BACKUP_B2_CONNECT_ITEM_PATH}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backup-b2-environment
  namespace: homelab
data:
  AWS_DEFAULT_REGION: us-west-004
---
apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: b2
  namespace: homelab
spec:
  backend:
    repoPasswordSecretRef:
      name: backup-b2-connect
      key: restic-password
    envFrom:
      - configMapRef:
          name: backup-b2-environment
    s3:
      endpoint: https://s3.us-west-004.backblazeb2.com
      bucket: homelab-backup-b2/k8up/homelab
      accessKeyIDSecretRef:
        name: backup-b2-connect
        key: access-key-id
      secretAccessKeySecretRef:
        name: backup-b2-connect
        key: secret-access-key
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 1
  podSecurityContext:
    runAsUser: 0
  backup:
    schedule: '0 4 * * *'
  check:
    schedule: '0 12 * * 0'
  prune:
    schedule: '0 12 1 * *'
    retention:
      keepDaily: 7
      keepWeekly: 4
      keepMonthly: 6
---
