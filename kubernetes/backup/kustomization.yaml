apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - resources.yaml
  - admission.yaml
configMapGenerator:
  - name: backup-scripts
    namespace: homelab
    files: [controller.py, worker.py, health.py]
  - name: backup-scripts
    namespace: identity
    files: [controller.py, worker.py]
  - name: backup-scripts
    namespace: networking
    files: [controller.py, worker.py]
generatorOptions:
  disableNameSuffixHash: true
