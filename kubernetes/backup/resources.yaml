apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backup-stage
  namespace: homelab
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 320Gi
---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: backup-b2-connect
  namespace: homelab
spec:
  itemPath: ${BACKUP_B2_CONNECT_ITEM_PATH}
---
apiVersion: v1
kind: Service
metadata:
  name: backup-worker
  namespace: homelab
spec:
  clusterIP: None
  selector:
    app: backup-worker
  ports:
    - name: unused
      port: 9999
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: backup-worker
  namespace: homelab
spec:
  serviceName: backup-worker
  replicas: 1
  selector:
    matchLabels:
      app: backup-worker
  template:
    metadata:
      labels:
        app: backup-worker
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ${BACKUP_IMAGE}
          command:
            - sleep
            - infinity
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 1Gi
          env:
            - name: NAMESPACE
              value: homelab
          volumeMounts:
            - name: scripts
              mountPath: /backup
              readOnly: true
            - name: stage
              mountPath: /stage
            - name: tmp
              mountPath: /tmp
            - name: opencloud-config
              mountPath: /source/opencloud-config
              readOnly: true
            - name: opencloud-data
              mountPath: /source/opencloud-data
              readOnly: true
            - name: immich-media
              mountPath: /source/immich-media
              readOnly: true
            - name: hermes-data
              mountPath: /source/hermes-data
              readOnly: true
            - name: t3-data
              mountPath: /source/t3-data
              readOnly: true
            - name: n8n-data
              mountPath: /source/n8n-data
              readOnly: true
            - name: zipline-data
              mountPath: /source/zipline-data
              readOnly: true
            - name: zipline-uploads
              mountPath: /source/zipline-uploads
              readOnly: true
            - name: recovery
              mountPath: /recovery
              readOnly: true
            - name: repositories
              mountPath: /repositories
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: backup-scripts
        - name: stage
          persistentVolumeClaim:
            claimName: backup-stage
        - name: tmp
          emptyDir: {}
        - name: opencloud-config
          persistentVolumeClaim:
            claimName: opencloud-config
            readOnly: true
        - name: opencloud-data
          persistentVolumeClaim:
            claimName: opencloud-data
            readOnly: true
        - name: immich-media
          persistentVolumeClaim:
            claimName: immich-media
            readOnly: true
        - name: hermes-data
          persistentVolumeClaim:
            claimName: hermes-data
            readOnly: true
        - name: t3-data
          persistentVolumeClaim:
            claimName: t3-data
            readOnly: true
        - name: n8n-data
          persistentVolumeClaim:
            claimName: n8n-data
            readOnly: true
        - name: zipline-data
          persistentVolumeClaim:
            claimName: zipline-data
            readOnly: true
        - name: zipline-uploads
          persistentVolumeClaim:
            claimName: zipline-uploads
            readOnly: true
        - name: recovery
          projected:
            defaultMode: 256
            sources:
              - secret:
                  name: immich-connect
                  items:
                    - key: database-password
                      path: immich/database-password
              - secret:
                  name: n8n-connect
                  items:
                    - key: encryption_key
                      path: n8n/encryption_key
              - secret:
                  name: zipline-connect
                  items:
                    - key: core-secret
                      path: zipline/core-secret
                    - key: oidc-client-secret
                      path: zipline/oidc-client-secret
        - name: repositories
          projected:
            defaultMode: 256
            sources:
              - secret:
                  name: backup-b2-connect
                  items:
                    - key: access-key-id
                      path: b2/access-key-id
                    - key: secret-access-key
                      path: b2/secret-access-key
                    - key: restic-password
                      path: b2/restic-password
              - configMap:
                  name: backup-repositories
                  items:
                    - key: b2-repository
                      path: b2/repository
                    - key: b2-region
                      path: b2/region
