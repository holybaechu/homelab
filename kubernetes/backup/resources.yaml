apiVersion: apps/v1
kind: Deployment
metadata:
  name: backup-watchdog
  namespace: homelab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backup-watchdog
  template:
    metadata:
      labels:
        app: backup-watchdog
    spec:
      serviceAccountName: backup-watchdog
      restartPolicy: Always
      terminationGracePeriodSeconds: 120
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: watchdog
          image: ${BACKUP_IMAGE}
          command:
            - python3
            - /backup/controller.py
            - watchdog
          securityContext:
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: scripts
              mountPath: /backup
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: scripts
          configMap:
            name: backup-scripts
        - name: tmp
          emptyDir: {}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-daily
  namespace: homelab
spec:
  schedule: 0 4 * * *
  timeZone: Asia/Seoul
  suspend: true
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 172800
      template:
        spec:
          serviceAccountName: backup-runner
          restartPolicy: Never
          terminationGracePeriodSeconds: 120
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: ${BACKUP_IMAGE}
              command:
                - python3
                - /backup/controller.py
                - backup
              securityContext:
                runAsUser: 0
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
                  add:
                    - CHOWN
                    - DAC_OVERRIDE
                    - FOWNER
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  memory: 1Gi
              volumeMounts:
                - name: scripts
                  mountPath: /backup
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
                - name: stage
                  mountPath: /stage
          volumes:
            - name: scripts
              configMap:
                name: backup-scripts
            - name: tmp
              emptyDir: {}
            - name: stage
              persistentVolumeClaim:
                claimName: backup-stage
---
