apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: b2-opencloud
  namespace: homelab
spec:
  backend:
    repoPasswordSecretRef:
      name: backup-b2-connect
      key: restic-password
    envFrom:
      - configMapRef:
          name: backup-b2-environment
    s3:
      endpoint: https://s3.us-west-004.backblazeb2.com
      bucket: homelab-backup-b2/k8up/homelab/opencloud
      accessKeyIDSecretRef:
        name: backup-b2-connect
        key: access-key-id
      secretAccessKeySecretRef:
        name: backup-b2-connect
        key: secret-access-key
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 1
  podSecurityContext:
    runAsUser: 0
  backup:
    schedule: 0 4 * * *
    concurrentRunsAllowed: false
    activeDeadlineSeconds: 7200
    tags:
      - opencloud
    labelSelectors:
      - matchLabels:
          backup.hchu.me/app: opencloud
  check:
    schedule: 0 12 * * 0
    activeDeadlineSeconds: 7200
  prune:
    schedule: 0 12 1 * *
    activeDeadlineSeconds: 7200
    retention:
      keepDaily: 7
      keepWeekly: 4
      keepMonthly: 6
---
