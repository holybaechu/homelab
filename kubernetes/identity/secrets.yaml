apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-env
  namespace: identity
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: authentik-env
    creationPolicy: Owner
  data:
  - secretKey: AUTHENTIK_SECRET_KEY
    remoteRef:
      key: ${AUTHENTIK_SECRET_KEY_REF}
  - secretKey: AUTHENTIK_POSTGRESQL__PASSWORD
    remoteRef:
      key: ${AUTHENTIK_DATABASE_PASSWORD_REF}
  - secretKey: AUTHENTIK_BOOTSTRAP_EMAIL
    remoteRef:
      key: ${AUTHENTIK_EMAIL_REF}
  - secretKey: AUTHENTIK_BOOTSTRAP_PASSWORD
    remoteRef:
      key: ${AUTHENTIK_PASSWORD_REF}
  - secretKey: HEADSCALE_OIDC_CLIENT_SECRET
    remoteRef:
      key: ${HEADSCALE_OIDC_SECRET_REF}
  - secretKey: ZIPLINE_OIDC_CLIENT_SECRET
    remoteRef:
      key: ${ZIPLINE_OIDC_SECRET_REF}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-postgresql
  namespace: identity
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: authentik-postgresql
    creationPolicy: Owner
  data:
  - secretKey: POSTGRES_PASSWORD
    remoteRef:
      key: ${AUTHENTIK_DATABASE_PASSWORD_REF}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: headscale-oidc
  namespace: identity
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: headscale-oidc
    creationPolicy: Owner
  data:
  - secretKey: client-secret
    remoteRef:
      key: ${HEADSCALE_OIDC_SECRET_REF}
