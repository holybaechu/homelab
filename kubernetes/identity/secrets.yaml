apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-env
  namespace: identity
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: authentik-env
    creationPolicy: Owner
  data:
  - secretKey: AUTHENTIK_SECRET_KEY
    remoteRef:
      key: homelab/authentik_secret_key
  - secretKey: AUTHENTIK_POSTGRESQL__PASSWORD
    remoteRef:
      key: homelab/authentik_database_password
  - secretKey: AUTHENTIK_BOOTSTRAP_EMAIL
    remoteRef:
      key: homelab/authentik_bootstrap_email
  - secretKey: AUTHENTIK_BOOTSTRAP_PASSWORD
    remoteRef:
      key: homelab/authentik_bootstrap_password
  - secretKey: HEADSCALE_OIDC_CLIENT_SECRET
    remoteRef:
      key: homelab/headscale_oidc_client_secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-postgresql
  namespace: identity
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: authentik-postgresql
    creationPolicy: Owner
  data:
  - secretKey: POSTGRES_PASSWORD
    remoteRef:
      key: homelab/authentik_database_password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: headscale-oidc
  namespace: identity
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: headscale-oidc
    creationPolicy: Owner
  data:
  - secretKey: client-secret
    remoteRef:
      key: homelab/headscale_oidc_client_secret
