apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: headscale
  namespace: identity
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: headscale
  namespace: identity
  annotations:
    secret.reloader.stakater.com/reload: headscale-oidc
    configmap.reloader.stakater.com/reload: headscale-config
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: headscale
  template:
    metadata:
      labels:
        app: headscale
    spec:
      automountServiceAccountToken: false
      hostAliases:
      - ip: ${NODE_IP}
        hostnames:
        - auth.${DOMAIN}
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
      containers:
      - name: headscale
        image: docker.io/headscale/headscale:v0.29.6
        args:
        - serve
        ports:
        - name: http
          containerPort: 8080
        volumeMounts:
        - name: config
          mountPath: /etc/headscale
          readOnly: true
        - name: data
          mountPath: /var/lib/headscale
        - name: run
          mountPath: /var/run/headscale
        - name: oidc
          mountPath: /var/run/secrets/headscale
          readOnly: true
        readinessProbe:
          httpGet:
            path: /health
            port: http
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
        startupProbe:
          httpGet:
            path: /health
            port: http
          failureThreshold: 120
          periodSeconds: 5
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      volumes:
      - name: config
        configMap:
          name: headscale-config
      - name: data
        persistentVolumeClaim:
          claimName: headscale
      - name: run
        emptyDir: {}
      - name: oidc
        secret:
          secretName: headscale-oidc
---
apiVersion: v1
kind: Service
metadata:
  name: headscale
  namespace: identity
spec:
  selector:
    app: headscale
  ports:
  - name: http
    port: 8080
    targetPort: http
