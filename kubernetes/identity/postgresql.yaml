apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: authentik-postgresql
  namespace: identity
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik-postgresql
  namespace: identity
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: authentik-postgresql
  template:
    metadata:
      labels:
        app: authentik-postgresql
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 999
      containers:
      - name: postgres
        image: docker.io/library/postgres:18.6-trixie
        args:
        - -c
        - max_connections=200
        env:
        - name: POSTGRES_USER
          value: authentik
        - name: POSTGRES_DB
          value: authentik
        - name: PGDATA
          value: /var/lib/postgresql/18/docker
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: authentik-postgresql
              key: POSTGRES_PASSWORD
        ports:
        - name: postgresql
          containerPort: 5432
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - authentik
            - -d
            - authentik
          periodSeconds: 10
        startupProbe:
          exec:
            command:
            - pg_isready
            - -U
            - authentik
            - -d
            - authentik
          failureThreshold: 60
          periodSeconds: 5
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: authentik-postgresql
---
apiVersion: v1
kind: Service
metadata:
  name: authentik-postgresql
  namespace: identity
spec:
  selector:
    app: authentik-postgresql
  ports:
  - name: postgresql
    port: 5432
    targetPort: postgresql
