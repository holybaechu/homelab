apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: authentik-server
  namespace: identity
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: Host(`auth.${DOMAIN}`)
    middlewares:
    - name: secure-headers
      namespace: traefik
    services:
    - name: authentik-server
      port: http
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: headscale
  namespace: identity
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: Host(`vpn.${DOMAIN}`)
    middlewares:
    - name: secure-headers
      namespace: traefik
    services:
    - name: headscale
      port: 8080
  tls: {}
