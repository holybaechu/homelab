version: 1
metadata:
  name: Homelab identity and application access
entries:
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: authentik Bootstrap
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: System - OAuth2 Provider - Scopes
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Provider authorization flow (implicit consent)
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Provider invalidation flow
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Authentication flow
      required: true
  - model: authentik_core.group
    identifiers:
      name: homelab-admins
    id: admins
  - model: authentik_core.group
    identifiers:
      name: metube-users
    id: metube-users
  - model: authentik_core.group
    identifiers:
      name: copyparty-users
    id: copyparty-users
  - model: authentik_core.group
    identifiers:
      name: copyparty-admins
    id: copyparty-admins
  - model: authentik_core.user
    identifiers:
      username: akadmin
    attrs:
      groups:
        - !Find [authentik_core.group, [is_superuser, true]]
        - !KeyOf admins
        - !KeyOf metube-users
        - !KeyOf copyparty-users
        - !KeyOf copyparty-admins
  - model: authentik_providers_oauth2.scopemapping
    identifiers:
      name: Homelab groups
    id: groups-scope
    attrs:
      scope_name: groups
      expression: |
        return {"groups": [group.name for group in request.user.groups.all()]}
  - model: authentik_providers_oauth2.oauth2provider
    identifiers:
      name: Headscale
    id: headscale-provider
    attrs:
      client_id: homelab-headscale
      client_secret: !Env HEADSCALE_OIDC_CLIENT_SECRET
      client_type: confidential
      grant_types:
        - authorization_code
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      redirect_uris:
        - matching_mode: strict
          url: https://headscale.${DOMAIN}/oidc/callback
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !KeyOf groups-scope
  - model: authentik_core.application
    identifiers:
      slug: headscale
    id: headscale-app
    attrs:
      name: Headscale
      provider: !KeyOf headscale-provider
      meta_launch_url: https://headscale.${DOMAIN}
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf headscale-app
      group: !KeyOf admins
      order: 0
  - model: authentik_providers_proxy.proxyprovider
    identifiers:
      name: MeTube
    id: metube-provider
    attrs:
      mode: forward_single
      external_host: https://metube.${DOMAIN}
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
  - model: authentik_core.application
    identifiers:
      slug: metube
    id: metube-app
    attrs:
      name: MeTube
      provider: !KeyOf metube-provider
      meta_launch_url: https://metube.${DOMAIN}
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf metube-app
      group: !KeyOf metube-users
      order: 0
  - model: authentik_providers_proxy.proxyprovider
    identifiers:
      name: Copyparty
    id: copyparty-provider
    attrs:
      mode: forward_single
      external_host: https://copyparty.${DOMAIN}
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
  - model: authentik_core.application
    identifiers:
      slug: copyparty
    id: copyparty-app
    attrs:
      name: Copyparty
      provider: !KeyOf copyparty-provider
      policy_engine_mode: any
      meta_launch_url: https://copyparty.${DOMAIN}
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf copyparty-app
      group: !KeyOf copyparty-users
      order: 0
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf copyparty-app
      group: !KeyOf copyparty-admins
      order: 1
  - model: authentik_outposts.outpost
    identifiers:
      managed: goauthentik.io/outposts/embedded
    attrs:
      providers:
        - !KeyOf metube-provider
        - !KeyOf copyparty-provider
      config:
        authentik_host: https://auth.${DOMAIN}
