version: 1
metadata:
  name: Homelab identity and application access
entries:
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: authentik Bootstrap
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: System - OAuth2 Provider - Scopes
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Provider authorization flow (implicit consent)
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Provider invalidation flow
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Authentication flow
      required: true
  # Rename existing objects in place before reconciling their new names.
  - model: authentik_core.group
    conditions:
      - !Find [authentik_core.group, [name, homelab-admins]]
    identifiers:
      pk: !Find [authentik_core.group, [name, homelab-admins]]
    attrs:
      name: Headscale Users
  - model: authentik_core.group
    conditions:
      - !Find [authentik_core.group, [name, metube-users]]
    identifiers:
      pk: !Find [authentik_core.group, [name, metube-users]]
    attrs:
      name: MeTube Users
  - model: authentik_core.group
    identifiers:
      name: Headscale Users
    id: headscale-users
  - model: authentik_core.group
    identifiers:
      name: MeTube Users
    id: metube-users
  - model: authentik_core.group
    identifiers:
      name: OpenCloud Users
    id: opencloud-users
  - model: authentik_core.group
    identifiers:
      name: OpenCloud Admins
    id: opencloud-admins
  - model: authentik_core.group
    identifiers:
      name: Zipline Users
    id: zipline-users
  - model: authentik_core.group
    identifiers:
      name: Shlink Users
    id: shlink-users
  - model: authentik_core.user
    identifiers:
      username: akadmin
    attrs:
      groups:
        - !Find [authentik_core.group, [is_superuser, true]]
  # Groups grant application entitlements; service access depends on those grants.
  - model: authentik_policies_expression.expressionpolicy
    identifiers:
      name: Homelab service access
    id: service-access-policy
    attrs:
      cache_timeout: 0
      expression: |
        return request.user.app_entitlements(request.obj).filter(name__in=["user", "admin"]).exists()
  - model: authentik_providers_oauth2.scopemapping
    identifiers:
      name: Homelab groups
    id: groups-scope
    attrs:
      scope_name: groups
      expression: |
        # Headscale consumes service roles through its groups claim.
        return {"groups": [entitlement.name for entitlement in request.user.app_entitlements(provider.application)]}
  - model: authentik_providers_oauth2.oauth2provider
    identifiers:
      name: Headscale
    id: headscale-provider
    attrs:
      client_id: homelab-headscale
      client_secret: !Env HEADSCALE_OIDC_CLIENT_SECRET
      client_type: confidential
      grant_types:
        - authorization_code
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      redirect_uris:
        - matching_mode: strict
          url: https://vpn.${DOMAIN}/oidc/callback
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !KeyOf groups-scope
  - model: authentik_core.application
    identifiers:
      slug: headscale
    id: headscale-app
    attrs:
      name: Headscale
      provider: !KeyOf headscale-provider
      meta_launch_url: https://vpn.${DOMAIN}
  - model: authentik_core.applicationentitlement
    identifiers:
      app: !KeyOf headscale-app
      name: user
    id: headscale-user-entitlement
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf headscale-user-entitlement
      group: !KeyOf headscale-users
      order: 0
  # Match application/order to replace the existing group binding in place.
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf headscale-app
      order: 0
    attrs:
      policy: !KeyOf service-access-policy
      group: null
      user: null
  - model: authentik_providers_proxy.proxyprovider
    identifiers:
      name: MeTube
    id: metube-provider
    attrs:
      mode: forward_single
      external_host: https://metube.${DOMAIN}
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
  - model: authentik_core.application
    identifiers:
      slug: metube
    id: metube-app
    attrs:
      name: MeTube
      provider: !KeyOf metube-provider
      meta_launch_url: https://metube.${DOMAIN}
  - model: authentik_core.applicationentitlement
    identifiers:
      app: !KeyOf metube-app
      name: user
    id: metube-user-entitlement
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf metube-user-entitlement
      group: !KeyOf metube-users
      order: 0
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf metube-app
      order: 0
    attrs:
      policy: !KeyOf service-access-policy
      group: null
      user: null
  - model: authentik_providers_oauth2.scopemapping
    identifiers:
      name: OpenCloud roles
    id: opencloud-roles-scope
    attrs:
      scope_name: opencloud_roles
      expression: |
        entitlements = {entitlement.name for entitlement in request.user.app_entitlements(provider.application)}
        if "admin" in entitlements:
            return {"roles": ["opencloudAdmin"]}
        if "user" in entitlements:
            return {"roles": ["opencloudUser"]}
        return {"roles": []}
  - model: authentik_providers_oauth2.oauth2provider
    identifiers:
      name: OpenCloud
    id: opencloud-provider
    attrs:
      client_id: homelab-opencloud
      client_type: public
      sub_mode: user_uuid
      grant_types:
        - authorization_code
        - refresh_token
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      redirect_uris:
        - matching_mode: strict
          url: https://cloud.${DOMAIN}/oidc-callback.html
        - matching_mode: strict
          url: https://cloud.${DOMAIN}/oidc-silent-redirect.html
        - matching_mode: strict
          url: https://cloud.${DOMAIN}/
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-offline_access]]
        - !KeyOf groups-scope
        - !KeyOf opencloud-roles-scope
  - model: authentik_core.application
    identifiers:
      slug: opencloud
    id: opencloud-app
    attrs:
      name: OpenCloud
      provider: !KeyOf opencloud-provider
      policy_engine_mode: any
      meta_launch_url: https://cloud.${DOMAIN}
  - model: authentik_core.applicationentitlement
    identifiers:
      app: !KeyOf opencloud-app
      name: user
    id: opencloud-user-entitlement
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf opencloud-user-entitlement
      group: !KeyOf opencloud-users
      order: 0
  - model: authentik_core.applicationentitlement
    identifiers:
      app: !KeyOf opencloud-app
      name: admin
    id: opencloud-admin-entitlement
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf opencloud-admin-entitlement
      group: !KeyOf opencloud-admins
      order: 0
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf opencloud-app
      order: 0
    attrs:
      policy: !KeyOf service-access-policy
      group: null
      user: null
  # Remove the old admin access binding so it cannot bypass entitlement checks.
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf opencloud-app
      group: !KeyOf opencloud-admins
      order: 1
    state: absent
  - model: authentik_providers_oauth2.oauth2provider
    identifiers:
      name: Zipline
    id: zipline-provider
    attrs:
      client_id: homelab-zipline
      client_secret: !Env ZIPLINE_OIDC_CLIENT_SECRET
      client_type: confidential
      sub_mode: user_uuid
      grant_types:
        - authorization_code
        - refresh_token
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      redirect_uris:
        - matching_mode: strict
          url: https://i.${DOMAIN}/api/auth/oauth/oidc
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-offline_access]]
  - model: authentik_core.application
    identifiers:
      slug: zipline
    id: zipline-app
    attrs:
      name: Zipline
      provider: !KeyOf zipline-provider
      meta_launch_url: https://i.${DOMAIN}
  - model: authentik_core.applicationentitlement
    identifiers:
      app: !KeyOf zipline-app
      name: user
    id: zipline-user-entitlement
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf zipline-user-entitlement
      group: !KeyOf zipline-users
      order: 0
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf zipline-app
      order: 0
    attrs:
      policy: !KeyOf service-access-policy
      group: null
      user: null
  - model: authentik_core.application
    identifiers:
      slug: kutt
    state: absent
  - model: authentik_providers_oauth2.oauth2provider
    identifiers:
      name: Kutt
    state: absent
  - model: authentik_providers_proxy.proxyprovider
    identifiers:
      name: Shlink
    id: shlink-provider
    attrs:
      mode: forward_single
      external_host: https://l.${DOMAIN}
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
  - model: authentik_core.application
    identifiers:
      slug: shlink
    id: shlink-app
    attrs:
      name: Shlink
      provider: !KeyOf shlink-provider
      meta_launch_url: https://l.${DOMAIN}
  - model: authentik_core.applicationentitlement
    identifiers:
      app: !KeyOf shlink-app
      name: user
    id: shlink-user-entitlement
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf shlink-user-entitlement
      group: !KeyOf shlink-users
      order: 0
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf shlink-app
      order: 0
    attrs:
      policy: !KeyOf service-access-policy
      group: null
      user: null
  - model: authentik_outposts.outpost
    identifiers:
      managed: goauthentik.io/outposts/embedded
    attrs:
      providers:
        - !KeyOf metube-provider
        - !KeyOf shlink-provider
      config:
        authentik_host: https://auth.${DOMAIN}
