apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: headscale-gateway
  namespace: networking
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: headscale-gateway
    creationPolicy: Owner
  data:
  - secretKey: authkey
    remoteRef:
      key: ${HEADSCALE_GATEWAY_KEY_REF}
