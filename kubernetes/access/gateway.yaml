apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: headscale-gateway
  namespace: networking
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: headscale-gateway
  namespace: networking
  annotations:
    secret.reloader.stakater.com/reload: headscale-gateway
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: headscale-gateway
  template:
    metadata:
      labels:
        app: headscale-gateway
    spec:
      automountServiceAccountToken: false
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      hostAliases:
      - ip: ${NODE_IP}
        hostnames:
        - headscale.${DOMAIN}
      containers:
      - name: tailscale
        image: ghcr.io/tailscale/tailscale:v1.104.2
        env:
        - name: TS_AUTHKEY
          valueFrom:
            secretKeyRef:
              name: headscale-gateway
              key: authkey
        - name: TS_AUTH_ONCE
          value: 'true'
        - name: TS_STATE_DIR
          value: /var/lib/tailscale
        - name: TS_KUBE_SECRET
          value: ''
        - name: TS_USERSPACE
          value: 'false'
        - name: TS_ACCEPT_DNS
          value: 'false'
        - name: TS_HOSTNAME
          value: homelab-gateway
        - name: TS_ROUTES
          value: ${LAN_CIDR}
        - name: TS_EXTRA_ARGS
          value: --login-server=https://headscale.${DOMAIN} --advertise-tags=tag:gateway --advertise-exit-node --accept-routes=false
        - name: TS_TAILSCALED_EXTRA_ARGS
          value: --port=41641
        - name: TS_ENABLE_HEALTH_CHECK
          value: 'true'
        - name: TS_LOCAL_ADDR_PORT
          value: 127.0.0.1:9002
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
            - NET_RAW
        volumeMounts:
        - name: data
          mountPath: /var/lib/tailscale
        - name: tun
          mountPath: /dev/net/tun
        readinessProbe:
          exec:
            command:
            - wget
            - -q
            - -O
            - /dev/null
            - http://127.0.0.1:9002/healthz
          periodSeconds: 10
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: headscale-gateway
      - name: tun
        hostPath:
          path: /dev/net/tun
          type: CharDevice
