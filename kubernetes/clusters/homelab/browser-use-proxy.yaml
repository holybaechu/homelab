apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: browser-use-proxy-runtime
  namespace: flux-system
spec:
  suspend: true
  dependsOn:
    - name: apps
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: homelab
  path: ./kubernetes/apps/browser-use-proxy/runtime
  prune: true
  deletionPolicy: Orphan
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
      - kind: ConfigMap
        name: onepassword-references
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: browser-use-proxy-public
  namespace: flux-system
spec:
  suspend: true
  dependsOn:
    - name: browser-use-proxy-runtime
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: homelab
  path: ./kubernetes/apps/browser-use-proxy/public
  prune: true
  deletionPolicy: Orphan
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
