apiVersion: v1
kind: Pod
metadata:
  name: talos-access-recovery-state
  namespace: networking
  labels:
    app: talos-access-recovery
spec:
  activeDeadlineSeconds: 1800
  restartPolicy: Never
  automountServiceAccountToken: false
  nodeSelector:
    node-role.kubernetes.io/control-plane: ""
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
    - key: node-role.kubernetes.io/master
      operator: Exists
      effect: NoSchedule
  securityContext:
    runAsUser: 65534
    runAsGroup: 65534
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  initContainers:
    - name: encrypt-saved-configuration
      image: alpine:3.23@sha256:ff7f0c727dd796aa36787bfcd9a64bf35a6ce72a73451b3359fde849b6703d63
      command:
        - /bin/sh
        - -c
        - |
          mkdir -p /mnt/state
          printf "Starting recovery\n" > /encrypted/status.txt
          if /bin/sh -ec '
            umask 077
            printf "Installing encryption tool\n" > /encrypted/status.txt
            apk add --no-cache openssl >/dev/null 2>&1
            trap "umount /mnt/state 2>/dev/null || true" EXIT
            printf "Reading saved configuration\n" > /encrypted/status.txt
            if [ -b /dev/talos-state ]; then
              mount -t xfs -o ro,norecovery,nouuid /dev/talos-state /mnt/state
              ln -s /mnt/state/config.yaml /tmp/source-config.yaml
            else
              exit 1
            fi
            test -s /tmp/source-config.yaml
            printf "Encrypting configuration\n" > /encrypted/status.txt
            openssl cms -encrypt -binary -aes-256-gcm \
              -in /tmp/source-config.yaml -outform DER \
              -out /encrypted/config.p7m.partial -recip /public/recovery.crt \
              -keyopt rsa_padding_mode:oaep -keyopt rsa_oaep_md:sha256
            test -s /encrypted/config.p7m.partial
            chmod 0444 /encrypted/config.p7m.partial
            mv /encrypted/config.p7m.partial /encrypted/config.p7m
          '; then
            printf "Encrypted export ready\n" > /encrypted/status.txt
          else
            printf "Recovery failed; status.txt identifies the last attempted phase.\n" > /encrypted/failure.txt
            chmod 0444 /encrypted/failure.txt
          fi
          chmod 0444 /encrypted/status.txt
      securityContext:
        privileged: true
        runAsUser: 0
        runAsGroup: 0
        runAsNonRoot: false
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 256Mi
      volumeMounts:
        - name: state-device
          mountPath: /dev/talos-state
          readOnly: true
        - name: recipient
          mountPath: /public
          readOnly: true
        - name: encrypted
          mountPath: /encrypted
  containers:
    - name: encrypted-download
      image: python:3.14-alpine@sha256:bc62fbcb684904b1bb81a6240041bb60e9c1ee19ddeaf17a6b4297e1cc9c95d2
      command: ["python", "-I", "-m", "http.server", "8080", "--bind", "0.0.0.0", "--directory", "/encrypted"]
      ports:
        - name: http
          containerPort: 8080
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      readinessProbe:
        httpGet:
          path: /status.txt
          port: http
        periodSeconds: 5
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 96Mi
      volumeMounts:
        - name: encrypted
          mountPath: /encrypted
          readOnly: true
  volumes:
    - name: state-device
      hostPath:
        path: /dev/disk/by-partlabel/STATE
        type: BlockDevice
    - name: recipient
      configMap:
        name: talos-access-recovery
        defaultMode: 0444
    - name: encrypted
      emptyDir:
        medium: Memory
        sizeLimit: 8Mi
---
apiVersion: v1
kind: Service
metadata:
  name: talos-access-recovery
  namespace: networking
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector:
    app: talos-access-recovery
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30443
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: talos-access-recovery
  namespace: networking
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`talos-recovery.hchu.me`)
      kind: Rule
      middlewares:
        - name: private-only
          namespace: traefik
      services:
        - name: talos-access-recovery
          port: 8080
  tls: {}
