homelab_domain: hchu.me
homelab_private_domain: home.hchu.me
homelab_lan_cidr: 192.168.0.0/24
homelab_tailscale_cidr: 100.64.0.0/10
homelab_timezone: Asia/Seoul

# The immutable Gateway and CTF image keep durable challenge material on the
# homelab data volume and consume it through the dedicated LXC's Docker daemon.
openclaw_ctf_shared_host_path: "{{ homelab_data_mount }}/openclaw-ctf"
openclaw_ctf_workspace_root: /var/lib/openclaw/workspaces/ctf
# Gateway and CTF containers deliberately share this numeric identity so the
# 0700 PVE bind mount stays writable without a world/group-writable directory.
openclaw_ctf_uid: 1000
openclaw_ctf_gid: 1000
openclaw_ctf_docker_network: openclaw-ctf
openclaw_ctf_docker_network_cidr: 172.30.0.0/24
openclaw_ctf_docker_bridge: occtfbr0

service_user: homelab
service_group: homelab
service_uid: 1000
service_gid: 1000

homelab_data_lv_name: homelab-data
homelab_data_lv_size: 896G
homelab_data_mount: /var/lib/homelab
homelab_data_device: "/dev/pve/{{ homelab_data_lv_name }}"
homelab_container_uid_offset: 100000
