docker_apps_compose_root: /opt/homelab-compose
docker_apps_data_root: /srv/homelab
docker_apps_timezone: "{{ homelab_timezone }}"
docker_apps_uid: "{{ service_uid }}"
docker_apps_gid: "{{ service_gid }}"

arcane_control_root: /opt/homelab-control/arcane
arcane_data_root: /srv/homelab/docker-apps/arcane/data
arcane_secret_root: "{{ arcane_control_root }}/secrets"
arcane_projects_root: "{{ docker_apps_compose_root }}"
arcane_uid: "{{ service_uid }}"
arcane_gid: "{{ service_gid }}"
arcane_hostname: arcane.home.hchu.me
arcane_app_url: "https://{{ arcane_hostname }}"
arcane_local_url: http://127.0.0.1:3552
arcane_health_url: "{{ arcane_local_url }}/api/health"
arcane_control_services:
  - arcane
  - docker-socket-proxy
arcane_repository_name: homelab
arcane_repository_url: https://github.com/holybaechu/homelab.git
arcane_repository_branch: arcane-deploy
arcane_ci_role_name: homelab-production-deployer
arcane_ci_credential_name: github-actions-prod
arcane_ci_oidc_issuer: https://token.actions.githubusercontent.com
arcane_ci_oidc_audience: "{{ arcane_app_url }}"
arcane_ci_oidc_subject: repo:holybaechu/homelab:environment:prod
arcane_gitops_projects:
  - name: platform
    compose_path: apps/compose/platform/compose.yml
  - name: media
    compose_path: apps/compose/media/compose.yml
  - name: code
    compose_path: apps/compose/code/compose.yml
arcane_retired_gitops_projects:
  - name: hermes
    compose_path: apps/compose/hermes/compose.yml

traefik_acme_email: holybaechu@proton.me
traefik_domain: hchu.me
traefik_private_domain: home.hchu.me
traefik_proxy_network: homelab_proxy
cloudflare_ddns_domains: home.hchu.me

adguard_admin_username: admin
adguard_admin_port: 3000
adguard_dns_port: 53
adguard_upstream_dns:
  - tls://1.1.1.1
  - tls://1.0.0.1
adguard_bootstrap_dns:
  - 1.1.1.1
  - 1.0.0.1
adguard_fallback_dns:
  - 1.1.1.1
  - 1.0.0.1
adguard_dns_filters:
  - enabled: true
    url: https://adguardteam.github.io/HostlistsRegistry/assets/filter_48.txt
    name: HaGeZi's Pro Blocklist
    id: 48

qbittorrent_webui_username: holybaechu
qbittorrent_direct_peer_port: 35435
qbittorrent_instances:
  - service_name: qbittorrent
    config_root: /srv/homelab/docker-apps/qbittorrent
    connection_interface: ""
    peer_port: 35435
copyparty_listen_port: 3923
t3code_hostname: code.home.hchu.me
t3code_data_root: /srv/homelab/docker-apps/t3code/home
t3code_workspace_root: /srv/homelab/workspaces

retired_docker_compose_projects:
  - name: backup
    dest: "{{ docker_apps_compose_root }}/backup"
  - name: game
    dest: "{{ docker_apps_compose_root }}/game"
  - name: hermes
    dest: "{{ docker_apps_compose_root }}/hermes"

retired_docker_images:
  - homelab/hermes-agent:local
  - qmcgaw/gluetun:v3.41.3

retired_docker_volumes:
  - homelab_gluetun_data

retired_docker_networks:
  - media_default

retired_docker_compose_services:
  - project: media
    service: gluetun
  - project: media
    service: qbittorrent-vpn

docker_compose_projects:
  - name: platform
    src: apps/compose/platform
    dest: "{{ docker_apps_compose_root }}/platform"
    env_template: platform.env.j2
    config_templates:
      - src: AdGuardHome.yaml.j2
        dest: adguard/AdGuardHome.yaml
        mode: "0600"
  - name: media
    src: apps/compose/media
    dest: "{{ docker_apps_compose_root }}/media"
    env_template: media.env.j2
    config_templates:
      - src: copyparty.conf.j2
        dest: copyparty.conf
        mode: "0600"
  - name: code
    src: apps/compose/code
    dest: "{{ docker_apps_compose_root }}/code"
    env_template: t3code.env.j2
