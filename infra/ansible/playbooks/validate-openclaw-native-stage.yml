---
- name: Validate the staged or recovered dedicated native OpenClaw host
  hosts: svc_openclaw
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Check dedicated OpenClaw LXC isolation
      ansible.builtin.shell: |
        set -eu
        test "$(hostname)" = openclaw
        test "$(id -u openclaw)" = "{{ openclaw_uid }}"
        test "$(id -g openclaw)" = "{{ openclaw_gid }}"
        test "$(getent passwd openclaw | cut -d: -f7)" = /usr/sbin/nologin
        test ! -S /var/run/docker.sock
        test -x /usr/bin/docker
        ! systemctl cat docker.service >/dev/null 2>&1
        ! systemctl cat containerd.service >/dev/null 2>&1
        test "$(stat -c '%u:%g %a' '{{ openclaw_ctf_workspace_root }}')" = "{{ openclaw_uid }}:{{ openclaw_gid }} 700"
        test "$(stat -c '%u:%g %a' '{{ openclaw_ctf_docker_client_key_path }}')" = "0:0 600"
        test "$(stat -c '%U:%G %a' '/etc/openclaw/trust')" = "root:{{ openclaw_group }} 750"
        test "$(stat -c '%U:%G %a' '{{ openclaw_ctf_docker_known_hosts_path }}')" = "root:{{ openclaw_group }} 640"
      args:
        executable: /bin/sh
      changed_when: false

    - name: Check native OpenClaw runtime and firewall staging
      ansible.builtin.shell: |
        set -eu
        test "$(stat -c '%u:%g %a' '{{ openclaw_runtime_root }}')" = "{{ openclaw_uid }}:{{ openclaw_gid }} 700"
        test "$(stat -c '%u:%g %a' '{{ openclaw_auth_profile_secret_root }}')" = "{{ openclaw_uid }}:{{ openclaw_gid }} 700"
        test "$(stat -c '%u:%g %a' '{{ openclaw_secret_root }}')" = "0:0 700"
        test "$(stat -c '%u:%g %a' '{{ openclaw_gateway_token_path }}')" = "0:0 600"
        test "$(wc -c < '{{ openclaw_gateway_token_path }}')" -eq 65
        grep -Eq '^[0-9a-fA-F]{64}$' '{{ openclaw_gateway_token_path }}'
        systemctl is-active --quiet nftables
        systemctl is-enabled --quiet nftables
        nft list chain inet filter input | grep -F 'ip saddr {{ openclaw_proxy_ip }} tcp dport {{ openclaw_gateway_port }} accept'
      args:
        executable: /bin/sh
      changed_when: false
      no_log: true

    - name: Check pinned native OpenClaw artifacts
      ansible.builtin.shell: |
        set -eu
        test "$({{ openclaw_node_release_root }}/bin/node --version)" = 'v{{ openclaw_node_version }}'
        package_version="$({{ openclaw_node_release_root }}/bin/node -p \
          "require('{{ openclaw_release_root }}/lib/node_modules/openclaw/package.json').version")"
        test "$package_version" = '{{ openclaw_version }}'
        test -x '{{ openclaw_release_root }}/bin/openclaw'
        test "$(env -i PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
          /usr/local/bin/openclaw --version)" = '{{ openclaw_cli_version_output }}'
      args:
        executable: /bin/sh
      changed_when: false

    - name: Inspect the native transition marker during narrow validation
      ansible.builtin.stat:
        path: "{{ openclaw_native_transition_marker_path }}"
        follow: false
      register: openclaw_native_stage_marker

    - name: Read the native transition marker during narrow validation
      ansible.builtin.slurp:
        src: "{{ openclaw_native_transition_marker_path }}"
      register: openclaw_native_stage_marker_content
      when: openclaw_native_stage_marker.stat.exists | default(false)
      no_log: true

    - name: Require an exact native transition marker during narrow validation
      ansible.builtin.assert:
        that:
          - openclaw_native_stage_marker.stat.isreg | default(false)
          - not (openclaw_native_stage_marker.stat.islnk | default(false))
          - openclaw_native_stage_marker.stat.uid == 0
          - openclaw_native_stage_marker.stat.gid == 0
          - openclaw_native_stage_marker.stat.mode == '0600'
          - (openclaw_native_stage_marker_content.content | b64decode) == openclaw_native_transition_marker_value + '\n'
        fail_msg: The native transition marker is malformed during narrow validation.
      when: openclaw_native_stage_marker.stat.exists | default(false)
      no_log: true

    - name: Check staged, recovered, or cut-over native service state
      ansible.builtin.shell: |
        set -eu
        {% if openclaw_native_stage_marker.stat.exists | default(false) %}
        systemctl is-enabled --quiet openclaw-gateway.service
        systemctl is-active --quiet openclaw-gateway.service
        curl -fsS 'http://{{ openclaw_bind_host }}:{{ openclaw_gateway_port }}/readyz' >/dev/null
        {% else %}
        test "$(systemctl is-enabled openclaw-gateway.service 2>/dev/null || true)" = disabled
        test "$(systemctl is-active openclaw-gateway.service 2>/dev/null || true)" = inactive
        listeners="$(ss -H -ltn 'sport = :{{ openclaw_gateway_port }}')"
        test -z "${listeners}"
        {% endif %}
      args:
        executable: /bin/sh
      changed_when: false

    - name: Check the staged or active native credential boundary
      ansible.builtin.shell: |
        set -eu
        credential=/run/openclaw-gateway/gateway_token
        discord_credential=/run/openclaw-gateway/discord_bot_token
        {% if openclaw_native_stage_marker.stat.exists | default(false) %}
        test -f "$credential"
        test ! -L "$credential"
        test "$(stat -c '%u:%g %a %h %s' "$credential")" = "{{ openclaw_uid }}:{{ openclaw_gid }} 400 1 65"
        grep -Eq '^[0-9a-fA-F]{64}$' "$credential"
        test -f "$discord_credential"
        test ! -L "$discord_credential"
        discord_metadata="$(stat -c '%u:%g %a %h %s' "$discord_credential")"
        case "$discord_metadata" in
          "{{ openclaw_uid }}:{{ openclaw_gid }} 400 1 "*) ;;
          *) exit 1 ;;
        esac
        discord_size="${discord_metadata##* }"
        case "$discord_size" in
          ''|*[!0-9]*) exit 1 ;;
        esac
        test "$discord_size" -ge 1
        test "$discord_size" -le 4097
        {% else %}
        test ! -e /run/openclaw-gateway
        test ! -L /run/openclaw-gateway
        {% endif %}
        test ! -e /run/openclaw-credential-probe
        test ! -e /run/systemd/system/openclaw-credential-probe.service
      args:
        executable: /bin/sh
      changed_when: false
      no_log: true

- name: Validate the narrow Traefik stage and retained Docker Gateway
  hosts: svc_docker_apps
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Inspect the Docker-host native cutover marker during narrow validation
      ansible.builtin.stat:
        path: "{{ openclaw_native_cutover_marker_path }}"
        follow: false
      register: openclaw_native_source_stage_marker

    - name: Read the Docker-host native cutover marker during narrow validation
      ansible.builtin.slurp:
        src: "{{ openclaw_native_cutover_marker_path }}"
      register: openclaw_native_source_stage_marker_content
      when: openclaw_native_source_stage_marker.stat.exists | default(false)
      no_log: true

    - name: Require an exact Docker-host cutover marker during narrow validation
      ansible.builtin.assert:
        that:
          - openclaw_native_source_stage_marker.stat.isreg | default(false)
          - not (openclaw_native_source_stage_marker.stat.islnk | default(false))
          - openclaw_native_source_stage_marker.stat.uid == 0
          - openclaw_native_source_stage_marker.stat.gid == 0
          - openclaw_native_source_stage_marker.stat.mode == '0600'
          - (openclaw_native_source_stage_marker_content.content | b64decode) == openclaw_native_transition_marker_value + '\n'
        fail_msg: The Docker-host cutover marker is malformed during narrow validation.
      when: openclaw_native_source_stage_marker.stat.exists | default(false)
      no_log: true

    - name: Read the staged OpenClaw Traefik route
      ansible.builtin.slurp:
        src: "{{ docker_apps_compose_root }}/platform/dynamic/routes.yml"
      register: openclaw_native_stage_routes

    - name: Validate the exact staged OpenClaw Traefik route
      ansible.builtin.assert:
        that:
          - openclaw_stage_dynamic.http.routers.openclaw.rule == 'Host(`openclaw.home.hchu.me`)'
          - openclaw_stage_dynamic.http.routers.openclaw.entryPoints == ['websecure']
          - openclaw_stage_dynamic.http.routers.openclaw.middlewares == ['private-only', 'secure-headers']
          - openclaw_stage_dynamic.http.routers.openclaw.service == 'openclaw'
          - >-
            openclaw_stage_dynamic.http.services.openclaw.loadBalancer.servers ==
            [{'url': openclaw_traefik_backend_url}]
          - not (openclaw_docker_rollback_activate | bool)
      vars:
        openclaw_stage_dynamic: >-
          {{ openclaw_native_stage_routes.content | b64decode | from_yaml }}

    - name: Resolve the staged OpenClaw hostname through AdGuard
      ansible.builtin.command:
        argv:
          - dig
          - +short
          - "@127.0.0.1"
          - "{{ openclaw_hostname }}"
          - A
      register: openclaw_native_stage_dns
      changed_when: false
      failed_when: docker_apps_ip not in openclaw_native_stage_dns.stdout_lines

    - name: Require Traefik to be running and healthy after the narrow stage
      ansible.builtin.shell: |
        set -eu
        container="$(docker compose ps -q traefik)"
        test -n "$container"
        test "$(docker inspect --format '{% raw %}{{.State.Status}}{% endraw %}' "$container")" = running
        test "$(docker inspect --format '{% raw %}{{.State.Health.Status}}{% endraw %}' "$container")" = healthy
      args:
        executable: /bin/sh
        chdir: "{{ docker_apps_compose_root }}/platform"
      changed_when: false

    - name: Validate the committed Traefik runtime contract checkpoint
      ansible.builtin.shell: |
        set -eu
        marker='{{ openclaw_traefik_runtime_contract_marker_path }}'
        test -f "$marker"
        test ! -L "$marker"
        test "$(stat -c '%u:%g %a' "$marker")" = '0:0 600'
        desired="$(sha256sum compose.yml traefik.yml | sha256sum | awk '{print $1}')"
        test "$(cat "$marker")" = "$desired"
      args:
        executable: /bin/sh
        chdir: "{{ docker_apps_compose_root }}/platform"
      changed_when: false

    - name: Check retained Docker or validated native Gateway state
      ansible.builtin.shell: |
        set -eu
        cd '{{ openclaw_compose_root }}'
        container="$(docker compose ps --all -q openclaw-gateway)"
        test -n "$container"
        {% if openclaw_native_source_stage_marker.stat.exists | default(false) %}
        test -z "$(docker compose ps --status running -q openclaw-gateway)"
        curl -fsS 'http://{{ openclaw_ip }}:{{ openclaw_gateway_port }}/readyz' >/dev/null
        {% else %}
        test -n "$(docker compose ps --status running -q openclaw-gateway)"
        test "$(docker inspect --format '{% raw %}{{.State.Health.Status}}{% endraw %}' "$container")" = healthy
        curl -fsS 'http://127.0.0.1:{{ openclaw_gateway_port }}/readyz' >/dev/null
        {% endif %}
      args:
        executable: /bin/sh
      changed_when: false

    - name: Check the certificate-valid staged or recovered HTTPS route
      ansible.builtin.command:
        argv:
          - curl
          - --silent
          - --show-error
          - --output
          - /dev/null
          - --write-out
          - "%{http_code}"
          - --resolve
          - "{{ openclaw_hostname }}:443:127.0.0.1"
          - "https://{{ openclaw_hostname }}/healthz"
      register: openclaw_native_stage_https
      changed_when: false
      failed_when: >-
        openclaw_native_stage_https.rc != 0 or
        openclaw_native_stage_https.stdout != (
          '200' if openclaw_native_source_stage_marker.stat.exists | default(false)
          else '502'
        )
      retries: 12
      delay: 5
      until: >-
        openclaw_native_stage_https.rc == 0 and
        openclaw_native_stage_https.stdout == (
          '200' if openclaw_native_source_stage_marker.stat.exists | default(false)
          else '502'
        )

    - name: Recheck existing certificate-valid Traefik routes
      ansible.builtin.command:
        argv:
          - curl
          - --fail
          - --silent
          - --show-error
          - --resolve
          - "{{ item }}:443:127.0.0.1"
          - "https://{{ item }}/"
      loop:
        - adguard.home.hchu.me
        - arcane.home.hchu.me
      register: openclaw_native_existing_routes
      changed_when: false
      retries: 12
      delay: 5
      until: openclaw_native_existing_routes.rc == 0
