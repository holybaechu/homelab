---
- name: Inspect whether the retained Gateway container exists before native-primary fencing
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - ps
      - --all
      - -q
      - openclaw-gateway
  args:
    chdir: "{{ openclaw_compose_root }}"
  register: openclaw_pre_site_retained_gateway_container
  changed_when: false
  when:
    - hostvars['openclaw'].openclaw_native_activate | bool
    - not (openclaw_docker_rollback_activate | bool)

- name: Inspect whether the retained Gateway is running before native-primary fencing
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - ps
      - --status
      - running
      - -q
      - openclaw-gateway
  args:
    chdir: "{{ openclaw_compose_root }}"
  register: openclaw_pre_site_retained_gateway_running
  changed_when: false
  when:
    - hostvars['openclaw'].openclaw_native_activate | bool
    - not (openclaw_docker_rollback_activate | bool)

- name: Require a pristine retained Gateway bootstrap boundary before recovery
  ansible.builtin.assert:
    that:
      - openclaw_native_primary_source_hold.stat.exists | default(false)
      - openclaw_native_primary_source_hold.stat.isreg | default(false)
      - not (openclaw_native_primary_source_hold.stat.islnk | default(false))
      - openclaw_native_primary_source_hold.stat.uid | default(-1) == 0
      - openclaw_native_primary_source_hold.stat.gid | default(-1) == 0
      - openclaw_native_primary_source_hold.stat.mode | default('') == '0600'
      - >-
        (openclaw_native_primary_source_hold_content.content | default('') | b64decode) ==
        openclaw_native_transition_marker_value + '\n'
      - not (openclaw_pre_site_retained_gateway_checkpoint.stat.exists | default(false))
      - not (openclaw_pre_site_retained_gateway_checkpoint.stat.islnk | default(false))
      - not (openclaw_pre_site_persistent_retained_gateway_verifier.stat.exists | default(false))
      - not (openclaw_pre_site_persistent_retained_gateway_verifier.stat.islnk | default(false))
    fail_msg: >-
      The retained Docker Gateway is absent after its identity bootstrap has
      begun or completed. Refusing to replace a checkpointed rollback source;
      restore its exact retained container through a separately reviewed
      recovery instead.
  when:
    - hostvars['openclaw'].openclaw_native_activate | bool
    - not (openclaw_docker_rollback_activate | bool)
    - openclaw_pre_site_retained_gateway_container.stdout | trim | length == 0
  no_log: true

- name: Preflight exact retained rollback assets before cold recovery
  ansible.builtin.command:
    argv:
      - "{{ openclaw_pre_site_retained_gateway_verifier.path }}"
      - preflight
      - --container-state
      - fenced
      - --config-state
      - foundation-or-rollback
      - --compose-root
      - "{{ openclaw_compose_root }}"
      - --setup-root
      - "{{ openclaw_setup_root }}"
      - --config
      - "{{ openclaw_config_path }}"
      - --runtime-root
      - "{{ openclaw_runtime_root }}"
      - --state-root
      - "{{ openclaw_state_root }}"
      - --auth-root
      - "{{ openclaw_auth_profile_secret_root }}"
      - --control-root
      - "{{ openclaw_control_root }}"
      - --token
      - "{{ openclaw_gateway_token_path }}"
      - --checkpoint
      - "{{ openclaw_retained_gateway_identity_path }}"
      - --expected-image
      - "{{ openclaw_retained_image_ref }}"
      - --hostname
      - "{{ openclaw_hostname }}"
      - --port
      - "{{ openclaw_gateway_port | string }}"
      - --uid
      - "{{ openclaw_uid | string }}"
      - --gid
      - "{{ openclaw_gid | string }}"
      - --require-expected-token
  args:
    stdin: "{{ openclaw_gateway_token | trim }}\n"
    stdin_add_newline: false
  register: openclaw_pre_site_retained_gateway_recovery_preflight
  changed_when: false
  retries: 3
  delay: 2
  until: openclaw_pre_site_retained_gateway_recovery_preflight.rc == 0
  no_log: true
  when:
    - hostvars['openclaw'].openclaw_native_activate | bool
    - not (openclaw_docker_rollback_activate | bool)
    - openclaw_pre_site_retained_gateway_container.stdout | trim | length == 0
    - not (openclaw_pre_site_retained_gateway_checkpoint.stat.exists | default(false))
    - not (openclaw_pre_site_retained_gateway_checkpoint.stat.islnk | default(false))
    - not (openclaw_pre_site_persistent_retained_gateway_verifier.stat.exists | default(false))
    - not (openclaw_pre_site_persistent_retained_gateway_verifier.stat.islnk | default(false))

- name: Create an absent retained Docker Gateway fenced for initial identity seeding
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - create
      - openclaw-gateway
  args:
    chdir: "{{ openclaw_compose_root }}"
  register: openclaw_pre_site_retained_gateway_create
  changed_when: >-
    'Created' in (
      openclaw_pre_site_retained_gateway_create.stdout ~
      openclaw_pre_site_retained_gateway_create.stderr
    )
  when:
    - hostvars['openclaw'].openclaw_native_activate | bool
    - not (openclaw_docker_rollback_activate | bool)
    - openclaw_native_primary_source_hold.stat.exists | default(false)
    - openclaw_native_primary_source_hold.stat.isreg | default(false)
    - not (openclaw_native_primary_source_hold.stat.islnk | default(false))
    - openclaw_native_primary_source_hold.stat.uid | default(-1) == 0
    - openclaw_native_primary_source_hold.stat.gid | default(-1) == 0
    - openclaw_native_primary_source_hold.stat.mode | default('') == '0600'
    - >-
      (openclaw_native_primary_source_hold_content.content | default('') | b64decode) ==
      openclaw_native_transition_marker_value + '\n'
    - openclaw_pre_site_retained_gateway_container.stdout | trim | length == 0
    - not (openclaw_pre_site_retained_gateway_checkpoint.stat.exists | default(false))
    - not (openclaw_pre_site_retained_gateway_checkpoint.stat.islnk | default(false))
    - not (openclaw_pre_site_persistent_retained_gateway_verifier.stat.exists | default(false))
    - not (openclaw_pre_site_persistent_retained_gateway_verifier.stat.islnk | default(false))

- name: Require a checkpoint-matching running rollback Gateway before stopping it
  ansible.builtin.command:
    argv:
      - "{{ openclaw_pre_site_retained_gateway_verifier.path }}"
      - require
      - --container-state
      - rollback
      - --config-state
      - rollback
      - --compose-root
      - "{{ openclaw_compose_root }}"
      - --setup-root
      - "{{ openclaw_setup_root }}"
      - --config
      - "{{ openclaw_config_path }}"
      - --runtime-root
      - "{{ openclaw_runtime_root }}"
      - --state-root
      - "{{ openclaw_state_root }}"
      - --auth-root
      - "{{ openclaw_auth_profile_secret_root }}"
      - --control-root
      - "{{ openclaw_control_root }}"
      - --token
      - "{{ openclaw_gateway_token_path }}"
      - --checkpoint
      - "{{ openclaw_retained_gateway_identity_path }}"
      - --expected-image
      - "{{ openclaw_retained_image_ref }}"
      - --hostname
      - "{{ openclaw_hostname }}"
      - --port
      - "{{ openclaw_gateway_port | string }}"
      - --uid
      - "{{ openclaw_uid | string }}"
      - --gid
      - "{{ openclaw_gid | string }}"
      - --require-expected-token
  args:
    stdin: "{{ openclaw_gateway_token | trim }}\n"
    stdin_add_newline: false
  register: openclaw_pre_site_running_rollback_contract
  changed_when: false
  retries: 3
  delay: 2
  until: openclaw_pre_site_running_rollback_contract.rc == 0
  no_log: true
  when:
    - hostvars['openclaw'].openclaw_native_activate | bool
    - not (openclaw_docker_rollback_activate | bool)
    - openclaw_pre_site_retained_gateway_running.stdout | trim | length > 0

- name: Stop the retained Docker Gateway before native-primary reconciliation
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - stop
      - --timeout
      - "30"
      - openclaw-gateway
  args:
    chdir: "{{ openclaw_compose_root }}"
  register: openclaw_native_primary_source_stop
  changed_when: true
  when:
    - hostvars['openclaw'].openclaw_native_activate | bool
    - not (openclaw_docker_rollback_activate | bool)
    - openclaw_pre_site_retained_gateway_running.stdout | trim | length > 0

- name: Prove the retained Docker Gateway is fenced before native starts
  ansible.builtin.shell: |
    set -eu
    container="$(docker compose ps --all -q openclaw-gateway)"
    test -n "$container"
    test -z "$(docker compose ps --status running -q openclaw-gateway)"
  args:
    executable: /bin/sh
    chdir: "{{ openclaw_compose_root }}"
  changed_when: false
  when:
    - hostvars['openclaw'].openclaw_native_activate | bool
    - not (openclaw_docker_rollback_activate | bool)

- name: Disconnect the stopped retained Gateway before checkpoint verification
  ansible.builtin.shell: |
    set -eu
    container="$(docker compose ps --all -q openclaw-gateway)"
    test -n "$container"
    if docker inspect --format '{% raw %}{{json .NetworkSettings.Networks}}{% endraw %}' "$container" |
        python3 -c 'import json, sys; raise SystemExit(0 if "homelab_proxy" in json.load(sys.stdin) else 1)'; then
      docker network disconnect -f homelab_proxy "$container"
      printf '%s\n' changed
    fi
  args:
    executable: /bin/sh
    chdir: "{{ openclaw_compose_root }}"
  register: openclaw_pre_site_retained_gateway_disconnect
  changed_when: "'changed' in openclaw_pre_site_retained_gateway_disconnect.stdout_lines"
  when:
    - hostvars['openclaw'].openclaw_native_activate | bool
    - not (openclaw_docker_rollback_activate | bool)

- name: Re-require the exact stopped Gateway after leaving rollback
  ansible.builtin.command:
    argv:
      - "{{ openclaw_pre_site_retained_gateway_verifier.path }}"
      - require
      - --container-state
      - fenced
      - --config-state
      - rollback
      - --compose-root
      - "{{ openclaw_compose_root }}"
      - --setup-root
      - "{{ openclaw_setup_root }}"
      - --config
      - "{{ openclaw_config_path }}"
      - --runtime-root
      - "{{ openclaw_runtime_root }}"
      - --state-root
      - "{{ openclaw_state_root }}"
      - --auth-root
      - "{{ openclaw_auth_profile_secret_root }}"
      - --control-root
      - "{{ openclaw_control_root }}"
      - --token
      - "{{ openclaw_gateway_token_path }}"
      - --checkpoint
      - "{{ openclaw_retained_gateway_identity_path }}"
      - --expected-image
      - "{{ openclaw_retained_image_ref }}"
      - --hostname
      - "{{ openclaw_hostname }}"
      - --port
      - "{{ openclaw_gateway_port | string }}"
      - --uid
      - "{{ openclaw_uid | string }}"
      - --gid
      - "{{ openclaw_gid | string }}"
      - --require-expected-token
  args:
    stdin: "{{ openclaw_gateway_token | trim }}\n"
    stdin_add_newline: false
  register: openclaw_pre_site_stopped_rollback_contract
  changed_when: false
  retries: 3
  delay: 2
  until: openclaw_pre_site_stopped_rollback_contract.rc == 0
  no_log: true
  when:
    - hostvars['openclaw'].openclaw_native_activate | bool
    - not (openclaw_docker_rollback_activate | bool)
    - openclaw_pre_site_retained_gateway_running.stdout | trim | length > 0

- name: Bootstrap the stopped retained identity checkpoint once or require it thereafter
  ansible.builtin.command:
    argv:
      - "{{ openclaw_pre_site_retained_gateway_verifier.path }}"
      - >-
        {{
          'seed'
          if (
            not (openclaw_pre_site_retained_gateway_checkpoint.stat.exists | default(false))
            and not (openclaw_pre_site_retained_gateway_checkpoint.stat.islnk | default(false))
            and not (openclaw_pre_site_persistent_retained_gateway_verifier.stat.exists | default(false))
            and not (openclaw_pre_site_persistent_retained_gateway_verifier.stat.islnk | default(false))
          )
          else 'require'
        }}
      - --container-state
      - fenced
      - --config-state
      - foundation-or-rollback
      - --compose-root
      - "{{ openclaw_compose_root }}"
      - --setup-root
      - "{{ openclaw_setup_root }}"
      - --config
      - "{{ openclaw_config_path }}"
      - --runtime-root
      - "{{ openclaw_runtime_root }}"
      - --state-root
      - "{{ openclaw_state_root }}"
      - --auth-root
      - "{{ openclaw_auth_profile_secret_root }}"
      - --control-root
      - "{{ openclaw_control_root }}"
      - --token
      - "{{ openclaw_gateway_token_path }}"
      - --checkpoint
      - "{{ openclaw_retained_gateway_identity_path }}"
      - --expected-image
      - "{{ openclaw_retained_image_ref }}"
      - --hostname
      - "{{ openclaw_hostname }}"
      - --port
      - "{{ openclaw_gateway_port | string }}"
      - --uid
      - "{{ openclaw_uid | string }}"
      - --gid
      - "{{ openclaw_gid | string }}"
      - --require-expected-token
  args:
    stdin: "{{ openclaw_gateway_token | trim }}\n"
    stdin_add_newline: false
  register: openclaw_pre_site_retained_gateway_checkpoint_proof
  changed_when: "'changed=true' in openclaw_pre_site_retained_gateway_checkpoint_proof.stdout_lines"
  retries: 3
  delay: 2
  until: openclaw_pre_site_retained_gateway_checkpoint_proof.rc == 0
  no_log: true
  when:
    - hostvars['openclaw'].openclaw_native_activate | bool
    - not (openclaw_docker_rollback_activate | bool)
    - openclaw_pre_site_retained_gateway_running.stdout | trim | length == 0

- name: Require the exact retained identity checkpoint before tracked rollback
  ansible.builtin.command:
    argv:
      - "{{ openclaw_pre_site_retained_gateway_verifier.path }}"
      - require
      - --container-state
      - rollback
      - --config-state
      - rollback
      - --compose-root
      - "{{ openclaw_compose_root }}"
      - --setup-root
      - "{{ openclaw_setup_root }}"
      - --config
      - "{{ openclaw_config_path }}"
      - --runtime-root
      - "{{ openclaw_runtime_root }}"
      - --state-root
      - "{{ openclaw_state_root }}"
      - --auth-root
      - "{{ openclaw_auth_profile_secret_root }}"
      - --control-root
      - "{{ openclaw_control_root }}"
      - --token
      - "{{ openclaw_gateway_token_path }}"
      - --checkpoint
      - "{{ openclaw_retained_gateway_identity_path }}"
      - --expected-image
      - "{{ openclaw_retained_image_ref }}"
      - --hostname
      - "{{ openclaw_hostname }}"
      - --port
      - "{{ openclaw_gateway_port | string }}"
      - --uid
      - "{{ openclaw_uid | string }}"
      - --gid
      - "{{ openclaw_gid | string }}"
      - --require-expected-token
  args:
    stdin: "{{ openclaw_gateway_token | trim }}\n"
    stdin_add_newline: false
  register: openclaw_pre_site_rollback_contract
  changed_when: false
  retries: 3
  delay: 2
  until: openclaw_pre_site_rollback_contract.rc == 0
  no_log: true
  when: openclaw_docker_rollback_activate | bool
