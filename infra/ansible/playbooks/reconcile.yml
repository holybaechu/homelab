---
- name: Select one homelab deployment unit
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Require one explicit deployment unit
      ansible.builtin.assert:
        that:
          - homelab_unit is defined
          - homelab_unit in ['pve', 'tailnet', 'apps-host']
          - >-
            not (homelab_pve_access_only | default(false) | bool)
            or (homelab_unit == 'pve' and pve_lxc_reconcile_mode | default('apply') == 'apply')
          - >-
            not (homelab_pve_identity_only | default(false) | bool)
            or (homelab_unit == 'pve' and pve_lxc_reconcile_mode | default('apply') == 'apply'
                and not (homelab_pve_access_only | default(false) | bool))
        fail_msg: >-
          Pass -e homelab_unit=pve|tailnet|apps-host. There is no
          implicit whole-homelab reconciliation.
          Access-only reconciliation requires homelab_unit=pve and pve_lxc_reconcile_mode=apply.

- name: Reconcile the selected homelab deployment unit
  hosts: >-
    {{ {
      'pve': 'pve_hosts',
      'tailnet': 'svc_tailnet',
      'apps-host': 'svc_docker_apps'
    }.get(homelab_unit | default(''), 'localhost') }}
  gather_facts: "{{ homelab_unit != 'pve' }}"
  any_errors_fatal: true
  pre_tasks:
    - name: Require a controller-side bundle path for secret-bearing units
      ansible.builtin.assert:
        that:
          - homelab_secret_bundle is defined
          - homelab_secret_bundle | string | length > 0
        fail_msg: Pass -e homelab_secret_bundle=/absolute/path/to/component.json.
      when: >-
        homelab_unit == 'tailnet'
        or (homelab_unit == 'pve'
            and pve_lxc_reconcile_mode | default('apply') == 'apply')

    - name: Load the unit secret bundle on the controller
      ansible.builtin.set_fact:
        homelab_loaded_secret_bundle: >-
          {{ lookup('ansible.builtin.file', homelab_secret_bundle) | from_json }}
      when: >-
        homelab_unit == 'tailnet'
        or (homelab_unit == 'pve'
            and pve_lxc_reconcile_mode | default('apply') == 'apply')
      no_log: true

    - name: Require the versioned unit secret-bundle contract
      ansible.builtin.assert:
        that:
          - homelab_secret_bundle is defined
          - homelab_loaded_secret_bundle.version | type_debug == 'int'
          - >-
            homelab_loaded_secret_bundle.version == 1
            or (homelab_unit == 'tailnet' and homelab_loaded_secret_bundle.version == 2)
            or (homelab_unit == 'pve' and homelab_loaded_secret_bundle.version == 2)
          - homelab_loaded_secret_bundle.component == homelab_unit
          - homelab_loaded_secret_bundle['values'] is mapping
          - >-
            homelab_loaded_secret_bundle.keys() | list | sort
            == ['component', 'values', 'version']
        fail_msg: >-
          The selected unit requires a controller-side JSON bundle with
          its exact component name and a values object. PVE uses version=1 or 2;
          tailnet uses version=1 for hosted Tailscale or version=2 for Headscale.
      when: >-
        homelab_unit == 'tailnet'
        or (homelab_unit == 'pve'
            and pve_lxc_reconcile_mode | default('apply') == 'apply')
      no_log: true

    - name: Require the exact PVE component secret fields
      ansible.builtin.assert:
        that:
          - >-
            homelab_loaded_secret_bundle['values'].keys() | list | sort
            == (['deploy_ssh_public_keys'] if homelab_loaded_secret_bundle.version == 1
                else ['deploy_ssh_public_keys', 'proxmox_oidc_client_secret'])
          - homelab_loaded_secret_bundle['values'].deploy_ssh_public_keys is sequence
          - homelab_loaded_secret_bundle['values'].deploy_ssh_public_keys is not string
          - homelab_loaded_secret_bundle['values'].deploy_ssh_public_keys | length > 0
          - >-
            homelab_loaded_secret_bundle['values'].deploy_ssh_public_keys
            | select('string') | list | length
            == homelab_loaded_secret_bundle['values'].deploy_ssh_public_keys | length
          - >-
            homelab_loaded_secret_bundle['values'].deploy_ssh_public_keys
            | select(
              'match',
                '^(?:ssh-ed25519|ecdsa-sha2-nistp256|rsa-sha2-512) (?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{4}|[A-Za-z0-9+/]{3}=|[A-Za-z0-9+/]{2}==)\Z'
              )
            | list | length
            == homelab_loaded_secret_bundle['values'].deploy_ssh_public_keys | length
        fail_msg: >-
          The PVE bundle must contain only normalized, single-line deployment
          public keys using an allowed algorithm and base64 key body.
      when:
        - homelab_unit == 'pve'
        - pve_lxc_reconcile_mode | default('apply') == 'apply'
      no_log: true

    - name: Validate the PVE identity component credential before mutation
      ansible.builtin.assert:
        that:
          - homelab_loaded_secret_bundle.version == 2
          - homelab_loaded_secret_bundle['values'].proxmox_oidc_client_secret is string
          - homelab_loaded_secret_bundle['values'].proxmox_oidc_client_secret is match('^[a-f0-9]{64}\Z')
        fail_msg: PVE identity reconciliation requires its version-2 component bundle.
      when:
        - homelab_unit == 'pve'
        - pve_lxc_reconcile_mode | default('apply') == 'apply'
        - homelab_pve_identity_only | default(false) | bool
      no_log: true

    - name: Require the exact tailnet component secret fields
      ansible.builtin.assert:
        that:
          - >-
            homelab_loaded_secret_bundle['values'].keys() | list | sort
            == ['tailscale_auth_key']
          - homelab_loaded_secret_bundle['values'].tailscale_auth_key is string
          - >-
            homelab_loaded_secret_bundle['values'].tailscale_auth_key
            is match('^tskey-auth-[A-Za-z0-9]+(?:-[A-Za-z0-9]+)*\Z')
        fail_msg: >-
          The tailnet bundle must contain only one normalized, single-line
          tskey-auth-* authentication key.
      when: homelab_unit == 'tailnet' and homelab_loaded_secret_bundle.version == 1
      no_log: true

    - name: Require the exact Headscale gateway component secret fields
      ansible.builtin.assert:
        that:
          - >-
            homelab_loaded_secret_bundle['values'].keys() | list | sort
            == ['auth_key', 'login_server']
          - homelab_loaded_secret_bundle['values'].auth_key is string
          - >-
            homelab_loaded_secret_bundle['values'].auth_key
            is match('^[A-Za-z0-9._-]{16,256}\\Z')
          - homelab_loaded_secret_bundle['values'].login_server == 'https://headscale.home.hchu.me'
        fail_msg: The Headscale gateway bundle requires a single-line auth key and its HTTPS login server.
      when: homelab_unit == 'tailnet' and homelab_loaded_secret_bundle.version == 2
      no_log: true

    - name: Bind PVE access public keys from the component bundle
      ansible.builtin.set_fact:
        deploy_ssh_public_keys: >-
          {{ homelab_loaded_secret_bundle['values'].deploy_ssh_public_keys }}
      when:
        - homelab_unit == 'pve'
        - pve_lxc_reconcile_mode | default('apply') == 'apply'
      no_log: true

    - name: Bind the Tailscale auth key from the component bundle
      ansible.builtin.set_fact:
        tailscale_auth_key: >-
          {{ homelab_loaded_secret_bundle['values'].tailscale_auth_key
             if homelab_loaded_secret_bundle.version == 1
             else homelab_loaded_secret_bundle['values'].auth_key }}
        tailscale_login_server: >-
          {{ 'https://controlplane.tailscale.com'
             if homelab_loaded_secret_bundle.version == 1
             else homelab_loaded_secret_bundle['values'].login_server }}
      when: homelab_unit == 'tailnet'
      no_log: true

  tasks:
    - name: Preflight the complete PVE LXC apply before any unit mutation
      ansible.builtin.include_role:
        name: pve_lxc_reconcile
      vars:
        pve_lxc_reconcile_preflight_only: true
      when:
        - homelab_unit == 'pve'
        - pve_lxc_reconcile_mode | default('apply') == 'apply'
        - not (homelab_pve_identity_only | default(false) | bool)

    - name: Reconcile PVE durable storage
      ansible.builtin.include_role:
        name: pve_homelab_storage
      when:
        - homelab_unit == 'pve'
        - pve_lxc_reconcile_mode | default('apply') == 'apply'
        - not (homelab_pve_access_only | default(false) | bool)
        - not (homelab_pve_identity_only | default(false) | bool)

    - name: Reconcile the two PVE LXC definitions
      ansible.builtin.include_role:
        name: pve_lxc_reconcile
      vars:
        pve_lxc_reconcile_preflight_only: false
      when:
        - homelab_unit == 'pve'
        - not (homelab_pve_access_only | default(false) | bool)
        - not (homelab_pve_identity_only | default(false) | bool)

    - name: Reconcile LXC SSH and Python access through pct
      ansible.builtin.include_role:
        name: pve_lxc_access
      when:
        - homelab_unit == 'pve'
        - pve_lxc_reconcile_mode | default('apply') == 'apply'
        - not (homelab_pve_identity_only | default(false) | bool)

    - name: Reconcile PVE identity without replacing local authentication
      ansible.builtin.include_role:
        name: pve_identity
      when:
        - homelab_unit == 'pve'
        - pve_lxc_reconcile_mode | default('apply') == 'apply'
        - homelab_pve_identity_only | default(false) | bool

    - name: Reconcile the Debian base
      ansible.builtin.include_role:
        name: common_debian
      when: homelab_unit != 'pve'

    - name: Reconcile the tailnet host
      ansible.builtin.include_role:
        name: tailscale_gateway
      when: homelab_unit == 'tailnet'

    - name: Prepare the Docker application host
      ansible.builtin.include_role:
        name: docker_apps_host
      when: homelab_unit == 'apps-host'

    - name: Check whether targeted maintenance requires a reboot
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: homelab_unit_reboot_required
      when:
        - homelab_unit != 'pve'
        - homelab_maintenance_upgrade | default(false) | bool

    - name: Reboot the selected unit after targeted maintenance
      ansible.builtin.reboot:
        connect_timeout: 5
        reboot_timeout: 600
      when:
        - homelab_unit != 'pve'
        - homelab_maintenance_upgrade | default(false) | bool
        - homelab_unit_reboot_required.stat.exists

    - name: Read application health after host maintenance
      ansible.builtin.command:
        argv: [docker, compose, --project-name, homelab, -f, /opt/homelab/compose/compose.yml, ps, --format, json, --all]
      register: homelab_apps_health
      changed_when: false
      when:
        - homelab_unit == 'apps-host'
        - homelab_maintenance_upgrade | default(false) | bool

    - name: Require running healthy application containers
      ansible.builtin.assert:
        that:
          - item.State == 'running'
          - item.Health | default('') in ['', 'healthy']
        fail_msg: A homelab container is not healthy after maintenance.
      loop: "{{ homelab_apps_health.stdout_lines | default([]) | map('from_json') | list }}"
      loop_control:
        label: "{{ item.Service }}"
      when:
        - homelab_unit == 'apps-host'
        - homelab_maintenance_upgrade | default(false) | bool

    - name: Read tailnet health after host maintenance
      ansible.builtin.command:
        argv: [tailscale, status, --json]
      register: homelab_tailnet_maintenance_status
      changed_when: false
      when:
        - homelab_unit == 'tailnet'
        - homelab_maintenance_upgrade | default(false) | bool

    - name: Require a running tailnet after host maintenance
      ansible.builtin.assert:
        that:
          - >-
            (homelab_tailnet_maintenance_status.stdout | from_json).BackendState
            == 'Running'
        fail_msg: Tailscale is not running after targeted maintenance.
      when:
        - homelab_unit == 'tailnet'
        - homelab_maintenance_upgrade | default(false) | bool
