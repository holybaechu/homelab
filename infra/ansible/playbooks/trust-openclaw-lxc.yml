---
- name: Trust the current OpenClaw LXC SSH host key
  hosts: pve_hosts
  gather_facts: false
  vars:
    openclaw_bootstrap_targets: >-
      {{ pve_lxc_access_bootstrap |
      selectattr('name', 'equalto', 'openclaw') | list }}
  tasks:
    - name: Require exactly one declared OpenClaw bootstrap target
      ansible.builtin.assert:
        that:
          - openclaw_bootstrap_targets | length == 1

    - name: Read the OpenClaw ed25519 host public key through pct exec
      ansible.builtin.command:
        argv:
          - pct
          - exec
          - "{{ openclaw_bootstrap_targets[0].vmid }}"
          - --
          - /bin/sh
          - -lc
          - cat /etc/ssh/ssh_host_ed25519_key.pub
      changed_when: false
      register: openclaw_lxc_host_key

    - name: Add the current OpenClaw SSH host key to runner known_hosts
      ansible.builtin.known_hosts:
        path: "{{ lookup('env', 'HOME') }}/.ssh/known_hosts"
        name: "{{ hostvars['openclaw'].ansible_host }}"
        key: "{{ hostvars['openclaw'].ansible_host }} {{ openclaw_lxc_host_key.stdout }}"
      delegate_to: localhost

    - name: Wait for the OpenClaw SSH port
      ansible.builtin.wait_for:
        host: "{{ hostvars['openclaw'].ansible_host }}"
        port: 22
        state: started
        connect_timeout: 5
        timeout: 60
      delegate_to: localhost

