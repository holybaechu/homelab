---
- name: Trust the current OpenClaw LXC SSH host key
  hosts: pve_hosts
  gather_facts: false
  vars:
    openclaw_vmid: "{{ hostvars['openclaw'].vmid }}"
    openclaw_host: "{{ hostvars['openclaw'].ansible_host }}"
  tasks:
    - name: Require the topology-owned OpenClaw target
      ansible.builtin.assert:
        that:
          - openclaw_vmid | int > 0
          - openclaw_host | length > 0

    - name: Read the OpenClaw ed25519 host public key through pct exec
      ansible.builtin.command:
        argv:
          - pct
          - exec
          - "{{ openclaw_vmid }}"
          - --
          - /bin/sh
          - -lc
          - cat /etc/ssh/ssh_host_ed25519_key.pub
      changed_when: false
      register: openclaw_lxc_host_key

    - name: Add the current OpenClaw SSH host key to runner known_hosts
      ansible.builtin.known_hosts:
        path: "{{ lookup('env', 'HOME') }}/.ssh/known_hosts"
        name: "{{ openclaw_host }}"
        key: "{{ openclaw_host }} {{ openclaw_lxc_host_key.stdout }}"
      delegate_to: localhost

    - name: Wait for the OpenClaw SSH port
      ansible.builtin.wait_for:
        host: "{{ openclaw_host }}"
        port: 22
        state: started
        connect_timeout: 5
        timeout: 60
      delegate_to: localhost
