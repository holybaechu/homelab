---
- name: Maintain the Docker application LXC
  hosts: svc_docker_apps
  gather_facts: true
  any_errors_fatal: true
  vars:
    homelab_maintenance_upgrade: true
  roles:
    - common_debian
    - docker_engine
  post_tasks:
    - name: Check whether Docker application maintenance requires a reboot
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: docker_apps_reboot_required

    - name: Reboot the Docker application LXC when required
      ansible.builtin.reboot:
        connect_timeout: 5
        reboot_timeout: 600
      when: docker_apps_reboot_required.stat.exists

- name: Maintain the dedicated immutable OpenClaw LXC base
  hosts: svc_openclaw
  gather_facts: true
  any_errors_fatal: true
  vars:
    homelab_maintenance_upgrade: true
  roles:
    - common_debian
  post_tasks:
    - name: Check whether OpenClaw base maintenance requires a reboot
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: openclaw_reboot_required

    - name: Reboot the OpenClaw LXC when required
      ansible.builtin.reboot:
        connect_timeout: 5
        reboot_timeout: 600
      when: openclaw_reboot_required.stat.exists

- name: Maintain the tailnet LXC after dependent hosts
  hosts: svc_tailnet
  gather_facts: true
  any_errors_fatal: true
  vars:
    homelab_maintenance_upgrade: true
  roles:
    - common_debian
    - tailscale_gateway
  post_tasks:
    - name: Wait for SSH through a scheduled tailscaled restart
      ansible.builtin.wait_for_connection:
        delay: 10
        connect_timeout: 5
        sleep: 5
        timeout: 180
      when: tailscale_restart_scheduled | default(false)

    - name: Wait for the scheduled tailscaled restart proof
      ansible.builtin.shell: |
        set -eu
        test "$(cat /run/homelab-tailscale-restart.completed)" = "{{ tailscale_restart_id }}"
      args:
        executable: /bin/sh
      register: tailscale_maintenance_restart_completion
      changed_when: false
      retries: 36
      delay: 5
      until: tailscale_maintenance_restart_completion.rc == 0
      when: tailscale_restart_scheduled | default(false)

    - name: Verify the scheduled tailscaled restart succeeded
      ansible.builtin.command:
        argv:
          - systemctl
          - show
          - --property=Result
          - --value
          - tailscaled-ansible-restart.service
      register: tailscale_maintenance_restart_result
      changed_when: false
      failed_when: tailscale_maintenance_restart_result.stdout != "success"
      when: tailscale_restart_scheduled | default(false)

    - name: Verify tailscaled uses the installed binary after maintenance
      ansible.builtin.shell: |
        set -eu
        pid="$(systemctl show --property MainPID --value tailscaled)"
        test "${pid}" -gt 0
        test "$(readlink "/proc/${pid}/exe")" = /usr/sbin/tailscaled
      args:
        executable: /bin/sh
      changed_when: false
      when: tailscale_restart_scheduled | default(false)

    - name: Check whether tailnet maintenance requires a reboot
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: tailnet_reboot_required

    - name: Reboot the tailnet LXC when required
      ansible.builtin.reboot:
        connect_timeout: 5
        reboot_timeout: 600
      when: tailnet_reboot_required.stat.exists
