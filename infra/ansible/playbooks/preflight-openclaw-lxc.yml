---
- name: Preflight the dedicated OpenClaw LXC allocation
  hosts: pve_hosts
  gather_facts: false
  tasks:
    - name: Prove the OpenClaw VMID, IP, and MAC allocation is safe
      ansible.builtin.script:
        cmd: >-
          {{ playbook_dir }}/../../../scripts/ci/preflight-openclaw-lxc.py
          --vmid {{ openclaw_lxc_allocation.vmid }}
          --hostname {{ openclaw_lxc_allocation.hostname | quote }}
          --ip-address {{ openclaw_lxc_allocation.ip_address | quote }}
          --mac-address {{ openclaw_lxc_allocation.mac_address | quote }}
          --datastore-id {{ openclaw_lxc_allocation.datastore_id | quote }}
          --required-storage-gb {{ openclaw_lxc_allocation.required_storage_gb }}
          --required-feature nesting
          --required-feature keyctl
          --expected-bind-mount {{ (openclaw_ctf_shared_host_path + ',mp=' + openclaw_ctf_workspace_root) | quote }}
          --transitional-bind-mount {{ (openclaw_ctf_shared_host_path + ',mp=' + openclaw_ctf_workspace_root) | quote }}
          --transitional-bind-mount {{ (homelab_data_mount + '/openclaw-ctf-sandbox-skills,mp=' + openclaw_ctf_sandbox_skills_root) | quote }}
        executable: /usr/bin/python3
      changed_when: false
