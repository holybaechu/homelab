---
- name: Preflight the dedicated OpenClaw LXC allocation
  hosts: pve_hosts
  gather_facts: false
  tasks:
    - name: Prove the OpenClaw VMID, IP, and MAC allocation is safe
      ansible.builtin.script:
        cmd: >-
          {{ playbook_dir }}/../../../scripts/ci/preflight-openclaw-lxc.py
          --vmid {{ hostvars['openclaw'].vmid }}
          --hostname {{ hostvars['openclaw'].hostname | quote }}
          --ip-address {{ (hostvars['openclaw'].ansible_host + '/' + (hostvars['openclaw'].prefix_length | string)) | quote }}
          --mac-address {{ hostvars['openclaw'].mac_address | quote }}
          --datastore-id {{ lookup('env', 'PVE_ROOT_DATASTORE_ID') | default('local-lvm', true) | quote }}
          --required-storage-gb {{ hostvars['openclaw'].root_disk_gb }}
          --required-feature nesting
          --required-feature keyctl
          --expected-bind-mount {{ (openclaw_ctf_shared_host_path + ',mp=' + openclaw_ctf_workspace_root) | quote }}
        executable: /usr/bin/python3
      changed_when: false
