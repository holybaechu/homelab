---
- name: Preflight the isolated CTF executor LXC allocation
  hosts: pve_hosts
  gather_facts: false
  tasks:
    - name: Prove the CTF executor VMID, IP, and MAC allocation is safe
      ansible.builtin.script:
        cmd: >-
          {{ playbook_dir }}/../../../scripts/ci/preflight-openclaw-lxc.py
          --vmid {{ ctf_executor_lxc_allocation.vmid }}
          --hostname {{ ctf_executor_lxc_allocation.hostname | quote }}
          --ip-address {{ ctf_executor_lxc_allocation.ip_address | quote }}
          --mac-address {{ ctf_executor_lxc_allocation.mac_address | quote }}
          --datastore-id {{ ctf_executor_lxc_allocation.datastore_id | quote }}
          --required-storage-gb {{ ctf_executor_lxc_allocation.required_storage_gb }}
          --role-tag role-ctf-executor
          --required-feature nesting
          --required-feature keyctl
          --expected-bind-mount {{ (openclaw_ctf_shared_host_path + ',mp=' + openclaw_ctf_workspace_root) | quote }}
          --expected-bind-mount {{ (openclaw_ctf_sandbox_skills_host_path + ',mp=' + openclaw_ctf_sandbox_skills_root) | quote }}
          --transitional-bind-mount {{ (openclaw_ctf_sandbox_skills_host_path + ',mp=' + openclaw_ctf_sandbox_skills_root) | quote }}
          --allow-missing-expected-bind-mounts
        executable: /usr/bin/python3
      changed_when: false
