---
- name: Validate Proxmox LXC root-only settings
  hosts: pve_hosts
  gather_facts: false
  tasks:
    - name: Validate root-only LXC settings match inventory
      ansible.builtin.shell: |
        set -eu
        config="$(pct config "{{ hostvars[item].vmid }}")"
        {% for setting in hostvars[item].lxc_root_options.settings %}
        printf '%s\n' "$config" | grep -Eq '{{ setting.pattern }}' || {
          printf 'Missing {{ setting.description }} on {{ item }} ({{ hostvars[item].vmid }})\n' >&2
          exit 1
        }
        {% endfor %}
        {% for setting in hostvars[item].lxc_root_options.absent_settings | default([]) %}
        if printf '%s\n' "$config" | grep -Eq '{{ setting.pattern }}'; then
          printf 'Unexpected {{ setting.description }} on {{ item }} ({{ hostvars[item].vmid }})\n' >&2
          exit 1
        fi
        {% endfor %}
      args:
        executable: /bin/sh
      changed_when: false
      loop: "{{ groups['debian'] }}"
      loop_control:
        label: "{{ item }} ({{ hostvars[item].vmid }})"

- name: Validate tailnet
  hosts: svc_tailnet
  gather_facts: false
  tasks:
    - name: Check tailscaled service
      ansible.builtin.command: systemctl is-active tailscaled
      changed_when: false

    - name: Check IP forwarding
      ansible.builtin.command:
        argv:
          - sysctl
          - -n
          - "{{ item }}"
      changed_when: false
      register: tailnet_forwarding
      failed_when: tailnet_forwarding.stdout | trim != "1"
      loop:
        - net.ipv4.ip_forward
        - net.ipv6.conf.all.forwarding

    - name: Check persistent Tailscale UDP GRO service
      ansible.builtin.command:
        argv:
          - systemctl
          - is-enabled
          - tailscale-udp-gro.service
      changed_when: false

    - name: Check Tailscale UDP GRO forwarding
      ansible.builtin.shell: |
        set -eu
        netdev="$(
          ip -o route get 8.8.8.8 |
            awk '{ for (field = 1; field <= NF; field++) if ($field == "dev") { print $(field + 1); exit } }'
        )"
        test -n "${netdev}"
        features="$(ethtool -k "${netdev}")"
        printf '%s\n' "${features}" | grep -Eq '^[[:space:]]*rx-udp-gro-forwarding: on$'
        printf '%s\n' "${features}" | grep -Eq '^[[:space:]]*rx-gro-list: off$'
      args:
        executable: /bin/sh
      changed_when: false

    - name: Check Tailscale status
      ansible.builtin.command: tailscale status
      changed_when: false
      when: tailscale_auth_key is defined

- name: Validate the dedicated immutable OpenClaw runtime
  hosts: svc_openclaw
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Audit the active content-addressed release without another auth smoke
      ansible.builtin.command:
        argv:
          - /usr/local/libexec/deploy_openclaw_release.py
          - --install-root
          - "{{ openclaw_install_root }}"
          - --secret-root
          - "{{ openclaw_secret_root }}"
          - audit
      register: openclaw_immutable_audit
      changed_when: false
      no_log: true

    - name: Validate the independent CTF boundary and skill-promotion service
      ansible.builtin.shell: |
        set -eu
        test "$(stat -c '%u:%g %a' '{{ openclaw_skill_sync_github_token_path }}')" = '0:0 600'
        docker network inspect '{{ openclaw_ctf_docker_network }}' >/dev/null
        iptables -w -C DOCKER-USER -j OPENCLAW_CTF
        systemctl is-enabled --quiet openclaw-skill-sync.timer
        systemctl is-active --quiet openclaw-skill-sync.timer
        systemctl cat openclaw-skill-sync.service | grep -Fqx 'User={{ openclaw_skill_sync_user }}'
        systemctl cat openclaw-skill-sync.service | grep -Fqx 'LoadCredential=github_token:{{ openclaw_skill_sync_github_token_path }}'
        systemctl cat openclaw-skill-sync.service | grep -Fqx 'ReadOnlyPaths={{ openclaw_workspace_root }}/skills'
        systemctl cat openclaw-skill-sync.service | grep -Fqx 'ReadOnlyPaths={{ openclaw_ctf_workspace_root }}/skills'
        test ! -e /etc/systemd/system/openclaw-gateway.service
      args:
        executable: /bin/sh
      changed_when: false
      no_log: true

    - name: Verify the proven readiness endpoint without repeating the auth smoke
      ansible.builtin.uri:
        url: "{{ openclaw_readiness_url }}"
        status_code: 200
        return_content: false
      register: openclaw_readiness_validation
      changed_when: false
      retries: 6
      delay: 5
      until: openclaw_readiness_validation.status == 200
- name: Validate Docker Compose application host
  hosts: svc_docker_apps
  gather_facts: false
  tasks:
    - name: Check Docker Engine
      ansible.builtin.command: systemctl is-active docker
      changed_when: false

    - name: Check Docker Engine reboot persistence
      ansible.builtin.command: systemctl is-enabled docker
      changed_when: false

    - name: Validate rendered Compose projects
      ansible.builtin.command:
        cmd: docker compose --env-file .homelab/artifacts.env config --quiet
        chdir: "{{ item.dest }}"
      changed_when: false
      loop: "{{ docker_compose_projects }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Require every Compose service to be running
      ansible.builtin.shell: |
        set -eu
        expected="$(docker compose --env-file .homelab/artifacts.env config --services | sort)"
        running="$(docker compose --env-file .homelab/artifacts.env ps --services --status running | sort)"
        test "$expected" = "$running" || {
          printf 'Expected running services:\n%s\nActual running services:\n%s\n' "$expected" "$running" >&2
          docker compose --env-file .homelab/artifacts.env ps >&2
          exit 1
        }
      args:
        executable: /bin/sh
        chdir: "{{ item.dest }}"
      changed_when: false
      retries: 12
      delay: 10
      register: compose_running
      until: compose_running.rc == 0
      loop: "{{ docker_compose_projects }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Run the active release smoke contract
      ansible.builtin.command: ./.homelab/smoke
      args:
        chdir: "{{ item.dest }}"
      changed_when: false
      loop: "{{ docker_compose_projects }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Validate VueTorrent assets and qBittorrent selection
      ansible.builtin.script:
        cmd: "{{ playbook_dir }}/../files/validate-vuetorrent.sh"
        executable: /bin/sh
        chdir: "{{ docker_apps_current_root }}/homelab"
      changed_when: false

    - name: Check AdGuard Safe Search is disabled
      ansible.builtin.shell: |
        set -eu
        safe_search_enabled="$(
          awk '
            /^  safe_search:$/ { in_safe_search = 1; next }
            in_safe_search && /^    enabled:/ { print $2; exit }
            in_safe_search && /^  [^ ]/ { exit }
          ' adguard/AdGuardHome.yaml
        )"
        test "${safe_search_enabled}" = false
        docker compose --env-file .homelab/artifacts.env exec -T adguard \
          /opt/adguardhome/AdGuardHome --check-config \
          -c /opt/adguardhome/conf/AdGuardHome.yaml
      args:
        executable: /bin/sh
        chdir: "{{ docker_apps_current_root }}/homelab"
      changed_when: false

    - name: Query AdGuard normal DNS
      ansible.builtin.command: dig +short @127.0.0.1 example.com A
      register: adguard_dns_query
      changed_when: false
      failed_when: adguard_dns_query.stdout | length == 0

    - name: Query AdGuard private rewrites
      ansible.builtin.command: "dig +short @127.0.0.1 {{ item }} A"
      register: adguard_private_query
      changed_when: false
      failed_when: docker_apps_ip not in adguard_private_query.stdout_lines
      loop:
        - qbt.home.hchu.me
        - metube.home.hchu.me
        - "{{ t3code_hostname }}"
        - "{{ openclaw_hostname }}"

    - name: Check private Traefik routes
      ansible.builtin.command:
        argv:
          - curl
          - --fail
          - --silent
          - --show-error
          - --resolve
          - "{{ item }}:443:127.0.0.1"
          - "https://{{ item }}/"
      changed_when: false
      register: private_traefik_route
      retries: 12
      delay: 10
      until: private_traefik_route.rc == 0
      loop:
        - adguard.home.hchu.me
        - qbt.home.hchu.me
        - metube.home.hchu.me
        - "{{ t3code_hostname }}"

    - name: Check public Copyparty route
      ansible.builtin.command:
        argv:
          - curl
          - --fail
          - --silent
          - --show-error
          - --resolve
          - copyparty.hchu.me:443:127.0.0.1
          - https://copyparty.hchu.me/
      changed_when: false
      register: public_copyparty_route
      retries: 12
      delay: 10
      until: public_copyparty_route.rc == 0

    - name: Check qBittorrent uses the host public address
      ansible.builtin.shell: |
        set -eu
        host_ip="$(curl -4fsS https://api.ipify.org)"
        qbittorrent_ip="$(
          docker compose --env-file .homelab/artifacts.env exec -T qbittorrent sh -c '
            if command -v curl >/dev/null 2>&1; then
              exec curl -4fsS https://api.ipify.org
            fi
            exec wget -qO- https://api.ipify.org
          '
        )"
        test -n "$host_ip"
        test -n "$qbittorrent_ip"
        test "$host_ip" = "$qbittorrent_ip"
      args:
        executable: /bin/sh
        chdir: "{{ docker_apps_current_root }}/homelab"
      changed_when: false

    - name: Check direct qBittorrent peer port and Docker publications
      ansible.builtin.shell: |
        set -eu
        direct_listen_port="$(
          docker compose --env-file .homelab/artifacts.env exec -T qbittorrent sh -c '
            if command -v curl >/dev/null 2>&1; then
              exec curl -fsS http://127.0.0.1:8080/api/v2/app/preferences
            fi
            exec wget -qO- http://127.0.0.1:8080/api/v2/app/preferences
          ' | python3 -c 'import json, sys; print(json.load(sys.stdin).get("listen_port", 0))'
        )"
        test "${direct_listen_port}" = "{{ qbittorrent_direct_peer_port }}"
        direct_container="$(docker compose --env-file .homelab/artifacts.env ps -q qbittorrent)"
        test -n "$(docker port "${direct_container}" {{ qbittorrent_direct_peer_port }}/tcp)"
        test -n "$(docker port "${direct_container}" {{ qbittorrent_direct_peer_port }}/udp)"
      args:
        executable: /bin/sh
        chdir: "{{ docker_apps_current_root }}/homelab"
      changed_when: false
