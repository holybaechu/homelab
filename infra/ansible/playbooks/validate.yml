---
- name: Validate Proxmox LXC root-only settings
  hosts: pve_hosts
  gather_facts: false
  tasks:
    - name: Validate root-only LXC settings match inventory
      ansible.builtin.shell: |
        set -eu
        config="$(pct config "{{ item.vmid }}")"
        {% for setting in item.settings %}
        printf '%s\n' "$config" | grep -Eq '{{ setting.pattern }}' || {
          printf 'Missing {{ setting.description }} on {{ item.name }} ({{ item.vmid }})\n' >&2
          exit 1
        }
        {% endfor %}
        {% for setting in item.absent_settings | default([]) %}
        if printf '%s\n' "$config" | grep -Eq '{{ setting.pattern }}'; then
          printf 'Unexpected {{ setting.description }} on {{ item.name }} ({{ item.vmid }})\n' >&2
          exit 1
        fi
        {% endfor %}
      args:
        executable: /bin/sh
      changed_when: false
      loop: "{{ pve_lxc_root_options }}"
      loop_control:
        label: "{{ item.name }} ({{ item.vmid }})"

- name: Validate tailnet
  hosts: svc_tailnet
  gather_facts: false
  tasks:
    - name: Check tailscaled service
      ansible.builtin.command: systemctl is-active tailscaled
      changed_when: false

    - name: Check IP forwarding
      ansible.builtin.command:
        argv:
          - sysctl
          - -n
          - "{{ item }}"
      changed_when: false
      register: tailnet_forwarding
      failed_when: tailnet_forwarding.stdout | trim != "1"
      loop:
        - net.ipv4.ip_forward
        - net.ipv6.conf.all.forwarding

    - name: Check persistent Tailscale UDP GRO service
      ansible.builtin.command:
        argv:
          - systemctl
          - is-enabled
          - tailscale-udp-gro.service
      changed_when: false

    - name: Check Tailscale UDP GRO forwarding
      ansible.builtin.shell: |
        set -eu
        netdev="$(
          ip -o route get 8.8.8.8 |
            awk '{ for (field = 1; field <= NF; field++) if ($field == "dev") { print $(field + 1); exit } }'
        )"
        test -n "${netdev}"
        features="$(ethtool -k "${netdev}")"
        printf '%s\n' "${features}" | grep -Eq '^[[:space:]]*rx-udp-gro-forwarding: on$'
        printf '%s\n' "${features}" | grep -Eq '^[[:space:]]*rx-gro-list: off$'
      args:
        executable: /bin/sh
      changed_when: false

    - name: Check Tailscale status
      ansible.builtin.command: tailscale status
      changed_when: false
      when: tailscale_auth_key is defined

- name: Validate the dedicated native OpenClaw host
  hosts: svc_openclaw
  gather_facts: false
  tasks:
    - name: Check dedicated OpenClaw LXC isolation
      ansible.builtin.shell: |
        set -eu
        test "$(hostname)" = openclaw
        test "$(id -u openclaw)" = "{{ openclaw_uid }}"
        test "$(id -g openclaw)" = "{{ openclaw_gid }}"
        test "$(getent passwd openclaw | cut -d: -f7)" = /usr/sbin/nologin
        test ! -e /var/run/docker.sock
        ! command -v docker >/dev/null 2>&1
      args:
        executable: /bin/sh
      changed_when: false

    - name: Check native OpenClaw runtime and firewall staging
      ansible.builtin.shell: |
        set -eu
        test "$(stat -c '%u:%g %a' '{{ openclaw_runtime_root }}')" = "{{ openclaw_uid }}:{{ openclaw_gid }} 700"
        test "$(stat -c '%u:%g %a' '{{ openclaw_auth_profile_secret_root }}')" = "{{ openclaw_uid }}:{{ openclaw_gid }} 700"
        test "$(stat -c '%u:%g %a' '{{ openclaw_secret_root }}')" = "0:0 700"
        test "$(stat -c '%u:%g %a' '{{ openclaw_gateway_token_path }}')" = "0:0 600"
        test "$(wc -c < '{{ openclaw_gateway_token_path }}')" -eq 65
        grep -Eq '^[0-9a-fA-F]{64}$' '{{ openclaw_gateway_token_path }}'
        systemctl is-active --quiet nftables
        systemctl is-enabled --quiet nftables
        nft list chain inet filter input | grep -F 'ip saddr {{ openclaw_proxy_ip }} tcp dport {{ openclaw_gateway_port }} accept'
      args:
        executable: /bin/sh
      changed_when: false
      no_log: true

    - name: Require mutually exclusive tracked OpenClaw ownership and route
      ansible.builtin.assert:
        that:
          - openclaw_docker_rollback_activate is boolean
          - not ((openclaw_native_activate | bool) and (openclaw_docker_rollback_activate | bool))
          - >-
            openclaw_traefik_backend_url ==
            (
              'http://openclaw-rollback:18789'
              if openclaw_docker_rollback_activate | bool
              else 'http://' + openclaw_ip + ':18789'
            )
        fail_msg: OpenClaw primary ownership and the Traefik backend must change atomically.

    - name: Check pinned native OpenClaw artifacts
      ansible.builtin.shell: |
        set -eu
        test "$({{ openclaw_node_release_root }}/bin/node --version)" = 'v{{ openclaw_node_version }}'
        package_version="$(
          {{ openclaw_node_release_root }}/bin/node -p \
            "require('{{ openclaw_release_root }}/lib/node_modules/openclaw/package.json').version"
        )"
        test "$package_version" = '{{ openclaw_version }}'
        test -x '{{ openclaw_release_root }}/bin/openclaw'
        test "$(env -i PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
          /usr/local/bin/openclaw --version)" = '{{ openclaw_cli_version_output }}'
      args:
        executable: /bin/sh
      changed_when: false

    - name: Validate the active native OpenClaw private repository boundary
      ansible.builtin.shell: |
        set -eu
        hooks=/run/openclaw-native-empty-hooks
        test -d "$hooks"
        test "$(stat -c '%u:%g %a' "$hooks")" = '0:0 700'
        test ! -e .gitattributes && test ! -L .gitattributes
        test ! -e .git/info/attributes && test ! -L .git/info/attributes
        test ! -x .git/config
        git_safe() {
          git \
            -c core.hooksPath="$hooks" \
            -c core.fsmonitor=false \
            -c core.attributesFile=/dev/null \
            -c diff.external= \
            -c pager.status=false \
            "$@"
        }
        test "$(git_safe branch --show-current)" = main
        git_safe rev-parse --verify HEAD >/dev/null
        test -z "$(git_safe status --porcelain=v1 --no-ahead-behind)"
        git_safe diff --quiet --no-ext-diff --no-textconv
        git_safe diff --cached --quiet --no-ext-diff --no-textconv
        git_safe --no-pager ls-files --error-unmatch config/openclaw.json >/dev/null
        test -z "$(
          git_safe --no-pager ls-files |
            grep -E '(^|/)(state|runtime|auth|credentials|sessions|logs|cache|tmp|temp)(/|$)' || true
        )"
        set +e
        git_safe --no-pager grep --quiet -F -f '{{ openclaw_gateway_token_path }}' --
        tracked_token_status=$?
        set -e
        test "$tracked_token_status" -eq 1
        setup="$(realpath '{{ openclaw_setup_root }}')"
        runtime="$(realpath '{{ openclaw_runtime_root }}')"
        case "$runtime" in "$setup"|"$setup"/*) exit 1 ;; esac
        case "$setup" in "$runtime"|"$runtime"/*) exit 1 ;; esac
      args:
        executable: /bin/sh
        chdir: "{{ openclaw_setup_root }}"
      environment:
        GIT_CONFIG_NOSYSTEM: "1"
        GIT_CONFIG_SYSTEM: /dev/null
        GIT_CONFIG_GLOBAL: /dev/null
        GIT_PAGER: cat
        GIT_TERMINAL_PROMPT: "0"
      changed_when: false
      no_log: true
      when: openclaw_native_activate | bool

    - name: Inspect the native transition marker for validation
      ansible.builtin.stat:
        path: "{{ openclaw_native_transition_marker_path }}"
        follow: false
      register: openclaw_native_transition_marker_validation

    - name: Read the native transition marker for validation
      ansible.builtin.slurp:
        src: "{{ openclaw_native_transition_marker_path }}"
      register: openclaw_native_transition_marker_content_validation
      when: openclaw_native_transition_marker_validation.stat.exists | default(false)
      no_log: true

    - name: Reject an ambiguous native transition marker
      ansible.builtin.assert:
        that:
          - not (openclaw_native_activate | bool)
          - openclaw_native_transition_marker_validation.stat.isreg | default(false)
          - not (openclaw_native_transition_marker_validation.stat.islnk | default(false))
          - openclaw_native_transition_marker_validation.stat.uid == 0
          - openclaw_native_transition_marker_validation.stat.gid == 0
          - openclaw_native_transition_marker_validation.stat.mode == '0600'
          - (openclaw_native_transition_marker_content_validation.content | b64decode) == openclaw_native_transition_marker_value + '\n'
        fail_msg: >-
          The native marker conflicts with tracked activation or is malformed;
          refusing to accept an ambiguous Gateway state.
      when: openclaw_native_transition_marker_validation.stat.exists | default(false)
      no_log: true

    - name: Validate active native OpenClaw Git and secret boundaries
      ansible.builtin.shell: |
        set -eu
        hooks=/run/openclaw-native-empty-hooks
        test -d "$hooks"
        test "$(stat -c '%u:%g %a' "$hooks")" = '0:0 700'
        test -z "$(find "$hooks" -mindepth 1 -print -quit)"
        test ! -e .gitattributes && test ! -L .gitattributes
        test ! -e .git/info/attributes && test ! -L .git/info/attributes
        test ! -x .git/config
        git_safe() {
          git \
            -c core.hooksPath="$hooks" \
            -c core.fsmonitor=false \
            -c core.attributesFile=/dev/null \
            -c diff.external= \
            -c pager.status=false \
            "$@"
        }
        test "$(git_safe branch --show-current)" = main
        git_safe rev-parse --verify HEAD >/dev/null
        test -z "$(git_safe status --porcelain=v1 --no-ahead-behind)"
        git_safe diff --quiet --no-ext-diff --no-textconv
        git_safe diff --cached --quiet --no-ext-diff --no-textconv
        git_safe --no-pager ls-files --error-unmatch config/openclaw.json >/dev/null
        test -z "$(git_safe --no-pager ls-files | grep -E '(^|/)(\.env([^/]*|$)|state|runtime|auth|auth-profile-secrets|secrets|credentials|sessions|logs|cache|tmp|temp)(/|$)' | grep -vxF '.env.example' || true)"
        token_pattern='{{ openclaw_gateway_token_path }}'
        test -f "$token_pattern"
        test ! -L "$token_pattern"
        test "$(stat -c '%u:%g %a' "$token_pattern")" = '0:0 600'
        test "$(wc -c < "$token_pattern")" -eq 65
        grep -Eq '^[0-9a-fA-F]{64}$' "$token_pattern"
        set +e
        git_safe --no-pager grep --quiet -F -f "$token_pattern" --
        tracked_token_status=$?
        set -e
        test "$tracked_token_status" -eq 1
        setup="$(realpath -e '{{ openclaw_setup_root }}')"
        runtime="$(realpath -e '{{ openclaw_runtime_root }}')"
        auth="$(realpath -e '{{ openclaw_auth_profile_secret_root }}')"
        case "$runtime" in "$setup"|"$setup"/*) exit 1 ;; esac
        case "$setup" in "$runtime"|"$runtime"/*) exit 1 ;; esac
        case "$auth" in "$setup"|"$setup"/*) exit 1 ;; esac
        case "$setup" in "$auth"|"$auth"/*) exit 1 ;; esac
      args:
        executable: /bin/sh
        chdir: "{{ openclaw_setup_root }}"
      environment:
        GIT_CONFIG_NOSYSTEM: "1"
        GIT_CONFIG_SYSTEM: /dev/null
        GIT_CONFIG_GLOBAL: /dev/null
        GIT_PAGER: cat
        GIT_TERMINAL_PROMPT: "0"
      changed_when: false
      no_log: true
      when: openclaw_native_activate | bool

    - name: Check native Gateway staged, transitional, or active state
      ansible.builtin.shell: |
        set -eu
        {% if openclaw_docker_rollback_activate | bool %}
        ! systemctl is-enabled --quiet openclaw-gateway.service
        ! systemctl is-active --quiet openclaw-gateway.service
        listeners="$(ss -H -ltn 'sport = :{{ openclaw_gateway_port }}')"
        test -z "${listeners}"
        {% elif openclaw_native_activate | bool or openclaw_native_transition_marker_validation.stat.exists | default(false) %}
        systemctl is-enabled --quiet openclaw-gateway.service
        systemctl is-active --quiet openclaw-gateway.service
        curl -fsS 'http://{{ openclaw_bind_host }}:{{ openclaw_gateway_port }}/readyz' >/dev/null
        {% else %}
        test "$(systemctl is-enabled openclaw-gateway.service 2>/dev/null || true)" = disabled
        test "$(systemctl is-active openclaw-gateway.service 2>/dev/null || true)" = inactive
        test ! -e '{{ openclaw_setup_root }}' || test -d '{{ openclaw_setup_root }}/.git'
        {% endif %}
      args:
        executable: /bin/sh
      changed_when: false

    - name: Check the native Gateway runtime credential boundary
      ansible.builtin.shell: |
        set -eu
        credential=/run/openclaw-gateway/gateway_token
        {% if not (openclaw_docker_rollback_activate | bool) and (openclaw_native_activate | bool or openclaw_native_transition_marker_validation.stat.exists | default(false)) %}
        test -f "$credential"
        test ! -L "$credential"
        test "$(stat -c '%u:%g %a %h %s' "$credential")" = "{{ openclaw_uid }}:{{ openclaw_gid }} 400 1 65"
        grep -Eq '^[0-9a-fA-F]{64}$' "$credential"
        {% else %}
        test ! -e /run/openclaw-gateway
        test ! -L /run/openclaw-gateway
        {% endif %}
        test ! -e /run/openclaw-credential-probe
        test ! -e /run/systemd/system/openclaw-credential-probe.service
      args:
        executable: /bin/sh
      changed_when: false
      no_log: true

- name: Validate Docker Compose application host
  hosts: svc_docker_apps
  gather_facts: false
  tasks:
    - name: Check Docker Engine
      ansible.builtin.command: systemctl is-active docker
      changed_when: false

    - name: Check Docker Engine reboot persistence
      ansible.builtin.command: systemctl is-enabled docker
      changed_when: false

    - name: Inspect the validated native OpenClaw cutover marker
      ansible.builtin.stat:
        path: "{{ openclaw_native_cutover_marker_path }}"
        follow: false
      register: openclaw_native_cutover_marker_validation

    - name: Read the validated native OpenClaw cutover marker
      ansible.builtin.slurp:
        src: "{{ openclaw_native_cutover_marker_path }}"
      register: openclaw_native_cutover_marker_content_validation
      when: openclaw_native_cutover_marker_validation.stat.exists | default(false)
      no_log: true

    - name: Reject an ambiguous Docker-to-native OpenClaw cutover marker
      ansible.builtin.assert:
        that:
          - openclaw_native_cutover_marker_validation.stat.isreg | default(false)
          - not (openclaw_native_cutover_marker_validation.stat.islnk | default(false))
          - openclaw_native_cutover_marker_validation.stat.uid == 0
          - openclaw_native_cutover_marker_validation.stat.gid == 0
          - openclaw_native_cutover_marker_validation.stat.mode == '0600'
          - (openclaw_native_cutover_marker_content_validation.content | b64decode) == openclaw_native_transition_marker_value + '\n'
        fail_msg: >-
          The Docker-host native cutover marker is malformed; refusing to
          accept either Gateway state.
      when: openclaw_native_cutover_marker_validation.stat.exists | default(false)
      no_log: true

    - name: Read the staged OpenClaw Traefik route
      ansible.builtin.slurp:
        src: "{{ docker_apps_compose_root }}/platform/dynamic/routes.yml"
      register: openclaw_traefik_dynamic_validation

    - name: Validate the exact staged OpenClaw Traefik route
      ansible.builtin.assert:
        that:
          - openclaw_dynamic.http.routers.openclaw.rule == 'Host(`openclaw.home.hchu.me`)'
          - openclaw_dynamic.http.routers.openclaw.entryPoints == ['websecure']
          - openclaw_dynamic.http.routers.openclaw.middlewares == ['private-only', 'secure-headers']
          - openclaw_dynamic.http.routers.openclaw.service == 'openclaw'
          - >-
            openclaw_dynamic.http.services.openclaw.loadBalancer.servers
            == [{'url': openclaw_traefik_backend_url}]
      vars:
        openclaw_dynamic: >-
          {{ openclaw_traefik_dynamic_validation.content | b64decode | from_yaml }}

    - name: Validate the completed native cutover keeps Docker OpenClaw stopped
      when:
        - openclaw_native_cutover_marker_validation.stat.exists | default(false)
        - not (openclaw_docker_rollback_activate | bool)
      block:
        - name: Check the cut-over native OpenClaw Gateway readiness endpoint
          ansible.builtin.uri:
            url: "http://{{ openclaw_ip }}:{{ openclaw_gateway_port }}/readyz"
            method: GET
            status_code: 200
            return_content: false
          register: openclaw_native_cutover_readiness_validation
          changed_when: false
          retries: 6
          delay: 5
          until: openclaw_native_cutover_readiness_validation.status == 200

        - name: Require the retained Docker OpenClaw Gateway to be stopped
          ansible.builtin.shell: |
            set -eu
            container="$(docker compose ps --all -q openclaw-gateway)"
            test -n "$container"
            test -z "$(docker compose ps --status running -q openclaw-gateway)"
            test -f compose.yml
            test -f .env
            test -d '{{ openclaw_setup_root }}/.git'
            test -f '{{ openclaw_config_path }}'
            test -d '{{ openclaw_state_root }}'
            test -d '{{ openclaw_auth_profile_secret_root }}'
            test -f '{{ openclaw_gateway_token_path }}'
            image="$(docker inspect --format '{% raw %}{{.Config.Image}}{% endraw %}' "$container")"
            docker image inspect "$image" >/dev/null
          args:
            executable: /bin/sh
            chdir: "{{ openclaw_compose_root }}"
          changed_when: false

        - name: Require Arcane to have retired only the OpenClaw GitOps sync
          ansible.builtin.shell: |
            set -eu
            test -f '{{ arcane_data_root }}/arcane.db'
            count="$(
              python3 - '{{ arcane_data_root }}/arcane.db' <<'PY'
            import sqlite3
            import sys

            with sqlite3.connect(f"file:{sys.argv[1]}?mode=ro", uri=True) as database:
                print(
                    database.execute(
                        "SELECT COUNT(*) FROM gitops_syncs WHERE name = ?",
                        ("openclaw",),
                    ).fetchone()[0]
                )
            PY
            )"
            test "$count" = 0
          args:
            executable: /bin/sh
          changed_when: false

        - name: Check the cut-over OpenClaw HTTPS route through Traefik
          ansible.builtin.command:
            argv:
              - curl
              - --fail
              - --silent
              - --show-error
              - --resolve
              - "{{ openclaw_hostname }}:443:127.0.0.1"
              - "https://{{ openclaw_hostname }}/"
          changed_when: false
          register: openclaw_native_traefik_route_validation
          retries: 12
          delay: 5
          until: openclaw_native_traefik_route_validation.rc == 0

    - name: Validate tracked Docker rollback while preserving native cutover holds
      when: openclaw_docker_rollback_activate | bool
      block:
        - name: Require the permanent source marker and exact retained rollback container
          ansible.builtin.shell: |
            set -eu
            test "$(stat -c '%u:%g %a' '{{ openclaw_native_cutover_marker_path }}')" = '0:0 600'
            test "$(cat '{{ openclaw_native_cutover_marker_path }}')" = '{{ openclaw_native_transition_marker_value }}'
            container="$(docker compose ps --status running -q openclaw-gateway)"
            test -n "$container"
            test "$(printf '%s\n' "$container" | sed '/^$/d' | wc -l)" -eq 1
            test "$(docker inspect --format '{% raw %}{{.State.Health.Status}}{% endraw %}' "$container")" = healthy
            test "$(docker inspect --format '{% raw %}{{index .Config.Labels "com.docker.compose.project"}}{% endraw %}' "$container")" = openclaw
            test "$(docker inspect --format '{% raw %}{{index .Config.Labels "com.docker.compose.service"}}{% endraw %}' "$container")" = openclaw-gateway
            docker inspect --format '{% raw %}{{json .NetworkSettings.Networks}}{% endraw %}' "$container" |
              python3 -c '
            import json, sys
            network = json.load(sys.stdin).get("homelab_proxy")
            aliases = [] if network is None else network.get("Aliases") or []
            raise SystemExit(0 if "openclaw-rollback" in aliases else 1)
            '
            curl -fsS http://127.0.0.1:{{ openclaw_gateway_port }}/readyz >/dev/null
          args:
            executable: /bin/sh
            chdir: "{{ openclaw_compose_root }}"
          changed_when: false

        - name: Require Arcane OpenClaw sync to remain retired during rollback
          ansible.builtin.shell: |
            set -eu
            test -f '{{ arcane_data_root }}/arcane.db'
            test "$(python3 - '{{ arcane_data_root }}/arcane.db' <<'PY'
            import sqlite3
            import sys
            with sqlite3.connect(f"file:{sys.argv[1]}?mode=ro", uri=True) as database:
                print(database.execute("SELECT COUNT(*) FROM gitops_syncs WHERE name = ?", ("openclaw",)).fetchone()[0])
            PY
            )" = 0
          args:
            executable: /bin/sh
          changed_when: false

        - name: Check the certificate-valid Docker rollback path through Traefik
          ansible.builtin.command:
            argv:
              - curl
              - --fail
              - --silent
              - --show-error
              - --resolve
              - "{{ openclaw_hostname }}:443:127.0.0.1"
              - "https://{{ openclaw_hostname }}/"
          changed_when: false
          register: openclaw_docker_rollback_traefik_validation
          retries: 12
          delay: 5
          until: openclaw_docker_rollback_traefik_validation.rc == 0

    - name: Validate the Arcane control project
      ansible.builtin.command:
        cmd: docker compose config --quiet
        chdir: "{{ arcane_control_root }}"
      changed_when: false

    - name: Require every Arcane control service to be running
      ansible.builtin.shell: |
        set -eu
        expected="$(printf '%s\n' {% for service in arcane_control_services %}'{{ service }}' {% endfor %}| sort)"
        running="$(docker compose ps --services --status running | sort)"
        test "$expected" = "$running" || {
          printf 'Expected Arcane services:\n%s\nActual running services:\n%s\n' "$expected" "$running" >&2
          docker compose ps >&2
          exit 1
        }
      args:
        executable: /bin/sh
        chdir: "{{ arcane_control_root }}"
      changed_when: false

    - name: Check Arcane API health
      ansible.builtin.uri:
        url: "{{ arcane_health_url }}"
        method: GET
        status_code: 200
        return_content: false
      register: arcane_health_validation
      changed_when: false
      retries: 6
      delay: 5
      until: arcane_health_validation.status == 200

    - name: Validate Arcane control-plane state and secret files
      ansible.builtin.shell: |
        set -eu
        test -s "{{ arcane_data_root }}/arcane.db"
        test "$(stat -c '%a' "{{ arcane_secret_root }}")" = 750
        test "$(stat -c '%u:%g' "{{ arcane_secret_root }}")" = "0:{{ arcane_gid }}"
        test "$(stat -c '%a' "{{ arcane_secret_root }}/encryption_key")" = 640
        test "$(stat -c '%a' "{{ arcane_secret_root }}/jwt_secret")" = 640
        test "$(stat -c '%u:%g' "{{ arcane_secret_root }}/encryption_key")" = "0:{{ arcane_gid }}"
        test "$(stat -c '%u:%g' "{{ arcane_secret_root }}/jwt_secret")" = "0:{{ arcane_gid }}"
        encryption_key="$(tr -d '\r\n' < "{{ arcane_secret_root }}/encryption_key")"
        jwt_secret="$(tr -d '\r\n' < "{{ arcane_secret_root }}/jwt_secret")"
        test "$(printf '%s' "$encryption_key" | wc -c)" -eq 64
        printf '%s' "$encryption_key" | grep -Eq '^[0-9a-fA-F]{64}$'
        test "$(printf '%s' "$jwt_secret" | wc -c)" -ge 32
      args:
        executable: /bin/sh
      changed_when: false
      no_log: true

    - name: Validate Arcane uses only the private Docker socket proxy
      ansible.builtin.shell: |
        set -eu
        arcane_container="$(docker compose ps -q arcane)"
        proxy_container="$(docker compose ps -q docker-socket-proxy)"
        test -n "$arcane_container"
        test -n "$proxy_container"
        docker inspect "$arcane_container" "$proxy_container" | python3 -c 'import json, sys; arcane, proxy = json.load(sys.stdin); socket_mounts = [mount for mount in proxy["Mounts"] if mount["Destination"] == "/var/run/docker.sock"]; valid = "DOCKER_HOST=tcp://docker-socket-proxy:2375" in arcane["Config"]["Env"] and not any(mount["Destination"] == "/var/run/docker.sock" for mount in arcane["Mounts"]) and len(socket_mounts) == 1 and not socket_mounts[0]["RW"]; raise SystemExit(0 if valid else 1)'
      args:
        executable: /bin/sh
        chdir: "{{ arcane_control_root }}"
      changed_when: false

    - name: Validate Arcane sees the private OpenClaw repository read-only
      ansible.builtin.shell: |
        set -eu
        arcane_container="$(docker compose ps -q arcane)"
        test -n "$arcane_container"
        docker inspect "$arcane_container" | python3 -c 'import json, sys; container = json.load(sys.stdin)[0]; mounts = {(mount["Source"], mount["Destination"]): mount for mount in container["Mounts"]}; parent = mounts.get(("{{ docker_apps_compose_root }}", "{{ docker_apps_compose_root }}")); private = mounts.get(("{{ openclaw_setup_root }}", "{{ openclaw_setup_root }}")); raise SystemExit(0 if parent and parent["RW"] and private and not private["RW"] else 1)'
      args:
        executable: /bin/sh
        chdir: "{{ arcane_control_root }}"
      changed_when: false

    - name: Require Arcane to run without a static admin API key
      ansible.builtin.shell: |
        set -eu
        arcane_container="$(docker compose ps -q arcane)"
        test -n "$arcane_container"
        docker inspect "$arcane_container" | python3 -c 'import json, sys; environment = json.load(sys.stdin)[0]["Config"]["Env"]; forbidden = ("ADMIN_STATIC_API_KEY=", "ADMIN_STATIC_API_KEY_FILE="); raise SystemExit(1 if any(value.startswith(forbidden) for value in environment) else 0)'
        ! grep -q '^ADMIN_STATIC_API_KEY=' .env
        ! grep -q '^ADMIN_STATIC_API_KEY_FILE=' .env
        test ! -e "{{ arcane_secret_root }}/bootstrap_admin_api_key"
      args:
        executable: /bin/sh
        chdir: "{{ arcane_control_root }}"
      changed_when: false
      no_log: true

    - name: Validate rendered Compose projects
      ansible.builtin.command:
        cmd: docker compose config --quiet
        chdir: "{{ item.dest }}"
      changed_when: false
      loop: "{{ docker_compose_projects }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Require every Compose service to be running
      ansible.builtin.shell: |
        set -eu
        expected="$(docker compose config --services | sort)"
        running="$(docker compose ps --services --status running | sort)"
        test "$expected" = "$running" || {
          printf 'Expected running services:\n%s\nActual running services:\n%s\n' "$expected" "$running" >&2
          docker compose ps >&2
          exit 1
        }
      args:
        executable: /bin/sh
        chdir: "{{ item.dest }}"
      changed_when: false
      retries: 12
      delay: 10
      register: compose_running
      until: compose_running.rc == 0
      loop: "{{ docker_compose_projects }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Validate the OpenClaw Compose project
      ansible.builtin.command:
        cmd: docker compose config --quiet
        chdir: "{{ openclaw_compose_root }}"
      changed_when: false
      when: not (openclaw_native_cutover_marker_validation.stat.exists | default(false))

    - name: Read the immutable OpenClaw image from Compose
      ansible.builtin.command:
        cmd: docker compose config --images
        chdir: "{{ openclaw_compose_root }}"
      register: openclaw_rendered_image_validation
      changed_when: false
      failed_when: >-
        openclaw_rendered_image_validation.rc != 0 or
        openclaw_rendered_image_validation.stdout_lines | length != 1 or
        not (openclaw_rendered_image_validation.stdout | trim is match(
          '^ghcr\.io/openclaw/openclaw:[^@\s]+@sha256:[0-9a-f]{64}$'
        ))
      when: not (openclaw_native_cutover_marker_validation.stat.exists | default(false))

    - name: Require the OpenClaw Gateway container to be running and healthy
      ansible.builtin.shell: |
        set -eu
        container="$(docker compose ps -q openclaw-gateway)"
        test -n "$container"
        test "$(docker inspect --format '{% raw %}{{.State.Status}}{% endraw %}' "$container")" = running
        test "$(docker inspect --format '{% raw %}{{.State.Health.Status}}{% endraw %}' "$container")" = healthy
      args:
        executable: /bin/sh
        chdir: "{{ openclaw_compose_root }}"
      changed_when: false
      register: openclaw_running_validation
      retries: 12
      delay: 5
      until: openclaw_running_validation.rc == 0
      when: not (openclaw_native_cutover_marker_validation.stat.exists | default(false))

    - name: Validate OpenClaw Git, path, and permission boundaries
      ansible.builtin.shell: |
        set -eu
        hooks="$(mktemp -d /run/openclaw-validation-empty-hooks.XXXXXX)"
        chmod 0700 "$hooks"
        trap 'rmdir "$hooks"' EXIT
        git_safe() {
          git \
            -c core.hooksPath="$hooks" \
            -c core.fsmonitor=false \
            -c core.attributesFile=/dev/null \
            -c diff.external= \
            -c pager.status=false \
            "$@"
        }
        test ! -L "{{ openclaw_config_path }}"
        test "$(stat -c '%u:%g %a' "{{ openclaw_setup_root }}")" = "0:{{ openclaw_gid }} 750"
        test "$(stat -c '%u:%g %a' "{{ openclaw_setup_root }}/.git")" = "0:0 700"
        test "$(stat -c '%u:%g %a' "{{ openclaw_config_path }}")" = "0:{{ openclaw_gid }} 640"
        test "$(stat -c '%u:%g %a' "{{ openclaw_gateway_token_path }}")" = "{{ openclaw_uid }}:{{ openclaw_gid }} 600"
        test "$(stat -c '%u:%g %a' "{{ openclaw_state_root }}")" = "{{ openclaw_uid }}:{{ openclaw_gid }} 700"
        test "$(stat -c '%u:%g %a' "{{ openclaw_auth_profile_secret_root }}")" = "{{ openclaw_uid }}:{{ openclaw_gid }} 700"
        test ! -e .gitattributes && test ! -L .gitattributes
        test ! -e .git/info/attributes && test ! -L .git/info/attributes
        test ! -x .git/config
        test "$(git_safe branch --show-current)" = main
        git_safe rev-parse --verify HEAD >/dev/null
        test -z "$(git_safe status --porcelain=v1 --no-ahead-behind)"
        git_safe diff --quiet --no-ext-diff --no-textconv
        git_safe diff --cached --quiet --no-ext-diff --no-textconv
        git_safe --no-pager ls-files --error-unmatch config/openclaw.json >/dev/null
        git_safe --no-pager check-ignore -q .env
        test -z "$(git_safe --no-pager ls-files -- .env)"
        test -z "$(git_safe --no-pager ls-files | grep -E '(^|/)(state|runtime|auth|credentials|sessions|logs|cache|tmp|temp)(/|$)' || true)"
        gateway_token="$(tr -d '\r\n' < "{{ openclaw_gateway_token_path }}")"
        test "$(printf '%s' "$gateway_token" | wc -c)" -eq 64
        printf '%s' "$gateway_token" | grep -Eq '^[0-9a-fA-F]{64}$'
        test -z "$(git_safe --no-pager grep -F -- "$gateway_token" || true)"
        setup="$(realpath "{{ openclaw_setup_root }}")"
        runtime="$(realpath "{{ openclaw_runtime_root }}")"
        case "$runtime" in
          "$setup"|"$setup"/*) exit 1 ;;
        esac
      args:
        executable: /bin/sh
        chdir: "{{ openclaw_setup_root }}"
      environment:
        GIT_CONFIG_NOSYSTEM: "1"
        GIT_CONFIG_SYSTEM: /dev/null
        GIT_CONFIG_GLOBAL: /dev/null
        GIT_PAGER: cat
        GIT_TERMINAL_PROMPT: "0"
      changed_when: false
      no_log: true
      when: not (openclaw_native_cutover_marker_validation.stat.exists | default(false))

    - name: Validate OpenClaw container hardening and mount ownership
      ansible.builtin.shell: |
        set -eu
        container="$(docker compose ps -q openclaw-gateway)"
        test -n "$container"
        docker inspect "$container" | python3 -c 'import json, sys; c = json.load(sys.stdin)[0]; h = c["HostConfig"]; cfg = c["Config"]; mounts = {m["Destination"]: m for m in c["Mounts"]}; ports = h["PortBindings"]; labels = cfg.get("Labels") or {}; valid = cfg["Image"] == "{{ openclaw_rendered_image_validation.stdout | trim }}" and cfg["User"] == "{{ openclaw_uid }}:{{ openclaw_gid }}" and cfg.get("Entrypoint") == ["tini", "-s", "--"] and h["ReadonlyRootfs"] and h["RestartPolicy"]["Name"] == "unless-stopped" and set(h.get("CapDrop") or []) == {"ALL"} and "no-new-privileges:true" in (h.get("SecurityOpt") or []) and h.get("NetworkMode") != "host" and set(ports) == {"18789/tcp"} and ports["18789/tcp"] == [{"HostIp": "127.0.0.1", "HostPort": "{{ openclaw_gateway_port }}"}] and "/tmp" in (h.get("Tmpfs") or {}) and labels.get("com.getarcaneapp.arcane.updater") == "false" and not any(key.startswith("traefik.") for key in labels) and mounts["/etc/openclaw/openclaw.json"]["Source"] == "{{ openclaw_config_path }}" and not mounts["/etc/openclaw/openclaw.json"]["RW"] and mounts["/home/node/.openclaw"]["Source"] == "{{ openclaw_state_root }}" and mounts["/home/node/.openclaw"]["RW"] and mounts["/home/node/.config/openclaw"]["Source"] == "{{ openclaw_auth_profile_secret_root }}" and mounts["/home/node/.config/openclaw"]["RW"] and mounts["/run/secrets/openclaw_gateway_token"]["Source"] == "{{ openclaw_gateway_token_path }}" and not mounts["/run/secrets/openclaw_gateway_token"]["RW"] and not any(m["Destination"] == "/var/run/docker.sock" for m in c["Mounts"]); raise SystemExit(0 if valid else 1)'
      args:
        executable: /bin/sh
        chdir: "{{ openclaw_compose_root }}"
      changed_when: false
      when: not (openclaw_native_cutover_marker_validation.stat.exists | default(false))

    - name: Validate the OpenClaw host listener is loopback-only
      ansible.builtin.shell: |
        set -eu
        listeners="$(ss -H -ltn 'sport = :{{ openclaw_gateway_port }}')"
        test "$(printf '%s\n' "$listeners" | sed '/^$/d' | wc -l)" -eq 1
        printf '%s\n' "$listeners" | grep -Eq '127\.0\.0\.1:{{ openclaw_gateway_port }}([[:space:]]|$)'
        ! printf '%s\n' "$listeners" | grep -Eq '0\.0\.0\.0:{{ openclaw_gateway_port }}|\[::\]:{{ openclaw_gateway_port }}'
      args:
        executable: /bin/sh
      changed_when: false
      when: not (openclaw_native_cutover_marker_validation.stat.exists | default(false))

    - name: Check OpenClaw liveness and readiness endpoints
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ openclaw_gateway_port }}/{{ item }}"
        method: GET
        status_code: 200
        return_content: false
      loop:
        - healthz
        - readyz
      register: openclaw_endpoint_validation
      changed_when: false
      retries: 6
      delay: 5
      until: openclaw_endpoint_validation.status == 200
      when: not (openclaw_native_cutover_marker_validation.stat.exists | default(false))

    - name: Check the OpenClaw CLI version
      ansible.builtin.command:
        cmd: docker compose exec -T openclaw-gateway node dist/index.js --version
        chdir: "{{ openclaw_compose_root }}"
      register: openclaw_cli_version_validation
      changed_when: false
      failed_when: >-
        not (openclaw_cli_version_validation.stdout | trim is match(
          '^OpenClaw [0-9]{4}\.[0-9]+\.[0-9]+$'
        ))
      when: not (openclaw_native_cutover_marker_validation.stat.exists | default(false))

    - name: Check the active OpenClaw config path
      ansible.builtin.command:
        cmd: docker compose exec -T openclaw-gateway node dist/index.js config file
        chdir: "{{ openclaw_compose_root }}"
      register: openclaw_config_file_validation
      changed_when: false
      failed_when: openclaw_config_file_validation.stdout | trim != '/etc/openclaw/openclaw.json'
      when: not (openclaw_native_cutover_marker_validation.stat.exists | default(false))

    - name: Validate the active OpenClaw config schema
      ansible.builtin.command:
        cmd: docker compose exec -T openclaw-gateway node dist/index.js config validate --json
        chdir: "{{ openclaw_compose_root }}"
      register: openclaw_config_schema_validation
      changed_when: false
      failed_when: >-
        openclaw_config_schema_validation.rc != 0 or
        not (openclaw_config_schema_validation.stdout | from_json).valid or
        (openclaw_config_schema_validation.stdout | from_json).warnings | length > 0
      when: not (openclaw_native_cutover_marker_validation.stat.exists | default(false))

    - name: Audit the active OpenClaw secrets
      ansible.builtin.command:
        cmd: docker compose exec -T openclaw-gateway node dist/index.js secrets audit --check --json
        chdir: "{{ openclaw_compose_root }}"
      register: openclaw_secrets_audit_validation
      changed_when: false
      failed_when: >-
        openclaw_secrets_audit_validation.rc != 0 or
        (openclaw_secrets_audit_validation.stdout | from_json).status != 'clean' or
        (openclaw_secrets_audit_validation.stdout | from_json).summary.plaintextCount != 0 or
        (openclaw_secrets_audit_validation.stdout | from_json).summary.unresolvedRefCount != 0
      no_log: true
      when: not (openclaw_native_cutover_marker_validation.stat.exists | default(false))

    - name: Probe the running OpenClaw Gateway RPC endpoint
      ansible.builtin.command:
        cmd: docker compose exec -T openclaw-gateway node dist/index.js gateway probe --json
        chdir: "{{ openclaw_compose_root }}"
      changed_when: false
      when: not (openclaw_native_cutover_marker_validation.stat.exists | default(false))

    - name: Validate VueTorrent assets and qBittorrent selection
      ansible.builtin.script:
        cmd: "{{ playbook_dir }}/../files/validate-vuetorrent.sh"
        executable: /bin/sh
        chdir: "{{ docker_apps_compose_root }}/media"
      changed_when: false

    - name: Check AdGuard Safe Search is disabled
      ansible.builtin.shell: |
        set -eu
        safe_search_enabled="$(
          awk '
            /^  safe_search:$/ { in_safe_search = 1; next }
            in_safe_search && /^    enabled:/ { print $2; exit }
            in_safe_search && /^  [^ ]/ { exit }
          ' adguard/AdGuardHome.yaml
        )"
        test "${safe_search_enabled}" = false
        docker compose exec -T adguard \
          /opt/adguardhome/AdGuardHome --check-config \
          -c /opt/adguardhome/conf/AdGuardHome.yaml
      args:
        executable: /bin/sh
        chdir: "{{ docker_apps_compose_root }}/platform"
      changed_when: false

    - name: Query AdGuard normal DNS
      ansible.builtin.command: dig +short @127.0.0.1 example.com A
      register: adguard_dns_query
      changed_when: false
      failed_when: adguard_dns_query.stdout | length == 0

    - name: Query AdGuard private rewrites
      ansible.builtin.command: "dig +short @127.0.0.1 {{ item }} A"
      register: adguard_private_query
      changed_when: false
      failed_when: docker_apps_ip not in adguard_private_query.stdout_lines
      loop:
        - qbt.home.hchu.me
        - metube.home.hchu.me
        - "{{ t3code_hostname }}"
        - "{{ arcane_hostname }}"
        - "{{ openclaw_hostname }}"

    - name: Check private Traefik routes
      ansible.builtin.command:
        argv:
          - curl
          - --fail
          - --silent
          - --show-error
          - --resolve
          - "{{ item }}:443:127.0.0.1"
          - "https://{{ item }}/"
      changed_when: false
      register: private_traefik_route
      retries: 12
      delay: 10
      until: private_traefik_route.rc == 0
      loop:
        - adguard.home.hchu.me
        - qbt.home.hchu.me
        - metube.home.hchu.me
        - "{{ t3code_hostname }}"
        - "{{ arcane_hostname }}"

    - name: Check retired public qBittorrent route is absent
      ansible.builtin.command:
        argv:
          - curl
          - --silent
          - --show-error
          - --insecure
          - --output
          - /dev/null
          - --write-out
          - "%{http_code}"
          - --resolve
          - public.qbt.home.hchu.me:443:127.0.0.1
          - https://public.qbt.home.hchu.me/
      register: retired_public_qbittorrent_route
      changed_when: false
      failed_when: false
      retries: 12
      delay: 10
      until: >-
        retired_public_qbittorrent_route.rc == 0 and
        retired_public_qbittorrent_route.stdout == '404'

    - name: Check public Copyparty route
      ansible.builtin.command:
        argv:
          - curl
          - --fail
          - --silent
          - --show-error
          - --resolve
          - copyparty.hchu.me:443:127.0.0.1
          - https://copyparty.hchu.me/
      changed_when: false
      register: public_copyparty_route
      retries: 12
      delay: 10
      until: public_copyparty_route.rc == 0

    - name: Check qBittorrent uses the host public address
      ansible.builtin.shell: |
        set -eu
        host_ip="$(curl -4fsS https://api.ipify.org)"
        qbittorrent_ip="$(
          docker compose exec -T qbittorrent sh -c '
            if command -v curl >/dev/null 2>&1; then
              exec curl -4fsS https://api.ipify.org
            fi
            exec wget -qO- https://api.ipify.org
          '
        )"
        test -n "$host_ip"
        test -n "$qbittorrent_ip"
        test "$host_ip" = "$qbittorrent_ip"
      args:
        executable: /bin/sh
        chdir: "{{ docker_apps_compose_root }}/media"
      changed_when: false

    - name: Check direct qBittorrent peer port and Docker publications
      ansible.builtin.shell: |
        set -eu
        direct_listen_port="$(
          docker compose exec -T qbittorrent sh -c '
            if command -v curl >/dev/null 2>&1; then
              exec curl -fsS http://127.0.0.1:8080/api/v2/app/preferences
            fi
            exec wget -qO- http://127.0.0.1:8080/api/v2/app/preferences
          ' | python3 -c 'import json, sys; print(json.load(sys.stdin).get("listen_port", 0))'
        )"
        test "${direct_listen_port}" = "{{ qbittorrent_direct_peer_port }}"
        direct_container="$(docker compose ps -q qbittorrent)"
        test -n "$(docker port "${direct_container}" {{ qbittorrent_direct_peer_port }}/tcp)"
        test -n "$(docker port "${direct_container}" {{ qbittorrent_direct_peer_port }}/udp)"
      args:
        executable: /bin/sh
        chdir: "{{ docker_apps_compose_root }}/media"
      changed_when: false

    - name: Assert retired Compose service containers are absent
      ansible.builtin.command:
        argv:
          - docker
          - ps
          - --all
          - --quiet
          - --filter
          - "label=com.docker.compose.project={{ item.project }}"
          - --filter
          - "label=com.docker.compose.service={{ item.service }}"
      loop: "{{ retired_docker_compose_services | default([]) }}"
      loop_control:
        label: "{{ item.project }}:{{ item.service }}"
      register: retired_docker_compose_service_validation
      changed_when: false
      failed_when: retired_docker_compose_service_validation.stdout | trim | length > 0

    - name: Assert retired Docker volumes are absent
      ansible.builtin.command:
        argv:
          - docker
          - volume
          - inspect
          - "{{ item }}"
      loop: "{{ retired_docker_volumes | default([]) }}"
      register: retired_docker_volume_validation
      changed_when: false
      failed_when: retired_docker_volume_validation.rc != 1

    - name: Assert retired Docker networks are absent
      ansible.builtin.command:
        argv:
          - docker
          - network
          - inspect
          - "{{ item }}"
      loop: "{{ retired_docker_networks | default([]) }}"
      register: retired_docker_network_validation
      changed_when: false
      failed_when: retired_docker_network_validation.rc != 1

    - name: Assert retired local Docker images are absent
      ansible.builtin.command:
        argv:
          - docker
          - image
          - inspect
          - "{{ item }}"
      loop: "{{ retired_docker_images | default([]) }}"
      register: retired_docker_image_validation
      changed_when: false
      failed_when: retired_docker_image_validation.rc != 1
