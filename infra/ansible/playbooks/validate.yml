---
- name: Validate Proxmox LXC root-only settings
  hosts: pve_hosts
  gather_facts: false
  tasks:
    - name: Validate root-only LXC settings match inventory
      ansible.builtin.shell: |
        set -eu
        config="$(pct config "{{ item.vmid }}")"
        {% for setting in item.settings %}
        printf '%s\n' "$config" | grep -Eq '{{ setting.pattern }}' || {
          printf 'Missing {{ setting.description }} on {{ item.name }} ({{ item.vmid }})\n' >&2
          exit 1
        }
        {% endfor %}
      args:
        executable: /bin/sh
      changed_when: false
      loop: "{{ pve_lxc_root_options }}"
      loop_control:
        label: "{{ item.name }} ({{ item.vmid }})"

- name: Validate tailnet
  hosts: svc_tailnet
  gather_facts: false
  tasks:
    - name: Check tailscaled service
      ansible.builtin.command: systemctl is-active tailscaled
      changed_when: false

    - name: Check IP forwarding
      ansible.builtin.command:
        argv:
          - sysctl
          - -n
          - "{{ item }}"
      changed_when: false
      register: tailnet_forwarding
      failed_when: tailnet_forwarding.stdout | trim != "1"
      loop:
        - net.ipv4.ip_forward
        - net.ipv6.conf.all.forwarding

    - name: Check persistent Tailscale UDP GRO service
      ansible.builtin.command:
        argv:
          - systemctl
          - is-enabled
          - tailscale-udp-gro.service
      changed_when: false

    - name: Check Tailscale UDP GRO forwarding
      ansible.builtin.shell: |
        set -eu
        netdev="$(
          ip -o route get 8.8.8.8 |
            awk '{ for (field = 1; field <= NF; field++) if ($field == "dev") { print $(field + 1); exit } }'
        )"
        test -n "${netdev}"
        features="$(ethtool -k "${netdev}")"
        printf '%s\n' "${features}" | grep -Eq '^[[:space:]]*rx-udp-gro-forwarding: on$'
        printf '%s\n' "${features}" | grep -Eq '^[[:space:]]*rx-gro-list: off$'
      args:
        executable: /bin/sh
      changed_when: false

    - name: Check Tailscale status
      ansible.builtin.command: tailscale status
      changed_when: false
      when: tailscale_auth_key is defined

- name: Validate Docker Compose application host
  hosts: svc_docker_apps
  gather_facts: false
  tasks:
    - name: Check Docker Engine
      ansible.builtin.command: systemctl is-active docker
      changed_when: false

    - name: Validate rendered Compose projects
      ansible.builtin.command:
        cmd: docker compose config --quiet
        chdir: "{{ item.dest }}"
      changed_when: false
      loop: "{{ docker_compose_projects }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Require every Compose service to be running
      ansible.builtin.shell: |
        set -eu
        expected="$(docker compose config --services | sort)"
        running="$(docker compose ps --services --status running | sort)"
        test "$expected" = "$running" || {
          printf 'Expected running services:\n%s\nActual running services:\n%s\n' "$expected" "$running" >&2
          docker compose ps >&2
          exit 1
        }
      args:
        executable: /bin/sh
        chdir: "{{ item.dest }}"
      changed_when: false
      retries: 12
      delay: 10
      register: compose_running
      until: compose_running.rc == 0
      loop: "{{ docker_compose_projects }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Validate VueTorrent assets and qBittorrent selection
      ansible.builtin.script:
        cmd: "{{ playbook_dir }}/../files/validate-vuetorrent.sh"
        executable: /bin/sh
        chdir: "{{ docker_apps_compose_root }}/media"
      changed_when: false

    - name: Query AdGuard normal DNS
      ansible.builtin.command: dig +short @127.0.0.1 example.com A
      register: adguard_dns_query
      changed_when: false
      failed_when: adguard_dns_query.stdout | length == 0

    - name: Query AdGuard private rewrites
      ansible.builtin.command: "dig +short @127.0.0.1 {{ item }} A"
      register: adguard_private_query
      changed_when: false
      failed_when: docker_apps_ip not in adguard_private_query.stdout_lines
      loop:
        - qbt.home.hchu.me
        - public.qbt.home.hchu.me
        - metube.home.hchu.me

    - name: Check private Traefik routes
      ansible.builtin.command:
        argv:
          - curl
          - --fail
          - --silent
          - --show-error
          - --resolve
          - "{{ item }}:443:127.0.0.1"
          - "https://{{ item }}/"
      changed_when: false
      register: private_traefik_route
      retries: 12
      delay: 10
      until: private_traefik_route.rc == 0
      loop:
        - adguard.home.hchu.me
        - qbt.home.hchu.me
        - public.qbt.home.hchu.me
        - metube.home.hchu.me

    - name: Check public Copyparty route
      ansible.builtin.command:
        argv:
          - curl
          - --fail
          - --silent
          - --show-error
          - --resolve
          - copyparty.hchu.me:443:127.0.0.1
          - https://copyparty.hchu.me/
      changed_when: false
      register: public_copyparty_route
      retries: 12
      delay: 10
      until: public_copyparty_route.rc == 0

    - name: Check direct and VPN qBittorrent use the intended public addresses
      ansible.builtin.shell: |
        set -eu
        container_public_ip() {
          docker compose exec -T "$1" sh -c '
            if command -v curl >/dev/null 2>&1; then
              exec curl -4fsS https://api.ipify.org
            fi
            exec wget -qO- https://api.ipify.org
          '
        }
        host_ip="$(curl -4fsS https://api.ipify.org)"
        direct_ip="$(container_public_ip qbittorrent)"
        vpn_ip="$(container_public_ip qbittorrent-vpn)"
        gluetun_ip="$(docker compose exec -T gluetun wget -qO- https://api.ipify.org)"
        test -n "$host_ip"
        test -n "$direct_ip"
        test -n "$vpn_ip"
        test -n "$gluetun_ip"
        test "$host_ip" = "$direct_ip"
        test "$host_ip" != "$vpn_ip"
        test "$vpn_ip" = "$gluetun_ip"
      args:
        executable: /bin/sh
        chdir: "{{ docker_apps_compose_root }}/media"
      changed_when: false

    - name: Check direct qBittorrent peer port and Docker publications
      ansible.builtin.shell: |
        set -eu
        direct_listen_port="$(
          docker compose exec -T qbittorrent sh -c '
            if command -v curl >/dev/null 2>&1; then
              exec curl -fsS http://127.0.0.1:8080/api/v2/app/preferences
            fi
            exec wget -qO- http://127.0.0.1:8080/api/v2/app/preferences
          ' | python3 -c 'import json, sys; print(json.load(sys.stdin).get("listen_port", 0))'
        )"
        test "${direct_listen_port}" = "{{ qbittorrent_direct_peer_port }}"
        direct_container="$(docker compose ps -q qbittorrent)"
        test -n "$(docker port "${direct_container}" {{ qbittorrent_direct_peer_port }}/tcp)"
        test -n "$(docker port "${direct_container}" {{ qbittorrent_direct_peer_port }}/udp)"
      args:
        executable: /bin/sh
        chdir: "{{ docker_apps_compose_root }}/media"
      changed_when: false

    - name: Check Gluetun received a Proton forwarded port
      ansible.builtin.command:
        cmd: docker compose exec -T gluetun cat /tmp/gluetun/forwarded_port
        chdir: "{{ docker_apps_compose_root }}/media"
      register: gluetun_forwarded_port
      changed_when: false
      retries: 12
      delay: 10
      until: gluetun_forwarded_port.stdout | trim | int > 0

    - name: Check Proton forwarded port is applied to VPN qBittorrent
      ansible.builtin.shell: |
        set -eu
        applied_state="$(
          docker compose exec -T gluetun \
            wget -qO- http://127.0.0.1:8080/api/v2/app/preferences \
            | python3 -c 'import json, sys; p = json.load(sys.stdin); print(p.get("listen_port", 0), p.get("current_network_interface", ""))'
        )"
        test "${applied_state}" = "{{ gluetun_forwarded_port.stdout | trim }} tun0"
      args:
        executable: /bin/sh
        chdir: "{{ docker_apps_compose_root }}/media"
      changed_when: false
      register: qbittorrent_vpn_forwarded_port
      retries: 12
      delay: 10
      until: qbittorrent_vpn_forwarded_port.rc == 0

    - name: Check Hermes gateway status
      ansible.builtin.command:
        cmd: docker compose exec -T hermes hermes status
        chdir: "{{ docker_apps_compose_root }}/hermes"
      changed_when: false
