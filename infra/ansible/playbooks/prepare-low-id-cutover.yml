---
- name: Prepare the one-time lowest-ID LXC cutover
  hosts: pve_hosts
  gather_facts: false
  pre_tasks:
    - name: Remove retired backup client from Proxmox
      ansible.builtin.apt:
        name: restic
        state: absent
        purge: true
  roles:
    - pve_retire_legacy_lxcs
    - pve_homelab_storage
    - pve_prepare_low_id_cutover
