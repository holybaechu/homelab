---
- name: Stage the dedicated native OpenClaw Gateway without activation
  hosts: svc_openclaw
  gather_facts: true
  any_errors_fatal: true
  pre_tasks:
    - name: Require the tracked staging phase to remain non-activating
      ansible.builtin.assert:
        that:
          - not (openclaw_native_activate | bool)
        fail_msg: >-
          The narrow stage playbook is phase-one only. Activation must run through
          the explicit native migration finalizer.
  roles:
    - common_debian
    - openclaw_native

- name: Reconcile only the OpenClaw Traefik route
  hosts: svc_docker_apps
  gather_facts: false
  any_errors_fatal: true
  roles:
    - openclaw_traefik_route
