---
- name: Bootstrap only the dedicated OpenClaw LXC through Proxmox
  hosts: pve_hosts
  gather_facts: false
  any_errors_fatal: true
  vars:
    openclaw_host: "{{ hostvars['openclaw'].ansible_host }}"
  tasks:
    - name: Select the dedicated OpenClaw root-option declaration
      ansible.builtin.set_fact:
        openclaw_lxc_root_option_candidates: >-
          {{ pve_lxc_root_options | selectattr('name', 'equalto', 'openclaw') | list }}
        openclaw_lxc_access_candidates: >-
          {{ pve_lxc_access_bootstrap | selectattr('name', 'equalto', 'openclaw') | list }}

    - name: Require exactly one dedicated OpenClaw bootstrap declaration
      ansible.builtin.assert:
        that:
          - openclaw_lxc_root_option_candidates | length == 1
          - openclaw_lxc_access_candidates | length == 1
          - openclaw_lxc_root_option_candidates[0].vmid | int == 118
          - openclaw_lxc_access_candidates[0].vmid | int == 118
          - openclaw_lxc_allocation.vmid | int == 118
          - openclaw_lxc_root_option_candidates[0].name == 'openclaw'
          - openclaw_lxc_access_candidates[0].name == 'openclaw'
          - openclaw_lxc_access_candidates[0].os_family == 'debian'
          - openclaw_lxc_allocation.hostname == 'openclaw'
          - openclaw_host == '192.168.0.5'
          - openclaw_lxc_allocation.ip_address == '192.168.0.5/24'
          - openclaw_lxc_allocation.mac_address == '02:00:00:BA:EC:05'
        fail_msg: The narrow bootstrap must resolve only the approved OpenClaw LXC identity.

    - name: Apply root-only settings only to the dedicated OpenClaw LXC
      ansible.builtin.include_role:
        name: pve_lxc_root_options
      vars:
        pve_lxc_root_options: "{{ openclaw_lxc_root_option_candidates }}"

    - name: Install SSH and Python only in the dedicated OpenClaw LXC
      ansible.builtin.include_role:
        name: pve_lxc_access_bootstrap
      vars:
        pve_lxc_access_bootstrap: "{{ openclaw_lxc_access_candidates }}"

    - name: Read the dedicated OpenClaw SSH host key through Proxmox
      ansible.builtin.command:
        argv:
          - pct
          - exec
          - "{{ openclaw_lxc_allocation.vmid }}"
          - --
          - /bin/cat
          - /etc/ssh/ssh_host_ed25519_key.pub
      register: openclaw_lxc_host_key
      changed_when: false

    - name: Require one valid dedicated OpenClaw ed25519 host key
      ansible.builtin.assert:
        that:
          - openclaw_lxc_host_key.stdout_lines | length == 1
          - openclaw_lxc_host_key.stdout is match('^ssh-ed25519 [A-Za-z0-9+/]+={0,2}( [^\r\n]+)?$')
        fail_msg: Proxmox returned an invalid dedicated OpenClaw SSH host key.

    - name: Require an exact 32-byte dedicated OpenClaw ed25519 public-key payload
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - >-
            import base64, struct, sys;
            raw = base64.b64decode(sys.argv[1], validate=True);
            size = struct.unpack('>I', raw[:4])[0];
            name = raw[4:4 + size];
            offset = 4 + size;
            key_size = struct.unpack('>I', raw[offset:offset + 4])[0];
            key = raw[offset + 4:];
            raise SystemExit(0 if name == b'ssh-ed25519' and key_size == 32 and len(key) == 32 else 1)
          - "{{ openclaw_lxc_host_key.stdout.split()[1] }}"
      delegate_to: localhost
      changed_when: false

    - name: Trust only the dedicated OpenClaw SSH host key
      ansible.builtin.known_hosts:
        path: "{{ lookup('env', 'HOME') }}/.ssh/known_hosts"
        name: "{{ openclaw_host }}"
        key: "{{ openclaw_host }} {{ openclaw_lxc_host_key.stdout }}"
      delegate_to: localhost

    - name: Wait only for the dedicated OpenClaw SSH port
      ansible.builtin.wait_for:
        host: "{{ openclaw_host }}"
        port: 22
        state: started
        connect_timeout: 5
        delay: 2
        timeout: 600
      delegate_to: localhost

- name: Bootstrap Debian only on the dedicated OpenClaw LXC
  hosts: svc_openclaw
  gather_facts: false
  any_errors_fatal: true
  roles:
    - common_debian
