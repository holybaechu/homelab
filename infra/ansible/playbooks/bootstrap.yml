---
- name: Configure Proxmox homelab data storage
  hosts: pve_hosts
  gather_facts: false
  roles:
    - pve_homelab_storage
  post_tasks:
    - name: Read Proxmox root CA for the Traefik upstream trust store
      ansible.builtin.slurp:
        src: /etc/pve/pve-root-ca.pem
      register: pve_root_ca

    - name: Retain Proxmox root CA for later LXC bootstrap plays
      ansible.builtin.set_fact:
        pve_root_ca_pem: "{{ pve_root_ca.content | b64decode }}"
      no_log: true

- name: Configure Proxmox root-only LXC options
  hosts: pve_hosts
  gather_facts: false
  roles:
    - pve_lxc_root_options

- name: Bootstrap LXC SSH and Python access from Proxmox
  hosts: pve_hosts
  gather_facts: false
  roles:
    - pve_lxc_access_bootstrap

- name: Trust LXC SSH host keys
  hosts: pve_hosts
  gather_facts: false
  tasks:
    - name: Read LXC ed25519 host public keys through pct exec
      ansible.builtin.command:
        argv:
          - pct
          - exec
          - "{{ hostvars[item].vmid }}"
          - --
          - /bin/sh
          - -lc
          - cat /etc/ssh/ssh_host_ed25519_key.pub
      changed_when: false
      register: pve_lxc_host_key_results
      loop: "{{ groups['debian'] }}"
      loop_control:
        label: "{{ item }} ({{ hostvars[item].vmid }})"

    - name: Ensure local SSH directory exists
      ansible.builtin.file:
        path: "{{ lookup('env', 'HOME') }}/.ssh"
        state: directory
        mode: "0700"
      delegate_to: localhost
      run_once: true

    - name: Add LXC SSH host keys to known_hosts
      ansible.builtin.known_hosts:
        path: "{{ lookup('env', 'HOME') }}/.ssh/known_hosts"
        name: "{{ hostvars[item.item].ansible_host }}"
        key: "{{ hostvars[item.item].ansible_host }} {{ item.stdout }}"
      delegate_to: localhost
      loop: "{{ pve_lxc_host_key_results.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Wait for LXC SSH ports to accept connections
      ansible.builtin.wait_for:
        host: "{{ hostvars[item].ansible_host }}"
        port: 22
        state: started
        connect_timeout: 5
        delay: 2
        timeout: 600
      delegate_to: localhost
      loop: "{{ groups['debian'] }}"
      loop_control:
        label: "{{ item }}"

- name: Install Proxmox CA on the Docker application LXC
  hosts: svc_docker_apps
  gather_facts: false
  tasks:
    - name: Install Proxmox root CA for verified Traefik upstream TLS
      ansible.builtin.copy:
        content: "{{ hostvars['pve'].pve_root_ca_pem }}"
        dest: /etc/ssl/certs/homelab-pve-root-ca.pem
        owner: root
        group: root
        mode: "0644"
      no_log: true
