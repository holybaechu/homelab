---
- name: Require Arcane control-plane secrets
  ansible.builtin.assert:
    that:
      - arcane_encryption_key is defined
      - arcane_encryption_key is string
      - arcane_encryption_key is match('^[0-9a-fA-F]{64}$')
      - arcane_jwt_secret is defined
      - arcane_jwt_secret is string
      - arcane_jwt_secret | length >= 32
    fail_msg: >-
      Configure the stable Arcane encryption key and JWT secret in the prod
      secret store before deploying the control plane.
  no_log: true

- name: Keep the Arcane control plane outside its managed project tree
  ansible.builtin.assert:
    that:
      - arcane_control_root != arcane_projects_root
      - not arcane_control_root.startswith(arcane_projects_root + '/')
      - not arcane_projects_root.startswith(arcane_control_root + '/')
    fail_msg: Arcane must not manage or Git-sync its own control-plane Compose project.

- name: Require the persistent homelab mount before writing Arcane state
  ansible.builtin.command: "mountpoint -q {{ docker_apps_data_root }}"
  changed_when: false

- name: Inspect existing workload Compose files before Arcane adoption
  ansible.builtin.stat:
    path: >-
      {{ arcane_projects_root }}/{{ item.name }}/{{ item.compose_path | basename }}
  loop: "{{ arcane_gitops_projects }}"
  loop_control:
    label: "{{ item.name }}"
  register: arcane_workload_compose_files

- name: Require each Arcane adoption target to have its exact Compose file
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg
    fail_msg: >-
      Arcane cannot safely adopt {{ item.item.name }} because its expected
      Compose file is missing.
  loop: "{{ arcane_workload_compose_files.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Reject alternate root Compose files before Arcane adoption
  ansible.builtin.find:
    paths: "{{ arcane_projects_root }}/{{ item.name }}"
    recurse: false
    file_type: file
    patterns:
      - compose.yaml
      - docker-compose.yml
      - docker-compose.yaml
  loop: "{{ arcane_gitops_projects }}"
  loop_control:
    label: "{{ item.name }}"
  register: arcane_alternate_compose_files
  failed_when: arcane_alternate_compose_files.matched > 0

- name: Create Arcane control-plane directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ arcane_control_root }}"
      owner: root
      group: root
      mode: "0755"
    - path: "{{ arcane_secret_root }}"
      owner: root
      group: "{{ arcane_gid }}"
      mode: "0750"
    - path: "{{ arcane_data_root }}"
      owner: "{{ arcane_uid }}"
      group: "{{ arcane_gid }}"
      mode: "0750"
    - path: "{{ arcane_projects_root }}"
      owner: "{{ arcane_uid }}"
      group: "{{ arcane_gid }}"
      mode: "0755"
  loop_control:
    label: "{{ item.path }}"

- name: Inspect the shared Traefik proxy subnet
  ansible.builtin.command:
    argv:
      - docker
      - network
      - inspect
      - --format
      - "{% raw %}{{ (index .IPAM.Config 0).Subnet }}{% endraw %}"
      - "{{ traefik_proxy_network }}"
  register: arcane_proxy_network
  changed_when: false
  failed_when: >-
    arcane_proxy_network.rc != 0 or
    arcane_proxy_network.stdout | trim | length == 0

- name: Install Arcane control-plane secrets
  ansible.builtin.copy:
    content: "{{ item.value }}\n"
    dest: "{{ arcane_secret_root }}/{{ item.name }}"
    owner: root
    group: "{{ arcane_gid }}"
    mode: "0640"
  loop:
    - name: encryption_key
      value: "{{ arcane_encryption_key }}"
    - name: jwt_secret
      value: "{{ arcane_jwt_secret }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true
  diff: false

- name: Copy the Ansible-owned Arcane control project
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../../apps/compose/arcane/"
    dest: "{{ arcane_control_root }}/"
    owner: root
    group: root
    mode: preserve

- name: Remove any stale Arcane bootstrap key
  ansible.builtin.file:
    path: "{{ arcane_secret_root }}/bootstrap_admin_api_key"
    state: absent

- name: Render the default keyless Arcane environment
  ansible.builtin.template:
    src: arcane.env.j2
    dest: "{{ arcane_control_root }}/.env"
    owner: root
    group: root
    mode: "0600"
  vars:
    arcane_bootstrap_static_key_enabled: false
  no_log: true
  diff: false

- name: Validate the Arcane control project
  ansible.builtin.command:
    cmd: docker compose config --quiet
    chdir: "{{ arcane_control_root }}"
  changed_when: false

- name: Pull pinned Arcane control-plane images
  ansible.builtin.command:
    cmd: docker compose pull
    chdir: "{{ arcane_control_root }}"
  changed_when: false

- name: Reconcile Arcane resources through a temporary static key
  block:
    - name: Generate an ephemeral Arcane bootstrap key
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - import secrets; print('arc_' + secrets.token_hex(32))
      register: arcane_bootstrap_key
      changed_when: true
      no_log: true

    - name: Install the ephemeral Arcane bootstrap key
      ansible.builtin.copy:
        content: "{{ arcane_bootstrap_key.stdout }}\n"
        dest: "{{ arcane_secret_root }}/bootstrap_admin_api_key"
        owner: root
        group: "{{ arcane_gid }}"
        mode: "0640"
      no_log: true
      diff: false

    - name: Render the bootstrap Arcane environment
      ansible.builtin.template:
        src: arcane.env.j2
        dest: "{{ arcane_control_root }}/.env"
        owner: root
        group: root
        mode: "0600"
      vars:
        arcane_bootstrap_static_key_enabled: true
      no_log: true
      diff: false

    - name: Start Arcane with the temporary bootstrap key
      ansible.builtin.command:
        cmd: docker compose up -d --force-recreate --remove-orphans
        chdir: "{{ arcane_control_root }}"
      changed_when: true

    - name: Wait for the bootstrap Arcane API
      ansible.builtin.uri:
        url: "{{ arcane_health_url }}"
        method: GET
        status_code: 200
        return_content: false
      register: arcane_bootstrap_health
      changed_when: false
      retries: 12
      delay: 5
      until: arcane_bootstrap_health.status == 200

    - name: Reconcile Arcane GitOps and GitHub OIDC resources
      ansible.builtin.script:
        cmd: >-
          {{ playbook_dir }}/../../../scripts/ci/reconcile-arcane.py
          --base-url {{ arcane_local_url }}
          --repository-name {{ arcane_repository_name }}
          --repository-url {{ arcane_repository_url }}
          --branch {{ arcane_repository_branch }}
          --role-name {{ arcane_ci_role_name }}
          --credential-name {{ arcane_ci_credential_name }}
          --issuer {{ arcane_ci_oidc_issuer }}
          --audience {{ arcane_ci_oidc_audience }}
          --subject {{ arcane_ci_oidc_subject }}
          {% for project in arcane_gitops_projects %}
          --project {{ project.name }}={{ project.compose_path }}
          {% endfor %}
          {% for project in arcane_retired_gitops_projects | default([]) %}
          --retired-project {{ project.name }}={{ project.compose_path }}
          {% endfor %}
      environment:
        ARCANE_ADMIN_STATIC_API_KEY: "{{ arcane_bootstrap_key.stdout }}"
      register: arcane_reconcile
      changed_when: "'changed=true' in arcane_reconcile.stdout"
      no_log: true
  always:
    - name: Remove the Arcane bootstrap key file
      ansible.builtin.file:
        path: "{{ arcane_secret_root }}/bootstrap_admin_api_key"
        state: absent

    - name: Render Arcane without a static admin key
      ansible.builtin.template:
        src: arcane.env.j2
        dest: "{{ arcane_control_root }}/.env"
        owner: root
        group: root
        mode: "0600"
      vars:
        arcane_bootstrap_static_key_enabled: false
      no_log: true
      diff: false

    - name: Force Arcane into its final keyless state
      ansible.builtin.command:
        cmd: docker compose up -d --force-recreate arcane
        chdir: "{{ arcane_control_root }}"
      changed_when: true

    - name: Wait for the final Arcane API health endpoint
      ansible.builtin.uri:
        url: "{{ arcane_health_url }}"
        method: GET
        status_code: 200
        return_content: false
      register: arcane_final_health
      changed_when: false
      retries: 12
      delay: 5
      until: arcane_final_health.status == 200
