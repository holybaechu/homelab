---
- name: Require the existing platform project before the narrow route stage
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop:
    - "{{ docker_apps_compose_root }}/platform"
    - "{{ docker_apps_compose_root }}/platform/compose.yml"
    - "{{ docker_apps_compose_root }}/platform/.env"
  register: openclaw_traefik_platform_paths

- name: Reject an incomplete or redirected platform project
  ansible.builtin.assert:
    that:
      - openclaw_traefik_platform_paths.results[0].stat.isdir | default(false)
      - not (openclaw_traefik_platform_paths.results[0].stat.islnk | default(false))
      - openclaw_traefik_platform_paths.results[1].stat.isreg | default(false)
      - not (openclaw_traefik_platform_paths.results[1].stat.islnk | default(false))
      - openclaw_traefik_platform_paths.results[2].stat.isreg | default(false)
      - not (openclaw_traefik_platform_paths.results[2].stat.islnk | default(false))
    fail_msg: >-
      The narrow OpenClaw route stage requires the existing regular platform
      Compose project and environment file.

- name: Require Docker before the narrow route stage
  ansible.builtin.command: systemctl is-active docker
  changed_when: false

- name: Inspect the tracked Traefik dynamic configuration directory
  ansible.builtin.stat:
    path: "{{ docker_apps_compose_root }}/platform/dynamic"
    follow: false
  register: openclaw_traefik_dynamic_directory

- name: Reject a redirected Traefik dynamic configuration directory
  ansible.builtin.assert:
    that:
      - >-
        not (openclaw_traefik_dynamic_directory.stat.exists | default(false)) or
        (
          openclaw_traefik_dynamic_directory.stat.isdir | default(false) and
          not (openclaw_traefik_dynamic_directory.stat.islnk | default(false))
        )
    fail_msg: The tracked Traefik dynamic directory must not be a symlink or non-directory.

- name: Create the tracked Traefik dynamic configuration directory
  ansible.builtin.file:
    path: "{{ docker_apps_compose_root }}/platform/dynamic"
    state: directory
    owner: "{{ service_uid }}"
    group: "{{ service_gid }}"
    mode: "0755"
    follow: false

- name: Copy the complete phase-coupled Traefik dynamic configuration
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../../apps/compose/platform/dynamic/routes.yml"
    dest: "{{ docker_apps_compose_root }}/platform/dynamic/routes.yml"
    owner: "{{ service_uid }}"
    group: "{{ service_gid }}"
    mode: "0644"
  register: openclaw_traefik_routes_copy

- name: Copy the Traefik static configuration
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../../apps/compose/platform/traefik.yml"
    dest: "{{ docker_apps_compose_root }}/platform/traefik.yml"
    owner: "{{ service_uid }}"
    group: "{{ service_gid }}"
    mode: "0644"
  register: openclaw_traefik_static_copy

- name: Copy the platform Compose definition last
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../../apps/compose/platform/compose.yml"
    dest: "{{ docker_apps_compose_root }}/platform/compose.yml"
    owner: "{{ service_uid }}"
    group: "{{ service_gid }}"
    mode: "0644"
  register: openclaw_traefik_compose_copy

- name: Validate the narrowly updated platform project
  ansible.builtin.command:
    cmd: docker compose config --quiet
    chdir: "{{ docker_apps_compose_root }}/platform"
  changed_when: false

- name: Read the narrowly updated platform services
  ansible.builtin.command:
    cmd: docker compose config --services
    chdir: "{{ docker_apps_compose_root }}/platform"
  register: openclaw_traefik_platform_services
  changed_when: false
  failed_when: >-
    openclaw_traefik_platform_services.rc != 0 or
    'traefik' not in openclaw_traefik_platform_services.stdout_lines

- name: Compute the desired Traefik runtime contract
  ansible.builtin.shell: |
    set -eu
    sha256sum compose.yml traefik.yml | sha256sum | awk '{print $1}'
  args:
    executable: /bin/sh
    chdir: "{{ docker_apps_compose_root }}/platform"
  register: openclaw_traefik_runtime_contract
  changed_when: false
  failed_when: >-
    openclaw_traefik_runtime_contract.rc != 0 or
    not (openclaw_traefik_runtime_contract.stdout | trim is match('^[0-9a-f]{64}$'))

- name: Require the fixed Traefik runtime contract checkpoint path
  ansible.builtin.assert:
    that:
      - openclaw_traefik_runtime_contract_marker_path == '/opt/homelab-control/openclaw/traefik-runtime-contract.sha256'
    fail_msg: The Traefik runtime contract checkpoint path is not the reviewed control path.

- name: Inspect the Traefik runtime contract checkpoint directory
  ansible.builtin.stat:
    path: "{{ openclaw_traefik_runtime_contract_marker_path | dirname }}"
    follow: false
  register: openclaw_traefik_runtime_contract_directory

- name: Require the protected Traefik runtime contract checkpoint directory
  ansible.builtin.assert:
    that:
      - openclaw_traefik_runtime_contract_directory.stat.isdir | default(false)
      - not (openclaw_traefik_runtime_contract_directory.stat.islnk | default(false))
      - openclaw_traefik_runtime_contract_directory.stat.uid == 0
      - openclaw_traefik_runtime_contract_directory.stat.gid == 0
      - openclaw_traefik_runtime_contract_directory.stat.mode == '0755'
    fail_msg: The Traefik runtime contract checkpoint directory is unsafe.

- name: Inspect the applied Traefik runtime contract marker
  ansible.builtin.stat:
    path: "{{ openclaw_traefik_runtime_contract_marker_path }}"
    follow: false
  register: openclaw_traefik_runtime_contract_marker

- name: Read the applied Traefik runtime contract marker
  ansible.builtin.slurp:
    src: "{{ openclaw_traefik_runtime_contract_marker_path }}"
  register: openclaw_traefik_runtime_contract_marker_content
  when: >-
    openclaw_traefik_runtime_contract_marker.stat.isreg | default(false) and
    not (openclaw_traefik_runtime_contract_marker.stat.islnk | default(false)) and
    openclaw_traefik_runtime_contract_marker.stat.uid == 0 and
    openclaw_traefik_runtime_contract_marker.stat.gid == 0 and
    openclaw_traefik_runtime_contract_marker.stat.mode == '0600'

- name: Reject an unsafe Traefik runtime contract marker
  ansible.builtin.assert:
    that:
      - >-
        not (openclaw_traefik_runtime_contract_marker.stat.exists | default(false)) or
        (
          openclaw_traefik_runtime_contract_marker.stat.isreg | default(false) and
          not (openclaw_traefik_runtime_contract_marker.stat.islnk | default(false)) and
          openclaw_traefik_runtime_contract_marker.stat.uid == 0 and
          openclaw_traefik_runtime_contract_marker.stat.gid == 0 and
          openclaw_traefik_runtime_contract_marker.stat.mode == '0600' and
          (
            openclaw_traefik_runtime_contract_marker_content.content |
            default('') | b64decode
          ) is match('^[0-9a-f]{64}\\n$')
        )
    fail_msg: >-
      The applied Traefik runtime contract marker is unsafe; refusing to
      recreate or overwrite through an untrusted filesystem object.

- name: Select durable Traefik runtime contract reconciliation
  ansible.builtin.set_fact:
    openclaw_traefik_runtime_contract_requires_recreate: >-
      {{
        not (openclaw_traefik_runtime_contract_marker.stat.exists | default(false)) or
        (openclaw_traefik_runtime_contract_marker_content.content | default('') | b64decode | trim) !=
          (openclaw_traefik_runtime_contract.stdout | trim)
      }}

- name: Recreate only Traefik for an unapplied runtime contract
  ansible.builtin.command:
    cmd: docker compose up -d --force-recreate --no-deps traefik
    chdir: "{{ docker_apps_compose_root }}/platform"
  register: openclaw_traefik_targeted_recreate
  changed_when: true
  when: openclaw_traefik_runtime_contract_requires_recreate | bool

- name: Wait for the narrowly reconciled Traefik service
  ansible.builtin.shell: |
    set -eu
    container="$(docker compose ps -q traefik)"
    test -n "$container"
    test "$(docker inspect --format '{% raw %}{{.State.Status}}{% endraw %}' "$container")" = running
    test "$(docker inspect --format '{% raw %}{{.State.Health.Status}}{% endraw %}' "$container")" = healthy
  args:
    executable: /bin/sh
    chdir: "{{ docker_apps_compose_root }}/platform"
  register: openclaw_traefik_targeted_health
  changed_when: false
  retries: 18
  delay: 5
  until: openclaw_traefik_targeted_health.rc == 0

- name: Commit the applied Traefik runtime contract atomically
  ansible.builtin.copy:
    content: "{{ openclaw_traefik_runtime_contract.stdout | trim }}\n"
    dest: "{{ openclaw_traefik_runtime_contract_marker_path }}"
    owner: root
    group: root
    mode: "0600"
    unsafe_writes: false
  when: openclaw_traefik_runtime_contract_requires_recreate | bool

- name: Remove the superseded single-file Traefik configuration
  ansible.builtin.file:
    path: "{{ docker_apps_compose_root }}/platform/dynamic.yml"
    state: absent
