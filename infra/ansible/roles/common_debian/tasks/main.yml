---
- name: Install Debian base packages
  ansible.builtin.apt:
    name: "{{ common_debian_packages }}"
    update_cache: "{{ homelab_maintenance_upgrade | default(false) | bool }}"
    cache_valid_time: >-
      {{ 3600
         if (homelab_maintenance_upgrade | default(false) | bool)
         else omit }}
    state: >-
      {{ 'latest'
         if (homelab_maintenance_upgrade | default(false) | bool)
         else 'present' }}

- name: Set timezone
  community.general.timezone:
    name: "{{ homelab_timezone }}"

- name: Create service group
  ansible.builtin.group:
    name: "{{ service_group }}"
    gid: "{{ service_gid }}"
    state: present
  when: common_debian_create_service_account | default(true) | bool

- name: Create service user
  ansible.builtin.user:
    name: "{{ service_user }}"
    uid: "{{ service_uid }}"
    group: "{{ service_group }}"
    shell: /usr/sbin/nologin
    create_home: false
    state: present
  when: common_debian_create_service_account | default(true) | bool

- name: Configure Debian SSH hardening
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?{{ item.split()[0] }}\s+'
    line: "{{ item }}"
    validate: /usr/sbin/sshd -t -f %s
  loop:
    - PasswordAuthentication no
    - KbdInteractiveAuthentication no
    - ChallengeResponseAuthentication no
    - PermitRootLogin prohibit-password
  notify: Restart Debian ssh
