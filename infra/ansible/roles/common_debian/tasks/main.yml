---
- name: Install Debian base packages
  ansible.builtin.apt:
    name: "{{ common_debian_packages }}"
    update_cache: "{{ homelab_maintenance_upgrade | default(false) | bool }}"
    cache_valid_time: >-
      {{ 3600
         if (homelab_maintenance_upgrade | default(false) | bool)
         else omit }}
    state: >-
      {{ 'latest'
         if (homelab_maintenance_upgrade | default(false) | bool)
         else 'present' }}

- name: Read the configured timezone
  ansible.builtin.command:
    argv: [timedatectl, show, --property=Timezone, --value]
  register: common_debian_current_timezone
  changed_when: false

- name: Set the configured timezone
  ansible.builtin.command:
    argv: [timedatectl, set-timezone, "{{ homelab_timezone }}"]
  when: common_debian_current_timezone.stdout != homelab_timezone

- name: Configure Debian SSH hardening
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?{{ item.split()[0] }}\s+'
    line: "{{ item }}"
    validate: /usr/sbin/sshd -t -f %s
  loop:
    - PasswordAuthentication no
    - KbdInteractiveAuthentication no
    - ChallengeResponseAuthentication no
    - PermitRootLogin prohibit-password
  notify: Restart Debian ssh
