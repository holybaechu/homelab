---
- name: Reload isolated CTF executor SSH after transport update
  ansible.builtin.systemd_service:
    name: ssh.service
    state: reloaded

- name: Restart OpenClaw Gateway after CTF transport update
  ansible.builtin.systemd_service:
    name: openclaw-gateway.service
    state: restarted
  delegate_to: openclaw
  when:
    - hostvars['openclaw'].openclaw_native_activate | default(false) | bool
    - not (hostvars['openclaw'].openclaw_docker_rollback_activate | default(false) | bool)
