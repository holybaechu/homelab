---
- name: Require the restricted OpenClaw CTF Docker transport contract
  ansible.builtin.assert:
    that:
      - openclaw_ctf_docker_user == 'openclaw-ctf-docker'
      - openclaw_ctf_docker_host == 'ssh://' + openclaw_ctf_docker_user + '@' + ctf_executor_ip
      - openclaw_ctf_docker_client_key_path == '/etc/openclaw/secrets/ctf_docker_client_key'
      - openclaw_ctf_docker_known_hosts_path == '/etc/openclaw/secrets/ctf_docker_known_hosts'
      - openclaw_ip is match('^(?:(?:25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])\\.){3}(?:25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])$')
      - ctf_executor_ip is match('^(?:(?:25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])\\.){3}(?:25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])$')
      - openclaw_ip != ctf_executor_ip
    fail_msg: The isolated CTF Docker SSH transport variables are invalid.

- name: Read the Gateway CTF Docker transport public key
  ansible.builtin.slurp:
    src: "{{ openclaw_ctf_docker_client_key_path }}.pub"
  delegate_to: openclaw
  register: openclaw_ctf_gateway_transport_public_key
  no_log: true

- name: Require the Gateway CTF Docker transport public-key type
  ansible.builtin.assert:
    that:
      - >-
        (openclaw_ctf_gateway_transport_public_key.content | b64decode | trim)
        is match('^ssh-ed25519 [A-Za-z0-9+/]+(?: [^\s]+)?$')
    fail_msg: The Gateway CTF Docker transport public key is not an ed25519 key.
  no_log: true

- name: Install the Gateway-only forced Docker transport key
  ansible.builtin.copy:
    content: |
      from="{{ openclaw_ip }}",command="/usr/bin/docker system dial-stdio",no-agent-forwarding,no-port-forwarding,no-pty,no-user-rc,no-X11-forwarding {{ openclaw_ctf_gateway_transport_public_key.content | b64decode | trim }}
    dest: "/var/lib/{{ openclaw_ctf_docker_user }}/.ssh/authorized_keys"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Reload isolated CTF executor SSH after transport update

- name: Read the isolated CTF executor SSH host key
  ansible.builtin.slurp:
    src: /etc/ssh/ssh_host_ed25519_key.pub
  register: openclaw_ctf_executor_host_public_key
  no_log: true

- name: Pin the isolated CTF executor host key for the Gateway Docker transport
  ansible.builtin.copy:
    content: >-
      {{ ctf_executor_ip }} {{ openclaw_ctf_executor_host_public_key.content | b64decode | trim }}
    dest: "{{ openclaw_ctf_docker_known_hosts_path }}"
    owner: root
    group: root
    mode: "0600"
  delegate_to: openclaw
  no_log: true
  notify: Restart OpenClaw Gateway after CTF transport update

- name: Validate the restricted remote CTF Docker transport
  when: hostvars['openclaw'].openclaw_native_activate | default(false) | bool
  no_log: true
  block:
    - name: Create a temporary Gateway CTF Docker transport credential directory
      ansible.builtin.tempfile:
        state: directory
        path: /run
        prefix: openclaw-ctf-docker-transport-
      delegate_to: openclaw
      register: openclaw_ctf_transport_credential_dir

    - name: Protect the temporary Gateway CTF Docker transport credential directory
      ansible.builtin.file:
        path: "{{ openclaw_ctf_transport_credential_dir.path }}"
        state: directory
        owner: root
        group: "{{ hostvars['openclaw'].openclaw_group }}"
        mode: "0750"
      delegate_to: openclaw

    - name: Materialize a service-user CTF Docker transport identity
      ansible.builtin.copy:
        src: "{{ openclaw_ctf_docker_client_key_path }}"
        dest: "{{ openclaw_ctf_transport_credential_dir.path }}/ctf_docker_client_key"
        remote_src: true
        owner: "{{ hostvars['openclaw'].openclaw_user }}"
        group: "{{ hostvars['openclaw'].openclaw_group }}"
        mode: "0400"
      delegate_to: openclaw

    - name: Materialize a service-user pinned CTF executor host key
      ansible.builtin.copy:
        src: "{{ openclaw_ctf_docker_known_hosts_path }}"
        dest: "{{ openclaw_ctf_transport_credential_dir.path }}/ctf_docker_known_hosts"
        remote_src: true
        owner: "{{ hostvars['openclaw'].openclaw_user }}"
        group: "{{ hostvars['openclaw'].openclaw_group }}"
        mode: "0400"
      delegate_to: openclaw

    - name: Prove the Gateway can reach only the remote CTF Docker API
      ansible.builtin.command:
        argv:
          - /usr/bin/docker
          - version
      become: true
      become_user: "{{ hostvars['openclaw'].openclaw_user }}"
      environment:
        DOCKER_HOST: "{{ openclaw_ctf_docker_host }}"
        DOCKER_SSH_COMMAND: >-
          /usr/bin/ssh -F /dev/null -o BatchMode=yes -o IdentitiesOnly=yes
          -o StrictHostKeyChecking=yes
          -o UserKnownHostsFile={{ openclaw_ctf_transport_credential_dir.path }}/ctf_docker_known_hosts
          -o GlobalKnownHostsFile=/dev/null -o PasswordAuthentication=no
          -o KbdInteractiveAuthentication=no -o PreferredAuthentications=publickey
          -i {{ openclaw_ctf_transport_credential_dir.path }}/ctf_docker_client_key
      delegate_to: openclaw
      changed_when: false
  always:
    - name: Remove the temporary Gateway CTF Docker transport credential directory
      ansible.builtin.file:
        path: "{{ openclaw_ctf_transport_credential_dir.path }}"
        state: absent
      delegate_to: openclaw
      when: openclaw_ctf_transport_credential_dir.path is defined
      failed_when: false

- name: Reload CTF transport credentials in the Gateway service
  ansible.builtin.meta: flush_handlers
