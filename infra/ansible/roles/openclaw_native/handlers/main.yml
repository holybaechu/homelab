---
- name: Reload OpenClaw systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart OpenClaw Docker
  ansible.builtin.systemd_service:
    name: docker.service
    state: restarted
    enabled: true

- name: Reload OpenClaw nftables
  ansible.builtin.systemd_service:
    name: nftables.service
    state: reloaded
    enabled: true
