---
- name: Read and classify the bounded native OpenClaw journal privately
  ansible.builtin.script:
    cmd: classify_openclaw_journal.py
    executable: /usr/bin/python3
  register: openclaw_journal_classification
  changed_when: false
  failed_when: false
  no_log: true

- name: Validate the fixed native OpenClaw journal classification grammar
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - |
        import re
        import sys

        keys = (
            'journal-query-failed',
            'journal-truncated',
            'journal-records',
            'credential-unavailable',
            'gateway-lock-conflict',
            'gateway-lock-access',
            'listener-address-in-use',
            'listener-address-unavailable',
            'listener-bind-permission',
            'http-listener-startup',
            'filesystem-permission',
            'required-path-missing',
            'sqlite-startup',
            'startup-migration',
            'module-loader',
            'config-startup-guard',
            'plugin-bootstrap',
            'uncategorized-application-error',
        )
        raw = sys.stdin.buffer.read()
        if sys.argv[1] != '0' or not raw or b'\r' in raw:
            raise SystemExit(1)
        try:
            text = raw.decode('ascii')
        except UnicodeDecodeError:
            raise SystemExit(1)
        if text.endswith('\n'):
            text = text[:-1]
        if not text or text.endswith('\n'):
            raise SystemExit(1)
        lines = text.split('\n')
        if len(lines) != len(keys):
            raise SystemExit(1)
        values = {}
        for key, line in zip(keys, lines):
            match = re.fullmatch(re.escape(key) + r'=([0-9]{1,3})', line)
            if match is None:
                raise SystemExit(1)
            value = int(match.group(1))
            if value > 200:
                raise SystemExit(1)
            values[key] = value
        if values['journal-query-failed'] > 1 or values['journal-truncated'] > 1:
            raise SystemExit(1)
        if values['journal-query-failed'] != 0 or values['journal-records'] == 0:
            raise SystemExit(1)
        if sum(values[key] for key in keys[3:]) == 0:
            raise SystemExit(1)
      - "{{ openclaw_journal_classification.rc | string }}"
    stdin: "{{ openclaw_journal_classification.stdout }}"
    stdin_add_newline: false
  register: openclaw_journal_classification_validation
  changed_when: false
  failed_when: false
  no_log: true

- name: Require a valid fixed native OpenClaw journal classification
  ansible.builtin.assert:
    that:
      - openclaw_journal_classification_validation.rc == 0
    fail_msg: >-
      The bounded native OpenClaw journal classifier returned an invalid fixed
      counter schema; no retained failure state was reset.

- name: Report only validated native OpenClaw journal category counters
  ansible.builtin.debug:
    msg: "{{ openclaw_journal_classification.stdout_lines }}"
