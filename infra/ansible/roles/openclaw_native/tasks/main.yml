---
- name: Require the immutable OpenClaw host contract
  ansible.builtin.assert:
    that:
      - ansible_system == 'Linux'
      - ansible_architecture == 'x86_64'
      - inventory_hostname == 'openclaw'
      - ansible_host == hostvars['openclaw'].ansible_host
      - openclaw_install_root == '/opt/openclaw'
      - openclaw_state_root == '/var/lib/openclaw'
      - openclaw_secret_root == '/etc/openclaw/secrets'
      - openclaw_uid | int == 1000
      - openclaw_gid | int == 1000
      - openclaw_ctf_uid | int == openclaw_uid | int
      - openclaw_ctf_gid | int == openclaw_gid | int
      - openclaw_ctf_docker_network_cidr == '172.30.0.0/24'
      - openclaw_ctf_docker_bridge == 'occtfbr0'
    fail_msg: The dedicated OpenClaw LXC runtime contract is invalid.

- name: Require root-managed OpenClaw secrets
  ansible.builtin.assert:
    that:
      - openclaw_gateway_token is defined
      - openclaw_gateway_token | trim is match('^[0-9a-fA-F]{64}$')
      - openclaw_discord_bot_token is defined
      - openclaw_discord_bot_token | trim | length > 0
      - openclaw_exa_api_key is defined
      - openclaw_exa_api_key | trim | length > 0
      - openclaw_skill_sync_github_token is defined
      - openclaw_skill_sync_github_token | length >= 20
      - openclaw_skill_sync_github_token is not search('\\s')
  no_log: true

- name: Install OpenClaw host prerequisites without routine upgrades
  ansible.builtin.apt:
    name: [acl, ca-certificates, curl, gnupg, iptables, nftables, python3]
    state: "{{ 'latest' if (homelab_maintenance_upgrade | default(false) | bool) else 'present' }}"
    update_cache: "{{ homelab_maintenance_upgrade | default(false) | bool }}"
    cache_valid_time: "{{ 3600 if (homelab_maintenance_upgrade | default(false) | bool) else omit }}"

- name: Create Docker apt keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install Docker apt signing key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"

- name: Configure Docker apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable
    filename: docker
    state: present
    update_cache: false
  register: openclaw_docker_repository

- name: Refresh apt metadata only after adding Docker repository
  ansible.builtin.apt:
    update_cache: true
  when: openclaw_docker_repository.changed

- name: Install only the container runtime used in production
  ansible.builtin.apt:
    name: [containerd.io, docker-ce, docker-ce-cli, docker-compose-plugin]
    state: "{{ 'latest' if (homelab_maintenance_upgrade | default(false) | bool) else 'present' }}"
    update_cache: "{{ homelab_maintenance_upgrade | default(false) | bool }}"
    cache_valid_time: "{{ 3600 if (homelab_maintenance_upgrade | default(false) | bool) else omit }}"
  notify: Restart OpenClaw Docker

- name: Create OpenClaw service group
  ansible.builtin.group:
    name: "{{ openclaw_group }}"
    gid: "{{ openclaw_gid }}"
    system: true

- name: Create OpenClaw service account with local Docker access
  ansible.builtin.user:
    name: "{{ openclaw_user }}"
    uid: "{{ openclaw_uid }}"
    group: "{{ openclaw_group }}"
    groups: docker
    append: true
    home: "{{ openclaw_home }}"
    create_home: true
    shell: /usr/sbin/nologin
    system: true

- name: Create isolated skill promotion identity
  ansible.builtin.group:
    name: "{{ openclaw_skill_sync_group }}"
    gid: "{{ openclaw_skill_sync_gid }}"
    system: true
  when: openclaw_skill_sync_enabled | bool

- name: Create isolated skill promotion account
  ansible.builtin.user:
    name: "{{ openclaw_skill_sync_user }}"
    uid: "{{ openclaw_skill_sync_uid }}"
    group: "{{ openclaw_skill_sync_group }}"
    home: "{{ openclaw_skill_sync_state_root }}"
    create_home: false
    shell: /usr/sbin/nologin
    system: true
  when: openclaw_skill_sync_enabled | bool

- name: Create durable OpenClaw runtime directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ openclaw_install_root }}", owner: root, group: root, mode: "0755"}
    - {path: "{{ openclaw_install_root }}/incoming", owner: root, group: root, mode: "0700"}
    - {path: "{{ openclaw_install_root }}/state", owner: root, group: root, mode: "0700"}
    - {path: "{{ openclaw_state_root }}", owner: "{{ openclaw_user }}", group: "{{ openclaw_group }}", mode: "0700"}
    - {path: "{{ openclaw_workspaces_root }}", owner: "{{ openclaw_user }}", group: "{{ openclaw_group }}", mode: "0700"}
    - {path: "{{ openclaw_workspace_root }}/skills", owner: "{{ openclaw_user }}", group: "{{ openclaw_group }}", mode: "0700"}
    - {path: "{{ openclaw_ctf_workspace_root }}/skills", owner: "{{ openclaw_user }}", group: "{{ openclaw_group }}", mode: "0700"}
    - {path: "{{ openclaw_auth_profile_secret_root }}", owner: "{{ openclaw_user }}", group: "{{ openclaw_group }}", mode: "0700"}
    - {path: "{{ openclaw_secret_root }}", owner: root, group: "{{ openclaw_group }}", mode: "0710"}
    - {path: "{{ openclaw_skill_sync_state_root }}", owner: "{{ openclaw_skill_sync_user }}", group: "{{ openclaw_skill_sync_group }}", mode: "0700"}

- name: Materialize Gateway-owner-only secret files
  ansible.builtin.copy:
    content: "{{ item.content | trim }}\n"
    dest: "{{ item.path }}"
    owner: "{{ openclaw_user }}"
    group: "{{ openclaw_group }}"
    mode: "0400"
  loop:
    - {path: "{{ openclaw_gateway_token_path }}", content: "{{ openclaw_gateway_token }}"}
    - {path: "{{ openclaw_discord_bot_token_path }}", content: "{{ openclaw_discord_bot_token }}"}
    - {path: "{{ openclaw_exa_api_key_path }}", content: "{{ openclaw_exa_api_key }}"}
  no_log: true
  diff: false

- name: Materialize skill-promotion credential outside Gateway access
  ansible.builtin.copy:
    content: "{{ openclaw_skill_sync_github_token }}\n"
    dest: "{{ openclaw_skill_sync_github_token_path }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  diff: false
  when: openclaw_skill_sync_enabled | bool

- name: Create Docker service drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure local Docker for isolated CTF sandboxes
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
  notify: Restart OpenClaw Docker

- name: Install CTF egress boundary
  ansible.builtin.template:
    src: openclaw-ctf-docker-firewall.sh.j2
    dest: /usr/local/libexec/openclaw-ctf-docker-firewall
    owner: root
    group: root
    mode: "0755"

- name: Reapply CTF boundary after Docker restart
  ansible.builtin.template:
    src: 20-openclaw-ctf-firewall.conf.j2
    dest: /etc/systemd/system/docker.service.d/20-openclaw-ctf-firewall.conf
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload OpenClaw systemd
    - Restart OpenClaw Docker

- name: Install dedicated LXC firewall boundary
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/nft --check --file %s
  notify: Reload OpenClaw nftables

- name: Apply runtime changes before activation
  ansible.builtin.meta: flush_handlers

- name: Enable host runtime services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: [docker.service, nftables.service]

- name: Inspect isolated CTF network
  ansible.builtin.command:
    argv: [docker, network, inspect, "{{ openclaw_ctf_docker_network }}"]
  register: openclaw_ctf_network_probe
  changed_when: false
  failed_when: openclaw_ctf_network_probe.rc not in [0, 1]

- name: Create isolated CTF network
  ansible.builtin.command:
    argv:
      - docker
      - network
      - create
      - --driver
      - bridge
      - --subnet
      - "{{ openclaw_ctf_docker_network_cidr }}"
      - --opt
      - "com.docker.network.bridge.name={{ openclaw_ctf_docker_bridge }}"
      - --opt
      - com.docker.network.bridge.enable_icc=false
      - "{{ openclaw_ctf_docker_network }}"
  when: openclaw_ctf_network_probe.rc == 1

- name: Apply isolated CTF egress policy
  ansible.builtin.command:
    argv: [/usr/local/libexec/openclaw-ctf-docker-firewall]
  changed_when: false

- name: Install immutable release utilities
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../../scripts/ci/{{ item.source }}"
    dest: "/usr/local/libexec/{{ item.dest }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - {source: immutable_image_release.py, dest: immutable_image_release.py}
    - {source: openclaw_release.py, dest: openclaw_release.py}
    - {source: deploy_openclaw_release.py, dest: deploy_openclaw_release.py}

- name: Install isolated skill promotion utility
  ansible.builtin.copy:
    src: openclaw_skill_sync.py
    dest: "{{ openclaw_skill_sync_script_path }}"
    owner: root
    group: root
    mode: "0755"
  when: openclaw_skill_sync_enabled | bool

- name: Install isolated skill promotion service files
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - {src: openclaw-skill-sync-askpass.j2, dest: "{{ openclaw_skill_sync_askpass_path }}", mode: "0755"}
    - {src: openclaw-skill-sync.service.j2, dest: /etc/systemd/system/openclaw-skill-sync.service, mode: "0644"}
    - {src: openclaw-skill-sync.timer.j2, dest: /etc/systemd/system/openclaw-skill-sync.timer, mode: "0644"}
  notify: Reload OpenClaw systemd
  when: openclaw_skill_sync_enabled | bool

- name: Grant skill promoter traversal without Gateway credentials
  ansible.builtin.command:
    argv: [setfacl, -m, "u:{{ openclaw_skill_sync_user }}:--x", "{{ item }}"]
  loop:
    - "{{ openclaw_state_root }}"
    - "{{ openclaw_workspaces_root }}"
    - "{{ openclaw_workspace_root }}"
    - "{{ openclaw_ctf_workspace_root }}"
  changed_when: false
  when: openclaw_skill_sync_enabled | bool

- name: Grant skill promoter read-only skill roots
  ansible.builtin.command:
    argv: [setfacl, -R, -m, "u:{{ openclaw_skill_sync_user }}:r-X", "{{ item }}"]
  loop:
    - "{{ openclaw_workspace_root }}/skills"
    - "{{ openclaw_ctf_workspace_root }}/skills"
  changed_when: false
  when: openclaw_skill_sync_enabled | bool

- name: Enable isolated skill promotion timer
  ansible.builtin.systemd_service:
    name: openclaw-skill-sync.timer
    enabled: true
    state: started
    daemon_reload: true
  when: openclaw_skill_sync_enabled | bool

- name: Inspect legacy native Gateway unit
  ansible.builtin.stat:
    path: /etc/systemd/system/openclaw-gateway.service
  register: openclaw_legacy_gateway_unit

- name: Stop and disable legacy native Gateway unit
  ansible.builtin.systemd_service:
    name: openclaw-gateway.service
    enabled: false
    state: stopped
  when: openclaw_legacy_gateway_unit.stat.exists

- name: Remove legacy native Gateway unit
  ansible.builtin.file:
    path: /etc/systemd/system/openclaw-gateway.service
    state: absent
  register: openclaw_legacy_gateway_unit_removed
  when: openclaw_legacy_gateway_unit.stat.exists

- name: Reload systemd after retiring legacy native Gateway unit
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: openclaw_legacy_gateway_unit_removed.changed | default(false)
