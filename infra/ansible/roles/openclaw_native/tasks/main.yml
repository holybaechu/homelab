---
- name: Require the immutable OpenClaw host contract
  ansible.builtin.assert:
    that:
      - ansible_system == 'Linux'
      - ansible_architecture == 'x86_64'
      - inventory_hostname == 'openclaw'
      - ansible_host == hostvars['openclaw'].ansible_host
      - openclaw_install_root == '/opt/openclaw'
      - openclaw_state_root == '/var/lib/openclaw'
      - openclaw_secret_root == '/etc/openclaw/secrets'
      - openclaw_uid | int == 1000
      - openclaw_gid | int == 1000
      - openclaw_ctf_uid | int == openclaw_uid | int
      - openclaw_ctf_gid | int == openclaw_gid | int
      - openclaw_ctf_docker_network_cidr == '172.30.0.0/24'
      - openclaw_ctf_docker_bridge == 'occtfbr0'
    fail_msg: The dedicated OpenClaw LXC runtime contract is invalid.

- name: Install OpenClaw isolation prerequisites without routine upgrades
  ansible.builtin.apt:
    name: [iptables, nftables]
    state: "{{ 'latest' if (homelab_maintenance_upgrade | default(false) | bool) else 'present' }}"
    update_cache: "{{ homelab_maintenance_upgrade | default(false) | bool }}"
    cache_valid_time: "{{ 3600 if (homelab_maintenance_upgrade | default(false) | bool) else omit }}"

- name: Create OpenClaw service group
  ansible.builtin.group:
    name: "{{ openclaw_group }}"
    gid: "{{ openclaw_gid }}"
    system: true

- name: Create OpenClaw service account with local Docker access
  ansible.builtin.user:
    name: "{{ openclaw_user }}"
    uid: "{{ openclaw_uid }}"
    group: "{{ openclaw_group }}"
    groups: docker
    append: true
    home: "{{ openclaw_home }}"
    create_home: true
    shell: /usr/sbin/nologin
    system: true

- name: Create durable OpenClaw runtime directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ openclaw_install_root }}", owner: root, group: root, mode: "0755"}
    - {path: "{{ openclaw_state_root }}", owner: "{{ openclaw_user }}", group: "{{ openclaw_group }}", mode: "0700"}
    - {path: "{{ openclaw_workspaces_root }}", owner: "{{ openclaw_user }}", group: "{{ openclaw_group }}", mode: "0700"}
    - {path: "{{ openclaw_workspace_root }}", owner: "{{ openclaw_user }}", group: "{{ openclaw_group }}", mode: "0700"}
    - {path: "{{ openclaw_workspace_root }}/skills", owner: "{{ openclaw_user }}", group: "{{ openclaw_group }}", mode: "0700"}
    - {path: "{{ openclaw_ctf_workspace_root }}/skills", owner: "{{ openclaw_user }}", group: "{{ openclaw_group }}", mode: "0700"}
    - {path: "{{ openclaw_auth_profile_secret_root }}", owner: "{{ openclaw_user }}", group: "{{ openclaw_group }}", mode: "0700"}
    - {path: "{{ openclaw_secret_root }}", owner: root, group: root, mode: "0700"}

- name: Create Docker service drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install CTF egress boundary
  ansible.builtin.template:
    src: openclaw-ctf-docker-firewall.sh.j2
    dest: /usr/local/libexec/openclaw-ctf-docker-firewall
    owner: root
    group: root
    mode: "0755"

- name: Reapply CTF boundary after Docker restart
  ansible.builtin.template:
    src: 20-openclaw-ctf-firewall.conf.j2
    dest: /etc/systemd/system/docker.service.d/20-openclaw-ctf-firewall.conf
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload OpenClaw systemd
    - Restart OpenClaw Docker

- name: Install dedicated LXC firewall boundary
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/nft --check --file %s
  notify: Reload OpenClaw nftables

- name: Apply runtime changes before activation
  ansible.builtin.meta: flush_handlers

- name: Enable host runtime services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: [docker.service, nftables.service]

- name: Inspect isolated CTF network
  ansible.builtin.command:
    argv: [docker, network, inspect, "{{ openclaw_ctf_docker_network }}"]
  register: openclaw_ctf_network_probe
  changed_when: false
  failed_when: openclaw_ctf_network_probe.rc not in [0, 1]

- name: Require a canonical Docker network inspection document
  ansible.builtin.assert:
    that:
      - openclaw_ctf_network_probe.stdout | from_json is sequence
      - openclaw_ctf_network_probe.stdout | from_json | length == 1
      - openclaw_ctf_network_probe.stdout | from_json | first is mapping
    fail_msg: Docker returned an invalid CTF network inspection document.
  when: openclaw_ctf_network_probe.rc == 0

- name: Bind the existing CTF network document
  ansible.builtin.set_fact:
    openclaw_ctf_network_document: >-
      {{
        openclaw_ctf_network_probe.stdout | from_json | first
        if openclaw_ctf_network_probe.rc == 0
        else {}
      }}

- name: Detect CTF network isolation drift
  ansible.builtin.set_fact:
    openclaw_ctf_network_drift: >-
      {{
        openclaw_ctf_network_probe.rc == 0
        and (
          openclaw_ctf_network_document.get('Driver') != 'bridge'
          or openclaw_ctf_network_document.get('IPAM', {}).get('Config', []) | length != 1
          or openclaw_ctf_network_document.get('IPAM', {}).get('Config', [])[0].get('Subnet')
             != openclaw_ctf_docker_network_cidr
          or openclaw_ctf_network_document.get('Options', {}).get(
               'com.docker.network.bridge.name'
             ) != openclaw_ctf_docker_bridge
          or openclaw_ctf_network_document.get('Options', {}).get(
               'com.docker.network.bridge.enable_icc'
             ) != 'false'
        )
      }}

- name: Refuse occupied CTF network replacement
  ansible.builtin.assert:
    that:
      - openclaw_ctf_network_document.get('Containers', {}) | length == 0
    fail_msg: >-
      The existing {{ openclaw_ctf_docker_network }} network has isolation drift
      and attached containers. In a maintenance window, stop the OpenClaw project,
      remove that network, rerun openclaw-host reconciliation, and redeploy.
  when: openclaw_ctf_network_drift | bool

- name: Remove an unused CTF network with isolation drift
  ansible.builtin.command:
    argv: [docker, network, rm, "{{ openclaw_ctf_docker_network }}"]
  when: openclaw_ctf_network_drift | bool

- name: Create isolated CTF network
  ansible.builtin.command:
    argv:
      - docker
      - network
      - create
      - --driver
      - bridge
      - --subnet
      - "{{ openclaw_ctf_docker_network_cidr }}"
      - --opt
      - "com.docker.network.bridge.name={{ openclaw_ctf_docker_bridge }}"
      - --opt
      - com.docker.network.bridge.enable_icc=false
      - "{{ openclaw_ctf_docker_network }}"
  when: >-
    openclaw_ctf_network_probe.rc == 1
    or openclaw_ctf_network_drift | bool

- name: Inspect the reconciled CTF network
  ansible.builtin.command:
    argv: [docker, network, inspect, "{{ openclaw_ctf_docker_network }}"]
  register: openclaw_ctf_network_verified
  changed_when: false

- name: Verify the reconciled CTF isolation contract
  ansible.builtin.assert:
    that:
      - openclaw_ctf_network_verified.stdout | from_json is sequence
      - openclaw_ctf_network_verified.stdout | from_json | length == 1
      - openclaw_ctf_network_verified.stdout | from_json | first is mapping
      - (openclaw_ctf_network_verified.stdout | from_json | first).get('Driver') == 'bridge'
      - >-
        (openclaw_ctf_network_verified.stdout | from_json | first)
        .get('IPAM', {}).get('Config', []) | length == 1
      - >-
        (openclaw_ctf_network_verified.stdout | from_json | first)
        .get('IPAM', {}).get('Config', [])[0].get('Subnet')
        == openclaw_ctf_docker_network_cidr
      - >-
        (openclaw_ctf_network_verified.stdout | from_json | first)
        .get('Options', {}).get('com.docker.network.bridge.name')
        == openclaw_ctf_docker_bridge
      - >-
        (openclaw_ctf_network_verified.stdout | from_json | first)
        .get('Options', {}).get('com.docker.network.bridge.enable_icc') == 'false'
    fail_msg: The reconciled CTF Docker network does not enforce the isolation contract.

- name: Apply isolated CTF egress policy
  ansible.builtin.command:
    argv: [/usr/local/libexec/openclaw-ctf-docker-firewall]
  changed_when: false
