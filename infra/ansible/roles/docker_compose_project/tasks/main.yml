---
- name: Require application secrets
  ansible.builtin.assert:
    that:
      - cloudflare_traefik_token is defined and cloudflare_traefik_token | length > 0
      - cloudflare_ddns_token is defined and cloudflare_ddns_token | length > 0
      - adguard_admin_password is defined and adguard_admin_password | length > 0
      - qbittorrent_webui_password is defined and qbittorrent_webui_password | length > 0
      - copyparty_users is defined and copyparty_users | length > 0
    fail_msg: Configure every required prod secret before preparing the application stack.
  no_log: true

- name: Validate Copyparty account shape
  ansible.builtin.assert:
    that:
      - copyparty_users | selectattr('name', 'defined') | list | length == copyparty_users | length
      - copyparty_users | selectattr('password', 'defined') | list | length == copyparty_users | length
      - copyparty_users | selectattr('password_hash', 'defined') | list | length == 0
    fail_msg: Copyparty accounts must contain name and plaintext password fields; Ansible protects the rendered config.
  no_log: true

- name: Require the consolidated direct-deployment contract
  ansible.builtin.assert:
    that:
      - docker_apps_runtime_config_root == '/etc/homelab/runtime'
      - docker_apps_secret_root == '/etc/homelab/secrets'
      - docker_apps_current_root == '/opt/homelab/current'
      - docker_apps_deploy_state_root == '/opt/homelab/deploy-state'
      - docker_compose_projects | map(attribute='name') | list == ['homelab']
      - docker_compose_projects | map(attribute='src') | list == ['apps/compose/homelab']
      - >-
        docker_compose_projects | map(attribute='dest') | list
        == [docker_apps_current_root + '/homelab']
      - >-
        docker_compose_secret_inputs | map(attribute='dest') | sort
        == [
          docker_apps_secret_root + '/cloudflare-ddns.env',
          docker_apps_secret_root + '/traefik.env'
        ]
    fail_msg: The application host must prepare only the consolidated homelab release contract.

- name: Validate the consolidated runtime declaration
  ansible.builtin.assert:
    that:
      - item.name is match('^[a-z0-9][a-z0-9_-]*$')
      - item.env_template is string
      - item.env_template | length > 0
      - item.smoke_template is string
      - item.smoke_template | length > 0
      - item.dest == docker_apps_current_root + '/' + item.name
    fail_msg: The consolidated runtime project declaration is invalid.
  loop: "{{ docker_compose_projects }}"
  loop_control:
    label: "{{ item.name }}"

- name: Validate direct runtime overlay declarations
  ansible.builtin.assert:
    that:
      - item.1.src is string and item.1.src | length > 0
      - not item.1.dest.startswith('/')
      - "'..' not in item.1.dest.split('/')"
      - item.1.dest.split('/')[0] not in ['compose.yml', 'compose.yaml', '.env', '.homelab']
      - item.1.mode | default('0600') == '0600'
    fail_msg: Direct runtime overlays must be private, relative, and traversal-free.
  loop: "{{ docker_compose_projects | subelements('config_templates', skip_missing=True) }}"
  loop_control:
    label: "{{ item.0.name }}:{{ item.1.dest }}"

- name: Validate service secret declarations
  ansible.builtin.assert:
    that:
      - item.src in ['traefik.env.j2', 'cloudflare-ddns.env.j2']
      - item.dest.startswith(docker_apps_secret_root + '/')
      - "'..' not in item.dest.split('/')"
    fail_msg: Service secrets must use the two reviewed private environment files.
  loop: "{{ docker_compose_secret_inputs }}"
  loop_control:
    label: "{{ item.dest }}"

- name: Require the Proxmox homelab bind mount before writing application data
  ansible.builtin.command: mountpoint -q /srv/homelab
  changed_when: false

- name: Check shared Traefik proxy network
  ansible.builtin.command: docker network inspect homelab_proxy
  register: homelab_proxy_network
  changed_when: false
  failed_when: homelab_proxy_network.rc not in [0, 1]

- name: Create shared Traefik proxy network
  ansible.builtin.command: docker network create homelab_proxy
  when: homelab_proxy_network.rc != 0
  changed_when: true

- name: Create application data directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default(service_uid) }}"
    group: "{{ item.group | default(service_gid) }}"
    mode: "{{ item.mode | default('0755') }}"
  loop:
    - {path: /srv/homelab/docker-apps/qbittorrent/qBittorrent, mode: "0700"}
    - {path: /srv/homelab/docker-apps/copyparty}
    - {path: /srv/homelab/downloads/complete}
    - {path: /srv/homelab/downloads/incomplete}
    - {path: /srv/homelab/copyparty/downloads}
    - {path: /srv/homelab/copyparty/public}
    - {path: /srv/homelab/copyparty/shared-readonly}
    - {path: "{{ t3code_data_root }}", mode: "0700"}
    - {path: "{{ t3code_workspace_root }}"}

- name: Initialize the direct-deployment input manifest
  ansible.builtin.set_fact:
    docker_compose_managed_directories:
      - "{{ docker_apps_runtime_config_root | dirname }}"
      - "{{ docker_apps_runtime_config_root }}"
      - "{{ docker_apps_secret_root }}"
    docker_compose_managed_inputs: "{{ docker_compose_secret_inputs }}"
  changed_when: false

- name: Add the consolidated nonsecret environment to the input manifest
  ansible.builtin.set_fact:
    docker_compose_managed_directories: >-
      {{ docker_compose_managed_directories
         + [docker_apps_runtime_config_root + '/' + item.name] }}
    docker_compose_managed_inputs: >-
      {{ docker_compose_managed_inputs
         + [{'src': item.env_template,
             'dest': docker_apps_runtime_config_root + '/' + item.name + '/.env',
             'mode': '0600', 'force': true}] }}
  loop: "{{ docker_compose_projects }}"
  loop_control:
    label: "{{ item.name }}"
  changed_when: false

- name: Add the mandatory deployment smoke contract to the input manifest
  ansible.builtin.set_fact:
    docker_compose_managed_inputs: >-
      {{ docker_compose_managed_inputs
         + [{'src': item.smoke_template,
             'dest': docker_apps_runtime_config_root + '/' + item.name + '/smoke',
             'mode': '0700', 'force': true}] }}
  loop: "{{ docker_compose_projects }}"
  loop_control:
    label: "{{ item.name }}"
  changed_when: false

- name: Add generated overlays to the input manifest
  ansible.builtin.set_fact:
    docker_compose_managed_directories: >-
      {% set overlay_root = docker_apps_runtime_config_root + '/' + item.0.name + '/files' %}
      {% set overlay_parent = item.1.dest | dirname %}
      {{ docker_compose_managed_directories
         + [overlay_root]
         + [overlay_root if overlay_parent in ['', '.']
            else overlay_root + '/' + overlay_parent] }}
    docker_compose_managed_inputs: >-
      {{ docker_compose_managed_inputs
         + [{'src': item.1.src,
             'dest': docker_apps_runtime_config_root + '/' + item.0.name
                     + '/files/' + item.1.dest,
             'mode': item.1.mode | default('0600'),
             'force': item.1.force | default(true)}] }}
  loop: "{{ docker_compose_projects | subelements('config_templates', skip_missing=True) }}"
  loop_control:
    label: "{{ item.0.name }}:{{ item.1.dest }}"
  changed_when: false

- name: Require unique managed input destinations
  ansible.builtin.assert:
    that:
      - >-
        docker_compose_managed_inputs | map(attribute='dest') | unique | list | length
        == docker_compose_managed_inputs | length
    fail_msg: Direct-deployment inputs must have unique destinations.

- name: Inspect direct-deployment input directories
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop: "{{ docker_compose_managed_directories | unique | list }}"
  register: docker_compose_managed_directory_metadata

- name: Reject redirected direct-deployment input directories
  ansible.builtin.assert:
    that:
      - >-
        not (item.stat.exists | default(false)) or
        (item.stat.isdir | default(false) and not (item.stat.islnk | default(false)))
    fail_msg: A direct-deployment input directory is a symlink or non-directory.
  loop: "{{ docker_compose_managed_directory_metadata.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Create private direct-deployment input directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
    follow: false
  loop: "{{ docker_compose_managed_directories | unique | list }}"

- name: Inspect existing direct-deployment input files
  ansible.builtin.stat:
    path: "{{ item.dest }}"
    follow: false
  loop: "{{ docker_compose_managed_inputs }}"
  loop_control:
    label: "{{ item.dest }}"
  register: docker_compose_managed_input_metadata

- name: Reject redirected direct-deployment input files
  ansible.builtin.assert:
    that:
      - >-
        not (item.stat.exists | default(false)) or
        (item.stat.isreg | default(false) and not (item.stat.islnk | default(false)))
    fail_msg: A direct-deployment input path is a symlink or non-file.
  loop: "{{ docker_compose_managed_input_metadata.results }}"
  loop_control:
    label: "{{ item.item.dest }}"

- name: Read existing AdGuard admin password hash
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        from pathlib import Path
        import sys
        path = Path(sys.argv[1])
        username = sys.argv[2]
        if path.exists():
            lines = path.read_text(encoding="utf-8").splitlines()
            for index, line in enumerate(lines):
                if line.strip().startswith("- name:") and line.split(":", 1)[1].strip().strip("'\"") == username:
                    for candidate in lines[index + 1:index + 4]:
                        if candidate.strip().startswith("password:"):
                            print(candidate.split(":", 1)[1].strip().strip('"'))
                            raise SystemExit(0)
        print("")
      - "{{ docker_apps_runtime_config_root }}/homelab/files/adguard/AdGuardHome.yaml"
      - "{{ adguard_admin_username }}"
  register: adguard_existing_admin_hash
  changed_when: false
  no_log: true

- name: Verify existing AdGuard admin password hash
  ansible.builtin.shell: |
    set -eu
    tmp="$(mktemp)"
    trap 'rm -f "${tmp}"' EXIT
    printf '%s:%s\n' "$ADGUARD_ADMIN_USERNAME" "$ADGUARD_ADMIN_HASH" > "$tmp"
    htpasswd -vb "$tmp" "$ADGUARD_ADMIN_USERNAME" "$ADGUARD_ADMIN_PASSWORD" >/dev/null
  args:
    executable: /bin/sh
  environment:
    ADGUARD_ADMIN_USERNAME: "{{ adguard_admin_username }}"
    ADGUARD_ADMIN_HASH: "{{ adguard_existing_admin_hash.stdout }}"
    ADGUARD_ADMIN_PASSWORD: "{{ adguard_admin_password }}"
  register: adguard_existing_admin_hash_verify
  changed_when: false
  failed_when: false
  no_log: true
  when: adguard_existing_admin_hash.stdout | length > 0

- name: Hash AdGuard admin password when rotation is required
  ansible.builtin.command:
    argv:
      - htpasswd
      - -B
      - -C
      - "10"
      - -n
      - -b
      - "{{ adguard_admin_username }}"
      - "{{ adguard_admin_password }}"
  register: adguard_admin_htpasswd
  changed_when: false
  no_log: true
  when: (adguard_existing_admin_hash_verify.rc | default(1)) != 0

- name: Generate deterministic qBittorrent Web UI password hash
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import base64, hashlib, sys
        password = sys.argv[1].encode()
        salt = hashlib.sha256(password + b":qbittorrent-webui").digest()[:16]
        digest = hashlib.pbkdf2_hmac("sha512", password, salt, 100000)
        print("@ByteArray(%s:%s)" % (
            base64.b64encode(salt).decode(), base64.b64encode(digest).decode()
        ))
      - "{{ qbittorrent_webui_password }}"
  register: qbittorrent_webui_password_hash
  changed_when: false
  no_log: true

- name: Set service password hash facts
  ansible.builtin.set_fact:
    adguard_admin_password_hash: >-
      {{ adguard_existing_admin_hash.stdout
      if (adguard_existing_admin_hash_verify.rc | default(1)) == 0
      else adguard_admin_htpasswd.stdout.split(':', 1)[1] }}
    qbittorrent_webui_password_pbkdf2: "{{ qbittorrent_webui_password_hash.stdout }}"
  no_log: true

- name: Render private direct-deployment input files
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "{{ item.mode | default('0600') }}"
    force: "{{ item.force | default(true) }}"
    follow: false
  loop: "{{ docker_compose_managed_inputs }}"
  loop_control:
    label: "{{ item.dest }}"
  no_log: true

- name: Inspect materialized direct-deployment input files
  ansible.builtin.stat:
    path: "{{ item.dest }}"
    follow: false
  loop: "{{ docker_compose_managed_inputs }}"
  loop_control:
    label: "{{ item.dest }}"
  register: docker_compose_materialized_inputs

- name: Verify private direct-deployment input metadata
  ansible.builtin.assert:
    that:
      - item.stat.isreg | default(false)
      - not (item.stat.islnk | default(false))
      - item.stat.uid == 0
      - item.stat.gid == 0
      - item.stat.mode == (item.item.mode | default('0600'))
    fail_msg: A direct-deployment input is not a private root-owned regular file.
  loop: "{{ docker_compose_materialized_inputs.results }}"
  loop_control:
    label: "{{ item.item.dest }}"

- name: Inspect superseded split-project runtime directories
  ansible.builtin.stat:
    path: "{{ docker_apps_runtime_config_root }}/{{ item }}"
    follow: false
  loop:
    - platform
    - media
    - code
  register: docker_compose_legacy_runtime_directories

- name: Reject redirected superseded runtime directories
  ansible.builtin.assert:
    that:
      - >-
        not (item.stat.exists | default(false)) or
        (item.stat.isdir | default(false) and not (item.stat.islnk | default(false)))
    fail_msg: A superseded runtime directory is redirected or not a directory.
  loop: "{{ docker_compose_legacy_runtime_directories.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Remove superseded split-project runtime inputs
  ansible.builtin.file:
    path: "{{ docker_apps_runtime_config_root }}/{{ item }}"
    state: absent
    follow: false
  loop:
    - platform
    - media
    - code

- name: Bootstrap qBittorrent configuration without replacing application state
  ansible.builtin.template:
    src: qBittorrent.conf.j2
    dest: "{{ item.config_root }}/qBittorrent/qBittorrent.conf"
    owner: "{{ service_uid }}"
    group: "{{ service_gid }}"
    mode: "0600"
    force: false
  vars:
    qbittorrent_instance: "{{ item }}"
  loop: "{{ qbittorrent_instances }}"
  loop_control:
    label: "{{ item.service_name }}"
  no_log: true
