---
- name: Require application secrets
  ansible.builtin.assert:
    that:
      - cloudflare_traefik_token is defined and cloudflare_traefik_token | length > 0
      - cloudflare_ddns_token is defined and cloudflare_ddns_token | length > 0
      - adguard_admin_password is defined and adguard_admin_password | length > 0
      - proton_wireguard_private_key is defined and proton_wireguard_private_key | length > 0
      - qbittorrent_webui_password is defined and qbittorrent_webui_password | length > 0
      - copyparty_users is defined and copyparty_users | length > 0
    fail_msg: Configure every required prod secret before deploying the consolidated Compose host.
  no_log: true

- name: Validate Copyparty account shape
  ansible.builtin.assert:
    that:
      - copyparty_users | selectattr('name', 'defined') | list | length == copyparty_users | length
      - copyparty_users | selectattr('password', 'defined') | list | length == copyparty_users | length
      - copyparty_users | selectattr('password_hash', 'defined') | list | length == 0
    fail_msg: Copyparty accounts must contain name and plaintext password fields; Ansible protects the rendered config.
  no_log: true

- name: Require the Proxmox homelab bind mount before writing application data
  ansible.builtin.command: mountpoint -q /srv/homelab
  changed_when: false

- name: Check for superseded Traefik Compose project
  ansible.builtin.stat:
    path: "{{ docker_apps_compose_root }}/traefik/compose.yml"
  register: retired_traefik_compose

- name: Stop superseded Traefik Compose project before platform takeover
  ansible.builtin.command:
    cmd: docker compose stop
    chdir: "{{ docker_apps_compose_root }}/traefik"
  when: retired_traefik_compose.stat.exists
  changed_when: true

- name: Remove superseded Traefik containers while preserving the shared network
  ansible.builtin.command:
    cmd: docker compose rm -f
    chdir: "{{ docker_apps_compose_root }}/traefik"
  when: retired_traefik_compose.stat.exists
  changed_when: true

- name: Check shared Traefik proxy network
  ansible.builtin.command: docker network inspect homelab_proxy
  register: homelab_proxy_network
  changed_when: false
  failed_when: homelab_proxy_network.rc not in [0, 1]

- name: Create shared Traefik proxy network
  ansible.builtin.command: docker network create homelab_proxy
  when: homelab_proxy_network.rc != 0
  changed_when: true

- name: Create Compose and bind-mount directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default(service_uid) }}"
    group: "{{ item.group | default(service_gid) }}"
    mode: "{{ item.mode | default('0755') }}"
  loop:
    - {path: "{{ docker_apps_compose_root }}", owner: "{{ service_uid }}", group: "{{ service_gid }}"}
    - {path: "{{ docker_apps_compose_root }}/platform/adguard", mode: "0750"}
    - {path: /srv/homelab/docker-apps/qbittorrent/qBittorrent, mode: "0700"}
    - {path: /srv/homelab/docker-apps/qbittorrent-vpn/qBittorrent, mode: "0700"}
    - {path: /srv/homelab/docker-apps/copyparty}
    - {path: /srv/homelab/downloads/complete}
    - {path: /srv/homelab/downloads/incomplete}
    - {path: /srv/homelab/copyparty/downloads}
    - {path: /srv/homelab/copyparty/public}
    - {path: /srv/homelab/copyparty/shared-readonly}

- name: Inspect retired Compose projects
  ansible.builtin.stat:
    path: "{{ item.dest }}/compose.yml"
  loop: "{{ retired_docker_compose_projects | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  register: retired_compose_project_files

- name: Stop and remove retired Compose projects
  ansible.builtin.command:
    cmd: docker compose down --volumes --remove-orphans
    chdir: "{{ item.item.dest }}"
  loop: "{{ retired_compose_project_files.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: item.stat.exists
  changed_when: true

- name: Remove retired Compose project directories
  ansible.builtin.file:
    path: "{{ item.dest }}"
    state: absent
  loop: "{{ retired_docker_compose_projects | default([]) }}"
  loop_control:
    label: "{{ item.name }}"

- name: Inspect retired local Docker images
  ansible.builtin.command:
    argv:
      - docker
      - image
      - inspect
      - "{{ item }}"
  loop: "{{ retired_docker_images | default([]) }}"
  register: retired_docker_image_inspections
  changed_when: false
  failed_when: retired_docker_image_inspections.rc not in [0, 1]

- name: Remove retired local Docker images
  ansible.builtin.command:
    argv:
      - docker
      - image
      - rm
      - "{{ item.item }}"
  loop: "{{ retired_docker_image_inspections.results }}"
  when: item.rc == 0
  changed_when: true

- name: Assert no Hermes Compose containers remain
  ansible.builtin.command:
    argv:
      - docker
      - ps
      - --all
      - --quiet
      - --filter
      - label=com.docker.compose.project=hermes
  register: retired_hermes_containers
  changed_when: false
  failed_when: retired_hermes_containers.stdout | trim | length > 0

- name: Assert no game Compose containers remain
  ansible.builtin.script:
    cmd: >-
      {{ playbook_dir }}/../files/assert-no-game-compose-containers.sh
      /usr/bin/docker
  changed_when: false

- name: Create Compose project directories
  ansible.builtin.file:
    path: "{{ item.dest }}"
    state: directory
    owner: "{{ service_uid }}"
    group: "{{ service_gid }}"
    mode: "0755"
  loop: "{{ docker_compose_projects }}"
  loop_control:
    label: "{{ item.name }}"

- name: Copy tracked Compose project files
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../../{{ item.src }}/"
    dest: "{{ item.dest }}/"
    owner: "{{ service_uid }}"
    group: "{{ service_gid }}"
    mode: preserve
  loop: "{{ docker_compose_projects }}"
  loop_control:
    label: "{{ item.name }}"
  notify: Restart Compose project

- name: Read existing AdGuard admin password hash
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        from pathlib import Path
        import sys
        path = Path(sys.argv[1])
        username = sys.argv[2]
        if path.exists():
            lines = path.read_text(encoding="utf-8").splitlines()
            for index, line in enumerate(lines):
                if line.strip().startswith("- name:") and line.split(":", 1)[1].strip().strip("'\"") == username:
                    for candidate in lines[index + 1:index + 4]:
                        if candidate.strip().startswith("password:"):
                            print(candidate.split(":", 1)[1].strip().strip('"'))
                            raise SystemExit(0)
        print("")
      - "{{ docker_apps_compose_root }}/platform/adguard/AdGuardHome.yaml"
      - "{{ adguard_admin_username }}"
  register: adguard_existing_admin_hash
  changed_when: false
  no_log: true

- name: Verify existing AdGuard admin password hash
  ansible.builtin.shell: |
    set -eu
    tmp="$(mktemp)"
    trap 'rm -f "${tmp}"' EXIT
    printf '%s:%s\n' "$ADGUARD_ADMIN_USERNAME" "$ADGUARD_ADMIN_HASH" > "$tmp"
    htpasswd -vb "$tmp" "$ADGUARD_ADMIN_USERNAME" "$ADGUARD_ADMIN_PASSWORD" >/dev/null
  args:
    executable: /bin/sh
  environment:
    ADGUARD_ADMIN_USERNAME: "{{ adguard_admin_username }}"
    ADGUARD_ADMIN_HASH: "{{ adguard_existing_admin_hash.stdout }}"
    ADGUARD_ADMIN_PASSWORD: "{{ adguard_admin_password }}"
  register: adguard_existing_admin_hash_verify
  changed_when: false
  failed_when: false
  no_log: true
  when: adguard_existing_admin_hash.stdout | length > 0

- name: Hash AdGuard admin password when rotation is required
  ansible.builtin.command:
    argv:
      - htpasswd
      - -B
      - -C
      - "10"
      - -n
      - -b
      - "{{ adguard_admin_username }}"
      - "{{ adguard_admin_password }}"
  register: adguard_admin_htpasswd
  changed_when: false
  no_log: true
  when: (adguard_existing_admin_hash_verify.rc | default(1)) != 0

- name: Generate deterministic qBittorrent Web UI password hash
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import base64, hashlib, sys
        password = sys.argv[1].encode()
        salt = hashlib.sha256(password + b":qbittorrent-webui").digest()[:16]
        digest = hashlib.pbkdf2_hmac("sha512", password, salt, 100000)
        print("@ByteArray(%s:%s)" % (
            base64.b64encode(salt).decode(), base64.b64encode(digest).decode()
        ))
      - "{{ qbittorrent_webui_password }}"
  register: qbittorrent_webui_password_hash
  changed_when: false
  no_log: true

- name: Set service password hash facts
  ansible.builtin.set_fact:
    adguard_admin_password_hash: >-
      {{ adguard_existing_admin_hash.stdout
      if (adguard_existing_admin_hash_verify.rc | default(1)) == 0
      else adguard_admin_htpasswd.stdout.split(':', 1)[1] }}
    qbittorrent_webui_password_pbkdf2: "{{ qbittorrent_webui_password_hash.stdout }}"
  no_log: true

- name: Render Compose project environment files
  ansible.builtin.template:
    src: "{{ item.env_template }}"
    dest: "{{ item.dest }}/.env"
    owner: "{{ service_uid }}"
    group: "{{ service_gid }}"
    mode: "0600"
  loop: "{{ docker_compose_projects }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true
  notify: Restart Compose project

- name: Require the direct qBittorrent peer port to be available
  ansible.builtin.shell: |
    set -eu
    direct_container="$(docker compose ps -q qbittorrent 2>/dev/null || true)"
    for owner in $(docker ps -q --filter "publish={{ qbittorrent_direct_peer_port }}"); do
      test "${owner}" = "${direct_container}" || {
        printf 'Peer port {{ qbittorrent_direct_peer_port }} is published by another container.\n' >&2
        exit 1
      }
    done
    if [ -n "${direct_container}" ] \
      && docker port "${direct_container}" {{ qbittorrent_direct_peer_port }}/tcp >/dev/null 2>&1 \
      && docker port "${direct_container}" {{ qbittorrent_direct_peer_port }}/udp >/dev/null 2>&1; then
      exit 0
    fi
    python3 - "{{ qbittorrent_direct_peer_port }}" <<'PY'
    import socket
    import sys

    port = int(sys.argv[1])
    sockets = []
    try:
        for kind in (socket.SOCK_STREAM, socket.SOCK_DGRAM):
            sock = socket.socket(socket.AF_INET, kind)
            sock.bind(("0.0.0.0", port))
            if kind == socket.SOCK_STREAM:
                sock.listen(1)
            sockets.append(sock)
    finally:
        for sock in sockets:
            sock.close()
    PY
  args:
    executable: /bin/sh
    chdir: "{{ docker_apps_compose_root }}/media"
  changed_when: false

- name: Render qBittorrent configuration candidates
  ansible.builtin.template:
    src: qBittorrent.conf.j2
    dest: "/tmp/{{ item.service_name }}.conf.candidate"
    owner: "{{ service_uid }}"
    group: "{{ service_gid }}"
    mode: "0600"
  vars:
    qbittorrent_instance: "{{ item }}"
  loop: "{{ qbittorrent_instances }}"
  loop_control:
    label: "{{ item.service_name }}"
  changed_when: false
  no_log: true

- name: Compare qBittorrent configuration candidates
  ansible.builtin.shell: |
    test -f "{{ item.config_root }}/qBittorrent/qBittorrent.conf" \
      && cmp -s "/tmp/{{ item.service_name }}.conf.candidate" \
        "{{ item.config_root }}/qBittorrent/qBittorrent.conf"
  args:
    executable: /bin/sh
  loop: "{{ qbittorrent_instances }}"
  loop_control:
    label: "{{ item.service_name }}"
  register: qbittorrent_config_compare
  failed_when: qbittorrent_config_compare.rc not in [0, 1]
  changed_when: false
  no_log: true

- name: Stop qBittorrent instances before replacing changed configuration
  ansible.builtin.shell: |
    set -eu
    container_id="$(docker compose ps --all -q "{{ item.item.service_name }}")"
    if [ -n "${container_id}" ]; then
      docker compose stop "{{ item.item.service_name }}"
    fi
  args:
    executable: /bin/sh
    chdir: "{{ docker_apps_compose_root }}/media"
  loop: "{{ qbittorrent_config_compare.results }}"
  loop_control:
    label: "{{ item.item.service_name }}"
  when: item.rc != 0
  changed_when: true

- name: Install managed qBittorrent configurations
  ansible.builtin.copy:
    src: "/tmp/{{ item.item.service_name }}.conf.candidate"
    dest: "{{ item.item.config_root }}/qBittorrent/qBittorrent.conf"
    remote_src: true
    owner: "{{ service_uid }}"
    group: "{{ service_gid }}"
    mode: "0600"
  loop: "{{ qbittorrent_config_compare.results }}"
  loop_control:
    label: "{{ item.item.service_name }}"
  when: item.rc != 0
  no_log: true

- name: Render managed application configuration
  ansible.builtin.template:
    src: "{{ item.1.src }}"
    dest: "{{ item.1.dest if item.1.dest.startswith('/') else item.0.dest + '/' + item.1.dest }}"
    owner: "{{ item.1.owner | default(service_uid) }}"
    group: "{{ item.1.group | default(service_gid) }}"
    mode: "{{ item.1.mode | default('0644') }}"
  loop: "{{ docker_compose_projects | subelements('config_templates', skip_missing=True) }}"
  loop_control:
    label: "{{ item.0.name }}:{{ item.1.dest }}"
  no_log: true
  notify: Restart Compose project

- name: Pull Compose project images
  ansible.builtin.command:
    cmd: docker compose pull --ignore-buildable
    chdir: "{{ item.dest }}"
  loop: "{{ docker_compose_projects }}"
  loop_control:
    label: "{{ item.name }}"
  changed_when: false

- name: Build and start Compose projects in dependency order
  ansible.builtin.command:
    cmd: docker compose up -d --build --remove-orphans
    chdir: "{{ item.dest }}"
  loop: "{{ docker_compose_projects }}"
  loop_control:
    label: "{{ item.name }}"
  register: docker_compose_up
  changed_when: >-
    'Creating' in docker_compose_up.stdout or
    'Recreating' in docker_compose_up.stdout or
    'Started' in docker_compose_up.stdout or
    'Removed orphan' in docker_compose_up.stdout or
    'Building' in docker_compose_up.stdout

- name: Apply requested Compose project recreations
  ansible.builtin.meta: flush_handlers

- name: Reconcile Proton forwarded port with VPN qBittorrent
  ansible.builtin.shell: |
    set -eu
    forwarded_port="$(docker compose exec -T gluetun cat /tmp/gluetun/forwarded_port)"
    case "${forwarded_port}" in
      ''|*[!0-9]*) exit 1 ;;
    esac
    test "${forwarded_port}" -gt 0
    applied_state="$(
      docker compose exec -T gluetun \
        wget -qO- http://127.0.0.1:8080/api/v2/app/preferences \
        | python3 -c 'import json, sys; p = json.load(sys.stdin); print(p.get("listen_port", 0), p.get("current_network_interface", ""))'
    )"
    if [ "${applied_state}" = "${forwarded_port} tun0" ]; then
      echo changed=no
      exit 0
    fi
    docker compose exec -T gluetun wget -qO- \
      --post-data \
      "json={\"listen_port\":${forwarded_port},\"current_network_interface\":\"tun0\",\"random_port\":false,\"upnp\":false}" \
      http://127.0.0.1:8080/api/v2/app/setPreferences >/dev/null
    echo changed=yes
  args:
    executable: /bin/sh
    chdir: "{{ docker_apps_compose_root }}/media"
  register: qbittorrent_vpn_forwarding_reconcile
  changed_when: "'changed=yes' in qbittorrent_vpn_forwarding_reconcile.stdout"
  retries: 12
  delay: 10
  until: qbittorrent_vpn_forwarding_reconcile.rc == 0
