---
- name: Require application secrets
  ansible.builtin.assert:
    that:
      - cloudflare_traefik_token is defined and cloudflare_traefik_token | length > 0
      - cloudflare_ddns_token is defined and cloudflare_ddns_token | length > 0
      - adguard_admin_password is defined and adguard_admin_password | length > 0
      - qbittorrent_webui_password is defined and qbittorrent_webui_password | length > 0
      - copyparty_users is defined and copyparty_users | length > 0
    fail_msg: Configure every required prod secret before deploying the consolidated Compose host.
  no_log: true

- name: Validate Copyparty account shape
  ansible.builtin.assert:
    that:
      - copyparty_users | selectattr('name', 'defined') | list | length == copyparty_users | length
      - copyparty_users | selectattr('password', 'defined') | list | length == copyparty_users | length
      - copyparty_users | selectattr('password_hash', 'defined') | list | length == 0
    fail_msg: Copyparty accounts must contain name and plaintext password fields; Ansible protects the rendered config.
  no_log: true

- name: Require the Proxmox homelab bind mount before writing application data
  ansible.builtin.command: mountpoint -q /srv/homelab
  changed_when: false

- name: Check for superseded Traefik Compose project
  ansible.builtin.stat:
    path: "{{ docker_apps_compose_root }}/traefik/compose.yml"
  register: retired_traefik_compose

- name: Stop superseded Traefik Compose project before platform takeover
  ansible.builtin.command:
    cmd: docker compose stop
    chdir: "{{ docker_apps_compose_root }}/traefik"
  when: retired_traefik_compose.stat.exists
  changed_when: true

- name: Remove superseded Traefik containers while preserving the shared network
  ansible.builtin.command:
    cmd: docker compose rm -f
    chdir: "{{ docker_apps_compose_root }}/traefik"
  when: retired_traefik_compose.stat.exists
  changed_when: true

- name: Check shared Traefik proxy network
  ansible.builtin.command: docker network inspect homelab_proxy
  register: homelab_proxy_network
  changed_when: false
  failed_when: homelab_proxy_network.rc not in [0, 1]

- name: Create shared Traefik proxy network
  ansible.builtin.command: docker network create homelab_proxy
  when: homelab_proxy_network.rc != 0
  changed_when: true

- name: Create Compose and bind-mount directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default(service_uid) }}"
    group: "{{ item.group | default(service_gid) }}"
    mode: "{{ item.mode | default('0755') }}"
  loop:
    - {path: "{{ docker_apps_compose_root }}", owner: "{{ service_uid }}", group: "{{ service_gid }}"}
    - {path: "{{ docker_apps_compose_root }}/platform/adguard", mode: "0750"}
    - {path: /srv/homelab/docker-apps/qbittorrent/qBittorrent, mode: "0700"}
    - {path: /srv/homelab/docker-apps/copyparty}
    - {path: /srv/homelab/downloads/complete}
    - {path: /srv/homelab/downloads/incomplete}
    - {path: /srv/homelab/copyparty/downloads}
    - {path: /srv/homelab/copyparty/public}
    - {path: /srv/homelab/copyparty/shared-readonly}
    - {path: "{{ t3code_data_root }}", mode: "0700"}
    - {path: "{{ t3code_workspace_root }}"}

- name: Inspect retired Compose projects
  ansible.builtin.stat:
    path: "{{ item.dest }}/compose.yml"
  loop: "{{ retired_docker_compose_projects | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  register: retired_compose_project_files

- name: Stop and remove retired Compose projects
  ansible.builtin.command:
    cmd: docker compose down --volumes --remove-orphans
    chdir: "{{ item.item.dest }}"
  loop: "{{ retired_compose_project_files.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: item.stat.exists
  changed_when: true

- name: Remove retired Compose project directories
  ansible.builtin.file:
    path: "{{ item.dest }}"
    state: absent
  loop: "{{ retired_docker_compose_projects | default([]) }}"
  loop_control:
    label: "{{ item.name }}"

- name: Assert no Hermes Compose containers remain
  ansible.builtin.command:
    argv:
      - docker
      - ps
      - --all
      - --quiet
      - --filter
      - label=com.docker.compose.project=hermes
  register: retired_hermes_containers
  changed_when: false
  failed_when: retired_hermes_containers.stdout | trim | length > 0

- name: Assert no game Compose containers remain
  ansible.builtin.script:
    cmd: >-
      {{ playbook_dir }}/../files/assert-no-game-compose-containers.sh
      /usr/bin/docker
  changed_when: false

- name: Create Compose project directories
  ansible.builtin.file:
    path: "{{ item.dest }}"
    state: directory
    owner: "{{ service_uid }}"
    group: "{{ service_gid }}"
    mode: "0755"
  loop: "{{ docker_compose_projects }}"
  loop_control:
    label: "{{ item.name }}"

- name: Copy tracked Compose runtime files
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../../{{ item.0.src }}/{{ item.1 }}"
    dest: "{{ item.0.dest }}/{{ item.1 }}"
    owner: "{{ service_uid }}"
    group: "{{ service_gid }}"
    mode: preserve
  loop: "{{ docker_compose_projects | subelements('runtime_files') }}"
  loop_control:
    label: "{{ item.0.name }}:{{ item.1 }}"
  register: docker_compose_project_file_copy

- name: Inspect tracked Compose hot-reload directories
  ansible.builtin.stat:
    path: "{{ item.0.dest }}/{{ item.1 | dirname }}"
    follow: false
  loop: "{{ docker_compose_projects | subelements('hot_reload_files', skip_missing=True) }}"
  loop_control:
    label: "{{ item.0.name }}:{{ item.1 | dirname }}"
  register: docker_compose_hot_reload_directories

- name: Reject redirected tracked Compose hot-reload directories
  ansible.builtin.assert:
    that:
      - >-
        not (item.stat.exists | default(false)) or
        (
          item.stat.isdir | default(false) and
          not (item.stat.islnk | default(false))
        )
    fail_msg: >-
      A tracked Compose hot-reload directory is a symlink or non-directory;
      refusing to copy files through a redirected path.
  loop: "{{ docker_compose_hot_reload_directories.results }}"
  loop_control:
    label: "{{ item.item.0.name }}:{{ item.item.1 | dirname }}"

- name: Create tracked Compose hot-reload directories
  ansible.builtin.file:
    path: "{{ item.0.dest }}/{{ item.1 | dirname }}"
    state: directory
    owner: "{{ service_uid }}"
    group: "{{ service_gid }}"
    mode: "0755"
    follow: false
  loop: "{{ docker_compose_projects | subelements('hot_reload_files', skip_missing=True) }}"
  loop_control:
    label: "{{ item.0.name }}:{{ item.1 | dirname }}"

- name: Copy tracked Compose hot-reload files without forcing recreation
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../../{{ item.0.src }}/{{ item.1 }}"
    dest: "{{ item.0.dest }}/{{ item.1 }}"
    owner: "{{ service_uid }}"
    group: "{{ service_gid }}"
    mode: preserve
  loop: "{{ docker_compose_projects | subelements('hot_reload_files', skip_missing=True) }}"
  loop_control:
    label: "{{ item.0.name }}:{{ item.1 }}"

- name: Read existing AdGuard admin password hash
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        from pathlib import Path
        import sys
        path = Path(sys.argv[1])
        username = sys.argv[2]
        if path.exists():
            lines = path.read_text(encoding="utf-8").splitlines()
            for index, line in enumerate(lines):
                if line.strip().startswith("- name:") and line.split(":", 1)[1].strip().strip("'\"") == username:
                    for candidate in lines[index + 1:index + 4]:
                        if candidate.strip().startswith("password:"):
                            print(candidate.split(":", 1)[1].strip().strip('"'))
                            raise SystemExit(0)
        print("")
      - "{{ docker_apps_compose_root }}/platform/adguard/AdGuardHome.yaml"
      - "{{ adguard_admin_username }}"
  register: adguard_existing_admin_hash
  changed_when: false
  no_log: true

- name: Verify existing AdGuard admin password hash
  ansible.builtin.shell: |
    set -eu
    tmp="$(mktemp)"
    trap 'rm -f "${tmp}"' EXIT
    printf '%s:%s\n' "$ADGUARD_ADMIN_USERNAME" "$ADGUARD_ADMIN_HASH" > "$tmp"
    htpasswd -vb "$tmp" "$ADGUARD_ADMIN_USERNAME" "$ADGUARD_ADMIN_PASSWORD" >/dev/null
  args:
    executable: /bin/sh
  environment:
    ADGUARD_ADMIN_USERNAME: "{{ adguard_admin_username }}"
    ADGUARD_ADMIN_HASH: "{{ adguard_existing_admin_hash.stdout }}"
    ADGUARD_ADMIN_PASSWORD: "{{ adguard_admin_password }}"
  register: adguard_existing_admin_hash_verify
  changed_when: false
  failed_when: false
  no_log: true
  when: adguard_existing_admin_hash.stdout | length > 0

- name: Hash AdGuard admin password when rotation is required
  ansible.builtin.command:
    argv:
      - htpasswd
      - -B
      - -C
      - "10"
      - -n
      - -b
      - "{{ adguard_admin_username }}"
      - "{{ adguard_admin_password }}"
  register: adguard_admin_htpasswd
  changed_when: false
  no_log: true
  when: (adguard_existing_admin_hash_verify.rc | default(1)) != 0

- name: Generate deterministic qBittorrent Web UI password hash
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import base64, hashlib, sys
        password = sys.argv[1].encode()
        salt = hashlib.sha256(password + b":qbittorrent-webui").digest()[:16]
        digest = hashlib.pbkdf2_hmac("sha512", password, salt, 100000)
        print("@ByteArray(%s:%s)" % (
            base64.b64encode(salt).decode(), base64.b64encode(digest).decode()
        ))
      - "{{ qbittorrent_webui_password }}"
  register: qbittorrent_webui_password_hash
  changed_when: false
  no_log: true

- name: Set service password hash facts
  ansible.builtin.set_fact:
    adguard_admin_password_hash: >-
      {{ adguard_existing_admin_hash.stdout
      if (adguard_existing_admin_hash_verify.rc | default(1)) == 0
      else adguard_admin_htpasswd.stdout.split(':', 1)[1] }}
    qbittorrent_webui_password_pbkdf2: "{{ qbittorrent_webui_password_hash.stdout }}"
  no_log: true

- name: Render Compose project environment files
  ansible.builtin.template:
    src: "{{ item.env_template }}"
    dest: "{{ item.dest }}/.env"
    owner: "{{ service_uid }}"
    group: "{{ service_gid }}"
    mode: "0600"
  loop: "{{ docker_compose_projects }}"
  loop_control:
    label: "{{ item.name }}"
  register: docker_compose_project_environment_render
  no_log: true

- name: Require the direct qBittorrent peer port to be available
  ansible.builtin.shell: |
    set -eu
    direct_container="$(docker compose ps -q qbittorrent 2>/dev/null || true)"
    for owner in $(docker ps --no-trunc -q --filter "publish={{ qbittorrent_direct_peer_port }}"); do
      test "${owner}" = "${direct_container}" || {
        printf 'Peer port {{ qbittorrent_direct_peer_port }} is published by another container.\n' >&2
        exit 1
      }
    done
    if [ -n "${direct_container}" ] \
      && docker port "${direct_container}" {{ qbittorrent_direct_peer_port }}/tcp >/dev/null 2>&1 \
      && docker port "${direct_container}" {{ qbittorrent_direct_peer_port }}/udp >/dev/null 2>&1; then
      exit 0
    fi
    python3 - "{{ qbittorrent_direct_peer_port }}" <<'PY'
    import socket
    import sys

    port = int(sys.argv[1])
    sockets = []
    try:
        for kind in (socket.SOCK_STREAM, socket.SOCK_DGRAM):
            sock = socket.socket(socket.AF_INET, kind)
            sock.bind(("0.0.0.0", port))
            if kind == socket.SOCK_STREAM:
                sock.listen(1)
            sockets.append(sock)
    finally:
        for sock in sockets:
            sock.close()
    PY
  args:
    executable: /bin/sh
    chdir: "{{ docker_apps_compose_root }}/media"
  changed_when: false

- name: Bootstrap qBittorrent configuration without replacing application state
  ansible.builtin.template:
    src: qBittorrent.conf.j2
    dest: "{{ item.config_root }}/qBittorrent/qBittorrent.conf"
    owner: "{{ service_uid }}"
    group: "{{ service_gid }}"
    mode: "0600"
    force: false
  vars:
    qbittorrent_instance: "{{ item }}"
  loop: "{{ qbittorrent_instances }}"
  loop_control:
    label: "{{ item.service_name }}"
  no_log: true

- name: Render managed application configuration
  ansible.builtin.template:
    src: "{{ item.1.src }}"
    dest: "{{ item.1.dest if item.1.dest.startswith('/') else item.0.dest + '/' + item.1.dest }}"
    owner: "{{ item.1.owner | default(service_uid) }}"
    group: "{{ item.1.group | default(service_gid) }}"
    mode: "{{ item.1.mode | default('0644') }}"
    force: "{{ item.1.force | default(true) }}"
  loop: "{{ docker_compose_projects | subelements('config_templates', skip_missing=True) }}"
  loop_control:
    label: "{{ item.0.name }}:{{ item.1.dest }}"
  register: docker_compose_project_config_render
  no_log: true

- name: Restrict application-owned AdGuard configuration metadata
  ansible.builtin.file:
    path: "{{ docker_apps_compose_root }}/platform/adguard/AdGuardHome.yaml"
    state: file
    owner: root
    group: root
    mode: "0600"

- name: Select Compose projects that require forced recreation
  ansible.builtin.set_fact:
    docker_compose_force_recreate_projects: >-
      {{
        (
          (
            docker_compose_project_file_copy.results
            | selectattr('changed')
            | rejectattr('item.0.runtime_file_force_recreate_services', 'defined')
            | map(attribute='item.0.name')
            | list
          )
          +
          (
            docker_compose_project_environment_render.results
            | selectattr('changed')
            | map(attribute='item.name')
            | list
          )
          +
          (
            docker_compose_project_config_render.results
            | selectattr('changed')
            | map(attribute='item.0.name')
            | list
          )
        ) | unique | list
      }}
  changed_when: false
  no_log: true

- name: Select Compose projects that require isolated service recreation
  ansible.builtin.set_fact:
    docker_compose_force_recreate_service_projects: >-
      {{
        docker_compose_project_file_copy.results
        | selectattr('changed')
        | selectattr('item.0.runtime_file_force_recreate_services', 'defined')
        | map(attribute='item.0.name')
        | unique
        | list
      }}
  changed_when: false
  no_log: true

- name: Validate Compose project forced recreation selection
  ansible.builtin.assert:
    that:
      - >-
        docker_compose_force_recreate_projects | difference(
          docker_compose_projects | map(attribute='name') | list
        ) | length == 0
      - >-
        docker_compose_force_recreate_projects | unique | list | length
        == docker_compose_force_recreate_projects | length
    fail_msg: The forced recreation selection must contain unique declared Compose project names only.

- name: Validate isolated Compose service recreation declarations
  ansible.builtin.assert:
    that:
      - >-
        docker_compose_force_recreate_service_projects | difference(
          docker_compose_projects | map(attribute='name') | list
        ) | length == 0
      - >-
        item.runtime_file_force_recreate_services | default([]) | unique | list | length
        == item.runtime_file_force_recreate_services | default([]) | length
      - >-
        item.runtime_file_force_recreate_services | default([]) | reject('string') | list | length == 0
      - >-
        item.runtime_file_force_recreate_services | default([]) | select('equalto', '') | list | length == 0
    fail_msg: Isolated recreation declarations must contain unique non-empty service names only.
  loop: "{{ docker_compose_projects }}"
  loop_control:
    label: "{{ item.name }}"

- name: Validate isolated recreation services exist in their Compose projects
  ansible.builtin.command:
    cmd: docker compose config --services
    chdir: "{{ item.dest }}"
  loop: "{{ docker_compose_projects }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.runtime_file_force_recreate_services is defined
  register: docker_compose_declared_services
  changed_when: false
  failed_when: >-
    docker_compose_declared_services.rc != 0 or
    item.runtime_file_force_recreate_services | difference(
      docker_compose_declared_services.stdout_lines
    ) | length > 0

- name: Recreate only services with changed service-specific runtime inputs
  ansible.builtin.command:
    cmd: >-
      docker compose up -d --build --force-recreate --no-deps
      {{ item.1 }}
    chdir: "{{ item.0.dest }}"
  loop: >-
    {{ docker_compose_projects
       | subelements('runtime_file_force_recreate_services', skip_missing=True) }}
  loop_control:
    label: "{{ item.0.name }}:{{ item.1 }}"
  when: item.0.name in docker_compose_force_recreate_service_projects
  register: docker_compose_service_up
  changed_when: true

- name: Pull Compose project images
  ansible.builtin.command:
    cmd: docker compose pull --ignore-buildable
    chdir: "{{ item.dest }}"
  loop: "{{ docker_compose_projects }}"
  loop_control:
    label: "{{ item.name }}"
  changed_when: false

- name: Build and start Compose projects in dependency order
  ansible.builtin.command:
    cmd: >-
      docker compose up -d --build
      {{ '--force-recreate'
      if item.name in docker_compose_force_recreate_projects
      else '' }}
      --remove-orphans
    chdir: "{{ item.dest }}"
  loop: "{{ docker_compose_projects }}"
  loop_control:
    label: "{{ item.name }}"
  register: docker_compose_up
  changed_when: >-
    item.name in docker_compose_force_recreate_projects or
    'Creating' in (docker_compose_up.stdout + docker_compose_up.stderr) or
    'Created' in (docker_compose_up.stdout + docker_compose_up.stderr) or
    'Recreating' in (docker_compose_up.stdout + docker_compose_up.stderr) or
    'Recreated' in (docker_compose_up.stdout + docker_compose_up.stderr) or
    'Starting' in (docker_compose_up.stdout + docker_compose_up.stderr) or
    'Started' in (docker_compose_up.stdout + docker_compose_up.stderr) or
    'Removing' in (docker_compose_up.stdout + docker_compose_up.stderr) or
    'Removed' in (docker_compose_up.stdout + docker_compose_up.stderr) or
    'Removed orphan' in (docker_compose_up.stdout + docker_compose_up.stderr)

- name: Read effective qBittorrent Web UI preferences
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - exec
      - -T
      - "{{ item.service_name }}"
      - sh
      - -c
      - >-
        if command -v curl >/dev/null 2>&1; then
          exec curl -fsS http://127.0.0.1:8080/api/v2/app/preferences;
        fi;
        exec wget -qO- http://127.0.0.1:8080/api/v2/app/preferences
    chdir: "{{ docker_apps_compose_root }}/media"
  loop: "{{ qbittorrent_instances }}"
  loop_control:
    label: "{{ item.service_name }}"
  register: qbittorrent_effective_preferences
  changed_when: false
  retries: 12
  delay: 5
  until: qbittorrent_effective_preferences.rc == 0
  no_log: true

- name: Select VueTorrent through the live qBittorrent API when required
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - exec
      - -T
      - "{{ item.item.service_name }}"
      - sh
      - -c
      - |
        if command -v curl >/dev/null 2>&1; then
          exec curl -fsS \
            -H 'Referer: http://127.0.0.1:8080' \
            -H 'Origin: http://127.0.0.1:8080' \
            --data-urlencode \
            'json={"alternative_webui_enabled":true,"alternative_webui_path":"/vuetorrent"}' \
            http://127.0.0.1:8080/api/v2/app/setPreferences
        fi;
        exec wget -qO- \
          --header='Referer: http://127.0.0.1:8080' \
          --header='Origin: http://127.0.0.1:8080' \
          --post-data='json=%7B%22alternative_webui_enabled%22%3Atrue%2C%22alternative_webui_path%22%3A%22%2Fvuetorrent%22%7D' \
          http://127.0.0.1:8080/api/v2/app/setPreferences
    chdir: "{{ docker_apps_compose_root }}/media"
  loop: "{{ qbittorrent_effective_preferences.results }}"
  loop_control:
    label: "{{ item.item.service_name }}"
  when: >-
    not ((item.stdout | from_json).alternative_webui_enabled | bool) or
    (item.stdout | from_json).alternative_webui_path != '/vuetorrent'
  changed_when: true
  no_log: true

- name: Re-read effective qBittorrent Web UI preferences
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - exec
      - -T
      - "{{ item.service_name }}"
      - sh
      - -c
      - >-
        if command -v curl >/dev/null 2>&1; then
          exec curl -fsS http://127.0.0.1:8080/api/v2/app/preferences;
        fi;
        exec wget -qO- http://127.0.0.1:8080/api/v2/app/preferences
    chdir: "{{ docker_apps_compose_root }}/media"
  loop: "{{ qbittorrent_instances }}"
  loop_control:
    label: "{{ item.service_name }}"
  register: qbittorrent_verified_preferences
  changed_when: false
  retries: 6
  delay: 2
  until: >-
    qbittorrent_verified_preferences.rc == 0 and
    (qbittorrent_verified_preferences.stdout | from_json).alternative_webui_enabled | bool and
    (qbittorrent_verified_preferences.stdout | from_json).alternative_webui_path == '/vuetorrent'
  no_log: true

- name: Verify effective qBittorrent VueTorrent selection
  ansible.builtin.assert:
    that:
      - (item.stdout | from_json).alternative_webui_enabled | bool
      - (item.stdout | from_json).alternative_webui_path == '/vuetorrent'
    fail_msg: qBittorrent must use the VueTorrent Web UI rooted at /vuetorrent.
  loop: "{{ qbittorrent_verified_preferences.results }}"
  loop_control:
    label: "{{ item.item.service_name }}"
  no_log: true

- name: Restrict qBittorrent configuration metadata after live reconciliation
  ansible.builtin.file:
    path: "{{ item.config_root }}/qBittorrent/qBittorrent.conf"
    state: file
    owner: "{{ service_uid }}"
    group: "{{ service_gid }}"
    mode: "0600"
  loop: "{{ qbittorrent_instances }}"
  loop_control:
    label: "{{ item.service_name }}"

- name: Verify AdGuard runtime Safe Search is disabled
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ adguard_admin_port }}/control/safesearch/status"
    method: GET
    url_username: "{{ adguard_admin_username }}"
    url_password: "{{ adguard_admin_password }}"
    force_basic_auth: true
    status_code: 200
    return_content: true
  register: adguard_safe_search_runtime
  changed_when: false
  retries: 12
  delay: 5
  until:
    - adguard_safe_search_runtime.status == 200
    - not (adguard_safe_search_runtime.json.enabled | default(true) | bool)
  no_log: true

- name: Assert retired Compose service containers are absent
  ansible.builtin.command:
    argv:
      - docker
      - ps
      - --all
      - --quiet
      - --filter
      - "label=com.docker.compose.project={{ item.project }}"
      - --filter
      - "label=com.docker.compose.service={{ item.service }}"
  loop: "{{ retired_docker_compose_services | default([]) }}"
  loop_control:
    label: "{{ item.project }}:{{ item.service }}"
  register: retired_docker_compose_service_containers
  changed_when: false
  failed_when: retired_docker_compose_service_containers.stdout | trim | length > 0

- name: Inspect retired Docker volumes
  ansible.builtin.command:
    argv:
      - docker
      - volume
      - inspect
      - "{{ item }}"
  loop: "{{ retired_docker_volumes | default([]) }}"
  register: retired_docker_volume_inspections
  changed_when: false
  failed_when: retired_docker_volume_inspections.rc not in [0, 1]

- name: Remove retired Docker volumes
  ansible.builtin.command:
    argv:
      - docker
      - volume
      - rm
      - "{{ item.item }}"
  loop: "{{ retired_docker_volume_inspections.results }}"
  when: item.rc == 0
  changed_when: true

