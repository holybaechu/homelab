---
- name: Reload systemd for isolated Discord relay
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Inspect isolated Discord relay before restart
  ansible.builtin.command:
    argv:
      - systemctl
      - is-active
      - --quiet
      - openclaw-discord-relay.service
  register: openclaw_discord_relay_active_for_restart
  changed_when: false
  failed_when: openclaw_discord_relay_active_for_restart.rc not in [0, 3]
  listen: Restart isolated Discord relay

- name: Restart an already-active isolated Discord relay
  ansible.builtin.systemd_service:
    name: openclaw-discord-relay.service
    state: restarted
  when:
    - openclaw_discord_relay_enabled | bool
    - openclaw_discord_relay_active_for_restart.rc == 0
  listen: Restart isolated Discord relay
