---
- name: Require a stable OpenClaw Gateway token
  ansible.builtin.assert:
    that:
      - openclaw_gateway_token is defined
      - openclaw_gateway_token is string
      - openclaw_gateway_token | trim is match('^[0-9a-fA-F]{64}$')
    fail_msg: >-
      Configure OPENCLAW_GATEWAY_TOKEN as exactly 64 hexadecimal characters
      in the production secret store.
  no_log: true

- name: Require separated absolute OpenClaw paths
  ansible.builtin.assert:
    that:
      - openclaw_compose_root.startswith('/')
      - openclaw_setup_root.startswith('/')
      - openclaw_runtime_root.startswith('/')
      - openclaw_control_root.startswith('/')
      - openclaw_compose_root != openclaw_setup_root
      - openclaw_compose_root != openclaw_runtime_root
      - openclaw_compose_root != openclaw_control_root
      - openclaw_setup_root != openclaw_runtime_root
      - openclaw_setup_root != openclaw_control_root
      - openclaw_runtime_root != openclaw_control_root
      - not openclaw_compose_root.startswith(openclaw_setup_root + '/')
      - not openclaw_setup_root.startswith(openclaw_compose_root + '/')
      - not openclaw_compose_root.startswith(openclaw_runtime_root + '/')
      - not openclaw_runtime_root.startswith(openclaw_compose_root + '/')
      - not openclaw_compose_root.startswith(openclaw_control_root + '/')
      - not openclaw_control_root.startswith(openclaw_compose_root + '/')
      - not openclaw_runtime_root.startswith(openclaw_setup_root + '/')
      - not openclaw_setup_root.startswith(openclaw_runtime_root + '/')
      - not openclaw_control_root.startswith(openclaw_setup_root + '/')
      - not openclaw_setup_root.startswith(openclaw_control_root + '/')
      - not openclaw_runtime_root.startswith(openclaw_control_root + '/')
      - not openclaw_control_root.startswith(openclaw_runtime_root + '/')
      - openclaw_config_path == openclaw_setup_root + '/config/openclaw.json'
      - openclaw_state_root == openclaw_runtime_root + '/state'
      - openclaw_auth_profile_secret_root == openclaw_runtime_root + '/auth-profile-secrets'
      - openclaw_secret_root == openclaw_control_root + '/secrets'
      - openclaw_gateway_token_path == openclaw_secret_root + '/gateway_token'
      - openclaw_native_cutover_marker_path == openclaw_control_root + '/native-cutover-validated'
      - openclaw_native_transition_marker_value == 'homelab-openclaw-native-migration-v1'
      - openclaw_retained_gateway_identity_path == openclaw_control_root + '/retained-gateway-identity.json'
      - openclaw_retained_gateway_verifier_path == '/usr/local/libexec/openclaw-retained-gateway'
      - openclaw_retained_image_ref == 'ghcr.io/openclaw/openclaw:2026.7.1-2@sha256:8789721d2e9b24b780a1504b56deb4c6bd5c7dbf96a1dd117e7c45c2ed72c8ac'
      - openclaw_retained_cli_version_output == 'OpenClaw 2026.7.1-2 (0790d9f)'
      - openclaw_docker_rollback_activate is boolean
      - hostvars['openclaw'].openclaw_native_activate is defined
      - hostvars['openclaw'].openclaw_native_activate is boolean
      - >-
        (hostvars['openclaw'].openclaw_native_activate | bool) !=
        (openclaw_docker_rollback_activate | bool)
      - >-
        openclaw_traefik_backend_url ==
        (
          'http://openclaw-rollback:18789'
          if openclaw_docker_rollback_activate | bool
          else 'http://' + openclaw_ip + ':18789'
        )
    fail_msg: OpenClaw deployment, private setup, runtime, and control paths must remain separated.

- name: Require the persistent homelab mount before writing OpenClaw state
  ansible.builtin.command: "mountpoint -q {{ docker_apps_data_root }}"
  changed_when: false

- name: Inspect the validated native OpenClaw cutover marker
  ansible.builtin.stat:
    path: "{{ openclaw_native_cutover_marker_path }}"
    follow: false
  register: openclaw_native_cutover_marker

- name: Read the validated native OpenClaw cutover marker
  ansible.builtin.slurp:
    src: "{{ openclaw_native_cutover_marker_path }}"
  register: openclaw_native_cutover_marker_content
  when: openclaw_native_cutover_marker.stat.exists | default(false)
  no_log: true

- name: Require the exact validated native OpenClaw cutover marker
  ansible.builtin.assert:
    that:
      - openclaw_native_cutover_marker.stat.isreg | default(false)
      - not (openclaw_native_cutover_marker.stat.islnk | default(false))
      - openclaw_native_cutover_marker.stat.uid == 0
      - openclaw_native_cutover_marker.stat.gid == 0
      - openclaw_native_cutover_marker.stat.mode == '0600'
      - (openclaw_native_cutover_marker_content.content | b64decode) == openclaw_native_transition_marker_value + '\n'
    fail_msg: >-
      The native cutover marker exists but is malformed; refusing to start or
      hold either Gateway until an operator resolves the ambiguity.
  when: openclaw_native_cutover_marker.stat.exists | default(false)
  no_log: true

- name: Require the permanent source hold before tracked Docker rollback
  ansible.builtin.assert:
    that:
      - openclaw_native_cutover_marker.stat.exists | default(false)
    fail_msg: >-
      Docker rollback is allowed only from a completed native cutover with its
      exact permanent source hold marker intact.
  when: openclaw_docker_rollback_activate | bool

- name: Inspect the retained verifier executable path after validated cutover
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop:
    - /usr/local
    - /usr/local/libexec
    - "{{ openclaw_retained_gateway_verifier_path }}"
  register: openclaw_retained_gateway_verifier_directories
  when: openclaw_native_cutover_marker.stat.exists | default(false)

- name: Require a real root-owned retained verifier executable path
  ansible.builtin.assert:
    that:
      - openclaw_retained_gateway_verifier_directories.results[0].stat.isdir | default(false)
      - not (openclaw_retained_gateway_verifier_directories.results[0].stat.islnk | default(false))
      - openclaw_retained_gateway_verifier_directories.results[0].stat.uid | default(-1) == 0
      - openclaw_retained_gateway_verifier_directories.results[0].stat.gid | default(-1) == 0
      - openclaw_retained_gateway_verifier_directories.results[0].stat.mode | default('') == '0755'
      - >-
        not (openclaw_retained_gateway_verifier_directories.results[1].stat.exists | default(false)) or
        (
          openclaw_retained_gateway_verifier_directories.results[1].stat.isdir | default(false) and
          not (openclaw_retained_gateway_verifier_directories.results[1].stat.islnk | default(false)) and
          openclaw_retained_gateway_verifier_directories.results[1].stat.uid | default(-1) == 0 and
          openclaw_retained_gateway_verifier_directories.results[1].stat.gid | default(-1) == 0 and
          openclaw_retained_gateway_verifier_directories.results[1].stat.mode | default('') == '0755'
        )
      - >-
        not (openclaw_retained_gateway_verifier_directories.results[2].stat.exists | default(false)) or
        (
          openclaw_retained_gateway_verifier_directories.results[2].stat.isreg | default(false) and
          not (openclaw_retained_gateway_verifier_directories.results[2].stat.islnk | default(false)) and
          openclaw_retained_gateway_verifier_directories.results[2].stat.uid | default(-1) == 0 and
          openclaw_retained_gateway_verifier_directories.results[2].stat.gid | default(-1) == 0 and
          openclaw_retained_gateway_verifier_directories.results[2].stat.mode | default('') == '0755' and
          openclaw_retained_gateway_verifier_directories.results[2].stat.nlink | default(-1) == 1
        )
    fail_msg: >-
      The retained verifier executable path must remain real, root-owned, and
      mode 0755; refusing a redirected or writable executable boundary.
  when: openclaw_native_cutover_marker.stat.exists | default(false)

- name: Create the root-owned local executable directory after validated cutover
  ansible.builtin.file:
    path: /usr/local/libexec
    state: directory
    owner: root
    group: root
    mode: "0755"
    follow: false
  when: openclaw_native_cutover_marker.stat.exists | default(false)

- name: Install the retained OpenClaw rollback verifier after validated cutover
  ansible.builtin.copy:
    src: openclaw_retained_gateway.py
    dest: "{{ openclaw_retained_gateway_verifier_path }}"
    owner: root
    group: root
    mode: "0755"
    follow: false
  when: openclaw_native_cutover_marker.stat.exists | default(false)

- name: Inspect the bundled retained OpenClaw rollback verifier
  ansible.builtin.stat:
    path: "{{ role_path }}/files/openclaw_retained_gateway.py"
    checksum_algorithm: sha256
  delegate_to: localhost
  become: false
  register: openclaw_retained_gateway_verifier_source
  when: openclaw_native_cutover_marker.stat.exists | default(false)

- name: Inspect the installed retained OpenClaw rollback verifier
  ansible.builtin.stat:
    path: "{{ openclaw_retained_gateway_verifier_path }}"
    follow: false
    checksum_algorithm: sha256
  register: openclaw_retained_gateway_verifier_install
  when: openclaw_native_cutover_marker.stat.exists | default(false)

- name: Require the exact installed retained OpenClaw rollback verifier
  ansible.builtin.assert:
    that:
      - openclaw_retained_gateway_verifier_install.stat.isreg | default(false)
      - not (openclaw_retained_gateway_verifier_install.stat.islnk | default(false))
      - openclaw_retained_gateway_verifier_install.stat.uid | default(-1) == 0
      - openclaw_retained_gateway_verifier_install.stat.gid | default(-1) == 0
      - openclaw_retained_gateway_verifier_install.stat.mode | default('') == '0755'
      - openclaw_retained_gateway_verifier_install.stat.nlink | default(-1) == 1
      - openclaw_retained_gateway_verifier_source.stat.isreg | default(false)
      - openclaw_retained_gateway_verifier_source.stat.checksum | default('') | length == 64
      - >-
        openclaw_retained_gateway_verifier_install.stat.checksum | default('') ==
        openclaw_retained_gateway_verifier_source.stat.checksum | default('')
    fail_msg: >-
      The installed retained verifier must be a single-linked root-owned mode
      0755 regular file before any execution.
  when: openclaw_native_cutover_marker.stat.exists | default(false)

- name: Check for a half-committed native OpenClaw listener
  ansible.builtin.wait_for:
    host: "{{ openclaw_ip }}"
    port: "{{ openclaw_gateway_port }}"
    state: stopped
    connect_timeout: 1
    timeout: 2
  register: openclaw_unmarked_native_listener_probe
  changed_when: false
  failed_when: false
  when: not (openclaw_native_cutover_marker.stat.exists | default(false))

- name: Reject an unmarked native OpenClaw listener before Docker startup
  ansible.builtin.assert:
    that:
      - openclaw_unmarked_native_listener_probe.msg is not defined
    fail_msg: >-
      A native OpenClaw listener is reachable without the validated source
      marker; refusing to start Docker and risk split brain.
  when: not (openclaw_native_cutover_marker.stat.exists | default(false))

- name: Preserve the validated native cutover and hold Docker Gateway stopped
  when:
    - openclaw_native_cutover_marker.stat.exists | default(false)
    - not (openclaw_docker_rollback_activate | bool)
  block:
    - name: Require the validated native Gateway to remain ready
      ansible.builtin.uri:
        url: "http://{{ openclaw_ip }}:{{ openclaw_gateway_port }}/readyz"
        method: GET
        status_code: 200
        return_content: false
      register: openclaw_native_cutover_readiness
      changed_when: false
      retries: 6
      delay: 5
      until: openclaw_native_cutover_readiness.status == 200

    - name: Inspect whether the retained Docker OpenClaw Gateway is running
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - ps
          - --status
          - running
          - -q
          - openclaw-gateway
      args:
        chdir: "{{ openclaw_compose_root }}"
      register: openclaw_retained_gateway_running
      changed_when: false

    - name: Stop the retained Docker OpenClaw Gateway
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - stop
          - --timeout
          - "30"
          - openclaw-gateway
      args:
        chdir: "{{ openclaw_compose_root }}"
      register: openclaw_retained_gateway_stop
      changed_when: true
      when: openclaw_retained_gateway_running.stdout | trim | length > 0

    - name: Assert the retained Docker OpenClaw Gateway remains stopped
      ansible.builtin.shell: |
        set -eu
        test -z "$(docker compose ps --status running -q openclaw-gateway)"
      args:
        executable: /bin/sh
        chdir: "{{ openclaw_compose_root }}"
      changed_when: false

    - name: Disconnect the stopped rollback Gateway from the proxy network
      ansible.builtin.shell: |
        set -eu
        container="$(docker compose ps --all -q openclaw-gateway)"
        test -n "$container"
        if docker inspect --format '{% raw %}{{json .NetworkSettings.Networks}}{% endraw %}' "$container" |
            python3 -c 'import json, sys; raise SystemExit(0 if "homelab_proxy" in json.load(sys.stdin) else 1)'; then
          docker network disconnect -f homelab_proxy "$container"
          printf '%s\n' changed
        fi
      args:
        executable: /bin/sh
        chdir: "{{ openclaw_compose_root }}"
      changed_when: "'changed' in openclaw_retained_gateway_proxy_disconnect.stdout"
      register: openclaw_retained_gateway_proxy_disconnect

    - name: Require retained rollback assets and their immutable identity checkpoint
      ansible.builtin.command:
        argv:
          - "{{ openclaw_retained_gateway_verifier_path }}"
          - require
          - --container-state
          - stopped
          - --config-state
          - foundation-or-rollback
          - --compose-root
          - "{{ openclaw_compose_root }}"
          - --setup-root
          - "{{ openclaw_setup_root }}"
          - --config
          - "{{ openclaw_config_path }}"
          - --runtime-root
          - "{{ openclaw_runtime_root }}"
          - --state-root
          - "{{ openclaw_state_root }}"
          - --auth-root
          - "{{ openclaw_auth_profile_secret_root }}"
          - --control-root
          - "{{ openclaw_control_root }}"
          - --token
          - "{{ openclaw_gateway_token_path }}"
          - --checkpoint
          - "{{ openclaw_retained_gateway_identity_path }}"
          - --expected-image
          - "{{ openclaw_retained_image_ref }}"
          - --hostname
          - "{{ openclaw_hostname }}"
          - --port
          - "{{ openclaw_gateway_port | string }}"
          - --uid
          - "{{ openclaw_uid | string }}"
          - --gid
          - "{{ openclaw_gid | string }}"
          - --require-expected-token
      args:
        stdin: "{{ openclaw_gateway_token | trim }}\n"
        stdin_add_newline: false
      register: openclaw_retained_gateway_stopped_contract
      changed_when: false
      retries: 3
      delay: 2
      until: openclaw_retained_gateway_stopped_contract.rc == 0
      no_log: true
      when: hostvars['openclaw'].openclaw_native_activate | bool

- name: Activate the exact retained Docker Gateway for tracked rollback
  when: openclaw_docker_rollback_activate | bool
  block:
    - name: Require native OpenClaw to be stopped before Docker rollback
      ansible.builtin.wait_for:
        host: "{{ openclaw_ip }}"
        port: "{{ openclaw_gateway_port }}"
        state: stopped
        connect_timeout: 1
        timeout: 5
      changed_when: false

    - name: Inspect the retained Docker OpenClaw config for rollback
      ansible.builtin.slurp:
        src: "{{ openclaw_config_path }}"
      register: openclaw_docker_rollback_config
      no_log: true

    - name: Require the hardened HTTPS rollback config
      ansible.builtin.assert:
        that:
          - openclaw_rollback_config.gateway.mode == 'local'
          - openclaw_rollback_config.gateway.port | int == openclaw_gateway_port | int
          - openclaw_rollback_config.gateway.bind == 'lan'
          - openclaw_rollback_config.gateway.auth.mode == 'token'
          - >-
            openclaw_rollback_config.gateway.auth.token ==
            {'source': 'file', 'provider': 'gateway_token_file', 'id': 'value'}
          - openclaw_rollback_config.gateway.auth.allowTailscale == false
          - >-
            openclaw_rollback_config.gateway.auth.rateLimit ==
            {'maxAttempts': 10, 'windowMs': 60000, 'lockoutMs': 300000, 'exemptLoopback': true}
          - openclaw_rollback_config.gateway.controlUi.enabled == true
          - openclaw_rollback_config.gateway.controlUi.allowedOrigins == ['https://' + openclaw_hostname]
          - openclaw_rollback_config.gateway.terminal.enabled == false
          - openclaw_rollback_config.gateway.allowRealIpFallback == false
          - openclaw_rollback_config.gateway.tailscale.mode == 'off'
          - openclaw_rollback_config.gateway.tailscale.resetOnExit == false
          - openclaw_rollback_config.gateway.trustedProxies | default([]) | length == 0
          - >-
            openclaw_rollback_config.secrets.providers.gateway_token_file ==
            {'source': 'file', 'path': '/run/secrets/openclaw_gateway_token', 'mode': 'singleValue'}
        fail_msg: >-
          The retained Docker config must be explicitly prepared for the exact
          HTTPS origin without trusting proxy identity before rollback.
      vars:
        openclaw_rollback_config: >-
          {{ openclaw_docker_rollback_config.content | b64decode | from_json }}
      no_log: true

    - name: Require the exact retained rollback assets and immutable identity checkpoint
      ansible.builtin.command:
        argv:
          - "{{ openclaw_retained_gateway_verifier_path }}"
          - require
          - --container-state
          - rollback
          - --config-state
          - rollback
          - --compose-root
          - "{{ openclaw_compose_root }}"
          - --setup-root
          - "{{ openclaw_setup_root }}"
          - --config
          - "{{ openclaw_config_path }}"
          - --runtime-root
          - "{{ openclaw_runtime_root }}"
          - --state-root
          - "{{ openclaw_state_root }}"
          - --auth-root
          - "{{ openclaw_auth_profile_secret_root }}"
          - --control-root
          - "{{ openclaw_control_root }}"
          - --token
          - "{{ openclaw_gateway_token_path }}"
          - --checkpoint
          - "{{ openclaw_retained_gateway_identity_path }}"
          - --expected-image
          - "{{ openclaw_retained_image_ref }}"
          - --hostname
          - "{{ openclaw_hostname }}"
          - --port
          - "{{ openclaw_gateway_port | string }}"
          - --uid
          - "{{ openclaw_uid | string }}"
          - --gid
          - "{{ openclaw_gid | string }}"
          - --require-expected-token
      args:
        stdin: "{{ openclaw_gateway_token | trim }}\n"
        stdin_add_newline: false
      register: openclaw_retained_gateway_rollback_contract
      changed_when: false
      retries: 3
      delay: 2
      until: openclaw_retained_gateway_rollback_contract.rc == 0
      no_log: true

    - name: Prove the exact retained Docker Gateway identity and assets
      ansible.builtin.shell: |
        set -eu
        test -f compose.yml
        test -f .env
        test -d '{{ openclaw_setup_root }}/.git'
        test -f '{{ openclaw_config_path }}'
        test -d '{{ openclaw_state_root }}'
        test -d '{{ openclaw_auth_profile_secret_root }}'
        test -f '{{ openclaw_gateway_token_path }}'
        container="$(docker compose ps --all -q openclaw-gateway)"
        test -n "$container"
        test "$(printf '%s\n' "$container" | sed '/^$/d' | wc -l)" -eq 1
        expected_image="$(docker compose config --images)"
        test "$(printf '%s\n' "$expected_image" | sed '/^$/d' | wc -l)" -eq 1
        test "$(docker inspect --format '{% raw %}{{.Config.Image}}{% endraw %}' "$container")" = "$expected_image"
        test "$(docker inspect --format '{% raw %}{{index .Config.Labels "com.docker.compose.project"}}{% endraw %}' "$container")" = openclaw
        test "$(docker inspect --format '{% raw %}{{index .Config.Labels "com.docker.compose.service"}}{% endraw %}' "$container")" = openclaw-gateway
        docker image inspect "$expected_image" >/dev/null
        printf '%s\n' "$container"
      args:
        executable: /bin/sh
        chdir: "{{ openclaw_compose_root }}"
      register: openclaw_retained_gateway_identity
      changed_when: false

    - name: Require the existing private proxy network for rollback
      ansible.builtin.shell: |
        set -eu
        container='{{ openclaw_retained_gateway_identity.stdout | trim }}'
        docker network inspect homelab_proxy | python3 -c '
        import json, sys
        networks = json.load(sys.stdin)
        valid = (
            len(networks) == 1
            and networks[0].get("Name") == "homelab_proxy"
            and networks[0].get("Driver") == "bridge"
            and networks[0].get("Scope") == "local"
            and networks[0].get("Internal") is False
        )
        raise SystemExit(0 if valid else 1)
        '
        for member in $(docker network inspect --format '{% raw %}{{range .Containers}}{{.Name}} {{end}}{% endraw %}' homelab_proxy); do
          member_id="$(docker inspect --format '{% raw %}{{.Id}}{% endraw %}' "$member")"
          if docker inspect --format '{% raw %}{{json .NetworkSettings.Networks}}{% endraw %}' "$member" |
              python3 -c '
        import json, sys
        network = json.load(sys.stdin).get("homelab_proxy")
        aliases = [] if network is None else network.get("Aliases") or []
        raise SystemExit(0 if "openclaw-rollback" in aliases else 1)
        '; then
            test "$member_id" = "$container"
          fi
        done
      args:
        executable: /bin/sh
      changed_when: false

    - name: Start only the exact retained Docker Gateway
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - start
          - openclaw-gateway
      args:
        chdir: "{{ openclaw_compose_root }}"
      register: openclaw_retained_gateway_start
      changed_when: "'Started' in (openclaw_retained_gateway_start.stdout ~ openclaw_retained_gateway_start.stderr)"

    - name: Attach the retained Gateway to the proxy with its unique rollback alias
      ansible.builtin.shell: |
        set -eu
        container='{{ openclaw_retained_gateway_identity.stdout | trim }}'
        if docker inspect --format '{% raw %}{{json .NetworkSettings.Networks}}{% endraw %}' "$container" |
            python3 -c '
        import json, sys
        network = json.load(sys.stdin).get("homelab_proxy")
        aliases = [] if network is None else network.get("Aliases") or []
        raise SystemExit(0 if "openclaw-rollback" in aliases else 1)
        '; then
          printf '%s\n' unchanged
          exit 0
        fi
        docker network disconnect -f homelab_proxy "$container" 2>/dev/null || true
        docker network connect --alias openclaw-rollback homelab_proxy "$container"
        printf '%s\n' changed
      args:
        executable: /bin/sh
      register: openclaw_retained_gateway_proxy_attach
      changed_when: "'changed' in openclaw_retained_gateway_proxy_attach.stdout_lines"

    - name: Wait for the retained Docker rollback Gateway
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ openclaw_gateway_port }}/readyz"
        method: GET
        status_code: 200
        return_content: false
      register: openclaw_docker_rollback_readiness
      changed_when: false
      retries: 18
      delay: 5
      until: openclaw_docker_rollback_readiness.status == 200

    - name: Validate the running retained Gateway without recreating it
      ansible.builtin.shell: |
        set -eu
        container="$(docker compose ps --status running -q openclaw-gateway)"
        test "$container" = '{{ openclaw_retained_gateway_identity.stdout | trim }}'
        test "$(docker inspect --format '{% raw %}{{.State.Health.Status}}{% endraw %}' "$container")" = healthy
        docker inspect --format '{% raw %}{{json .NetworkSettings.Networks}}{% endraw %}' "$container" |
          python3 -c '
        import json, sys
        network = json.load(sys.stdin).get("homelab_proxy")
        aliases = [] if network is None else network.get("Aliases") or []
        raise SystemExit(0 if "openclaw-rollback" in aliases else 1)
        '
        test "$(stat -c '%u:%g %a' '{{ openclaw_native_cutover_marker_path }}')" = '0:0 600'
        test "$(cat '{{ openclaw_native_cutover_marker_path }}')" = '{{ openclaw_native_transition_marker_value }}'
      args:
        executable: /bin/sh
        chdir: "{{ openclaw_compose_root }}"
      changed_when: false

    - name: Validate and audit the retained rollback Gateway
      ansible.builtin.shell: |
        set -eu
        test "$(docker compose exec -T openclaw-gateway node dist/index.js --version)" = \
          '{{ openclaw_retained_cli_version_output }}'
        docker compose exec -T openclaw-gateway node dist/index.js config validate --json |
          python3 -c 'import json, sys; value=json.load(sys.stdin); raise SystemExit(0 if value.get("valid") and not value.get("warnings") else 1)'
        docker compose exec -T openclaw-gateway node dist/index.js secrets audit --check --json |
          python3 -c 'import json, sys; value=json.load(sys.stdin); summary=value.get("summary") or {}; raise SystemExit(0 if value.get("status") == "clean" and summary.get("plaintextCount") == 0 and summary.get("unresolvedRefCount") == 0 else 1)'
      args:
        executable: /bin/sh
        chdir: "{{ openclaw_compose_root }}"
      changed_when: false
      no_log: true

- name: Inspect the private OpenClaw repository
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ openclaw_setup_root }}"
    - "{{ openclaw_setup_root }}/.git"
    - "{{ openclaw_config_path }}"
  register: openclaw_setup_paths
  when: not (openclaw_native_cutover_marker.stat.exists | default(false))

- name: Require the protected private OpenClaw repository and regular config file
  ansible.builtin.assert:
    that:
      - openclaw_setup_paths.results[0].stat.isdir | default(false)
      - openclaw_setup_paths.results[0].stat.uid == 0
      - openclaw_setup_paths.results[0].stat.gid == openclaw_gid | int
      - openclaw_setup_paths.results[0].stat.mode == '0750'
      - openclaw_setup_paths.results[1].stat.isdir | default(false)
      - openclaw_setup_paths.results[1].stat.uid == 0
      - openclaw_setup_paths.results[1].stat.gid == 0
      - openclaw_setup_paths.results[1].stat.mode == '0700'
      - openclaw_setup_paths.results[2].stat.isreg | default(false)
      - not (openclaw_setup_paths.results[2].stat.islnk | default(false))
      - openclaw_setup_paths.results[2].stat.uid == 0
      - openclaw_setup_paths.results[2].stat.gid == openclaw_gid | int
      - openclaw_setup_paths.results[2].stat.mode == '0640'
    fail_msg: >-
      The private openclaw-setup repository or active config has unexpected
      type, ownership, or permissions; refusing to deploy it.
  when: not (openclaw_native_cutover_marker.stat.exists | default(false))

- name: Reject deployment manifests in the private OpenClaw repository root
  ansible.builtin.find:
    paths: "{{ openclaw_setup_root }}"
    recurse: false
    file_type: file
    patterns:
      - compose.yml
      - compose.yaml
      - docker-compose.yml
      - docker-compose.yaml
  register: openclaw_private_deployment_manifests
  failed_when: openclaw_private_deployment_manifests.matched > 0
  when: not (openclaw_native_cutover_marker.stat.exists | default(false))

- name: Require a clean main branch in the private OpenClaw repository
  ansible.builtin.shell: |
    set -eu
    test "$(git branch --show-current)" = main
    git rev-parse --verify HEAD >/dev/null
    test -z "$(git status --porcelain=v1)"
    git ls-files --error-unmatch config/openclaw.json >/dev/null
    test -z "$(git ls-files -- .env)"
  args:
    executable: /bin/sh
    chdir: "{{ openclaw_setup_root }}"
  changed_when: false
  when: not (openclaw_native_cutover_marker.stat.exists | default(false))

- name: Read the active private OpenClaw revision
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ openclaw_setup_root }}"
      - rev-parse
      - HEAD
  register: openclaw_setup_revision
  changed_when: false
  when: not (openclaw_native_cutover_marker.stat.exists | default(false))

- name: Inspect the existing OpenClaw deployment directory
  ansible.builtin.stat:
    path: "{{ openclaw_compose_root }}"
  register: openclaw_compose_root_stat
  when: not (openclaw_native_cutover_marker.stat.exists | default(false))

- name: Reject alternate OpenClaw deployment manifests
  ansible.builtin.find:
    paths: "{{ openclaw_compose_root }}"
    recurse: false
    file_type: file
    patterns:
      - compose.yaml
      - docker-compose.yml
      - docker-compose.yaml
  register: openclaw_alternate_compose_files
  failed_when: openclaw_alternate_compose_files.matched > 0
  when:
    - not (openclaw_native_cutover_marker.stat.exists | default(false))
    - openclaw_compose_root_stat.stat.isdir | default(false)

- name: Create OpenClaw deployment and runtime directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ openclaw_compose_root }}"
      owner: "{{ openclaw_uid }}"
      group: "{{ openclaw_gid }}"
      mode: "0755"
    - path: "{{ openclaw_control_root }}"
      owner: root
      group: root
      mode: "0755"
    - path: "{{ openclaw_secret_root }}"
      owner: root
      group: "{{ openclaw_gid }}"
      mode: "0750"
    - path: "{{ openclaw_runtime_root }}"
      owner: "{{ openclaw_uid }}"
      group: "{{ openclaw_gid }}"
      mode: "0700"
    - path: "{{ openclaw_state_root }}"
      owner: "{{ openclaw_uid }}"
      group: "{{ openclaw_gid }}"
      mode: "0700"
    - path: "{{ openclaw_state_root }}/workspace"
      owner: "{{ openclaw_uid }}"
      group: "{{ openclaw_gid }}"
      mode: "0700"
    - path: "{{ openclaw_auth_profile_secret_root }}"
      owner: "{{ openclaw_uid }}"
      group: "{{ openclaw_gid }}"
      mode: "0700"
  loop_control:
    label: "{{ item.path }}"
  when: not (openclaw_native_cutover_marker.stat.exists | default(false))

- name: Install the OpenClaw Gateway token outside Git
  ansible.builtin.copy:
    content: "{{ openclaw_gateway_token | trim }}\n"
    dest: "{{ openclaw_gateway_token_path }}"
    owner: "{{ openclaw_uid }}"
    group: "{{ openclaw_gid }}"
    mode: "0600"
  register: openclaw_gateway_token_install
  no_log: true
  diff: false
  when: not (openclaw_native_cutover_marker.stat.exists | default(false))

- name: Copy the public OpenClaw Compose project
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../../apps/compose/openclaw/"
    dest: "{{ openclaw_compose_root }}/"
    owner: "{{ openclaw_uid }}"
    group: "{{ openclaw_gid }}"
    mode: preserve
  when: not (openclaw_native_cutover_marker.stat.exists | default(false))

- name: Render the non-secret OpenClaw deployment environment
  ansible.builtin.template:
    src: openclaw.env.j2
    dest: "{{ openclaw_compose_root }}/.env"
    owner: "{{ openclaw_uid }}"
    group: "{{ openclaw_gid }}"
    mode: "0600"
  when: not (openclaw_native_cutover_marker.stat.exists | default(false))

- name: Validate the OpenClaw Compose project
  ansible.builtin.command:
    cmd: docker compose config --quiet
    chdir: "{{ openclaw_compose_root }}"
  changed_when: false
  when: not (openclaw_native_cutover_marker.stat.exists | default(false))

- name: Read the immutable OpenClaw image from Compose
  ansible.builtin.command:
    cmd: docker compose config --images
    chdir: "{{ openclaw_compose_root }}"
  register: openclaw_rendered_image
  changed_when: false
  failed_when: >-
    openclaw_rendered_image.rc != 0 or
    openclaw_rendered_image.stdout_lines | length != 1 or
    not (openclaw_rendered_image.stdout | trim is match(
      '^ghcr\.io/openclaw/openclaw:[^@\s]+@sha256:[0-9a-f]{64}$'
    ))
  when: not (openclaw_native_cutover_marker.stat.exists | default(false))

- name: Require the loopback Gateway port to be available
  ansible.builtin.shell: |
    set -eu
    current="$(docker compose ps --all -q openclaw-gateway 2>/dev/null || true)"
    for owner in $(docker ps --no-trunc -q --filter 'publish={{ openclaw_gateway_port }}'); do
      test -n "$current"
      test "$owner" = "$current"
    done
    if test -z "$current"; then
      python3 - "{{ openclaw_gateway_port }}" <<'PY'
    import socket
    import sys

    port = int(sys.argv[1])
    sock = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
    try:
        sock.bind(("127.0.0.1", port))
    finally:
        sock.close()
    PY
    fi
  args:
    executable: /bin/sh
    chdir: "{{ openclaw_compose_root }}"
  changed_when: false
  when: not (openclaw_native_cutover_marker.stat.exists | default(false))

- name: Pull the immutable OpenClaw image
  ansible.builtin.command:
    cmd: docker compose pull
    chdir: "{{ openclaw_compose_root }}"
  changed_when: false
  when: not (openclaw_native_cutover_marker.stat.exists | default(false))

- name: Verify the pinned OpenClaw image runtime identity
  ansible.builtin.command:
    argv:
      - docker
      - image
      - inspect
      - --format
      - "{% raw %}{{.Config.User}}{% endraw %}"
      - "{{ openclaw_rendered_image.stdout | trim }}"
  register: openclaw_image_user
  changed_when: false
  failed_when: openclaw_image_user.stdout | trim != 'node'
  when: not (openclaw_native_cutover_marker.stat.exists | default(false))

- name: Verify the active OpenClaw config path before startup
  ansible.builtin.command:
    cmd: >-
      docker compose run -T --rm --no-deps --entrypoint node
      openclaw-gateway dist/index.js config file
    chdir: "{{ openclaw_compose_root }}"
  register: openclaw_config_file_preflight
  changed_when: false
  failed_when: openclaw_config_file_preflight.stdout | trim != '/etc/openclaw/openclaw.json'
  when: not (openclaw_native_cutover_marker.stat.exists | default(false))

- name: Validate the active OpenClaw config before startup
  ansible.builtin.command:
    cmd: >-
      docker compose run -T --rm --no-deps --entrypoint node
      openclaw-gateway dist/index.js config validate --json
    chdir: "{{ openclaw_compose_root }}"
  register: openclaw_config_validation_preflight
  changed_when: false
  failed_when: >-
    openclaw_config_validation_preflight.rc != 0 or
    not (openclaw_config_validation_preflight.stdout | from_json).valid or
    (openclaw_config_validation_preflight.stdout | from_json).warnings | length > 0
  when: not (openclaw_native_cutover_marker.stat.exists | default(false))

- name: Audit OpenClaw secrets before startup
  ansible.builtin.command:
    cmd: >-
      docker compose run -T --rm --no-deps --entrypoint node
      openclaw-gateway dist/index.js secrets audit --check --json
    chdir: "{{ openclaw_compose_root }}"
  register: openclaw_secrets_audit_preflight
  changed_when: false
  failed_when: >-
    openclaw_secrets_audit_preflight.rc != 0 or
    (openclaw_secrets_audit_preflight.stdout | from_json).status != 'clean'
  no_log: true
  when: not (openclaw_native_cutover_marker.stat.exists | default(false))

- name: Start only the OpenClaw Compose project
  ansible.builtin.command:
    cmd: >-
      docker compose up -d
      {{ '--force-recreate' if openclaw_gateway_token_install.changed else '' }}
      --remove-orphans
    chdir: "{{ openclaw_compose_root }}"
  register: openclaw_compose_up
  changed_when: >-
    'Creating' in (openclaw_compose_up.stdout ~ openclaw_compose_up.stderr) or
    'Recreating' in (openclaw_compose_up.stdout ~ openclaw_compose_up.stderr) or
    'Created' in (openclaw_compose_up.stdout ~ openclaw_compose_up.stderr) or
    'Started' in (openclaw_compose_up.stdout ~ openclaw_compose_up.stderr) or
    'Removed orphan' in (openclaw_compose_up.stdout ~ openclaw_compose_up.stderr)
  when: not (openclaw_native_cutover_marker.stat.exists | default(false))

- name: Wait for the OpenClaw Gateway container to become healthy
  ansible.builtin.shell: |
    set -eu
    container="$(docker compose ps -q openclaw-gateway)"
    test -n "$container"
    test "$(docker inspect --format '{% raw %}{{.State.Health.Status}}{% endraw %}' "$container")" = healthy
  args:
    executable: /bin/sh
    chdir: "{{ openclaw_compose_root }}"
  register: openclaw_gateway_health
  changed_when: false
  retries: 18
  delay: 5
  until: openclaw_gateway_health.rc == 0
  when: not (openclaw_native_cutover_marker.stat.exists | default(false))

- name: Check the OpenClaw Gateway readiness endpoint
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ openclaw_gateway_port }}/readyz"
    method: GET
    status_code: 200
    return_content: false
  register: openclaw_gateway_readiness
  changed_when: false
  retries: 6
  delay: 5
  until: openclaw_gateway_readiness.status == 200
  when: not (openclaw_native_cutover_marker.stat.exists | default(false))
