---
- name: Reload systemd for the CTF Gateway
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Inspect active CTF Gateway before restart
  ansible.builtin.command:
    argv:
      - systemctl
      - is-active
      - --quiet
      - openclaw-ctf-gateway.service
  register: openclaw_ctf_gateway_active_for_restart
  changed_when: false
  failed_when: openclaw_ctf_gateway_active_for_restart.rc not in [0, 3]
  listen: Restart OpenClaw CTF Gateway

- name: Restart an already-active CTF Gateway
  ansible.builtin.systemd_service:
    name: openclaw-ctf-gateway.service
    state: restarted
  when:
    - openclaw_ctf_gateway_active_for_restart.rc == 0
    - openclaw_native_activate | bool
    - not (openclaw_docker_rollback_activate | bool)
  listen: Restart OpenClaw CTF Gateway
