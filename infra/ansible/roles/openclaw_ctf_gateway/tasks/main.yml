---
- name: Require the isolated OpenClaw CTF Gateway contract
  ansible.builtin.assert:
    that:
      - ansible_system == 'Linux'
      - ansible_architecture == 'x86_64'
      - openclaw_ctf_user == 'openclaw-ctf'
      - openclaw_ctf_group == 'openclaw-ctf'
      - openclaw_ctf_uid | int == 1001
      - openclaw_ctf_gid | int == 1001
      - openclaw_ctf_gateway_port | int == 19789
      - openclaw_ctf_gateway_bind_host == '127.0.0.1'
      - openclaw_ctf_workspace_root == '/srv/openclaw-ctf'
      - openclaw_ctf_sandbox_skills_root == openclaw_ctf_state_root + '/sandbox/skills-workspaces'
      - openclaw_ctf_gateway_config_path == '/etc/openclaw/ctf-gateway.json'
      - openclaw_ctf_docker_cli_path == '/opt/openclaw-ctf/bin/docker'
      - openclaw_ctf_docker_ssh_wrapper_path == '/opt/openclaw-ctf/bin/openclaw-ctf-docker-ssh'
      - openclaw_ctf_docker_host == 'ssh://' + openclaw_ctf_docker_user + '@' + ctf_executor_ip
      - openclaw_ctf_docker_client_key_path == openclaw_secret_root + '/ctf_docker_client_key'
      - openclaw_ctf_docker_known_hosts_path == openclaw_secret_root + '/ctf_docker_known_hosts'
      - openclaw_ctf_codex_profile_id == 'openai:ctf'
      - openclaw_ctf_codex_model == 'openai/gpt-5.6-terra'
      - openclaw_ctf_codex_thinking_default == 'xhigh'
      - openclaw_ctf_codex_plugin_spec == 'npm:@openclaw/codex@2026.7.1-1'
      - openclaw_relay_ctf_hmac_path == openclaw_secret_root + '/discord_relay_ctf_hmac'
      - openclaw_native_activate is boolean
      - openclaw_docker_rollback_activate is boolean
    fail_msg: The isolated CTF Gateway paths, identity, or Docker transport contract is invalid.

- name: Require the CTF Gateway token before native activation
  ansible.builtin.assert:
    that:
      - openclaw_ctf_gateway_token is defined
      - openclaw_ctf_gateway_token is string
      - openclaw_ctf_gateway_token | trim is match('^[0-9a-fA-F]{64}$')
    fail_msg: >-
      Configure OPENCLAW_CTF_GATEWAY_TOKEN as exactly 64 hexadecimal characters
      in the production secret store before activating the isolated CTF Gateway.
  no_log: true
  when:
    - openclaw_native_activate | bool
    - not (openclaw_docker_rollback_activate | bool)

- name: Install CTF Gateway operating-system prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - openssh-client
    state: present
    update_cache: true

- name: Create the isolated CTF Gateway group
  ansible.builtin.group:
    name: "{{ openclaw_ctf_group }}"
    gid: "{{ openclaw_ctf_gid }}"
    system: true
    state: present

- name: Create the isolated CTF Gateway user
  ansible.builtin.user:
    name: "{{ openclaw_ctf_user }}"
    uid: "{{ openclaw_ctf_uid }}"
    group: "{{ openclaw_ctf_group }}"
    home: "{{ openclaw_ctf_home }}"
    shell: /usr/sbin/nologin
    create_home: true
    system: true
    password_lock: true
    state: present

- name: Create isolated CTF Gateway directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: /opt/openclaw-ctf, owner: root, group: root, mode: '0755'}
    - {path: /opt/openclaw-ctf/bin, owner: root, group: "{{ openclaw_ctf_group }}", mode: '0750'}
    - {path: /opt/openclaw-ctf-plugins, owner: root, group: root, mode: '0755'}
    - {path: "{{ openclaw_ctf_home }}", owner: root, group: "{{ openclaw_ctf_group }}", mode: '0750'}
    - {path: "{{ openclaw_ctf_cache_root }}", owner: "{{ openclaw_ctf_user }}", group: "{{ openclaw_ctf_group }}", mode: '0700'}
    - {path: "{{ openclaw_ctf_compile_cache_root }}", owner: "{{ openclaw_ctf_user }}", group: "{{ openclaw_ctf_group }}", mode: '0700'}
    - {path: "{{ openclaw_ctf_state_root }}", owner: "{{ openclaw_ctf_user }}", group: "{{ openclaw_ctf_group }}", mode: '0700'}
    - {path: "{{ openclaw_ctf_state_root }}/sandbox", owner: "{{ openclaw_ctf_user }}", group: "{{ openclaw_ctf_group }}", mode: '0700'}
    - {path: "{{ openclaw_ctf_sandbox_skills_root }}", owner: "{{ openclaw_ctf_user }}", group: "{{ openclaw_ctf_group }}", mode: '0700'}
    - {path: "{{ openclaw_ctf_workspace_root }}", owner: "{{ openclaw_ctf_user }}", group: "{{ openclaw_ctf_group }}", mode: '0700'}
    - {path: "{{ openclaw_ctf_home }}/.config", owner: root, group: "{{ openclaw_ctf_group }}", mode: '0750'}
    - {path: "{{ openclaw_ctf_auth_profile_secret_root }}", owner: "{{ openclaw_ctf_user }}", group: "{{ openclaw_ctf_group }}", mode: '0700'}
    - {path: /etc/apt/keyrings, owner: root, group: root, mode: '0755'}
    - {path: /etc/openclaw, owner: root, group: root, mode: '0755'}
    - {path: "{{ openclaw_secret_root }}", owner: root, group: root, mode: '0700'}
  loop_control:
    label: "{{ item.path }}"

- name: Create the durable CTF workspace layout outside the private checkout
  ansible.builtin.file:
    path: "{{ openclaw_ctf_workspace_root }}/{{ item }}"
    state: directory
    owner: "{{ openclaw_ctf_user }}"
    group: "{{ openclaw_ctf_group }}"
    mode: '0700'
  loop:
    - challenges
    - exports
    - media/inbound
    - scripts
    - templates
    - skills/ctf-artifacts
  when: openclaw_native_activate | bool

- name: Inspect required private CTF Gateway source files
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop:
    - "{{ openclaw_ctf_gateway_source_config_path }}"
    - "{{ openclaw_ctf_plugin_source_root }}"
    - "{{ openclaw_setup_root }}/workspaces/ctf/AGENTS.md"
    - "{{ openclaw_setup_root }}/workspaces/ctf/templates/writeup.md"
    - "{{ openclaw_setup_root }}/workspaces/ctf/skills/ctf-artifacts/SKILL.md"
    - "{{ openclaw_setup_root }}/workspaces/ctf/scripts/init-ctf-challenge.py"
    - "{{ openclaw_setup_root }}/workspaces/ctf/scripts/export-ctf-package.py"
    - "{{ openclaw_ctf_plugin_source_root }}/openclaw.plugin.json"
  register: openclaw_ctf_gateway_source_paths
  when: openclaw_native_activate | bool

- name: Require protected CTF Gateway source files
  ansible.builtin.assert:
    that:
      - openclaw_ctf_gateway_source_paths.results[0].stat.isreg | default(false)
      - not (openclaw_ctf_gateway_source_paths.results[0].stat.islnk | default(true))
      - openclaw_ctf_gateway_source_paths.results[1].stat.isdir | default(false)
      - not (openclaw_ctf_gateway_source_paths.results[1].stat.islnk | default(true))
      - openclaw_ctf_gateway_source_paths.results[2].stat.isreg | default(false)
      - openclaw_ctf_gateway_source_paths.results[3].stat.isreg | default(false)
      - openclaw_ctf_gateway_source_paths.results[4].stat.isreg | default(false)
      - openclaw_ctf_gateway_source_paths.results[5].stat.isreg | default(false)
      - openclaw_ctf_gateway_source_paths.results[6].stat.isreg | default(false)
      - openclaw_ctf_gateway_source_paths.results[7].stat.isreg | default(false)
    fail_msg: >-
      The protected private checkout must contain the CTF-only config, relay
      plugin, and tracked CTF workspace assets before activation.
  when: openclaw_native_activate | bool

- name: Read the CTF relay plugin tool manifest
  ansible.builtin.slurp:
    src: "{{ openclaw_ctf_plugin_source_root }}/openclaw.plugin.json"
  register: openclaw_ctf_plugin_manifest_source
  no_log: true
  when: openclaw_native_activate | bool

- name: Require the CTF relay plugin to declare its bounded publish tool
  ansible.builtin.assert:
    that:
      - openclaw_ctf_plugin_manifest.contracts.tools == ['ctf_publish']
      - openclaw_ctf_plugin_manifest.activation.onStartup | bool
    fail_msg: >-
      The CTF relay plugin must explicitly declare its ctf_publish tool before
      the Discord relay can deliver CTF requests.
  vars:
    openclaw_ctf_plugin_manifest: >-
      {{ openclaw_ctf_plugin_manifest_source.content | b64decode | from_json }}
  no_log: true
  when: openclaw_native_activate | bool

- name: Read the protected CTF-only Gateway config
  ansible.builtin.slurp:
    src: "{{ openclaw_ctf_gateway_source_config_path }}"
  register: openclaw_ctf_gateway_source_config
  no_log: true
  when: openclaw_native_activate | bool

- name: Require CTF-only Gateway config and narrow relay route
  ansible.builtin.assert:
    that:
      - >-
        openclaw_ctf_gateway_config.secrets ==
        {'providers':
          {
            'ctf_gateway_token_file': {'source': 'file', 'path': '${OPENCLAW_CTF_GATEWAY_TOKEN_FILE}', 'mode': 'singleValue'}
          }
        }
      - >-
        openclaw_ctf_gateway_config.gateway.auth.token ==
        {'source': 'file', 'provider': 'ctf_gateway_token_file', 'id': 'value'}
      - openclaw_ctf_gateway_config.gateway.port | int == openclaw_ctf_gateway_port | int
      - openclaw_ctf_gateway_config.gateway.bind == 'loopback'
      - openclaw_ctf_gateway_config.gateway.controlUi.enabled == false
      - openclaw_ctf_gateway_config.gateway.terminal.enabled == false
      - openclaw_ctf_gateway_config.agents.list | map(attribute='id') | list == ['ctf']
      - openclaw_ctf_gateway_config.agents.list[0].model.primary == openclaw_ctf_codex_model
      - openclaw_ctf_gateway_config.agents.list[0].thinkingDefault == openclaw_ctf_codex_thinking_default
      - openclaw_ctf_gateway_config.auth.order.openai == [openclaw_ctf_codex_profile_id]
      - >-
        openclaw_ctf_gateway_config.models.providers.openai ==
        {'agentRuntime': {'id': 'codex'}}
      - openclaw_ctf_gateway_config.agents.list[0].workspace == openclaw_ctf_workspace_root
      - openclaw_ctf_gateway_config.agents.list[0].sandbox.backend == 'docker'
      - openclaw_ctf_gateway_config.agents.list[0].sandbox.scope == 'session'
      - openclaw_ctf_gateway_config.agents.list[0].sandbox.docker.network == openclaw_ctf_docker_network
      - openclaw_ctf_gateway_config.agents.list[0].sandbox.docker.user == (openclaw_ctf_uid | string) + ':' + (openclaw_ctf_gid | string)
      - openclaw_ctf_gateway_config.agents.list[0].tools.elevated.enabled == false
      - openclaw_ctf_gateway_config.agents.list[0].tools.alsoAllow == ['ctf_publish']
      - >-
        'openclaw-discord-relay-ctf' in
        openclaw_ctf_gateway_config.agents.list[0].tools.sandbox.tools.allow
      - openclaw_ctf_gateway_config.get('channels', {}) | length == 0
      - openclaw_ctf_gateway_config.get('bindings', []) | length == 0
      - openclaw_ctf_gateway_config.plugins.load.paths == [openclaw_ctf_plugin_root]
      - openclaw_ctf_gateway_config.plugins.entries.codex.enabled | bool
      - openclaw_ctf_gateway_config.plugins.entries['openclaw-discord-relay-ctf'].enabled | bool
      - >-
        openclaw_ctf_gateway_config.plugins.entries['openclaw-discord-relay-ctf']
        ['config']['allowedChannelIds'] | length > 0
    fail_msg: >-
      The isolated CTF config must contain only the Docker-sandboxed CTF agent,
      Codex-subscription OAuth routing, no OpenAI API key, no Discord account
      or bindings, and a fixed CTF relay endpoint.
  vars:
    openclaw_ctf_gateway_config: "{{ openclaw_ctf_gateway_source_config.content | b64decode | from_json }}"
  no_log: true
  when: openclaw_native_activate | bool

- name: Seed tracked CTF instructions and artifact helpers into the isolated workspace
  ansible.builtin.copy:
    src: "{{ openclaw_setup_root }}/{{ item.source }}"
    dest: "{{ openclaw_ctf_workspace_root }}/{{ item.destination }}"
    remote_src: true
    owner: "{{ openclaw_ctf_user }}"
    group: "{{ openclaw_ctf_group }}"
    mode: "{{ item.mode }}"
  loop:
    - {source: workspaces/ctf/AGENTS.md, destination: AGENTS.md, mode: '0640'}
    - {source: workspaces/ctf/templates/writeup.md, destination: templates/writeup.md, mode: '0640'}
    - {source: workspaces/ctf/skills/ctf-artifacts/SKILL.md, destination: skills/ctf-artifacts/SKILL.md, mode: '0640'}
    - {source: workspaces/ctf/scripts/init-ctf-challenge.py, destination: scripts/init-ctf-challenge.py, mode: '0750'}
    - {source: workspaces/ctf/scripts/export-ctf-package.py, destination: scripts/export-ctf-package.py, mode: '0750'}
  when: openclaw_native_activate | bool
  notify: Restart OpenClaw CTF Gateway

- name: Install Docker CLI apt signing key for the isolated CTF Gateway
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: '0644'

- name: Configure Docker CLI apt repository for the isolated CTF Gateway
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable
    filename: docker
    state: present
    update_cache: true

- name: Install the Docker CLI only long enough to stage the isolated binary
  ansible.builtin.apt:
    name: docker-ce-cli
    state: present
    update_cache: true

- name: Copy the Docker CLI into the CTF-only executable directory
  ansible.builtin.copy:
    src: /usr/bin/docker
    dest: "{{ openclaw_ctf_docker_cli_path }}"
    remote_src: true
    owner: root
    group: "{{ openclaw_ctf_group }}"
    mode: '0750'
  notify: Restart OpenClaw CTF Gateway

- name: Remove the globally executable Docker CLI package
  ansible.builtin.apt:
    name: docker-ce-cli
    state: absent
    autoremove: false

- name: Generate the CTF executor Docker transport identity
  ansible.builtin.command:
    argv:
      - /usr/bin/ssh-keygen
      - -q
      - -t
      - ed25519
      - -N
      - ''
      - -f
      - "{{ openclaw_ctf_docker_client_key_path }}"
      - -C
      - openclaw-ctf-docker-transport
  args:
    creates: "{{ openclaw_ctf_docker_client_key_path }}"
  no_log: true
  notify: Restart OpenClaw CTF Gateway

- name: Protect the CTF executor Docker transport identity
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ openclaw_ctf_docker_client_key_path }}", mode: '0600'}
    - {path: "{{ openclaw_ctf_docker_client_key_path }}.pub", mode: '0644'}
  no_log: true

- name: Initialize the pinned CTF executor Docker host-key file
  ansible.builtin.copy:
    content: ''
    dest: "{{ openclaw_ctf_docker_known_hosts_path }}"
    owner: root
    group: root
    mode: '0600'
    force: false
  no_log: true
  notify: Restart OpenClaw CTF Gateway

- name: Install the CTF-only Docker SSH wrapper
  ansible.builtin.template:
    src: openclaw-ctf-docker-ssh.j2
    dest: "{{ openclaw_ctf_docker_ssh_wrapper_path }}"
    owner: root
    group: "{{ openclaw_ctf_group }}"
    mode: '0750'
  notify: Restart OpenClaw CTF Gateway

- name: Inspect the CTF relay HMAC credential
  ansible.builtin.stat:
    path: "{{ openclaw_relay_ctf_hmac_path }}"
    follow: false
  register: openclaw_relay_ctf_hmac_stat
  no_log: true

- name: Generate the CTF relay HMAC credential
  ansible.builtin.command:
    argv:
      - /usr/bin/openssl
      - rand
      - -hex
      - '32'
  register: openclaw_relay_ctf_hmac_generated
  changed_when: true
  no_log: true
  when: not (openclaw_relay_ctf_hmac_stat.stat.exists | default(false))

- name: Store the CTF relay HMAC credential outside Git
  ansible.builtin.copy:
    content: "{{ openclaw_relay_ctf_hmac_generated.stdout }}\n"
    dest: "{{ openclaw_relay_ctf_hmac_path }}"
    owner: root
    group: root
    mode: '0600'
  no_log: true
  diff: false
  when: not (openclaw_relay_ctf_hmac_stat.stat.exists | default(false))
  notify: Restart OpenClaw CTF Gateway

- name: Install the CTF Gateway token outside Git
  ansible.builtin.copy:
    content: "{{ openclaw_ctf_gateway_token | trim }}\n"
    dest: "{{ openclaw_ctf_gateway_token_path }}"
    owner: root
    group: root
    mode: '0600'
  no_log: true
  diff: false
  when:
    - openclaw_native_activate | bool
    - not (openclaw_docker_rollback_activate | bool)
  notify: Restart OpenClaw CTF Gateway

- name: Remove the retired CTF OpenAI API-key credential
  ansible.builtin.file:
    path: "{{ openclaw_secret_root }}/ctf_openai_api_key"
    state: absent
  when:
    - openclaw_native_activate | bool
    - not (openclaw_docker_rollback_activate | bool)
  notify: Restart OpenClaw CTF Gateway

- name: Install the protected CTF Gateway config outside the core checkout
  ansible.builtin.copy:
    src: "{{ openclaw_ctf_gateway_source_config_path }}"
    dest: "{{ openclaw_ctf_gateway_config_path }}"
    remote_src: true
    owner: root
    group: "{{ openclaw_ctf_group }}"
    mode: '0640'
  when: openclaw_native_activate | bool
  notify: Restart OpenClaw CTF Gateway

- name: Install the private CTF relay plugin outside the core checkout
  ansible.builtin.copy:
    src: "{{ openclaw_ctf_plugin_source_root }}/"
    dest: "{{ openclaw_ctf_plugin_root }}/"
    remote_src: true
    owner: root
    group: "{{ openclaw_ctf_group }}"
    mode: preserve
  when: openclaw_native_activate | bool
  notify: Restart OpenClaw CTF Gateway

- name: Restrict the installed CTF relay plugin to the CTF Gateway identity
  ansible.builtin.file:
    path: "{{ openclaw_ctf_plugin_root }}"
    state: directory
    owner: root
    group: "{{ openclaw_ctf_group }}"
    mode: '0750'
    recurse: true
  when: openclaw_native_activate | bool
  notify: Restart OpenClaw CTF Gateway

- name: Validate the isolated CTF config with a service-user token
  when: openclaw_native_activate | bool
  block:
    - name: Create a temporary CTF Gateway validation credential directory
      ansible.builtin.tempfile:
        state: directory
        path: /run
        prefix: openclaw-ctf-validation-credential-
      register: openclaw_ctf_validation_credential_dir
      no_log: true

    - name: Protect the temporary CTF Gateway validation credential directory
      ansible.builtin.file:
        path: "{{ openclaw_ctf_validation_credential_dir.path }}"
        state: directory
        owner: root
        group: "{{ openclaw_ctf_group }}"
        mode: '0750'
      no_log: true

    - name: Materialize a CTF service-user Gateway validation credential
      ansible.builtin.copy:
        src: "{{ openclaw_ctf_gateway_token_path }}"
        dest: "{{ openclaw_ctf_validation_credential_dir.path }}/gateway_token"
        remote_src: true
        owner: "{{ openclaw_ctf_user }}"
        group: "{{ openclaw_ctf_group }}"
        mode: '0400'
      no_log: true
      diff: false

    - name: Materialize a CTF service-user relay HMAC validation credential
      ansible.builtin.copy:
        src: "{{ openclaw_relay_ctf_hmac_path }}"
        dest: "{{ openclaw_ctf_validation_credential_dir.path }}/discord_relay_ctf_hmac"
        remote_src: true
        owner: "{{ openclaw_ctf_user }}"
        group: "{{ openclaw_ctf_group }}"
        mode: '0400'
      no_log: true
      diff: false

    - name: Materialize a writable CTF plugin-install config
      ansible.builtin.copy:
        src: "{{ openclaw_ctf_gateway_config_path }}"
        dest: "{{ openclaw_ctf_validation_credential_dir.path }}/plugin-install-config.json"
        remote_src: true
        owner: "{{ openclaw_ctf_user }}"
        group: "{{ openclaw_ctf_group }}"
        mode: '0600'
      no_log: true
      diff: false

    - name: Install the pinned CTF Codex harness
      ansible.builtin.command:
        argv:
          - "{{ openclaw_node_current_root }}/bin/node"
          - "{{ openclaw_entrypoint }}"
          - plugins
          - install
          - "{{ openclaw_ctf_codex_plugin_spec }}"
          - --pin
          - --force
      become: true
      become_user: "{{ openclaw_ctf_user }}"
      environment: &openclaw_ctf_plugin_install_environment
        HOME: "{{ openclaw_ctf_home }}"
        PATH: "{{ openclaw_ctf_docker_cli_path | dirname }}:{{ openclaw_node_current_root }}/bin:{{ openclaw_current_root }}/bin:/usr/local/bin:/usr/bin:/bin"
        OPENCLAW_HOME: "{{ openclaw_ctf_home }}"
        OPENCLAW_STATE_DIR: "{{ openclaw_ctf_state_root }}"
        OPENCLAW_CONFIG_PATH: "{{ openclaw_ctf_validation_credential_dir.path }}/plugin-install-config.json"
        OPENCLAW_WORKSPACE_DIR: "{{ openclaw_ctf_workspace_root }}"
        OPENCLAW_DISABLE_BONJOUR: '1'
        OPENCLAW_NO_AUTO_UPDATE: '1'
        OPENCLAW_NO_RESPAWN: '1'
        OPENCLAW_SERVICE_REPAIR_POLICY: external
        OPENCLAW_SUPERVISOR_MODE: external
        OPENCLAW_CTF_GATEWAY_TOKEN_FILE: "{{ openclaw_ctf_validation_credential_dir.path }}/gateway_token"
        OPENCLAW_DISCORD_RELAY_CTF_HMAC_FILE: "{{ openclaw_ctf_validation_credential_dir.path }}/discord_relay_ctf_hmac"
      notify: Restart OpenClaw CTF Gateway

    - name: Validate the CTF-only OpenClaw config schema
      ansible.builtin.command:
        argv:
          - "{{ openclaw_node_current_root }}/bin/node"
          - "{{ openclaw_entrypoint }}"
          - config
          - validate
          - --json
      become: true
      become_user: "{{ openclaw_ctf_user }}"
      environment: &openclaw_ctf_cli_environment
        <<: *openclaw_ctf_plugin_install_environment
        OPENCLAW_CONFIG_PATH: "{{ openclaw_ctf_gateway_config_path }}"
      register: openclaw_ctf_config_validation_preflight
      changed_when: false
      failed_when: >-
        openclaw_ctf_config_validation_preflight.rc != 0 or
        not (openclaw_ctf_config_validation_preflight.stdout | from_json).valid or
        (openclaw_ctf_config_validation_preflight.stdout | from_json).warnings | length > 0

    - name: Inspect the CTF Codex harness runtime before startup
      ansible.builtin.command:
        argv:
          - "{{ openclaw_node_current_root }}/bin/node"
          - "{{ openclaw_entrypoint }}"
          - plugins
          - inspect
          - codex
          - --runtime
          - --json
      become: true
      become_user: "{{ openclaw_ctf_user }}"
      environment: *openclaw_ctf_cli_environment
      register: openclaw_ctf_codex_runtime_inspection
      changed_when: false
      failed_when: >-
        openclaw_ctf_codex_runtime_inspection.rc != 0 or
        (openclaw_ctf_codex_runtime_inspection.stdout | from_json).plugin.id != 'codex' or
        (openclaw_ctf_codex_runtime_inspection.stdout | from_json).plugin.status != 'loaded'

    - name: Inspect the CTF relay plugin runtime before startup
      ansible.builtin.command:
        argv:
          - "{{ openclaw_node_current_root }}/bin/node"
          - "{{ openclaw_entrypoint }}"
          - plugins
          - inspect
          - openclaw-discord-relay-ctf
          - --runtime
          - --json
      become: true
      become_user: "{{ openclaw_ctf_user }}"
      environment: *openclaw_ctf_cli_environment
      register: openclaw_ctf_plugin_runtime_inspection
      changed_when: false
      failed_when: >-
        openclaw_ctf_plugin_runtime_inspection.rc != 0 or
        (openclaw_ctf_plugin_runtime_inspection.stdout | from_json).plugin.id != 'openclaw-discord-relay-ctf' or
        (openclaw_ctf_plugin_runtime_inspection.stdout | from_json).plugin.status != 'loaded' or
        'ctf_publish' not in ((openclaw_ctf_plugin_runtime_inspection.stdout | from_json).tools | map(attribute='names') | flatten)
      no_log: true

    - name: Audit CTF-only OpenClaw secrets before startup
      ansible.builtin.command:
        argv:
          - "{{ openclaw_node_current_root }}/bin/node"
          - "{{ openclaw_entrypoint }}"
          - secrets
          - audit
          - --check
          - --json
      become: true
      become_user: "{{ openclaw_ctf_user }}"
      environment: *openclaw_ctf_cli_environment
      register: openclaw_ctf_secrets_audit_preflight
      changed_when: false
      failed_when: >-
        openclaw_ctf_secrets_audit_preflight.rc != 0 or
        (openclaw_ctf_secrets_audit_preflight.stdout | from_json).status != 'clean' or
        (openclaw_ctf_secrets_audit_preflight.stdout | from_json).summary.plaintextCount != 0 or
        (openclaw_ctf_secrets_audit_preflight.stdout | from_json).summary.unresolvedRefCount != 0
      no_log: true
  always:
    - name: Remove the temporary CTF Gateway validation credential directory
      ansible.builtin.file:
        path: "{{ openclaw_ctf_validation_credential_dir.path }}"
        state: absent
      when: openclaw_ctf_validation_credential_dir.path is defined
      no_log: true

- name: Render the isolated CTF Gateway system service
  ansible.builtin.template:
    src: openclaw-ctf-gateway.service.j2
    dest: /etc/systemd/system/openclaw-ctf-gateway.service
    owner: root
    group: root
    mode: '0644'
  notify:
    - Reload systemd for the CTF Gateway
    - Restart OpenClaw CTF Gateway

- name: Flush CTF Gateway handlers before activation
  ansible.builtin.meta: flush_handlers

- name: Activate the isolated CTF Gateway after the core Gateway
  ansible.builtin.systemd_service:
    name: openclaw-ctf-gateway.service
    enabled: true
    state: started
    daemon_reload: true
  when:
    - openclaw_native_activate | bool
    - not (openclaw_docker_rollback_activate | bool)

- name: Stop the isolated CTF Gateway for tracked Docker rollback
  ansible.builtin.systemd_service:
    name: openclaw-ctf-gateway.service
    enabled: false
    state: stopped
    daemon_reload: true
  when: openclaw_docker_rollback_activate | bool

- name: Wait for the isolated CTF Gateway loopback readiness endpoint
  ansible.builtin.uri:
    url: "http://{{ openclaw_ctf_gateway_bind_host }}:{{ openclaw_ctf_gateway_port }}/readyz"
    method: GET
    status_code: 200
    return_content: false
  register: openclaw_ctf_gateway_readiness
  changed_when: false
  retries: 18
  delay: 5
  until: openclaw_ctf_gateway_readiness.status == 200
  when:
    - openclaw_native_activate | bool
    - not (openclaw_docker_rollback_activate | bool)
