---
- name: Cancel any pending tailscaled restart
  ansible.builtin.command:
    argv:
      - systemctl
      - stop
      - tailscaled-ansible-restart.timer
      - tailscaled-ansible-restart.service
  changed_when: false
  failed_when: false

- name: Inspect the interrupted-run guard
  ansible.builtin.stat:
    path: /run/homelab-tailscale-restart.in-progress
  register: tailscale_previous_restart_guard

- name: Install Tailscale signing key
  ansible.builtin.get_url:
    url: https://pkgs.tailscale.com/stable/debian/trixie.noarmor.gpg
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    mode: "0644"

- name: Install Tailscale repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/tailscale.list
    mode: "0644"
    content: |
      deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/debian trixie main
  register: tailscale_apt_repository

- name: Refresh apt metadata after adding the Tailscale repository
  ansible.builtin.apt:
    update_cache: true
  when: tailscale_apt_repository.changed

- name: Install Tailscale gateway network tooling
  ansible.builtin.apt:
    name: ethtool
    update_cache: "{{ homelab_maintenance_upgrade | default(false) | bool }}"
    cache_valid_time: >-
      {{ 3600
         if (homelab_maintenance_upgrade | default(false) | bool)
         else omit }}
    state: >-
      {{ 'latest'
         if (homelab_maintenance_upgrade | default(false) | bool)
         else 'present' }}

- name: Install the deterministic tailscaled restart service
  ansible.builtin.copy:
    src: tailscaled-ansible-restart.service
    dest: /etc/systemd/system/tailscaled-ansible-restart.service
    mode: "0644"

- name: Install the deterministic tailscaled restart timer
  ansible.builtin.copy:
    src: tailscaled-ansible-restart.timer
    dest: /etc/systemd/system/tailscaled-ansible-restart.timer
    mode: "0644"

- name: Install the Tailscale UDP GRO configuration script
  ansible.builtin.copy:
    src: configure-tailscale-udp-gro
    dest: /usr/local/sbin/configure-tailscale-udp-gro
    mode: "0755"

- name: Install the persistent Tailscale UDP GRO service
  ansible.builtin.copy:
    src: tailscale-udp-gro.service
    dest: /etc/systemd/system/tailscale-udp-gro.service
    mode: "0644"

- name: Reload systemd for the Tailscale units
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Enable persistent Tailscale UDP GRO forwarding
  ansible.builtin.systemd_service:
    name: tailscale-udp-gro.service
    enabled: true
    state: started

- name: Apply Tailscale UDP GRO forwarding on every deployment
  ansible.builtin.command:
    argv:
      - /usr/local/sbin/configure-tailscale-udp-gro
  changed_when: false

- name: Allocate this run's tailscaled restart identifier
  ansible.builtin.set_fact:
    tailscale_restart_id: "{{ ansible_date_time.iso8601_micro }}"

- name: Mark this role run as interruption-sensitive
  ansible.builtin.copy:
    dest: /run/homelab-tailscale-restart.in-progress
    content: "{{ tailscale_restart_id }}\n"
    mode: "0600"
  changed_when: false

- name: Install Tailscale without disrupting the active route
  ansible.builtin.apt:
    name: tailscale
    update_cache: "{{ homelab_maintenance_upgrade | default(false) | bool }}"
    cache_valid_time: >-
      {{ 3600
         if (homelab_maintenance_upgrade | default(false) | bool)
         else omit }}
    state: >-
      {{ 'latest'
         if (homelab_maintenance_upgrade | default(false) | bool)
         else 'present' }}
    policy_rc_d: 101
  register: tailscale_package

- name: Disable unusable public IPv6 underlay for stable DERP selection
  ansible.builtin.copy:
    dest: /etc/sysctl.d/90-homelab-ipv4-underlay.conf
    mode: "0644"
    content: |
      net.ipv6.conf.all.disable_ipv6=1
      net.ipv6.conf.default.disable_ipv6=1
      net.ipv6.conf.lo.disable_ipv6=1
  register: tailscale_underlay

- name: Enable IP forwarding
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-tailscale-subnet-router.conf
    mode: "0644"
    content: |
      net.ipv4.ip_forward=1
      net.ipv6.conf.all.forwarding=1

- name: Apply sysctl
  ansible.builtin.command:
    cmd: >-
      sysctl -w
      net.ipv6.conf.all.disable_ipv6=1
      net.ipv6.conf.default.disable_ipv6=1
      net.ipv6.conf.lo.disable_ipv6=1
      net.ipv4.ip_forward=1
      net.ipv6.conf.all.forwarding=1
  changed_when: false

- name: Enable tailscaled
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started

- name: Join Tailscale when auth key is supplied
  ansible.builtin.command:
    argv:
      - tailscale
      - up
      - "--hostname={{ tailscale_hostname }}"
      - "--accept-routes={{ tailscale_accept_routes | lower }}"
      - "--accept-dns={{ tailscale_accept_dns | default(false) | lower }}"
      - "--advertise-routes={{ tailscale_advertise_routes }}"
      - "--advertise-exit-node={{ tailscale_advertise_exit_node | lower }}"
      - "--auth-key={{ tailscale_auth_key }}"
  no_log: true
  when: tailscale_auth_key is defined
  changed_when: false

- name: Detect a tailscaled process using a replaced binary
  ansible.builtin.shell: |
    set -eu
    pid="$(systemctl show --property MainPID --value tailscaled)"
    test "${pid}" -gt 0
    running_executable="$(readlink "/proc/${pid}/exe")"
    case "${running_executable}" in
      /usr/sbin/tailscaled)
        exit 1
        ;;
      "/usr/sbin/tailscaled (deleted)")
        exit 0
        ;;
      *)
        printf 'Unexpected tailscaled executable: %s\n' "${running_executable}" >&2
        exit 0
        ;;
    esac
  args:
    executable: /bin/sh
  register: tailscale_stale_binary
  changed_when: false
  failed_when: false

- name: Decide whether tailscaled must restart
  ansible.builtin.set_fact:
    tailscale_restart_required: >-
      {{
        tailscale_package.changed
        or tailscale_underlay.changed
        or tailscale_stale_binary.rc == 0
        or tailscale_previous_restart_guard.stat.exists
      }}

- name: Reset the deterministic tailscaled restart units
  ansible.builtin.command:
    argv:
      - systemctl
      - reset-failed
      - "{{ item }}"
  changed_when: false
  failed_when: >-
    tailscale_reset_failed.rc != 0
    and 'not loaded' not in tailscale_reset_failed.stderr
  register: tailscale_reset_failed
  loop:
    - tailscaled-ansible-restart.timer
    - tailscaled-ansible-restart.service
  when: tailscale_restart_required

- name: Remove the previous tailscaled restart completion proof
  ansible.builtin.file:
    path: /run/homelab-tailscale-restart.completed
    state: absent
  when: tailscale_restart_required

- name: Write the requested tailscaled restart identifier
  ansible.builtin.copy:
    dest: /run/homelab-tailscale-restart.request
    content: "{{ tailscale_restart_id }}\n"
    mode: "0600"
  when: tailscale_restart_required

- name: Record the pending tailscaled restart for the recovery play
  ansible.builtin.set_fact:
    tailscale_restart_scheduled: true
  when: tailscale_restart_required

- name: Schedule the deterministic tailscaled restart
  ansible.builtin.systemd_service:
    name: tailscaled-ansible-restart.timer
    state: started
  when: tailscale_restart_required

- name: Clear the interrupted-run guard when no restart is needed
  ansible.builtin.file:
    path: /run/homelab-tailscale-restart.in-progress
    state: absent
  changed_when: false
  when: not tailscale_restart_required
