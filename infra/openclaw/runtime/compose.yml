name: openclaw

services:
  gateway:
    image: ${OPENCLAW_GATEWAY_REF:?exact Gateway repository@sha256 is required}
    platform: linux/amd64
    user: "1000:1000"
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    network_mode: host
    environment:
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /etc/openclaw/config/openclaw.json
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspaces/main
      OPENCLAW_GATEWAY_TOKEN_FILE: /run/secrets/openclaw/gateway_token
      OPENCLAW_DISCORD_BOT_TOKEN_FILE: /run/secrets/openclaw/discord_bot_token
      OPENCLAW_EXA_API_KEY_FILE: /run/secrets/openclaw/exa_api_key
      OPENCLAW_CTF_IMAGE: ${OPENCLAW_CTF_REF:?exact CTF repository@sha256 is required}
      OPENCLAW_CONFIG_COMMIT: ${OPENCLAW_CONFIG_COMMIT:?exact config commit is required}
      OPENCLAW_RELEASE_ID: ${OPENCLAW_RELEASE_ID:?release id is required}
      OPENCLAW_DISABLE_BONJOUR: "1"
      OPENCLAW_NO_AUTO_UPDATE: "1"
      TZ: Asia/Seoul
    volumes:
      - type: bind
        source: ${OPENCLAW_CONFIG_ROOT:?config bundle root is required}
        target: /etc/openclaw
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /var/lib/openclaw
        target: /home/node/.openclaw
        bind:
          create_host_path: false
      - type: bind
        source: /var/lib/openclaw
        target: /var/lib/openclaw
        bind:
          create_host_path: false
      - type: bind
        source: /home/openclaw/.config/openclaw
        target: /home/node/.config/openclaw
        bind:
          create_host_path: false
      - type: bind
        source: ${OPENCLAW_SECRET_ROOT:?secret root is required}/gateway_token
        target: /run/secrets/openclaw/gateway_token
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${OPENCLAW_SECRET_ROOT}/discord_bot_token
        target: /run/secrets/openclaw/discord_bot_token
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${OPENCLAW_SECRET_ROOT}/exa_api_key
        target: /run/secrets/openclaw/exa_api_key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=1000,gid=1000,mode=1777
    cap_drop: [ALL]
    group_add:
      - "${OPENCLAW_DOCKER_GID:?numeric host Docker group is required}"
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:18789/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    labels:
      homelab.openclaw.release: ${OPENCLAW_RELEASE_ID}
      homelab.openclaw.config-commit: ${OPENCLAW_CONFIG_COMMIT}
