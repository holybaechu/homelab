name: code

services:
  t3code:
    image: homelab/t3code:0.0.28-kali
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      HOME: /home/t3code
      TZ: "${TZ:-Asia/Seoul}"
    volumes:
      - /srv/homelab/docker-apps/t3code/home:/home/t3code:rw
      - /srv/homelab/workspaces:/workspace:rw
    networks:
      - proxy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const s=require('net').connect(3773,'127.0.0.1');s.on('connect',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1));setTimeout(()=>process.exit(1),2000)"
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 30s
    labels:
      - com.getarcaneapp.arcane.updater=false
      - traefik.enable=true
      - traefik.docker.network=homelab_proxy
      - traefik.http.routers.code.rule=Host(`code.home.hchu.me`)
      - traefik.http.routers.code.entrypoints=websecure
      - traefik.http.routers.code.middlewares=private-only@file,secure-headers@file
      - traefik.http.services.code.loadbalancer.server.port=3773

networks:
  proxy:
    external: true
    name: homelab_proxy
