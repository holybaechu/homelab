name: media

services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:20.04.1
    restart: unless-stopped
    environment:
      DOCKER_MODS: ghcr.io/vuetorrent/vuetorrent-lsio-mod:2.34.1
      PGID: "${PGID}"
      PUID: "${PUID}"
      TORRENTING_PORT: "${QBT_DIRECT_PEER_PORT}"
      TZ: "${TZ}"
      WEBUI_PORT: "8080"
    ports:
      - "${QBT_DIRECT_PEER_PORT}:${QBT_DIRECT_PEER_PORT}/tcp"
      - "${QBT_DIRECT_PEER_PORT}:${QBT_DIRECT_PEER_PORT}/udp"
    volumes:
      - /srv/homelab/docker-apps/qbittorrent:/config:rw
      - /srv/homelab/downloads:/downloads:rw
      - /srv/homelab/copyparty/public:/public:rw
    networks:
      - proxy
    labels:
      - com.getarcaneapp.arcane.updater=false
      - traefik.enable=true
      - traefik.docker.network=homelab_proxy
      - traefik.http.routers.qbt.rule=Host(`qbt.home.hchu.me`)
      - traefik.http.routers.qbt.entrypoints=websecure
      - traefik.http.routers.qbt.middlewares=private-only@file,secure-headers@file
      - traefik.http.services.qbt.loadbalancer.server.port=8080

  copyparty:
    image: copyparty/ac:1.20.20
    restart: unless-stopped
    env_file: .env
    command: ["-c", "/config/copyparty.conf"]
    volumes:
      - ./copyparty.conf:/config/copyparty.conf:ro
      - /srv/homelab/docker-apps/copyparty:/config/state:rw
      - /srv/homelab/copyparty/public:/srv/public:rw
      - /srv/homelab/copyparty/shared-readonly:/srv/shared-readonly:ro
      - /srv/homelab/downloads/complete:/srv/downloads:ro
    networks:
      - proxy
    labels:
      - com.getarcaneapp.arcane.updater=false
      - traefik.enable=true
      - traefik.docker.network=homelab_proxy
      - traefik.http.routers.copyparty.rule=Host(`copyparty.hchu.me`)
      - traefik.http.routers.copyparty.entrypoints=websecure
      - traefik.http.routers.copyparty.middlewares=secure-headers@file
      - traefik.http.services.copyparty.loadbalancer.server.port=3923

  metube:
    image: ghcr.io/alexta69/metube:2026.08.04
    restart: unless-stopped
    env_file: .env
    environment:
      DELETE_FILE_ON_TRASHCAN: "true"
    volumes:
      - /srv/homelab/copyparty/downloads:/downloads:rw
    networks:
      - proxy
    labels:
      - com.getarcaneapp.arcane.updater=false
      - traefik.enable=true
      - traefik.docker.network=homelab_proxy
      - traefik.http.routers.metube.rule=Host(`metube.home.hchu.me`)
      - traefik.http.routers.metube.entrypoints=websecure
      - traefik.http.routers.metube.middlewares=private-only@file,secure-headers@file
      - traefik.http.services.metube.loadbalancer.server.port=8081

networks:
  proxy:
    external: true
    name: homelab_proxy
