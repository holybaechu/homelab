name: homelab

services:
  traefik:
    image: traefik:v3.7.11@sha256:5203c3f39ca70de6790d964624e042463ffbd57715bc82be155cf224c0dd5144
    restart: unless-stopped
    env_file:
      - ./.secrets/traefik.env
    command:
      - --configFile=/etc/traefik/traefik.yml
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./generated/traefik/routes.yml:/etc/traefik/dynamic/routes.yml:ro
      - /etc/ssl/certs/homelab-pve-root-ca.pem:/etc/ssl/certs/homelab-pve-root-ca.pem:ro
      - traefik_data:/data
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  adguard:
    image: adguard/adguardhome:v0.107.78@sha256:1ea34eafe5dc691007946e8eaab7bf46b0de9412f39213d8c06e48b53bf9a6c5
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./generated/adguard/AdGuardHome.yaml:/opt/adguardhome/conf/AdGuardHome.yaml:ro
      - adguard_work:/opt/adguardhome/work
    labels:
      - homelab.smoke.url=https://adguard.home.hchu.me/
    healthcheck:
      test: ["CMD", "/opt/adguardhome/AdGuardHome", "--check-config", "-c", "/opt/adguardhome/conf/AdGuardHome.yaml"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  cloudflare-ddns:
    image: favonia/cloudflare-ddns:1@sha256:61013368c8f95981c0bb8bf56d962078d8b4e95724a554fa2dabb20d6e478097
    restart: unless-stopped
    env_file:
      - ./.secrets/cloudflare-ddns.env
    environment:
      DOMAINS: home.hchu.me
      IP6_PROVIDER: none
      PROXIED: "false"
      TZ: Asia/Seoul
    network_mode: host
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    labels:
      - homelab.health=process
    # The upstream scratch image contains only /bin/ddns and CA certificates,
    # so the deployer applies a mandatory host-side liveness/restart gate.

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.2.3@sha256:212b86dff59e3962b4082b5ef20a577e76c8f8527d2ab505cfa887b4bcecb0b0
    restart: unless-stopped
    environment:
      DOCKER_MODS: ghcr.io/vuetorrent/vuetorrent-lsio-mod:2.34.1@sha256:7cf3996f8c405a42d37c34c37d8eed7cbb01ef7c698c7a8ec243f53bd4b480cc
      PGID: "1000"
      PUID: "1000"
      TORRENTING_PORT: "35435"
      TZ: Asia/Seoul
      WEBUI_PORT: "8080"
    entrypoint: ["/bin/sh", "/run/homelab/init-qbittorrent.sh"]
    ports:
      - "35435:35435/tcp"
      - "35435:35435/udp"
    volumes:
      - /srv/homelab/docker-apps/qbittorrent:/config:rw
      - /srv/homelab/downloads:/downloads:rw
      - /srv/homelab/copyparty/public:/public:rw
      - ./config/init-qbittorrent.sh:/run/homelab/init-qbittorrent.sh:ro
      - ./generated/qbittorrent/qBittorrent.conf:/run/homelab/qBittorrent.conf:ro
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=homelab_proxy
      - traefik.http.routers.qbt.rule=Host(`qbt.home.hchu.me`)
      - traefik.http.routers.qbt.entrypoints=websecure
      - traefik.http.routers.qbt.middlewares=private-only@file,secure-headers@file
      - traefik.http.services.qbt.loadbalancer.server.port=8080
      - homelab.smoke.url=https://qbt.home.hchu.me/
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/ >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  copyparty:
    image: copyparty/ac:1.20.20@sha256:a885633e42f7395331ab709c1310bd21e79617b13dfd41c6e3f56910b6a8d2f0
    restart: unless-stopped
    command: ["-c", "/config/copyparty.conf"]
    environment:
      PGID: "1000"
      PUID: "1000"
      TZ: Asia/Seoul
    volumes:
      - ./generated/copyparty.conf:/config/copyparty.conf:ro
      - /srv/homelab/docker-apps/copyparty:/config/state:rw
      - /srv/homelab/copyparty/public:/srv/public:rw
      - /srv/homelab/copyparty/shared-readonly:/srv/shared-readonly:ro
      - /srv/homelab/downloads/complete:/srv/downloads:ro
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=homelab_proxy
      - traefik.http.routers.copyparty.rule=Host(`copyparty.hchu.me`)
      - traefik.http.routers.copyparty.entrypoints=websecure
      - traefik.http.routers.copyparty.middlewares=secure-headers@file
      - traefik.http.services.copyparty.loadbalancer.server.port=3923
      - homelab.smoke.url=https://copyparty.hchu.me/
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q 'http://127.0.0.1:3923/?reset=/._'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  metube:
    image: ghcr.io/alexta69/metube:2026.08.20@sha256:fb5b91a66db83e1d2ef9c1f2c6a1cd6bbc64eaa8e78a2fafdcea1e93011340a6
    restart: unless-stopped
    environment:
      DELETE_FILE_ON_TRASHCAN: "true"
      PGID: "1000"
      PUID: "1000"
      TZ: Asia/Seoul
    volumes:
      - /srv/homelab/copyparty/downloads:/downloads:rw
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=homelab_proxy
      - traefik.http.routers.metube.rule=Host(`metube.home.hchu.me`)
      - traefik.http.routers.metube.entrypoints=websecure
      - traefik.http.routers.metube.middlewares=private-only@file,secure-headers@file
      - traefik.http.services.metube.loadbalancer.server.port=8081
      - homelab.smoke.url=https://metube.home.hchu.me/
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/ >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  proxy:
    name: homelab_proxy

volumes:
  traefik_data:
    name: platform_traefik_data
  adguard_work:
    name: platform_adguard_work
