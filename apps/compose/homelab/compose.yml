name: homelab

services:
  traefik:
    image: traefik:v3.7.14@sha256:575fa15b135078fe5e50aa847987d96dbddd7b093c172429618404df73f3fa7c
    restart: unless-stopped
    env_file:
      - ./.secrets/traefik.env
    command:
      - --configFile=/etc/traefik/homelab/traefik.yml
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config:/etc/traefik/homelab:ro
      - ./generated/traefik:/etc/traefik/dynamic:ro
      - /etc/ssl/certs/homelab-pve-root-ca.pem:/etc/ssl/certs/homelab-pve-root-ca.pem:ro
      - traefik_data:/data
    networks:
      - proxy
      - copyparty_proxy
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  adguard:
    image: adguard/adguardhome:v0.107.79@sha256:aba9e3bf0613be3ba3755e1fc311b126e2c24bec25e18b6483894a88283074f0
    restart: unless-stopped
    network_mode: host
    volumes:
      # AdGuard persists normalized runtime fields back into its config file.
      # Preserve it until its template, credentials, or topology changes.
      - ./generated/adguard:/opt/adguardhome/conf:rw
      - adguard_work:/opt/adguardhome/work
    labels:
      - homelab.smoke.url=https://adguard.home.hchu.me/
    healthcheck:
      test: ["CMD", "/opt/adguardhome/AdGuardHome", "--check-config", "-c", "/opt/adguardhome/conf/AdGuardHome.yaml"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  cloudflare-ddns:
    image: favonia/cloudflare-ddns:1@sha256:5e61736b982b87d84a1120b4767c4deff0f2cc55ca3ee9dcb1dc58623039b5cb
    restart: unless-stopped
    env_file:
      - ./.secrets/cloudflare-ddns.env
    environment:
      DOMAINS: home.hchu.me,auth.home.hchu.me,headscale.home.hchu.me,metube.home.hchu.me
      IP6_PROVIDER: none
      PROXIED: "false"
      TZ: Asia/Seoul
    network_mode: host
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    labels:
      - homelab.health=process
    # The upstream scratch image contains only /bin/ddns and CA certificates,
    # Compose checks process liveness when waiting for startup.

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.2.4@sha256:b522f9f4b769f8f36d49d22d5eb6a92e9aa18904c6a1830b1439df511ec21983
    restart: unless-stopped
    environment:
      DOCKER_MODS: ghcr.io/vuetorrent/vuetorrent-lsio-mod:2.36.1@sha256:2750543ce2f9868e12bca941482431eb59b5517e89c2538cb2229124aa79d2c2
      PGID: "1000"
      PUID: "1000"
      TORRENTING_PORT: "35435"
      TZ: Asia/Seoul
      WEBUI_PORT: "8080"
    entrypoint: ["/bin/sh", "/run/homelab/init-qbittorrent.sh"]
    ports:
      - "35435:35435/tcp"
      - "35435:35435/udp"
    volumes:
      - /srv/homelab/docker-apps/qbittorrent:/config:rw
      - /srv/homelab/downloads:/downloads:rw
      - /srv/homelab/copyparty/public:/public:rw
      - ./config:/run/homelab:ro
      - ./generated/qbittorrent:/run/homelab-settings:ro
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=homelab_proxy
      - traefik.http.routers.qbt.rule=Host(`qbt.home.hchu.me`)
      - traefik.http.routers.qbt.entrypoints=websecure
      - traefik.http.routers.qbt.middlewares=private-only@file,secure-headers@file
      - traefik.http.services.qbt.loadbalancer.server.port=8080
      - homelab.smoke.url=https://qbt.home.hchu.me/
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/ >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  copyparty:
    image: copyparty/ac:1.20.25@sha256:cbf8f82c9317ce7c0690b59b0a10f7deb74d73babbf88c3c110e1cbd599d8bad
    restart: unless-stopped
    command: ["-c", "/config/homelab/copyparty.conf"]
    environment:
      PGID: "1000"
      PUID: "1000"
      TZ: Asia/Seoul
    volumes:
      - ./generated/copyparty:/config/homelab:ro
      - /srv/homelab/docker-apps/copyparty:/config/state:rw
      - /srv/homelab/copyparty/public:/srv/public:rw
      - /srv/homelab/copyparty/shared-readonly:/srv/shared-readonly:ro
      - /srv/homelab/downloads/complete:/srv/downloads:ro
    networks:
      - copyparty_proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=homelab_copyparty_proxy
      - traefik.http.routers.copyparty.rule=Host(`copyparty.hchu.me`)
      - traefik.http.routers.copyparty.entrypoints=websecure
      - traefik.http.routers.copyparty.middlewares=clear-copyparty-identity@file,authentik@file,secure-headers@file
      - traefik.http.routers.copyparty-public.rule=Host(`copyparty.hchu.me`) && (Method(`GET`) || Method(`HEAD`)) && (((Path(`/public`) || PathPrefix(`/public/`)) && !HeaderRegexp(`Cookie`, `authentik_proxy_`)) || (PathPrefix(`/.cpr/`) && !PathPrefix(`/.cpr/metrics`) && !PathPrefix(`/.cpr/ssdp`)))
      - traefik.http.routers.copyparty-public.entrypoints=websecure
      - traefik.http.routers.copyparty-public.priority=100
      - traefik.http.routers.copyparty-public.middlewares=clear-copyparty-identity@file,secure-headers@file
      - traefik.http.routers.copyparty-public.service=copyparty
      - traefik.http.routers.copyparty-dav.rule=Host(`copyparty-dav.home.hchu.me`)
      - traefik.http.routers.copyparty-dav.entrypoints=websecure
      - traefik.http.routers.copyparty-dav.priority=100
      - traefik.http.routers.copyparty-dav.middlewares=private-only@file,clear-copyparty-identity@file,secure-headers@file
      - traefik.http.routers.copyparty-dav.service=copyparty
      - traefik.http.services.copyparty.loadbalancer.server.port=3923
      - homelab.smoke.url=https://copyparty.hchu.me/public/
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q 'http://127.0.0.1:3923/?reset=/._'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  metube:
    image: ghcr.io/alexta69/metube:2026.10.09@sha256:df929ef2453fd75c1f1cbd8dafb309ee03ff18d8705c7c1e01642b1202d4a650
    restart: unless-stopped
    environment:
      DELETE_FILE_ON_TRASHCAN: "true"
      PGID: "1000"
      PUID: "1000"
      TZ: Asia/Seoul
    volumes:
      - /srv/homelab/copyparty/downloads:/downloads:rw
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=homelab_proxy
      - traefik.http.routers.metube.rule=Host(`metube.home.hchu.me`)
      - traefik.http.routers.metube.entrypoints=websecure
      - traefik.http.routers.metube.middlewares=authentik@file,secure-headers@file
      - traefik.http.services.metube.loadbalancer.server.port=8081
      - homelab.smoke.url=https://metube.home.hchu.me/
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/ >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  authentik-db:
    image: postgres:16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    env_file:
      - path: ./.secrets/authentik-db.env
        format: raw
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
    volumes:
      - authentik_db:/var/lib/postgresql/data
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "authentik", "-d", "authentik"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  authentik-server:
    image: ghcr.io/goauthentik/server:2026.8.3@sha256:ab9b4e8cc4ab3f8d1198d2db6aeea66bafea1963b3f2843589e0d163f97d9849
    restart: unless-stopped
    command: server
    extra_hosts:
      - auth.home.hchu.me:host-gateway
    shm_size: 512mb
    env_file:
      - path: ./.secrets/authentik.env
        format: raw
    environment:
      AUTHENTIK_POSTGRESQL__HOST: authentik-db
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
    depends_on:
      authentik-db:
        condition: service_healthy
    volumes:
      - authentik_data:/data
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=homelab_proxy
      - traefik.http.routers.authentik.rule=Host(`auth.home.hchu.me`)
      - traefik.http.routers.authentik.entrypoints=websecure
      - traefik.http.routers.authentik.middlewares=secure-headers@file
      - traefik.http.routers.authentik.service=authentik
      - traefik.http.routers.authentik.observability.accesslogs=false
      - traefik.http.routers.metube-auth.rule=Host(`metube.home.hchu.me`) && PathPrefix(`/outpost.goauthentik.io/`)
      - traefik.http.routers.metube-auth.entrypoints=websecure
      - traefik.http.routers.metube-auth.priority=100
      - traefik.http.routers.metube-auth.middlewares=secure-headers@file
      - traefik.http.routers.metube-auth.service=authentik
      - traefik.http.routers.metube-auth.observability.accesslogs=false
      - traefik.http.routers.copyparty-auth.rule=Host(`copyparty.hchu.me`) && PathPrefix(`/outpost.goauthentik.io/`)
      - traefik.http.routers.copyparty-auth.entrypoints=websecure
      - traefik.http.routers.copyparty-auth.priority=200
      - traefik.http.routers.copyparty-auth.middlewares=secure-headers@file
      - traefik.http.routers.copyparty-auth.service=authentik
      - traefik.http.routers.copyparty-auth.observability.accesslogs=false
      - traefik.http.services.authentik.loadbalancer.server.port=9000
      - homelab.smoke.url=https://auth.home.hchu.me/-/health/ready/
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s

  authentik-worker:
    image: ghcr.io/goauthentik/server:2026.8.3@sha256:ab9b4e8cc4ab3f8d1198d2db6aeea66bafea1963b3f2843589e0d163f97d9849
    restart: unless-stopped
    command: worker
    shm_size: 512mb
    env_file:
      - path: ./.secrets/authentik.env
        format: raw
      - path: ./.secrets/authentik-bootstrap.env
        format: raw
    environment:
      AUTHENTIK_POSTGRESQL__HOST: authentik-db
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
    depends_on:
      authentik-db:
        condition: service_healthy
    volumes:
      - authentik_data:/data
      - ./generated/authentik:/blueprints/homelab:ro
    networks:
      - proxy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          ak healthcheck && python -c "import json, urllib.request;
          r = urllib.request.Request('http://authentik-server:9000/application/o/headscale/.well-known/openid-configuration',
          headers={'Host': 'auth.home.hchu.me', 'X-Forwarded-Proto': 'https'});
          assert json.load(urllib.request.urlopen(r, timeout=3))['issuer'] == 'https://auth.home.hchu.me/application/o/headscale/'"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s

  headscale:
    image: headscale/headscale:0.29.4@sha256:8833f828b414c0907b7e5c71da76473216fe17cce0818a166b536ec552c0903f
    restart: unless-stopped
    command: ["serve", "--config", "/etc/headscale/config.yaml"]
    depends_on:
      authentik-server:
        condition: service_healthy
      authentik-worker:
        condition: service_healthy
      traefik:
        condition: service_healthy
    extra_hosts:
      - auth.home.hchu.me:host-gateway
    volumes:
      - ./generated/headscale:/etc/headscale:ro
      - headscale_data:/var/lib/headscale
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=homelab_proxy
      - traefik.http.routers.headscale.rule=Host(`headscale.home.hchu.me`)
      - traefik.http.routers.headscale.entrypoints=websecure
      - traefik.http.routers.headscale.observability.accesslogs=false
      - traefik.http.services.headscale.loadbalancer.server.port=8080
      - homelab.smoke.url=https://headscale.home.hchu.me/health
    healthcheck:
      test: ["CMD", "headscale", "health", "--config", "/etc/headscale/config.yaml"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s

networks:
  proxy:
    name: homelab_proxy
  copyparty_proxy:
    name: homelab_copyparty_proxy
    internal: true

volumes:
  traefik_data:
    name: platform_traefik_data
  adguard_work:
    name: platform_adguard_work
  authentik_db:
    name: platform_authentik_db
  authentik_data:
    name: platform_authentik_data
  headscale_data:
    name: platform_headscale_data
